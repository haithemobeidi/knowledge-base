` POST policy doesn't exist on R2) — measured false: R2 DOES verify signed `Content-Length`/`Content-Type` on a query-signed PUT (mismatch → 403 before bytes land). The trap: aws4fetch's default treats both as *unsignable* and silently drops them from the signature, so the limit ships decorative and even passes naive testing. Fix is `aws: { allHeaders: true }`; protocol is \"read `X-Amz-SignedHeaders` in the URL you minted, and test the MISMATCH case, not the match case.\"", "content": "# R2 presigned-PUT size/type limits ARE enforceable — but aws4fetch silently unsigns them\n\nAny app that lets clients upload straight to Cloudflare R2 via presigned PUT\nURLs (the standard \"server never proxies the bytes\" pattern) eventually needs\nto cap upload size and content type — otherwise a signed-in client gets a\nfree window to park objects of any size on your paid bucket.\n\nTwo layers of misinformation make this look impossible, and one library trap\nmakes a working fix silently decorative. All three claims below were\n**measured against a live R2 bucket** (2026-07-22), not inferred.\n\n## The misleading landscape\n\n1. **S3's official answer doesn't exist on R2.** On AWS S3 you'd use a POST\n   policy with a `content-length-range` condition. R2 does not support POST\n   object uploads, so every S3 tutorial dead-ends.\n2. **Community consensus says \"impossible.\"** Cloudflare community threads on\n   this exact question conclude R2 presigned PUTs can't bound size and\n   recommend fronting the bucket with a Worker. This is **wrong** — see below.\n\n## What actually works\n\nSigV4 lets you include headers in the signature. R2 **does verify** signed\n`Content-Length` and `Content-Type` on a query-signed (presigned) PUT — a\nrequest whose actual body size or MIME type differs from what was signed is\nrejected with `403 SignatureDoesNotMatch` before any bytes land. Measured\nmatrix:\n\n```\nsigned len=10,   body=10                    → 200\nsigned len=10,   body=100                   → 403 SignatureDoesNotMatch\nsigned type=jpeg, sent type=jpeg            → 200\nsigned type=jpeg, sent type=text/plain      → 403\nsigned type=jpeg, header omitted            → 403\n```\n\nSo the server-side presign flow becomes: client declares `{size, contentType}`\n→ server validates against per-kind caps → server signs BOTH into the URL →\nthe cap now binds the actual bytes, not the client's claim. No Worker needed.\n\n## The trap: aws4fetch drops these headers from the signature by default\n\naws4fetch (the zero-dependency SigV4 signer commonly used with R2) keeps an\ninternal *unsignable headers* list that includes `content-length` and\n`content-type`. Pass them in `headers` and it signs the request **without\nthem** — no warning, no error. `X-Amz-SignedHeaders` in the produced URL says\n`host`, every upload succeeds regardless of size, and your \"limit\" is\ndecorative. A naive verification pass even *passes*: match-PUT works,\nmismatch-PUT also works, and if you only test the happy path you ship it.\n\nThe fix is one option:\n\n```js\nconst signed = await client.sign(url, {\n  method: 'PUT',\n  headers: { 'content-length': String(size), 'content-type': contentType },\n  aws: { signQuery: true, allHeaders: true },   // ← allHeaders is the fix\n});\n```\n\nThe uploader must then send exactly those headers (most HTTP clients set\n`Content-Length` automatically from the body; set `Content-Type` explicitly).\n\n## Verification protocol (the transferable lesson)\n\n1. **Read `X-Amz-SignedHeaders` in the URL you minted.** If it doesn't list\n   `content-length`/`content-type`, they are not enforced, whatever your\n   signing code appears to say. This is a one-line assert worth keeping in a\n   test.\n2. **Test the MISMATCH case, not the match case.** A signed-limits scheme that\n   only ever sees compliant clients proves nothing — the entire point is the\n   403 on a lying client. (This is what caught the aws4fetch trap: the first\n   probe run \"passed\" 6/6 because nothing was actually signed.)\n\n## Companion guard: quota that can't be outrun\n\nSigned sizes bound each object; a per-user quota bounds the total. If the\nserver caches R2 usage (ListObjectsV2 sums) with a TTL, bump the cached figure\nby each approved presign's **declared** size immediately — otherwise a burst of\npresigns inside one TTL window sails past the quota before the next listing\nsees the bytes."}, {"id": "resolve-versions-from-the-registry-not-a-search-index.md", "title": "A package search index is not the package registry — read the registry's own metadata", "kind": "gotcha", "last_verified": "2026-08-09", "stack": ["any", "dependencies", "maven", "npm", "pypi", "gradle", "process"], "groups": ["Other", "Process & Meta"], "description": "`search.maven.org` reported a library's newest release as 3.2.0; the registry's own `maven-metadata.xml` said **3.5.0**, three minor versions and two months newer. A wrong-but-valid pin throws no error and reads as deliberate forever. Authoritative endpoints for Maven/npm/PyPI/crates/Go, why the index legitimately lags (it's a separate ingestion, and mirrors, aggregators and LLM answers are the same class of cache), and the two checks past the number: `<release>`/`dist-tags` to avoid picking an alpha off the raw version list, and the dependency's own floor against your resolved ceiling before you add it.", "content": "# A package search index is not the package registry — read the registry's own metadata\n\n**One-liner:** picking a dependency version, `search.maven.org`'s API reported Coil's newest release as **3.2.0**. The registry's own `maven-metadata.xml` said **3.5.0** — three minor versions newer and two months old. Pinning from the search result would have shipped a stale dependency that looked *deliberately chosen*, complete with a version number someone would defend in review. Search indexes are caches with their own refresh schedules; the registry has an authoritative metadata endpoint, it is one `curl` away, and it is the only thing that answers \"what is the latest version\" correctly.\n\n## The failure shape\n\nIt is quiet, which is the problem:\n\n1. You need the current version of a library.\n2. You ask a search UI, a search API, an aggregator site, or a model.\n3. You get **a** version. It is real, it exists, it resolves, it builds.\n4. It is not the latest, and nothing anywhere will tell you.\n\nA wrong-but-valid version produces no error. It produces a `libs.versions.toml` entry that reads as intentional forever, and you inherit months of fixed bugs you will rediscover yourself.\n\n## Ask the registry directly\n\nEvery major registry publishes machine-readable metadata at a predictable URL. These are the source of truth the resolvers themselves use.\n\n**Maven Central**\n\n```bash\n# group path with dots -> slashes\ncurl -s https://repo1.maven.org/maven2/dev/chrisbanes/haze/haze-android/maven-metadata.xml \\\n  | grep -E '<latest>|<release>|<lastUpdated>'\n```\n\n`<release>` is the newest non-SNAPSHOT. `<versioning><versions>` lists everything. `<lastUpdated>` timestamps the index itself, which tells you whether the *registry* is fresh, not just your reading of it.\n\n**npm**\n\n```bash\ncurl -s https://registry.npmjs.org/react | jq '.\"dist-tags\"'\n# {\"latest\":\"...\", \"next\":\"...\", ...}\n```\n\n**PyPI**\n\n```bash\ncurl -s https://pypi.org/pypi/fonttools/json | jq -r '.info.version'\n```\n\n**crates.io**\n\n```bash\ncurl -s https://crates.io/api/v1/crates/serde | jq -r '.crate.max_stable_version'\n```\n\n**Go** — the module proxy is the registry:\n\n```bash\ncurl -s https://proxy.golang.org/github.com/gorilla/mux/@v/list\n```\n\nOr let your own toolchain ask, which is better still because it resolves through the exact repositories your build is configured with:\n\n```bash\n./gradlew dependencyUpdates      # ben-manes plugin\nnpm outdated\npip list --outdated\ncargo upgrade --dry-run\n```\n\n## Read past the version number\n\nLatest is not automatically correct. Two more checks, both cheap:\n\n- **Stable vs pre-release.** The version list is chronological, so the newest entry is frequently an alpha. In the case this came from, the list ended `1.7.2, 2.0.0-alpha01 … alpha04` — the right pin was 1.7.2, and a naive \"take the last one\" would have shipped an alpha. `<release>` on Maven and `dist-tags.latest` on npm already exclude pre-releases; the raw version list does not.\n- **Its own floor against your ceiling.** Fetch the POM / package manifest and check the dependency it demands versus what you resolve to:\n\n  ```bash\n  curl -s https://repo1.maven.org/maven2/dev/chrisbanes/haze/haze-android/1.7.2/haze-android-1.7.2.pom \\\n    | grep -A2 '<artifactId>ui<\/artifactId>'      # -> compose ui 1.10.0\n  ```\n\n  Ours resolved to 1.11.4, so the floor was satisfied and no version fight was coming. Thirty seconds, and it converts \"I think this is compatible\" into a fact before the dependency is added rather than after the build breaks.\n\n## Why the index disagrees\n\nNot a bug, exactly — a different job. Search endpoints run their own ingestion (Maven Central's is a Solr index), and ingestion lags, batches, and occasionally stalls on individual coordinates. There is no contract that the index reflects the registry within any window. The registry's metadata file, by contrast, *is* what the artifact publisher wrote.\n\nThe same gap exists for:\n\n- **Mirrors and corporate proxies** (Artifactory, Nexus, internal npm) — a caching remote can serve a months-old view and looks identical to upstream.\n- **Aggregator sites** — mvnrepository, libraries.io, \"awesome\" lists, badges.\n- **LLMs, including this one.** A model's answer about \"the latest version\" is a statement about its training data, at best. This is the most common instance now and the least likely to be double-checked, because the answer arrives fluent and specific.\n\n## The rule\n\n**Resolve \"what is the latest version\" against the registry's authoritative metadata endpoint. Never a search UI, never an index API, never an aggregator, never from memory.**\n\nAnd when you pin, put the evidence next to the pin:\n\n```toml\n# haze 1.7.2 — newest stable per repo1.maven.org maven-metadata.xml (2026-08-08);\n# 2.0.0 is alpha. Needs compose-ui >= 1.10.0; we resolve 1.11.4.\nhaze = \"1.7.2\"\n```\n\nTwo lines that stop the next person re-running the same investigation, and that date the claim so a future reader knows how stale it is.\n\n## Related\n\n- [[negative-control-before-trusting-a-probe]] — the same family: the thing that answered you was not the thing you thought you asked.\n- [[chase-industry-stats-to-a-primary-source]] — the research-hygiene version of this rule, for numbers rather than versions: follow the citation chain to a primary source before the value becomes a constant.\n- [[monorepo-stale-dist-zod-strip]] — staleness one boundary in: a committed artifact that is silently older than its source."}, {"id": "restartable-task-generation-counter.md", "title": "Generation Counter for Restartable Tasks", "kind": "pattern", "last_verified": "2026-07-20", "stack": ["rust", "tauri", "tokio", "threads"], "groups": ["Frameworks & Libraries", "Languages", "Platforms & Runtimes"], "description": "Atomic generation counter for safely restarting threads / async tasks / child processes without leaking the old instance. Survives React StrictMode double-mounts and stop/start races. Extracted from Checkpoint's process monitor; LLM Hub uses it for sidecar restart. Plus a related but distinct pattern: an N-consecutive-miss counter for debouncing a flickering process-liveness signal (launcher-to-game handoff gaps misread as \"stopped\").", "content": "# Generation Counter for Restartable Tasks\n\n> How to restart an owned background task (thread, async task, or child process) without leaking the previous instance.\n\n## The Problem\n\nAnywhere you have a \"service\" that can be started, stopped, and re-started:\n\n- A polling thread that watches the filesystem / processes / events\n- An async task draining a stream\n- A child process you spawned and communicate with over stdio\n- Anything that holds resources and runs in a loop\n\n…you eventually hit a race. Common triggers:\n\n- **React StrictMode** double-mounts a component → fires `start` twice in quick succession → two threads now own the same job, double-emitting events.\n- **A stop-start sequence races** the sleeping loop: stop runs, but the old thread is mid-sleep; start spawns a new thread; old thread wakes up, sees `running == true` (the new thread set it), keeps running. Now you have two.\n- **A child-process crash plus restart**: the old reader task is still draining stdout when you spawn the replacement; its in-flight messages get attributed to the new generation.\n\n`Arc<AtomicBool>` for a `running` flag is not enough — it can't distinguish \"I'm the current generation\" from \"someone bumped me into stale territory.\"\n\n## The Pattern\n\nUse an `AtomicU32` generation counter alongside the running flag. Each spawned task captures the counter value **at spawn time**, then exits the moment the counter advances past it.\n\n```rust\nuse std::sync::atomic::{AtomicBool, AtomicU32, Ordering};\nuse std::sync::Arc;\n\npub struct ServiceState {\n    pub running: Arc<AtomicBool>,\n    pub generation: Arc<AtomicU32>,\n}\n\nimpl Default for ServiceState {\n    fn default() -> Self {\n        Self {\n            running: Arc::new(AtomicBool::new(false)),\n            generation: Arc::new(AtomicU32::new(0)),\n        }\n    }\n}\n\npub fn start(state: &ServiceState) {\n    // Bump the counter. Any thread spawned by a previous start sees its\n    // captured generation no longer matches and exits on its next tick.\n    let my_generation = state.generation.fetch_add(1, Ordering::SeqCst) + 1;\n    let running = state.running.clone();\n    let generation = state.generation.clone();\n    running.store(true, Ordering::SeqCst);\n\n    std::thread::spawn(move || {\n        while running.load(Ordering::SeqCst)\n            && generation.load(Ordering::SeqCst) == my_generation\n        {\n            // ... do work ...\n            std::thread::sleep(std::time::Duration::from_secs(3));\n        }\n        eprintln!(\"[service] gen={} loop exited\", my_generation);\n    });\n}\n\npub fn stop(state: &ServiceState) {\n    // Stop sets `running = false` only. It does NOT bump the generation.\n    // Generation bumps are reserved for `start` so that a late-arriving\n    // stop (from a cleanup race) can't kill the surviving thread of a\n    // newer start.\n    state.running.store(false, Ordering::SeqCst);\n}\n```\n\n## Why It Works\n\n- **Stale tasks self-exit at their next loop tick.** No `JoinHandle.abort()` plumbing, no cancel tokens to pass around — the task just checks two atomics and returns naturally when its generation is no longer current.\n- **The newest task always wins.** `fetch_add` is atomic; only one task can hold any given generation number.\n- **Start asymmetry is intentional.** Only `start` bumps the generation. If `stop` bumped it too, the sequence `stop1 → start2 → stop1's-late-cleanup` would kill `start2`'s thread.\n- **No locks on the hot path.** Atomics + clone-the-Arc is essentially free per iteration.\n\n## Tuning the Tick Interval\n\nThe task exits within one loop iteration of the generation bump. If your iterations take 3 seconds (filesystem polling), worst-case stale-task lifetime is 3 seconds. That's usually fine. If you need faster exit, either:\n\n- Shorten the sleep (cheap if the work itself is cheap)\n- Sleep in shorter intervals with the check between them\n- Use `tokio::select!` with a watch channel for sub-second responsiveness (overkill for most cases)\n\n## Variant: Async Tasks (tokio)\n\nSame idea, swap thread for `tokio::spawn`:\n\n```rust\nlet my_generation = state.generation.fetch_add(1, Ordering::SeqCst) + 1;\nlet running = state.running.clone();\nlet generation = state.generation.clone();\n\ntokio::spawn(async move {\n    while running.load(Ordering::SeqCst)\n        && generation.load(Ordering::SeqCst) == my_generation\n    {\n        // ... await something ...\n        tokio::time::sleep(Duration::from_secs(3)).await;\n    }\n});\n```\n\n## Variant: Child Process with Stdio Reader\n\nThe generation counter solves the \"stale reader\" half of the problem. For child processes you also need to (a) reap the child on stop, and (b) wire reader/writer tasks to the same generation. Sketch:\n\n```rust\npub struct SidecarState {\n    pub child: Arc<tokio::sync::Mutex<Option<tokio::process::Child>>>,\n    pub generation: Arc<AtomicU32>,\n}\n\npub async fn spawn_sidecar(state: &SidecarState) -> Result<(), Error> {\n    let my_generation = state.generation.fetch_add(1, Ordering::SeqCst) + 1;\n    let mut child = tokio::process::Command::new(\"node\")\n        .arg(\"sidecar.cjs\")\n        .stdin(Stdio::piped())\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped())\n        .spawn()?;\n\n    let stdout = child.stdout.take().unwrap();\n    let generation = state.generation.clone();\n\n    tokio::spawn(async move {\n        let mut reader = tokio::io::BufReader::new(stdout).lines();\n        while generation.load(Ordering::SeqCst) == my_generation {\n            match reader.next_line().await {\n                Ok(Some(line)) => { /* parse, dispatch */ },\n                Ok(None) => break,           // child closed stdout\n                Err(_) => break,\n            }\n        }\n        // Either child died, or we're a stale generation. Exit.\n    });\n\n    *state.child.lock().await = Some(child);\n    Ok(())\n}\n```\n\nOn restart: bump the generation, kill the old `Child`, spawn a new one. The old reader task notices its generation is stale at its next `next_line().await` return and exits without writing to whatever shared channel feeds the rest of the app.\n\n## What This Pattern Does NOT Solve\n\n- **Reaping the process / freeing the resource.** You still need to call `child.kill()` (or equivalent) explicitly. Generation counter just makes the **observers** exit cleanly.\n- **Ordering of \"I'm dead\" signals.** If your app needs to know which generation a \"child exited\" event came from, attach the generation number to the event payload.\n- **Replay during restart.** Messages emitted by gen N after gen N+1 has started will be ignored. If you need to drain a queue before stopping, do it explicitly in stop.\n\n## When NOT to Use This\n\n- **One-shot tasks.** If the task runs once and exits, no generation counter needed.\n- **Tasks you'd never restart.** If the only lifecycle is start-once-at-app-launch and stop-at-app-exit, an `AtomicBool` plus a `JoinHandle.abort()` is simpler.\n- **Tasks where stale output is harmless.** Rare, but: if the task only emits idempotent events to a UI that doesn't care about duplicates, you can skip the ceremony.\n\n## Related pattern: debounce a flickering liveness signal (different problem, same file)\n\nThe generation counter above solves *stale-instance cleanup on restart* — it does nothing for the opposite failure: a process-liveness poll that misreads a **momentary gap** in an otherwise-live signal as \"the process stopped,\" when what's actually happening is a handoff between two processes (a launcher/bootstrapper exiting a beat before the real long-running process appears).\n\nConcrete case: a game-process watcher polling \"is any tracked exe still running\" fired its `game_stopped` event (which drove a whole quit-ritual flow) on the very **first** poll where the watched exe was momentarily absent — which happened on *launch*, not quit, for any game whose launcher process exits and hands off to the real game exe a beat later (common with repacks, DRM wrappers, and anti-cheat self-relaunch). One missed poll, read as ground truth, fired a user-facing flow at exactly the wrong moment.\n\n**Fix: an N-consecutive-miss counter, reset on any live sighting.**\n\n```rust\nstruct Session {\n    missed_polls: u32,\n    // ...\n}\n\nconst STOP_GRACE_POLLS: u32 = 4; // ~12s at a 3s poll interval\n\n// each poll tick:\nif exe_is_running {\n    session.missed_polls = 0;\n} else {\n    session.missed_polls += 1;\n    if session.missed_polls >= STOP_GRACE_POLLS {\n        fire_game_stopped();\n    }\n}\n```\n\nTune the grace window to comfortably exceed the real handoff gap you're protecting against (here, ~12s covered every observed launcher-to-game handoff), not to an arbitrary round number — too short and the false positive survives, too long and a genuine quick-exit takes longer to register.\n\n**Generalizes beyond games:** any OS-process-lifecycle watcher that treats \"process absent on this poll\" as ground truth needs this — dev-server auto-restart detectors, wrapper/launcher-process patterns, health-check pollers watching a process that legitimately restarts itself. The tell that you need it: your \"stopped\" event fires occasionally on **launch**, not just on genuine stop.\n\n## Origin\n\nThe pattern was extracted from Checkpoint's `apps/desktop/src-tauri/src/commands/process_watch.rs` (lines 88-368). That project hit it via React StrictMode double-mounting a hotkey-armed monitor in dev mode; the same atomic counter killed both that bug and a stop/start race in prod.\n\nLLM Hub (sister project) adopted the same pattern for its Node sidecar's reader-task lifecycle when the sidecar crashes and gets restarted with exponential backoff. Same primitives, different application surface.\n\n## Reference\n\n- Original implementation: `Checkpoint/apps/desktop/src-tauri/src/commands/process_watch.rs`, MonitorState struct (line 356) and the start/stop pair around lines 88-338.\n- Rust atomics docs: <https://doc.rust-lang.org/std/sync/atomic/>"}, {"id": "runtime-animation-profiler-hud.md", "title": "A dev-only in-app HUD for judging animation perf by numbers, not vibes", "kind": "pattern", "last_verified": "2026-07-08", "stack": ["react", "dom", "performance"], "groups": ["Frameworks & Libraries", "Reliability & Perf"], "description": "A dependency-free dev-only HUD that measures real frame timing (refresh-rate-agnostic jank detection) and fingerprints DOM/GPU-layer leaks by tagName/className histogram diffing — turns \"it feels janky\" into an exact element and class string to grep.", "content": "# A dev-only in-app HUD for judging animation perf by numbers, not vibes\n\n**One-liner:** a small, dependency-free React component that measures real frame timing during a specific animation and renders the numbers in a corner overlay — on whatever machine the build is running on, no DevTools/profiler attach required. Distinguishes two failure signals that look the same to the eye but have different root causes: **frame-skip** (the animation is janky right now) vs. **accumulation** (the app gets worse over time — a leak, not a one-off slow frame).\n\n## Why this beats \"does it feel smooth\" during development\n\nA GPU compositor-layer leak or a growing DOM produces a specific signature: smooth on a fresh app launch, degrading over a handful of repetitions, then plateauing (as opposed to an unbounded climb, which points at a JS heap leak instead). You cannot reliably eyeball \"smooth → slightly worse → slightly worse again → plateaus\" — but a HUD that prints the numbers after every repetition makes the shape of the degradation immediately legible, and tells you which failure family to chase before you open a profiler at all.\n\n## Refresh-rate-agnostic jank detection\n\nDon't hardcode \"60fps, so &gt;16.7ms is a dropped frame\" — that assumption breaks on 120/144Hz displays. Instead, compute the **median inter-frame delta over the current measurement window** (robust to the very slow frames you're trying to detect) and flag anything over 1.5x that median:\n\n```ts\nfunction computeJank(frameTimestamps: number[]) {\n  const deltas = frameTimestamps.slice(1).map((t, i) => t - frameTimestamps[i]);\n  const median = [...deltas].sort((a, b) => a - b)[Math.floor(deltas.length / 2)] ?? 16.67;\n  const jankThreshold = median * 1.5;\n  const jank = deltas.filter((d) => d > jankThreshold).length;\n  const longestMs = Math.max(...deltas);\n  return { jank, longestMs, fps: (1000 * (frameTimestamps.length - 1)) / (frameTimestamps[frameTimestamps.length - 1] - frameTimestamps[0]) };\n}\n```\n\nSample continuously via `requestAnimationFrame` for the duration of the animation being measured (start on animation-begin, stop on animation-end), push `performance.now()` each tick, then run the above once the animation completes.\n\n## Accumulation signals — heap, DOM count, GPU-layer proxy, portal count\n\nSnapshot four cheap signals at the end of each measured repetition:\n\n```ts\nfunction snapshotMemory() {\n  const mem = (performance as any).memory; // Chromium-only (incl. WebView2); undefined elsewhere\n  return {\n    heapMb: mem ? Math.round(mem.usedJSHeapSize / 1_048_576) : 0,\n    nodes: document.getElementsByTagName('*').length,\n    // Inline will-change is a cheap proxy for \"promoted to its own GPU compositor layer\" —\n    // if this climbs across repetitions without settling, you're leaking compositor layers.\n    willChange: document.querySelectorAll('[style*=\"will-change\"]').length,\n    // Direct children of <body>: portal roots (modal libraries, tooltip libraries,\n    // AnimatePresence-style overlays) mount here. If this climbs alongside `nodes`,\n    // suspect a portal that isn't unmounting rather than an in-tree leak.\n    bodyChildren: document.body.childElementCount,\n  };\n}\n```\n\nPlot `nodes`/`heapMb`/`willChange`/`bodyChildren` per repetition in the HUD. A plateau after N repetitions = compositor/GPU-resource saturation (usually benign, or fixable by capping concurrent GPU-promoted layers). An unbounded climb = an actual leak (something isn't unmounting or isn't clearing a ref).\n\n## Leak fingerprinting: WHICH element is leaking, not just \"something is\"\n\nThe single most useful technique here — turns \"the DOM node count keeps climbing\" into \"here is the exact element type and class string to grep for\":\n\n```ts\nfunction tagHistogram(): Record<string, number> {\n  const h: Record<string, number> = {};\n  for (const el of document.getElementsByTagName('*')) h[el.tagName] = (h[el.tagName] ?? 0) + 1;\n  return h;\n}\n\n// First measured repetition sets the baseline; every subsequent one reports\n// cumulative growth vs. that baseline — over N repetitions a small per-cycle\n// leak (+3/cycle) becomes impossible to miss (\"+45\" after 15 cycles).\nfunction leakDelta(baseline: Record<string, number>, current: Record<string, number>): string[] {\n  return Object.entries(current)\n    .map(([tag, n]) => [tag, n - (baseline[tag] ?? 0)] as const)\n    .filter(([, delta]) => delta > 0)\n    .sort((a, b) => b[1] - a[1])\n    .slice(0, 6)\n    .map(([tag, delta]) => `${tag.toLowerCase()} +${delta}`);\n}\n```\n\nTwo refinements that make this even sharper:\n- **Fold in your own component markers as pseudo-tags** — count `document.querySelectorAll('[data-my-component]').length` alongside the native tag counts, so growth points at a specific component's subtree, not just \"DIV is growing\" (which could be anything).\n- **When one tag is the top offender, histogram it AGAIN by className** (or by parent tag+class, for class-less elements) to get the exact Tailwind/CSS class string — distinctive enough to `grep` straight to the source line responsible, no guessing which of the app's 40 components renders that tag.\n\n## Shape of the HUD itself\n\n- Gate the entire file behind your framework's dev-only flag (`import.meta.env.DEV` for Vite) so it tree-shakes out of production entirely — zero prod cost.\n- Fixed-position corner overlay, monospace, small — a scrolling table of the last ~16 measured repetitions (duration, jank count, worst frame, fps, heap, node count, will-change count, body-children count), plus a rolling \"leaking since start: tag +N, tag +N...\" line once a baseline exists.\n- Collapse/clear controls so it doesn't get in the way when you're not actively investigating.\n\n## What NOT to do\n\n- Don't assume 60fps and hardcode a 16.7ms jank threshold — compute it from the actual observed frame cadence so the tool works unmodified on 120/144Hz hardware.\n- Don't rely on `performance.memory` existing — it's Chromium-only and non-standard; feature-detect and report 0/unavailable elsewhere rather than throwing.\n- Don't ship this to production, even inert — gate the whole module import behind the dev flag so bundlers can tree-shake it, not just hide it behind a runtime `if`."}, {"id": "session-revocation-vs-minted-tokens.md", "title": "\"Sign out everywhere\" doesn't reach the short-lived tokens you minted from the session", "kind": "gotcha", "last_verified": "2026-07-23", "stack": ["auth", "sessions", "jwt", "powersync", "s3", "presigned-urls", "local-first"], "groups": ["Auth & Security", "Cloud & Backend", "Data & Sync"], "description": "Opaque revocable sessions give you instant \"sign out everywhere\", but any short-lived token you MINT from a session and hand to a stateless verifier (PowerSync/JWKS JWTs, S3/R2 presigned URLs, access tokens) outlives the revoke by its own TTL — there's no revocation list in the JWKS/presigned model. Close the gap by routing high-value actions (writes, minting NEW tokens) through the revocable session so they 401 instantly, keep minted-token TTLs short (that TTL = your revocation latency), and skip the real-time force-logout push (it only shaves a read-only tail on a device that already holds the local copy). \"Signed out\" is a per-request server check, not a client state.", "content": "# \"Sign out everywhere\" doesn't reach the short-lived tokens you minted from the session\n\n## Symptom\n\nYou build opaque, server-side sessions (a random token, hashed in a `sessions`\ntable, revocable by setting `revoked_at`). Revocation works: hit\n`/auth/signout-all`, run one `UPDATE ... WHERE user_id = $1`, and the next\nrequest carrying that session gets a 401. You ship \"sign out everywhere\" as a\nlost-/stolen-device kill switch and call it done.\n\nThen you notice a device whose session you just revoked can KEEP SYNCING for a\nfew more minutes — or keep pulling attachments. The takeover kill switch has a\nhole you didn't design for.\n\n## Cause\n\nYour revocable session is not the only credential in play. Anything you MINT\nfrom that session — and hand to a subsystem that verifies it WITHOUT calling\nback to your session store — outlives the revocation by its own TTL:\n\n- **Sync-service JWTs (PowerSync / Firebase-style).** The client exchanges its\n  session for a short-lived RS256 JWT that the sync service verifies against\n  your JWKS. JWKS verification is stateless by design — the service never phones\n  home — so a JWT already in the client's hand stays valid until it expires.\n  There is no revocation list in the JWKS model.\n- **S3 / R2 presigned URLs.** Signed with a TTL; the object store honors the\n  signature until it expires, with zero knowledge of your session state.\n- **Any bearer access token** in an access+refresh scheme: the access token is\n  self-contained and valid till expiry; only the refresh is gated.\n\nSo \"revoke all sessions\" instantly kills every path that RE-CHECKS the session\nper request, but leaves a tail equal to the longest-lived minted token.\n\n## Fix\n\nTwo parts: make the part that MATTERS have no tail, and make the unavoidable\ntail as short as the design allows.\n\n1. **Route high-value actions through the revocable session, not a minted\n   token.** In our app, WRITES (CRUD upload) and MINTING NEW tokens both\n   authenticate with the session token and do a live store lookup per request.\n   So the instant you revoke: writes 401, and no new sync/presign tokens can be\n   minted. The account-takeover vector (modifying data) closes with NO window —\n   only read-via-already-minted-token has a tail.\n2. **Keep minted-token TTLs short — that TTL _is_ your revocation latency.**\n   PowerSync's recommended floor for asymmetric keys is ~5 min; keep presigned\n   URLs similar. That number is the max time a revoked device keeps read access.\n3. **Don't reach for a real-time \"force logout\" push unless the tail sits on a\n   high-value action.** We considered a server→device push and rejected it: it\n   would only shave the read-only sync tail (on a device that already holds the\n   local-first copy anyway), while the write/account vector is already instant.\n   Per-request server checks beat a push for the thing that matters.\n4. **Name what you can't reach as accepted, not a bug.** A local-first app's\n   data already on the physical stolen device is unreachable — no server action\n   remote-wipes a device you don't hold. Put that in the threat model explicitly.\n\n## Notes\n\n- The load-bearing mental model: **\"signed out\" is enforced per-request\n  server-side, not a client state.** A stolen client can still DISPLAY \"signed\n  in\" and be completely inert, because every action re-checks. That's the\n  reassuring half — UI lag on the victim's other device doesn't mean the\n  attacker kept capability.\n- The client \"sign out everywhere\" should clear locally ONLY on a confirmed\n  server revoke; on a failed/uncertain call, keep the local session and warn +\n  offer retry. Silently clearing only the local device while the others stay\n  live inverts the entire point of the feature.\n- Related: [[db-backed-auth-503-not-401]] (the same opaque-session store must\n  answer 503, not 401, on an outage) and [[r2-presigned-put-size-limits]].\n- Verified 2026-07-23: cross-device revoke confirmed — writes 401 instantly, the\n  sync stream stopped within the ~5-min JWT TTL."}, {"id": "shared-schema-multiple-projections-drift.md", "title": "One shared parse schema, many row-producers — a centralized helper isn't enough", "kind": "gotcha", "last_verified": "2026-07-08", "stack": ["zod", "sql", "typescript", "graphql"], "groups": ["Cloud & Backend", "Frameworks & Libraries", "Languages"], "description": "A same-repo, same-commit drift flavor: multiple SQL/query call sites feed ONE shared parse schema, and a centralized column-list helper doesn't stop a second call site from writing its own inline SELECT. Recurred twice in the same codebase; the mitigation menu from cheapest to strongest.", "content": "# One shared parse schema, many row-producers — a centralized helper isn't enough\n\n**One-liner:** when several independent queries (or resolvers, or handlers) each produce their own row shape but all get validated by ONE shared schema, adding a required field to that schema does not automatically make every producer emit it. This is a same-repo, same-commit flavor of schema drift — no staleness, no separate system, just N places that build a row and one schema that all of them feed. It recurred **twice** in the same codebase, in the same shape, because the fix the first time (extract a shared column-list helper) only protects the call sites that actually adopt it.\n\n## The trap, concretely\n\n`journalEntrySelectSchema` (a Zod schema) gained a required field (`uuid: z.string().nullable()`) during a UUID migration. Two SQL projections fed rows into `.parse(journalEntrySelectSchema)`:\n\n```ts\n// queries.ts — the CENTRALIZED helper, extracted after the first time this bug happened\nconst SESSION_ENTRY_COLUMNS = `\n  id, uuid, game_id AS gameId, notes,\n  intention_1 AS intention1, /* ...more columns... */\n  created_at AS createdAt, updated_at AS updatedAt\n`;\n// this one got updated when `uuid` was added — it's the ONE place the column list lives\n```\n\n```tsx\n// GameDetail.tsx — a SECOND, independent inline SELECT that never adopted the helper\nconst rows = await db.select(`SELECT id, game_id AS gameId, notes, /* no uuid */ ...\n  FROM journal_entries WHERE game_id = $1 ...`);\nz.array(journalEntrySelectSchema).parse(rows); // throws: uuid is required but missing\n```\n\nOnly the centralized helper's projection was updated. The inline one wasn't — because nothing forced `GameDetail.tsx` to use the helper instead of writing its own `SELECT`. Zod threw on every row from the inline site. The surrounding code had a silent `catch {}`, so the array quietly stayed `[]`. The UI sections gated on `entries.length > 0` silently never rendered. Meanwhile a completely different part of the same screen kept working, because it read from a *different* schema/query pair — so the bug presented as \"this one panel is empty,\" not \"the schema/projection contract broke,\" and took real debugging time to trace back to a one-line projection gap.\n\n## The general shape\n\nAny time you have:\n- **One shared validation schema** (Zod, io-ts, a GraphQL type, a Pydantic model) that multiple code paths validate rows against, AND\n- **More than one producer** of rows for that schema (multiple SQL queries, multiple resolvers, multiple API handlers)\n\n...you have this exposure. Adding a required field to the schema is a **type-level** change, but the producers are often untyped strings (raw SQL) or otherwise not statically checked against the schema's shape — so the compiler doesn't catch a producer that's now short a field. The mismatch only surfaces at runtime, at the `.parse()` call, and only for the producer(s) that didn't get updated.\n\n## Why \"extract a shared helper\" only half-fixes it\n\nPlaymoir already hit this once and extracted `SESSION_ENTRY_COLUMNS` specifically to centralize the column list. That worked for every call site that imports and uses the helper. It did **nothing** to stop a later call site from writing its own inline `SELECT` instead — which is exactly what happened. A centralized helper is opt-in; nothing enforced its use.\n\n## Mitigation menu (pick based on how much you want to spend)\n\n1. **Procedural (free, relies on memory):** when you add a required field to a shared schema, grep every `.parse(<schemaName>)` call site in the codebase and manually verify each upstream projection includes the new column. Cheap, works, but only as reliable as remembering to do it.\n2. **Structural — one helper per table, enforced by review/grep:** export exactly one \"these are the columns\" helper per table, and treat any *other* inline `SELECT` targeting that table as a review red flag. A one-line CI grep (`rg 'FROM journal_entries' --files-without-match 'SESSION_ENTRY_COLUMNS'`) can flag new inline SELECTs against a table that's supposed to only be queried through its helper.\n3. **Structural, stronger — derive the SELECT list FROM the schema at runtime:** instead of a helper that's a second hand-maintained copy of the field list, generate it from the schema itself, e.g. `Object.keys(schema.shape).map(camelToSnake).join(', ')`. Now there is only **one** place the field list is ever written down — the schema — and every query that spreads the derived list picks up a new field automatically. This eliminates the \"two places to keep in sync\" problem instead of just centralizing it into a helper a second caller can still bypass.\n4. **Defensive, always do this regardless of the above:** never let a `.parse()` failure at a data-loading boundary disappear into a silent `catch {}`. Log it at minimum. The reason this bug cost real debugging time wasn't the missing column — it was that the failure mode was \"empty state,\" not \"visible error.\" A logged parse failure turns an invisible bug into an actionable stack trace the moment it happens.\n\n## Relationship to the drift-guard pattern\n\nThis is a sibling of [`n-copies-of-truth-drift-guard.md`](./n-copies-of-truth-drift-guard.md) but a different flavor: that lesson is about copies of a schema spread across **independent systems** (DB, sync layer, client, server) that go stale relative to each other over time. This one is about copies **inside the same repo, same commit** — multiple query sites that happen to feed one shared type, where nothing but convention keeps them aligned. Same root cause (one conceptual schema, N independent producers, silent-by-default validation), different blast radius (cross-system vs. cross-call-site).\n\n---\n*Captured from Playmoir's journal-entries UUID migration bug (fixed commit `f814635`, 2026-05-17) — noted in the codebase's own bug log as \"the second drift bug of this exact shape.\"*"}, {"id": "signed-but-flagged-download-reputation.md", "title": "Your correctly-signed installer still says \"may be dangerous\" — it's reputation, not signature, and one tier has no appeal", "kind": "gotcha", "last_verified": "2026-07-23", "stack": ["windows", "code-signing", "azure-trusted-signing", "smartscreen", "chrome", "distribution"], "groups": ["Auth & Security", "Platforms & Runtimes"], "description": "A correctly code-signed Windows installer (`signtool verify /pa` clean, VirusTotal 0/N) still trips Chrome \"isn't commonly downloaded\" and SmartScreen \"Windows protected your PC\" because both are REPUTATION systems (download volume + signing identity + file hash), not signature checks. 2026 traps for Azure Trusted Signing: the EV-cert instant-reputation escape hatch is gone, and a ~late-March-2026 CA migration (`AOC CA 0x` intermediates) reset SmartScreen rep. The soft Chrome notice has NO appeal (the Safe Browsing report form is only for false _dangerous_ verdicts) — it clears with volume under a stable identity. VirusTotal 0/N doesn't clear it but is a reassurance artifact to link (re-scan per build; hash is per-version).", "content": "# Your correctly-signed installer still says \"may be dangerous\" — it's reputation, not signature, and one tier has no appeal\n\n## Symptom\n\nYou code-sign your Windows installer (e.g. Azure Trusted Signing), `signtool\nverify /pa` passes clean, VirusTotal is 0/N. Yet:\n\n- Chrome's download bar says **\"This file isn't commonly downloaded and it may\n  be dangerous\"** (Keep / Discard).\n- Windows SmartScreen throws **\"Windows protected your PC\"** on first run.\n\nYou start hunting for the signing bug that isn't there, or for an \"appeal\" form\nthat doesn't apply.\n\n## Cause\n\nSigning establishes IDENTITY, not TRUST. Both warnings are **reputation**\nsystems keyed on download volume + your signing identity + the file hash — and a\nnew publisher / new file has none yet:\n\n- **Chrome's \"not commonly downloaded\"** is a SOFT Safe Browsing tier: literally\n  \"few people have downloaded this exact file.\" It is NOT a malware verdict (the\n  \"Download suspicious file\" option is still offered). It clears with volume.\n- **SmartScreen** reputation is per-file-hash AND influenced by the issuing CA's\n  accumulated trust.\n\nTwo 2026-specific traps compound it for Azure Trusted Signing users:\n\n- **The EV escape hatch is gone.** EV code-signing certs used to grant INSTANT\n  SmartScreen reputation. Microsoft stopped issuing new EV code-signing certs in\n  favor of Trusted Signing, which does NOT confer instant reputation.\n- **A CA migration reset reputation.** Around late March 2026, Azure Trusted\n  Signing silently moved signing to new intermediate CAs (Microsoft ID Verified\n  CS AOC CA 03 / EOC CA 03–04) WITHOUT carrying SmartScreen reputation over, so\n  correctly-signed builds began re-tripping SmartScreen. Widespread, Microsoft's\n  side, self-heals as the new CA accrues. Check your chain with `signtool verify\n  /pa /v` — an `AOC CA 0x` intermediate means you're in the affected cohort.\n\n## Fix\n\nThere is no switch. The levers, honestly ranked:\n\n1. **Do nothing structural; accrue reputation.** Volume under a STABLE signing\n   identity + stable download URL. Reputation attaches to the publisher, so each\n   new build sheds the warning faster over time. Churning the cert/identity\n   resets the clock.\n2. **Identify which warning you have — only one is appealable.** The Chrome SOFT\n   \"not commonly downloaded\" notice has NO appeal path. `safebrowsing.google.com/\n   safebrowsing/report_error/` is for contesting a FALSE _dangerous_/malware\n   verdict or a \"deceptive site\" block — submitting a merely-unknown file there\n   does nothing. Don't waste time on it.\n3. **Publish reassurance, not a fix.** A VirusTotal permalink (0/N) does NOT\n   clear Chrome's notice (Chrome doesn't read VT), but it's a public,\n   no-login-needed artifact to link on your download page so testers read the\n   warning as newness, not malware. Pair with \"signed by <publisher>\" + the\n   SHA-256.\n\n## Notes\n\n- Dead-end value: the hours people lose here go to (a) re-verifying a signature\n  that's fine and (b) hunting a Chrome appeal that doesn't exist for the soft\n  tier. Recognize the tier FIRST — soft notice (no appeal, wait for volume) vs.\n  hard \"dangerous\" block (a real false positive worth reporting).\n- The VT permalink and SHA-256 are PER-BUILD. A versionless \"latest\" download\n  URL changes hash every release, so a hardcoded VT link on your site points at\n  an old version's scan after the next release — re-scan + update it each\n  release, or state the general \"signed + scanned each build\" claim and let the\n  link be clearly version-tagged.\n- Related: [[azure-cli-windows-auth-traps]] (the `az` login side of a Trusted\n  Signing pipeline), [[tauri-desktop-security-hardening]].\n- Verified 2026-07-23 against a Trusted-Signing `AOC CA 04` chain: `signtool\n  verify /pa` clean, VirusTotal 0/63 on the signed MSI, Chrome still showed the\n  soft notice (expected — reputation, not signature)."}, {"id": "single-select-that-commits-cant-be-a-radio-group.md", "title": "A single-select that commits on choice cannot be a radio group", "kind": "gotcha", "last_verified": "2026-07-28", "stack": ["frontend", "html", "accessibility", "react", "forms"], "groups": ["Frameworks & Libraries", "Other"], "description": "A native radio group SELECTS as the arrow keys travel through it, and that selection dispatches both `change` AND `click` — so no event on a radio distinguishes \"chose this\" from \"passed over this on the way elsewhere\". Any control that commits, writes, closes or navigates on selection therefore fires that on values the user never picked (measured: guarding on `click` does not help; `event.detail` is reasoned-and-rejected, label-forwarded clicks make it unreliable and it breaks Space). Radios use *automatic* activation and offer no browse-without-selecting state — which is exactly the \"arrows move, Enter confirms\" model people describe wanting. Fix: buttons + `aria-pressed` (five tab stops, which is what users assume anyway), or the ARIA manual-activation pattern if you need one tab stop. Radios stay correct wherever selection is cheap and reversible, e.g. inside a form that commits on Save.", "content": "# A single-select that commits on choice cannot be a radio group\n\n**One-liner:** a native radio group *selects as the arrow keys travel through it*, and that selection dispatches **both `change` and `click`** — so if your control does anything irreversible on selection (writes to a DB, closes a popover, submits), the first arrow press fires it on a value the user was only passing over. No event on a radio can tell \"chose this\" from \"travelled through this\". Use buttons with `aria-pressed`, or the ARIA manual-activation pattern.\n\n## The failure shape\n\nYou build a small \"pick one of five\" control — durations, sort orders, filter presets. It lives in a popover, and picking an option should commit and dismiss, because leaving the panel open after a one-click answer makes the user close something they already answered.\n\nRadios are the semantically correct control for one-of-N, so you reach for them: real `<input type=\"radio\">` under styled labels, because a hand-rolled `role=\"radio\"` div owes the user arrow-key traversal and focus management, and hand-rolled versions of that are how a codebase ends up with a fifth half-correct widget. Good instinct. Wrong control.\n\nThe bug the user reports is confusing, which is what makes this worth writing down:\n\n> \"tab works, arrows don't\"\n\nor\n\n> \"if i click the reminder, click tab (selects a chip) then the arrow key it goes to the next one and closes immediately\"\n\nThe arrow keys are working perfectly. They move to the next option, select it, your `onChange` fires, you commit and dismiss — and the panel vanishes before the user sees anything move. It reads as \"the arrow key is broken\" when it is in fact \"the arrow key did the whole job instantly, on the wrong value.\"\n\n## Why this happens\n\nTwo separate facts combine badly:\n\n1. **A radio group uses *automatic activation*.** Tab enters the group and lands on the checked radio (one tab stop for the whole group, which is correct). Arrow keys then move focus **and change the selection** at the same time. There is no \"browse without selecting\" state. Compare **manual activation**, where arrows move a focus ring and Enter/Space commits — that is the mental model most people describe when they say \"it's just a selector, Enter should confirm\", and radios do not offer it.\n\n2. **Arrow-key selection runs the element's activation behaviour, which dispatches a `click` event.** This is the part that ambushes you. `click` is not a pointer-only event on form controls.\n\nSo both of the obvious discriminators fail:\n\n```jsx\n// FAILS: change fires for every option you arrow past.\n<input type=\"radio\" onChange={() => commitAndClose(value)} />\n\n// ALSO FAILS: click fires on arrow traversal too.\n<input type=\"radio\"\n       onChange={() => stage(value)}\n       onClick={() => commitAndClose(value)} />\n```\n\n**Measured, not assumed:** the second form was actually built and tested, and the arrow key still closed the panel on the first press.\n\n### The fix that looks clever and isn't worth it\n\n`MouseEvent.detail` is 0 for keyboard-generated clicks and ≥1 for real pointer clicks, so `onClick={e => { if (e.detail > 0) commit() }}` looks like the answer.\n\n**Not measured — reasoned, and rejected before building**, for three reasons worth knowing:\n\n- Clicking a `<label>` dispatches a *second*, synthesized click at the labeled control, and its `detail` is not reliably 1 across browsers. Your commit either double-fires or doesn't fire.\n- `Space` on a focused radio also produces a `detail: 0` click. If you filter those out you have just broken the keyboard path you were trying to protect, and now you need an `onKeyDown` for Enter and Space anyway.\n- You end up with three handlers coordinating through event archaeology to reconstruct a fact the platform could have told you plainly. The next person to touch it will not know why, and there is a good chance they \"simplify\" it back into the bug.\n\n## The fix\n\n**Use buttons.** They have no traversal semantics to fight: Tab moves, Enter/Space activates, activation is the only signal, and there is exactly one event to handle.\n\n```jsx\n<div role=\"group\" aria-label=\"Remind me in\">\n  {PRESETS.map(p => (\n    <button\n      key={p.days}\n      type=\"button\"\n      aria-pressed={value === p.days}      // carries what `checked` used to\n      onClick={() => commitAndClose(p.days)}\n      className={/* focus-visible:ring-2 — you own the focus ring now */}\n    >\n      {p.label}\n    <\/button>\n  ))}\n<\/div>\n```\n\nWhat you trade:\n\n| | radio group | buttons + `aria-pressed` |\n|---|---|---|\n| Tab stops | 1 for the whole group | 1 per option |\n| Arrow keys | move **and select** | nothing |\n| Can browse without selecting | no | n/a — nothing selects until you activate |\n| Distinguishes chose-vs-passed-over | **no** | yes, trivially |\n| Screen reader announces | \"radio group, 2 of 5\" | pressed/not pressed per button |\n\nFive tab stops for a five-item chip row inside a popover is what most people expect anyway — it is what the user in this case had assumed was happening before any of this came up.\n\nIf you genuinely need one tab stop (a long list, or a control that must not eat the tab order), use the ARIA **manual activation** pattern instead: `role=\"radiogroup\"` + roving `tabindex`, arrows move focus *only*, Enter/Space selects. That is more code and you owe the user correct focus management — but it is the honest construct for \"browse, then confirm\", and it is what you were reaching for when you picked radios.\n\n## When a radio group is still right\n\nRadios remain correct — and preferable — when **selection is not a commit**:\n\n- Inside a form that commits on Save. Nothing happens when the value changes, so automatic activation costs nothing. (In the case this came from, the same picker sits in a form *and* in a commit-on-click popover; the form half would have been perfectly happy as radios.)\n- Any filter/toggle where changing the value is instantly reversible and has no side effect beyond re-rendering.\n\nThe rule is not \"radios are bad\". It is: **automatic activation is fine when activation is cheap.** The moment selection writes, navigates, closes, or otherwise costs something, arrow traversal is firing that cost on values the user never chose.\n\n## Checklist\n\nBefore using a radio group, ask:\n\n- [ ] Does anything happen the instant the value changes — a write, a network call, a dismiss, a navigation?\n- [ ] If yes: can the user reach option 5 without options 2, 3 and 4 doing that thing on the way? **With radios, no.**\n- [ ] Am I about to write `onClick` on a radio to detect \"a real choice\"? It fires on arrow keys. Stop.\n- [ ] Am I about to inspect `event.detail`? You are reconstructing intent from event trivia. Change the control.\n- [ ] If I switch to buttons: have I added `aria-pressed`, a `role=\"group\"` with a label, and my own `focus-visible` ring? (Buttons don't group themselves, and a visually-hidden input's focus state is not free either way.)\n\n## Related\n\n- [[derive-dont-track-ui-flags]] — same family: the fix is changing the shape so the bug cannot exist, not adding another guard to the shape that has it."}, {"id": "sql-migration-runner-auto-baseline.md", "title": "A safe SQL migration runner (with auto-baseline on adoption)", "kind": "howto", "last_verified": "2026-06-29", "stack": ["postgres", "node", "migrations"], "groups": ["Cloud & Backend", "Data & Sync", "Platforms & Runtimes"], "description": "A one-command migration runner that won't wipe data: auto-baselines an already-hand-migrated DB (records files as applied, runs none) so early `drop table` migrations can't re-run. Dry-run, per-migration transactions, multi-statement handling.", "content": "# A safe SQL migration runner (with auto-baseline on adoption)\n\n**Problem:** you have numbered `.sql` migrations you've been running by hand (pasting into a dashboard SQL editor). You want one command — but a naive \"run every file\" runner will **wipe data** if any early migration starts with `drop table if exists` (common when an early migration replaced a throwaway spike table) and you point it at a DB that's *already* migrated.\n\n## The core idea\nTrack applied migrations in a `_migrations` table; only run files not yet recorded. The subtlety is **adoption**: the first time you run the tool against a DB that was set up by hand, `_migrations` is empty, so a naive runner thinks NOTHING is applied and re-runs everything — including the destructive `drop table`s.\n\n**Fix: auto-baseline.** On first run, if the tracker is absent BUT the schema clearly already exists (a known core table is present), **record every current file as applied and run NONE.** A truly fresh DB (core table absent) runs everything in order.\n\n## Detection logic\n```\ntrackerExisted = <_migrations table exists?>\nensure _migrations table (skip in --dry-run)\napplied        = rows in _migrations (empty set if it didn't exist)\npending        = files not in applied\n\nif pending is empty:                          -> up to date, nothing to do\nelse if !trackerExisted && coreTableExists:   -> BASELINE: insert all pending as applied, run NONE\nelse:                                          -> run each pending file in its own transaction, record it\n```\n\n## Implementation notes\n- **One transaction per migration** (`BEGIN; <file sql>; INSERT _migrations; COMMIT`). On failure, `ROLLBACK` and STOP — earlier migrations stay committed; fix and re-run.\n- **Multi-statement files:** with node-postgres, `client.query(fileText)` (no params → simple protocol) runs multiple `;`-separated statements in one call. Postgres DDL is transactional, so the wrapper gives atomicity per file.\n- **`--dry-run` must write NOTHING** — don't even `CREATE TABLE _migrations` in dry-run; treat a missing tracker as an empty set. This lets you preview the plan against a live DB safely (read-only).\n- **Reuse the app's DB connection config** (same `DATABASE_URL`, same TLS/CA settings) so the runner connects identically to the server.\n- Numbered prefixes (`0001_`, `0002_`) sort lexically into apply order — keep the zero-padding.\n- Idempotent: a second run reports \"up to date.\"\n\n## Verify before trusting it on prod\n1. `--dry-run` against the live DB first (read-only). It should report the baseline plan: *\"existing schema detected, would baseline N, run none.\"*\n2. Run for real → it baselines (records files as applied, executes none).\n3. Run again → must say \"nothing to apply.\" That three-step check proves both the detection and the idempotency.\n\n## Note: local vs cloud migrations\nThis is for the **cloud** DB (the one you hand-migrate). A local embedded DB (e.g. Tauri's SQLite via tauri-plugin-sql) usually has its **own** migration ledger that auto-runs on app launch — keep the two separate; this runner is not for those.\n\n---\n*Captured from the Playmoir migration runner, 2026-06-29 (`apps/server/migrate.js`, Supabase Postgres).*"}, {"id": "steam-library-integration.md", "title": "Steam library integration — cover art, install-state, and the ToS constraint that shapes the whole architecture", "kind": "reference", "last_verified": "2026-08-11", "stack": ["steam", "rust", "vdf", "game-library-integration", "cdn"], "groups": ["Integrations", "Languages", "Other"], "description": "Steam's librarycache has three coexisting cover-art layouts across client versions; VDF text parsing vs. binary `appinfo.vdf` (use a validated crate); an authoritative-scan-diff pattern for install-state with a hard failure-vs-empty rule; and the Steam Web API 100k-calls/day ToS cap that forces a local-scan + OpenID + BYO-key three-tier architecture.", "content": "# Steam library integration — cover art, install-state, and the ToS constraint that shapes the whole architecture\n\n**Context:** for any project that reads a user's local Steam library (a launcher, an overlay tool, a companion app — not just Playmoir). Steam's client has changed its on-disk layouts multiple times over the years and there's very little good public documentation of the current state; this is a snapshot of what actually works today, plus the ToS constraint that determines your architecture before you write any code.\n\n## 1. Cover-art resolution — Steam's librarycache has THREE coexisting layouts\n\nA real Steam install has games cached at different times across client updates, so all three layouts can be present simultaneously on one machine:\n\n| Layout | Shape | Era |\n|---|---|---|\n| **A — flat-in-appid-dir** | `{appid}/library_600x900.jpg`, `_2x.jpg` variant, `library_capsule.jpg`, `header.jpg`, `library_hero.jpg`, `logo.png` | Current-ish |\n| **B — nested content-hash** | `{appid}/{contentHash}/library_capsule.jpg`, `.../library_header.jpg`, `.../library_hero.jpg`, `.../library_hero_blur.jpg` | Newest |\n| **C — legacy flat** | `librarycache/{appid}_library_600x900.jpg` directly in the root | Old |\n\n**Resolution technique:** walk all three layouts unconditionally and use a `maybe_set(slot, dir, filename)` helper that only writes into an `Option<String>` slot if it's currently empty. Scan order stops mattering — each asset slot (capsule/header/hero/logo) just converges on whichever layout actually has that file for that game. Prefer the `@2x` variant when both exist (some games cache ONLY the `@2x` file, so don't skip checking for it).\n\n**Windows path gotcha:** Steam's registry `SteamPath` value uses forward slashes; joining it with `PathBuf::join` on Windows injects backslashes, producing a mixed-slash path. If you're feeding this path into something with its own glob-matching (e.g. Tauri's asset-protocol scope), mixed separators silently fail to match. Normalize to one separator (flatten to `/`) before using the path anywhere that does its own matching.\n\n**If a cover looks broken/missing** even after checking all three layouts: Steam's librarycache is populated **lazily**. A game that hasn't been opened/viewed in the Steam client recently may simply not have its art cached to disk yet, regardless of which layout you're checking. The reliable fix is prompting the user to click the game once in Steam's own library (which triggers Steam to download the missing asset) — your code's three-layout fallback chain is the safety net for \"which layout is it in,\" not a fix for \"Steam hasn't downloaded it at all.\"\n\n## 2. Text KeyValues (VDF) parsing — hand-roll it, it's simpler than it looks\n\n`libraryfolders.vdf` (which drives lets exist at multiple Steam library locations) and `appmanifest_{appid}.acf` (per-game install metadata: `name`, `installdir`, `StateFlags`, `SizeOnDisk`, `LastPlayed`) are both Valve's plain-text **KeyValues** format — nested `\"key\" \"value\"` pairs in braces.\n\nIf every field you need is a **flat, top-level pair** (not nested inside a same-named sibling key that could collide), a hand-rolled line-scan extractor is legitimately simpler and more auditable than pulling in a general KeyValues parser — you don't need full tree parsing for \"give me the value next to this exact key at this nesting depth.\" Two real gotchas either way:\n\n- **`libraryfolders.vdf` lives at two possible paths** depending on Steam client version: `steamapps/libraryfolders.vdf` (legacy) and `config/libraryfolders.vdf` (newer). Check both; don't assume one.\n- **VDF string values backslash-escape quotes and backslashes** (Windows paths inside VDF look like `\"installdir\"  \"Half-Life\\\\2\"`). Unescape `\\\\` sequences before using the extracted path — skipping this corrupts any path containing a literal backslash (i.e. every Windows path).\n\n## 3. Binary `appinfo.vdf` — don't hand-roll this one, use a validated crate\n\n`appinfo.vdf` (Steam's cache of every app's metadata, including whether an appid is a real game vs. a tool/demo/soundtrack/DLC) is a **different, binary** format — not text KeyValues — and Valve has changed its binary structure over time (a comment in this codebase's `Cargo.toml` notes it's currently \"v41 string-table format, June 2024\"). This is exactly the case where \"don't reinvent the wheel\" flips to \"don't hand-roll a binary format parser Valve can silently version-bump\" — use a maintained crate (this project uses `steam-vdf-parser` from crates.io) and **validate it against a real, current `appinfo.vdf` file before trusting it** — binary format parsers for undocumented formats are exactly where a stale crate silently breaks.\n\nRead the app's classification via `appinfo → common → type` (Steam's own field distinguishing `game` from tool/demo/etc.) instead of hand-maintaining a denylist of non-game appids — it's self-updating as Steam adds new apps. Keep a small static fallback denylist (known non-game appids like the Steamworks Common Redistributables, `228980`) for when `appinfo.vdf` can't be read at all, so the feature degrades instead of failing outright.\n\n## 4. Install-state reconciliation: authoritative-scan-diff, with a hard rule about failure vs. empty\n\nThe general pattern for \"periodically re-derive a local boolean from a live external source\" (not Steam-specific in principle, but this is the clearest instance): treat a fresh scan as authoritative, and flip every row that claims `installed = true` but is absent from the new scan.\n\n```sql\nUPDATE games SET installed = 0, updated_at = unixepoch()\nWHERE platform = 'steam' AND installed = 1 AND deleted_at IS NULL\n  AND steam_appid NOT IN (...)   -- the just-scanned set of currently-installed appids\n```\n\n**The same pattern applies to a REMOTE authoritative-set pull, not just a local scan** — with one extra gotcha. A \"pull my owned games\" REST/API pull that only ever *upserts what it received* has the identical bug in a different guise: a refunded or gift-removed game is simply absent from the response (the server already filters it out), so a naive pull never removes the now-stale local row — it just silently never updates it again, and the count drifts upward forever. Fix: after upserting the received set, also soft-delete local live rows scoped to that source whose id is absent from it (`WHERE platform = 'steam' AND deleted_at IS NULL AND steam_appid NOT IN (...pulled ids...)`) — same shape as the install-state diff above, applied to *ownership* instead of *install state*. Two guards this version needs that the pure-local scan doesn't:\n- **Don't prune a row that has a competing local authority.** A game that's still installed on disk but absent from the \"owned\" pull is very often *family-shared* (some platforms surface a shared library's installed titles even though the owning account isn't the pulling account) — pruning it would vanish a game that's genuinely still playable. Exclude anything the local scan independently confirms is installed; a real refund self-heals once the game is eventually uninstalled and the next pull runs.\n- **An empty/short response must never drive a prune.** A fresh sign-in whose cloud side hasn't populated yet, or a paginated response you're only seeing one page of, looks identical to \"the user now owns zero games\" from the diff's point of view — skip the prune entirely whenever the pulled set is empty, rather than trusting absence-from-empty as a signal.\n\n**The load-bearing correctness rule:** the scan function must return an explicit `Err` (failure) when Steam isn't installed at all or the scan couldn't complete — never `Ok(empty list)` for that case. If \"Steam not found\" and \"Steam found, zero games installed\" both produced an empty list, a transient scan failure (or a machine that simply doesn't have Steam) would mass-flip every previously-installed row to `false`. Only reconcile against a **proven-successful** scan; a proven-failed one should leave existing state untouched. This is the general shape for any \"resync local state from an external source\" feature — the failure path and the legitimately-empty path must be distinguishable at the type level (`Result`, not a plain array), or a transient failure silently masquerades as \"everything is now gone.\"\n\n## 5. The Steam Web API ToS constraint that determines your whole import architecture\n\nSteam's Web API terms cap a single developer key at **100,000 calls/day** and prohibit sharing or delegating that key to third parties. A product that proxies Steam Web API calls through one shared backend-held key cannot scale past a small user base — 1,000 users making 100 calls/day each exhausts the daily cap by noon. This is a hard constraint, not a \"we'll optimize later\" problem.\n\nThe pattern other Steam-integrated tools (Playnite, GOG Galaxy 2.0) and this project converge on is a **three-tier import model** that avoids the shared-key bottleneck entirely:\n\n1. **Local VDF/ACF read** for installed games — no API key needed at all (sections 1–4 above).\n2. **Steam OpenID 2.0 sign-in** for identity only (SteamID64) — not the Web API, no key, no rate limit (see `powersync-steam-backend-architecture.md` for the OpenID flow itself).\n3. **User brings their own Steam Web API key** (self-service, free, instant at Steam's key page) for anything that needs the full owned-games list beyond what's locally installed — each user consumes their OWN 100k/day budget, so the product's scale is no longer bounded by a shared key. Store the user's key via the OS keychain/DPAPI, not plaintext.\n\nIf you're scoping a new Steam-integrated feature, decide up front which of these three tiers it actually needs — most \"show the user's library\" features only need tier 1, and reaching for tier 3 (asking the user for their own API key) should be reserved for features that genuinely need data local scanning can't provide (full owned-games list including uninstalled-and-never-locally-seen games, playtime history, etc.).\n\n## 6. The web CDN is NOT the librarycache — Steam runs two disjoint asset pipelines\n\nSection 1's layout B (nested content-hash directories) is not just a directory shape you walk: **those hashes are the only key to assets that exist nowhere else on the public web.** Steam serves game art through two pipelines, and neither is a superset of the other:\n\n- **The store pipeline** — flat, guessable URLs (`cdn.cloudflare.steamstatic.com/steam/apps/{appid}/logo.png`, `library_hero.jpg`, …) plus `IStoreBrowseService/GetItems` with `include_assets`, which returns hash-named *store* assets (capsules, heroes, header). **GetItems never returns a `logo` entry — for any game.**\n- **The library pipeline** — hash-addressed URLs of the shape `shared.steamstatic.com/store_item_assets/steam/apps/{appid}/{hash}/logo.png`. Publicly served (200, no auth), but the hashes come from appinfo, i.e. from the Steam **client** — no public web API exposes them. The client materialises them on disk as layout B: `librarycache/{appid}/{hash}/logo.png`.\n\nMeasured on a real 728-game library (2026-08-10): 86 games have no flat `logo.png`; **21 of those have a logo that exists only in the library pipeline** (new titles are the common case), which the Steam client renders happily while every web-side probe swears no logo exists. The remaining 65 genuinely have no logo asset anywhere — for those, a text fallback is *correct* and Steam's own client shows text too.\n\n**The workable fix for a companion device (phone/web) that can't read librarycache:** harvest the hashes from a machine that can — one pass over `librarycache/*/*/logo.png` yields `{appid → hash}` — and mirror them through your own backend as a column the companion client reads. Two properties make this better than it sounds:\n\n- **Hash-addressed URLs are content-addressed, so they can never go stale.** The flat URLs can and do: a publisher rebrand replaces `logo.png` in place, and any client that cached the old bytes (image loaders default to serve-from-disk-without-revalidation) shows yesterday's logo indefinitely. A rebrand changes the *hash*, so a hash URL either serves the right bytes or 404s into your fallback chain. Prefer the hashed rung FIRST when you know the hash, flat as fallback.\n- The harvest decays as the library grows — new purchases have no hash until the harvesting machine re-runs. Make the desktop client maintain the column as part of its normal library sync, not a hand-run script.\n\nThe epistemics of how this was almost missed — a unanimous two-source census concluding \"no logo exists\" for logos the desktop was visibly rendering — is written up in [[negative-control-before-trusting-a-probe]] (believed negatives need a positive control). The mechanics live here; don't duplicate the story there.\n\n## Related, adjacent domain (save-file locations, not cover art)\n\nIf a future feature needs \"where does game X keep its save files,\" don't build a proprietary per-game path database from scratch — the community already maintains one: `mtkennerly/ludusavi` (Rust, GPL-3) ships a manifest dataset (`ludusavi-manifest`) derived from PCGamingWiki's save-location data, keyed by Steam appid. Check its license terms before redistributing, but it's a solved, actively-maintained problem — don't re-derive it by hand."}, {"id": "subset-bundled-fonts.md", "title": "\"Bundling webfonts costs megabytes\" is folklore — measure it, then subset it", "kind": "howto", "last_verified": "2026-08-09", "stack": ["any", "android", "web", "ios", "fonts", "assets", "performance"], "groups": ["Other", "Platforms & Runtimes", "Process & Meta", "Reliability & Perf"], "description": "\"Bundling webfonts would add megabytes\" shipped as a code comment nobody had measured. Actual: 1.62 MB for four families, and the bulk wasn't the Latin glyphs anyone wanted — **every static Rajdhani weight carries a full Devanagari set (~390 KB), and the design needed two**. `pyftsubset` to the ranges the UI can emit took six files to **516 KB** with no visible difference; out-of-range glyphs fall through to the system font, which is correct behaviour anyway. Measure the family AND what's big inside it; derive the ranges from your own strings (the punctuation, not just A–Z); `--layout-features='*'` or you silently lose kerning; take the variable release when one exists but pin the axis per weight or the renderer fakes the bold. Plus the OFL obligations that ride along into a store build.", "content": "# \"Bundling webfonts costs megabytes\" is folklore — measure it, then subset it\n\n**One-liner:** an app shipped with system fonts instead of its own brand typefaces, justified by a code comment reading *\"bundling three webfont families would add megabytes.\"* Nobody had measured. The real number was **1.62 MB for four families**, and the bulk was not the Latin glyphs anyone wanted — **every static Rajdhani weight carries a full Devanagari set at ~390 KB**, and the design needed two of those weights. Subsetting to the character ranges the UI can actually emit took all six files to **516 KB**, with no visible difference. Typography is the single largest carrier of brand identity; half a megabyte is a cheap price, and the folklore had quietly sold it as an expensive one.\n\n## The failure shape\n\nIt is a three-line story and it is very common:\n\n1. Someone asks \"should we bundle the brand fonts?\"\n2. Someone answers \"that would add megabytes\" — plausibly, from experience, without opening a file browser.\n3. **The estimate becomes a code comment**, which reads as a decision that was investigated. Everyone downstream inherits it.\n\nThe tell is a justification that names a *magnitude* rather than a *measurement*: \"megabytes\", \"too big\", \"bloats the bundle\". A real measurement has a number and a date.\n\n## Two things to measure, not one\n\nThe obvious question is \"how big is the family?\" The more useful one is **\"what is big INSIDE it?\"** Those have different answers and only the second one tells you what to do.\n\nGoogle Fonts ships most families with full language coverage. For a Latin-only UI that means you are shipping:\n\n- **Devanagari, Cyrillic, Greek, Vietnamese** — entire scripts, frequently the majority of the file.\n- **Every OpenType layout feature**, including ones nothing enables.\n- On static families, **all of that once per weight.**\n\nMeasured here: Rajdhani has no variable release, so two weights meant two full Devanagari sets — ~780 KB of glyphs for a UI that renders English. That is not \"fonts are big.\" That is \"you are shipping a script you don't use, twice.\"\n\n## The fix, in one command\n\n`pyftsubset` (from `fonttools`) cuts a font to the codepoints you declare:\n\n```bash\npython -m venv .fontvenv && .fontvenv/Scripts/python -m pip install fonttools brotli\n\n# Basic Latin, Latin-1, Latin Extended-A, plus the punctuation a UI actually emits:\n# en/em dashes, curly quotes, bullet, ellipsis, arrows, minus, euro, trademark.\nRANGES=\"U+0020-007E,U+00A0-00FF,U+0100-017F,U+2010-2015,U+2018-201F,U+2022,U+2026,U+2039-203A,U+2190-2193,U+2212,U+20AC,U+2122\"\n\npython -m fontTools.subset in.ttf \\\n  --unicodes=\"$RANGES\" \\\n  --layout-features='*' \\\n  --name-IDs='*' \\\n  --output-file=out.ttf\n```\n\nTwo flags matter more than they look:\n\n- **`--layout-features='*'`** keeps kerning and ligatures. The default drops features, and a subset that kerns worse than the original is a downgrade you will notice on headings before you work out why.\n- **`--name-IDs='*'`** keeps the name table, including the licence and designer records. For OFL fonts that is not cosmetic — see below.\n\nMeasured result, four families / six files: **1.62 MB → 516 KB**, no visible difference.\n\n## Where the ranges come from\n\nDo not guess the ranges from a chart. Derive them:\n\n- **Basic Latin + Latin-1 + Latin Extended-A** covers Western European text and is the safe floor.\n- **Then add the punctuation your own UI emits.** Grep your string resources for typographic characters — em dashes, curly quotes, ellipses, arrows, ™, €. These are the ones that produce a single missing glyph in a shipped screen, which looks far worse than a plainer font would have.\n\n**What happens outside the range is the part that makes this safe:** an unmapped codepoint falls through to the system font. A CJK game title still renders. It renders in the platform font rather than your brand font — which is what would have happened anyway, because no bundled Latin family covered it.\n\n## Variable vs static — the distinction that changes the arithmetic\n\n- **Variable font:** one file serves every weight along an axis. Subset once, done.\n- **Static family:** one file per weight, and every one of them carries the full language coverage. This is where multi-megabyte numbers actually come from.\n\nIf a family has a variable release, take it. If it does not, the per-weight cost is real and you should ship only the weights the design uses — adding a Medium \"for completeness\" is another whole file.\n\n**The trap on the variable side:** the renderer needs the axis pinned per weight, or it loads the file at its default weight and *synthesises* the rest. You get a \"bold\" that is a smeared regular. In Compose that means one `Font(...)` per weight with `variationSettings = FontVariation.Settings(FontVariation.weight(w))`; on the web it is `font-variation-settings` / a correctly declared `@font-face` weight range. Whatever the platform, verify a real bold is being loaded rather than faked — the two look similar in a screenshot and different at a glance in person.\n\n## Licensing rides along\n\nAlmost every Google font is **SIL Open Font License 1.1**. Subsetting is explicitly permitted (it is a Modified Version), but two obligations survive into your binary:\n\n- **Ship the licence text** and keep the copyright notice — this is why `--name-IDs='*'` matters, and why a `FONTS_LICENSE.txt` belongs next to the fonts.\n- **Surface it in-app** if you distribute through a store. A licence file in your repo is not a licence delivered to the user. A \"Licences\" row in Settings opening a scrollable text screen is the standard pattern and takes an hour.\n\nAlso: OFL forbids selling the fonts on their own and forbids using the Reserved Font Name. Subsetting and embedding in a commercial app is fine; renaming the file is fine; calling your subset \"Rajdhani\" while modifying it is the part to read carefully.\n\n## Make it reproducible, commit the output\n\nPut the fetch-and-subset in a script that pins the upstream source and the ranges, and **commit the resulting files**. Then:\n\n- A normal build never touches the network.\n- Regenerating for an upstream revision or a wider range is one command.\n- The ranges are reviewable in a diff instead of living in someone's shell history.\n\nPrint the before/after bytes per file as the script runs. That single line of output is what turns the next \"wouldn't that be huge?\" conversation into a fact.\n\n## Checklist\n\n- [ ] Has anyone actually **measured** the raw files, or is the number folklore?\n- [ ] Do you know **what** is big inside them — a script you don't render, or the glyphs you do?\n- [ ] Variable release availab
