ally \"server is ignorant\" during the window where your delete hasn't uploaded yet — a classic resurrection bug (add-wins-by-accident). Guard it: only clear the local tombstone once the delete is server-acknowledged, OR the incoming row's `updated_at` is causally newer than your local `deleted_at` (a genuine later revive, not sync catching up).\n3. **A fixed wall-clock GC timer on tombstones (e.g. \"purge after 30 days\") is resurrection-unsafe** for any client that can be offline longer than the timer. Every system that documents this (Cassandra's `gc_grace_seconds`, Ditto's TTL, Couchbase's purge interval) attaches an explicit resurrection warning to a fixed timer. The safe version ties purge to **proof of replication** (a high-water-mark cursor the server tracks per device, or an \"await replication\" check before purging), not a bare clock. With a trusted central server, this is easy: the server already knows each device's last-synced position, so it can prove a tombstone has been seen everywhere before hard-deleting it — no CRDT version-vector machinery required, that complexity is only necessary for genuinely peer-to-peer systems with no central authority.\n\n## When NOT to overthink this\n\nIf you have a trusted central server (not peer-to-peer), you do not need version vectors, HLCs, or CRDT causal-stability tracking to get this right — that machinery exists for systems (Yjs, Automerge) that have no central authority to lean on. A central-server topology can just ask the server \"has every device passed this point yet?\" and that answer is sufficient. Reach for heavier conflict resolution (Hybrid Logical Clocks, `(updated_at, device_id)` tiebreaks) only if you actually observe clock-skew-driven ordering bugs in practice — not preemptively.\n\n## Related\n\n- [`local-first-sync-with-d1.md`](./local-first-sync-with-d1.md) — the sibling lesson on tombstones-with-matched-retention for **genuine** deletes; this lesson is specifically about the case that pattern does NOT cover (re-derivable/mirrored data).\n- [`n-copies-of-truth-drift-guard.md`](./n-copies-of-truth-drift-guard.md) — a different sync-correctness failure mode (schema shape drift) from the same broader \"local-first sync is subtle\" family.\n\n---\n*Distilled from a 2026-07-06 research pass (13 named systems compared: PowerSync, ElectricSQL, Replicache/Zero, WatermelonDB, RxDB, Automerge, Yjs, Turso, Linear, Figma, Ditto, CouchDB, Couchbase) commissioned after a real production bug where \"disconnect Steam\" soft-deleted re-derivable library rows that PowerSync correctly kept re-sending.*"}, {"id": "two-surfaces-split-only-by-a-threshold.md", "title": "Two surfaces separated only by a threshold will collide — time is a knob *within* a surface, never the divider *between* two", "kind": "pattern", "last_verified": "2026-07-29", "stack": ["product-design", "ux", "information-architecture"], "groups": ["Other"], "description": "\"Recent here, older there\" is one list with a seam: the predicates overlap near the boundary so removing an item from one feed doesn't remove it (the button visibly does nothing), and items migrate between surfaces on their own as time passes, spending location — a strong memory cue — on a value the user isn't tracking. Divide by what EVIDENCE you have about an item instead, so transitions between surfaces are caused rather than scheduled; time then becomes a knob inside one surface. Includes the three-question test to apply before adding any surface.", "content": "# Two surfaces separated only by a threshold will collide — time is a knob *within* a surface, never the divider *between* two\n\n**One-liner:** \"recent items here, older items there\" feels like clean information architecture and is actually one list with a seam in it — the two queries overlap for whatever population sits near the boundary, an action in one surface makes the item reappear in the other so the button looks broken, and items migrate between surfaces on their own as time passes; the fix is to divide by **what evidence you have about the item**, which is a property that doesn't drift.\n\n## The shape\n\nYou have a list of things and want to surface them in more than one place. The obvious split is time:\n\n- \"Recently played\" / \"Played a while ago\" / \"Haven't touched in months\"\n- \"New\" / \"This week\" / \"Older\"\n- \"Due soon\" / \"Overdue\"\n- \"Active projects\" / \"Stale projects\"\n\nEach surface gets a threshold. Ship it, and the trouble starts.\n\n## Failure 1: the buttons stop working\n\nThe version that made this obvious: a \"remind me about this game\" feature delivered matured reminders into a row, and the *same row* also auto-surfaced games you hadn't played in a while. Both used the same 14-day constant.\n\nSo virtually every matured reminder was simultaneously an automatic candidate. Un-setting a reminder removed the game from the reminder feed — and the automatic feed instantly re-picked it up, into the same row, at the same position.\n\n**The button visibly did nothing.** No error, no bug report that makes sense, just \"un-remind is broken.\" It wasn't broken; it did exactly what it said, and a second query put the card straight back.\n\nThis is the general case: when two feeds share a slot and their predicates overlap, **removing an item from one feed is not removal.** Any per-item action in either surface is suspect.\n\n## Failure 2: items move house on their own\n\nThe subtler one, and it survives even if you fix the overlap.\n\nIf surface A is \"0–14 days\" and surface B is \"15+ days,\" then an item you did nothing to will disappear from A and appear in B overnight. From the user's side, a thing they know moved somewhere else while they weren't looking, and nothing they did caused it.\n\nLocation is one of the strongest memory cues in an interface. Spending it on \"how long ago\" — a value that changes continuously and that the user is not tracking — throws it away. Worse, the move is invisible in the moment and only noticed later as \"where did that go?\"\n\n## Failure 3: thresholds drift apart and nobody notices\n\nTwo constants that must stay in a fixed relationship is a drift trap. Ours were literally the same constant used by both surfaces, which is the *most* coupled version and still wrong. Split them into two constants and now a change to one silently opens a gap (items in neither surface) or an overlap (items in both). Neither fails loudly.\n\n## The fix: divide by evidence, not by elapsed time\n\nAsk what you actually **know** about each item and what question that lets you answer. Our three surfaces came out as:\n\n| Evidence you have | The question it answers | Surface |\n|---|---|---|\n| The user explicitly asked | \"what did I promise myself?\" | reminders |\n| The user has written about it | \"what did I abandon mid-thread?\" | the forgotten row |\n| Nothing written, activity only | \"what should I start?\" | recommendations |\n\nThese do not overlap, and an item cannot drift from one to another with the passage of time — only a *user action* moves it (writing about something, or asking to be reminded). That's the property you want: **transitions between surfaces should be caused, not scheduled.**\n\nNote what happened to time in that model. It didn't disappear — the forgotten row still has a 14-day floor. But it's now a knob *inside* one surface controlling how much that surface shows, not a wall between two surfaces. Tuning it changes a volume, not a taxonomy.\n\n## Make the disjointness structural, not incidental\n\nOnce you have the split, enforce it in the query rather than trusting the predicates to stay non-overlapping:\n\n```sql\n-- the guessed feed excludes anything the user explicitly asked for\nAND NOT (<the exact predicate the explicit surface uses>)\n```\n\nImport that predicate; don't restate it. If the two definitions ever drift, items appear in both surfaces or vanish from both — the exact bug you just removed, returning through the back door. One exported function, two call sites:\n\n```ts\nexport function activeRequestWhere(alias?: string): string {\n  const p = alias ? `${alias}.` : '';\n  return `${p}requested_at IS NOT NULL AND (${p}last_seen IS NULL OR ${p}last_seen <= ${p}requested_at)`;\n}\n```\n\nThere's a UX dividend too: because the surfaces are disjoint by construction, taking the explicit action **visibly moves the item** from the guessed surface to the asked-for one. The mechanism becomes legible instead of mysterious.\n\n## The test to apply before adding a surface\n\nBefore splitting anything into two lists, ask:\n\n1. **Can one item satisfy both predicates at once?** If yes, you have one list, not two.\n2. **Can an item move between them with no user action?** If yes, you're spending location on a value the user isn't tracking.\n3. **What does each surface know that the other structurally cannot?** If you can't answer without saying \"it's newer,\" they're the same surface.\n\nQuestion 3 is the useful one. If a proposed surface has no evidence of its own — only a different number — it's a filter, a sort order, or a \"show more,\" not a place.\n\n## Related\n\n- [derive-dont-track-ui-flags.md](./derive-dont-track-ui-flags.md) — same instinct one level down: prefer a property you can compute over a state you have to keep in sync.\n- [n-copies-of-truth-drift-guard.md](./n-copies-of-truth-drift-guard.md) — why the shared predicate gets imported rather than restated."}, {"id": "verify-the-artifact-your-user-receives.md", "title": "Verify the artifact your USER receives, not the one you built", "kind": "pattern", "last_verified": "2026-08-08", "stack": ["release-engineering", "distribution", "cdn", "cloudflare", "r2", "code-signing", "virustotal"], "groups": ["Auth & Security", "Other"], "description": "A \"scanned clean, here's the hash\" badge is a claim about **the bytes a stranger downloads**, but every cheap check verifies the bytes on your build machine, separated from them by an upload, an object store, a CDN cache and a versionless alias. Don't add checks — collapse the chain: have the human download from the real link and scan THAT, then match its digest against your local artifact (VirusTotal's temporary URL base64-decodes to the scanned file's md5). One comparison proves build = served = scanned, and the CDN check you'd have fought a bot challenge for becomes redundant by proof rather than by omission. Plus the traps that survive it: publish the content-keyed permanent URL not the per-analysis one, scan→confirm→THEN deploy, `dist/` is stale by default so a bare deploy ships the old hash while every source grep reads green, a check run seconds after deploy reads the previous deployment, and badges multiply (a testers page lagged two full releases).", "content": "# Verify the artifact your USER receives, not the one you built\n\n**One-liner:** if you publish a \"scanned clean, here's the hash\" badge for a desktop download, you are making a claim about **the bytes a stranger gets from your site** — but every convenient way to check verifies *the bytes on your build machine* instead, and the two are separated by an upload, an object store, a CDN cache, and a versionless alias. The fix is not more checks; it is choosing the **one** comparison that collapses the whole chain: have a human download from the real link and scan *that*, then match its hash against your local artifact. One `md5` comparison then proves build = served = scanned, and the CDN verification you were dreading becomes free.\n\n## The shape\n\nAny signed desktop distribution ends up looking like this:\n\n```\nlocal build output          ->  Playmoir_1.3.0_x64_en-US.msi\nuploaded to object store    ->  r2://releases/Playmoir_1.3.0_x64_en-US.msi\n                            ->  r2://releases/Playmoir_x64_en-US.msi   (stable alias)\nfronted by a CDN            ->  https://releases.example.com/...\nlinked from the site        ->  /download -> 302 -> the alias\nscanned by a third party    ->  VirusTotal report for SOME file\npublished on the site       ->  \"Signed & Verified Clean\" -> links that report\n```\n\nThe badge asserts a chain: **the file users download is the file that was scanned, and it is the file you built and signed.** Three links, each independently breakable:\n\n1. **build -> served.** Upload silently failed, or the alias still holds the previous release because a CDN edge cached it. The stable alias is the dangerous one: *one URL whose CONTENT changes while its NAME does not*, which is precisely the shape caches get wrong.\n2. **served -> scanned.** You scanned your local file; users get a different one.\n3. **scanned -> published.** The hash in your HTML is not the hash of the report you think you linked.\n\n## Why the obvious checks don't close it\n\n- **Hashing your local build proves link 3 and nothing else.** It is the check everyone runs because it is the easy one.\n- **`curl`-ing your own CDN to hash the served bytes is the right idea and is often blocked.** WAF bot management classifies on TLS/HTTP fingerprint as well as user-agent, so curl gets a challenge while browsers sail through. (See [bot-challenge-blocks-your-auto-updater.md](./bot-challenge-blocks-your-auto-updater.md) — same CDN behaviour, worse consequences.) You end up spoofing a Chrome UA and hoping the fingerprint passes, which works until it doesn't and gives you a confidently wrong answer either way.\n- **Trusting the scanner's page to prove the file exists** fails for a subtler reason, worth its own lesson: see [negative-control-before-trusting-a-probe.md](./negative-control-before-trusting-a-probe.md).\n\n## The move\n\n**Ask the human to scan the file they downloaded from the real, public link** — not the artifact in `target/release/bundle/`. Then hash your local build and compare against the scan's own record of what it scanned.\n\nMost scanners expose the scanned file's digest. VirusTotal's temporary result URL encodes it directly:\n\n```bash\n# the /gui/file-analysis/<base64> URL a fresh scan hands you\necho \"YWRmNDIwNGQwY2UyMjRjNzhjNTk0OWYxYjJhNzFhYTM6MTc4NjE2MTQyOA==\" | base64 -d\n# -> adf4204d0ce224c78c5949f1b2a71aa3:1786161428\n#    ^ md5 of the scanned file          ^ analysis timestamp\n\nmd5sum Playmoir_1.3.0_x64_en-US.msi\n# -> adf4204d0ce224c78c5949f1b2a71aa3   MATCH\n```\n\nThat single match proves **all three links at once**:\n\n- the scanned file came through the site -> CDN -> alias path (they downloaded it),\n- it is byte-identical to the local build (the md5 matched),\n- so the sha256 you compute locally addresses the same object in the scanner's index.\n\n**The post-upload alias verification you were going to fight the bot challenge for is now redundant by proof, not by omission.** That distinction matters: you are not skipping the check, you are getting it from a comparison you had to make anyway.\n\nMeasured contrast, same project, two releases apart: the previous release needed a scripted `curl` with a spoofed Chrome user-agent, run after a manual CDN purge, to hash the served alias. The next release got the identical guarantee from one `base64 -d` and one `md5sum`.\n\n## The traps that survive this\n\n**Publish the permanent URL, never the per-analysis one.** A fresh scan hands you a URL tied to *one analysis run* (`/gui/file-analysis/<base64>`), which rots. The durable form is keyed by content (`/gui/file/<sha256>`). A badge is a long-lived claim; point it at a long-lived resource.\n\n**Order matters: scan, confirm, THEN deploy.** Deploying a green \"verified clean\" chip that links a report which does not exist yet is worse than having no chip.\n\n**Your build directory is stale by default.** `dist/` holds the *previous* build's content-hashed assets. A bare `deploy dist` without a preceding build ships the old hash while every source-file grep reads green, because the source is correct — only the artifact is old. This is the same trap as [monorepo-stale-dist-zod-strip.md](./monorepo-stale-dist-zod-strip.md), one boundary further out: there it was a runtime importing a week-old build, here it is a CDN serving one. **Rule: the deploy command always begins with the build command.**\n\n**A verification run seconds after deploy reads the previous deployment.** Propagation is not instant, and the failure looks alarming and structural — the live page referencing a bundle hash you have never seen reads as a routing or project-binding fault. Re-check after ~30s before diagnosing anything.\n\n**Check every surface that carries the hash.** Badges multiply: a hero chip, a beta/testers page, a docs snippet. In the case this came from, the testers page silently lagged **two full releases** behind the homepage because only one of them was on the checklist. Grep for the *old* hash after updating; the correct post-condition is zero occurrences, not \"I edited the file I remembered.\"\n\n## When this doesn't apply\n\n- **No human in the loop** (fully automated release). Then you do need the programmatic served-bytes check, and you need to solve the bot-challenge problem properly — an allowlist rule for your own verifier, or verifying from inside the origin rather than through the edge.\n- **The scanner doesn't expose the digest of what it scanned.** Without that, the human's download proves nothing you can tie to your artifact.\n- **Reproducible-build guarantees are the actual requirement** (supply-chain attestation, SLSA). This pattern proves *your* file reached the user; it does not prove the file was built from the source you think. Different problem, different tooling.\n\n## The transferable core\n\nThe badge is a promise about the user's copy. Every cheap check available to you examines your copy. **Design the verification so the one artifact you can definitely obtain — the user's — is the one that gets measured**, and let the hash comparison carry everything else. Where you cannot obtain it, get a human to fetch it for you; that is not a workaround, it is the most direct evidence available."}, {"id": "webview2-react-render-traps.md", "title": "WebView2 + React render traps — gotchas that don't exist in Chrome dev", "kind": "gotcha", "last_verified": "2026-07-26", "stack": ["tauri", "react", "webview2"], "groups": ["Frameworks & Libraries", "Platforms & Runtimes"], "description": "Eleven WebView2/Tauri render gotchas not present in Chrome dev: image lazy-load intervention, `key={id}` for fresh GPU layers, useLayoutEffect-mandatory for measurement, drag-region clearance, portal-to-body for modals, scrollbar gutter, image pre-decode for flight animations, asset.localhost canvas-taint (sample pixels via backend bytes → blob, never the DOM img), and ancestor-opacity animations blinding a child's backdrop-filter (backdrop root).", "content": "# WebView2 + React render traps — gotchas that don't exist in Chrome dev\n\n> The Tauri/Electron promise is \"you already know how to build web apps, just ship it as a desktop app.\" Mostly true, but WebView2 (Windows) and WKWebView (macOS) ship slightly different rendering and resource-management behavior than Chrome dev. Most surprises come from WebView2 being more aggressive about resource conservation. This is the surviving list of traps we hit.\n\n## Trap 1: `loading=\"eager\"` is mandatory for above-the-fold images\n\n**Symptom:** images that are visible in the viewport at first paint render as blank/broken for 200-800ms before snapping in, only on Windows builds. Works perfectly in dev (which usually runs in Chrome).\n\n**Cause:** Chrome implements a \"Lazy Image Loading\" intervention that defers all `<img>` requests by default, and WebView2 inherits it. The intervention is supposed to skip in-viewport images, but the heuristic isn't perfect — especially for images inside transformed/animated containers where layout isn't yet stable.\n\n**Fix:** add `loading=\"eager\"` to ALL `<img>` elements that should be visible at first paint.\n\n```tsx\n<img\n  src={gameCoverUrl}\n  loading=\"eager\"     // ← required on Windows\n  decoding=\"async\"    // ← optional but recommended; non-blocking decode\n  alt={game.name}\n/>\n```\n\n**Where to add it:**\n- Banner images on detail screens\n- Above-the-fold cards in lists/grids\n- Hero artwork during transition animations (the trap is worst here — the image isn't where the heuristic expected it yet)\n\n**Where you can skip it:** images below the fold or only revealed on scroll. Native lazy-load is still a real perf win there.\n\nWe hit this on game detail screen hero banners. The first frame after navigating to a game detail had a 500ms blank-banner flash before the cover loaded. `loading=\"eager\"` removed the flash entirely.\n\n---\n\n## Trap 2: `key={id}` on hero components to force fresh DOM/GPU per item\n\n**Symptom:** navigating from detail-screen-for-game-A to detail-screen-for-game-B reuses the same React component but the new game's banner image renders as a gray rectangle for several hundred ms. Or, more subtly, a CSS animation that played for game A doesn't replay for game B.\n\n**Cause:** React reuses the existing DOM node when the component type is identical. WebView2 then sometimes reuses the GPU compositor layer associated with that DOM node, including any cached image decode. When the `src` changes, the decoder has to flush the old bitmap and request the new one — and during that gap, the GPU shows the cached old frame OR a blank/transparent fallback depending on timing.\n\n**Fix:** add `key={id}` (or `key={uuid}`) to the top-level component that should \"reset\" between items.\n\n```tsx\nfunction App() {\n  return <GameDetailHero key={selectedGameId} game={selectedGame} />;\n}\n```\n\nAdding the key forces React to unmount the old component and mount a fresh one for each new game. New DOM nodes → new GPU compositor layers → no stale bitmap caching.\n\n**Trade-off:** you lose any state that was internal to the component (open accordions, scroll position) because it remounts. If you need to preserve some state across the morph, lift it to a parent that doesn't remount.\n\n---\n\n## Trap 3: `useLayoutEffect` is MANDATORY for measurement-driven styles in StrictMode\n\n**Symptom:** flight/morph animations work perfectly in production but fail in dev. Element positions are off by a few pixels, or the animation snaps from origin to destination without the interpolation. Toggling StrictMode off in dev \"fixes\" it.\n\n**Cause:** StrictMode double-invokes effects (development only) to catch impure side-effects. If you compute element positions in `useEffect` and then apply them to JSX style props on the same render, StrictMode's second invocation can run AFTER the browser has already painted the first invocation's frame. The animation starts from the WRONG position.\n\n`useLayoutEffect` runs synchronously after DOM mutations but BEFORE the browser paints. Measurements taken here, and styles applied here, land on the same frame as the DOM mutation. Safe under StrictMode.\n\n**The rule:** any dynamic CSS that depends on measuring real DOM (positions, sizes, computed filter offsets, transform origins) MUST be applied imperatively from `useLayoutEffect`, NEVER via JSX `style={...}` props that read the same measurement.\n\n```tsx\n// WRONG — JSX path, StrictMode breaks this\nfunction FlightGhost({ from, to }) {\n  const [transform, setTransform] = useState('');\n  useEffect(() => {\n    const dx = to.x - from.x;\n    const dy = to.y - from.y;\n    setTransform(`translate(${dx}px, ${dy}px)`);\n  }, [from, to]);\n  return <div style={{ transform }}>...<\/div>;\n}\n\n// RIGHT — imperative path, survives StrictMode\nfunction FlightGhost({ from, to }) {\n  const ref = useRef<HTMLDivElement>(null);\n  useLayoutEffect(() => {\n    const node = ref.current;\n    if (!node) return;\n    const dx = to.x - from.x;\n    const dy = to.y - from.y;\n    node.style.transform = `translate(${dx}px, ${dy}px)`;\n  }, [from, to]);\n  return <div ref={ref}>...<\/div>;\n}\n```\n\nThis trap is brutal because the dev/prod divergence makes it look like a \"StrictMode bug\" rather than a real issue. It IS a real issue — your impure render path WAS depending on a single invocation. Move it to useLayoutEffect and it works everywhere.\n\n---\n\n## Trap 4: Tauri title-bar drag region eats clicks in the top ~32px\n\n**Symptom:** clicks on buttons or interactive elements near the top of the window do nothing. Only on the desktop build, not the dev server in a normal browser.\n\n**Cause:** Tauri's default window decoration / drag region behavior reserves an invisible \"drag handle\" strip at the top of the window. The strip exists so users can grab anywhere along the title bar area to drag the window, but it captures clicks before they reach your DOM.\n\nThe default height is 28-32px depending on the Tauri version and Windows version.\n\n**Fix:** add top padding to every top-level screen so interactive content doesn't sit in the drag-eating zone.\n\n```tsx\n// Every top-level route / screen\n<main className=\"pt-[44px] ...\">  {/* ← clearance */}\n  {/* screen content */}\n<\/main>\n```\n\n44px is conservative (covers Windows 11 in dense-mode + a few px of safety margin). Adjust if your title bar is shorter on macOS/Linux.\n\n**Where you can skip it:** the drag region is only at the top of the window. Side-pinned UI, modals, or anything `position: fixed; bottom: 0;` is unaffected.\n\n**Don't try to \"disable\" the drag region** unless your app has its own custom title bar with explicit drag handles. Removing the drag region without replacing it makes the window un-draggable.\n\n### The follow-up bite: persistent chrome isn't a \"screen\", and partial overlap hides for months\n\nAdded 2026-07-21 after this exact trap resurfaced in a shipped app, ~4 months after the `pt-[44px]` fix above was applied everywhere it was supposed to go.\n\n**Two things make the second occurrence much harder to spot than the first.**\n\n**1 · The advice says \"every top-level screen,\" and persistent chrome is not a screen.** Sidebars, nav rails, floating toolbars, and brand marks are mounted *beside* the router, so a sweep that fixes routes misses them completely. In our case the sidebar had `pt-5` (20px) while every route had `pt-[44px]` — the one component nobody thought of as a screen was the one still straddling the boundary. **Audit by \"what renders in the top 32px,\" not by \"what is a page.\"**\n\n**2 · Partial overlap presents as flakiness, not breakage.** An element taller than the remaining gap gets *bisected* by the drag region: our 25px-tall logo sat at y=20–45, so its top 12px were dead and its bottom 13px worked fine. It still lit up on hover (the hover fired from the live half), so it looked completely functional. The user's own words on discovering it: *\"with the logo only the bottom half really works lol.\"* A fully-dead button gets reported on day one; a half-dead one survives indefinitely because every accidental success reinforces \"it works.\"\n\n**Do the arithmetic instead of clicking around.** `container padding-top` + `element offset` vs. the drag strip's height is a two-file check, and it's decisive. Clicking is unreliable precisely because you'll often hit the live half.\n\n**Two fixes, and prefer the boring one.** You can raise the element above the drag layer (`z-index` above the strip's), or push it below the boundary with padding. Padding wins in almost every case: it reuses the clearance convention the codebase already has, it's self-explanatory to the next reader, and it leaves the drag strip intact — the `z-index` route silently punches a non-draggable hole in your title bar, and needs a comment explaining why a logo has a mysterious stacking context.\n\n**Related affordance note, worth thirty seconds:** the same element had `cursor: default` set explicitly *and* a hover animation (scale + glow) — and users read it as a button anyway. **A hover transform outranks the cursor as an interactivity signal.** If an element animates on hover, people will click it regardless of what the cursor says; either give it a real action or remove the hover state. Do not rely on `cursor` to communicate \"not clickable.\"\n\n---\n\n## Trap 5: Lightbox/modal portal MUST go to `document.body`\n\n**Symptom:** a lightbox or modal `position: fixed; inset: 0;` anchors to the wrong element — it's clipped by a scrollable container or sits inside a transformed parent that messes up its positioning.\n\n**Cause:** `position: fixed` anchors to the nearest **transformed** ancestor, not the viewport, if any ancestor has a `transform`, `filter`, `perspective`, `will-change: transform`, or `contain` property set. CSS spec, not a WebView2 quirk — but WebView2 makes it more common because animated parent components often have `transform: translate3d(0,0,0)` for GPU promotion.\n\n**Fix:** render the modal/lightbox into a portal targeting `document.body` so it escapes the transformed ancestor chain entirely.\n\n```tsx\nimport { createPortal } from 'react-dom';\n\nfunction Lightbox({ src, onClose }) {\n  return createPortal(\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center bg-black/80\">\n      <img src={src} className=\"max-h-full max-w-full\" />\n      <button onClick={onClose} className=\"absolute top-4 right-4\">×<\/button>\n    <\/div>,\n    document.body\n  );\n}\n```\n\n**Watch for:** transformed ancestors are often invisible. A grid with `transition: transform` on hover, a parent with `will-change: opacity` for an entrance animation — any of these can break `fixed` positioning silently. If `inset: 0` ever produces a result that isn't full-viewport, suspect a transformed ancestor.\n\n---\n\n## Trap 6: `scrollbar-gutter: stable` to prevent layout jump\n\n**Symptom:** when a scroll-locked modal opens, the page underneath shifts horizontally by ~15px. The scrollbar disappears, content reflows wider, then the modal animates in over the shifted layout.\n\n**Cause:** Windows scrollbars overlay the content by default (modern Edge/Chrome do reserve gutter, but only for certain elements). When scroll is locked (e.g. via `body { overflow: hidden }`), the scrollbar vanishes, content gets the reclaimed horizontal space, reflow happens, jump.\n\n**Fix:** reserve the gutter unconditionally on scrollable containers.\n\n```css\n.scrollable-pane {\n  overflow-y: auto;\n  scrollbar-gutter: stable;  /* always reserve scrollbar space */\n}\n\n/* Or globally on html element */\nhtml {\n  scrollbar-gutter: stable;\n}\n```\n\nNow the gutter is always there. Hiding the scrollbar (via `overflow: hidden` on body for modal-open) doesn't reclaim space, so no shift.\n\n---\n\n## Trap 7: Image decode timing during morph/flight animations\n\n**Symptom:** A \"flight\" animation that morphs a thumbnail from a list into a hero banner on the next screen shows a momentary blank frame in the middle of the transition. The thumbnail is visible at start, the hero is visible at end, but during the flight the image disappears.\n\n**Cause:** when the flight ghost element first mounts, its `<img>` triggers a fresh decode. Until the decode finishes, the image renders blank. The flight animation runs on a 600ms timeline; the decode takes 50-200ms on cold cache. If the flight ghost was mounted at frame 0 of the animation, frames 0-12 show blank.\n\n**Fix:** pre-warm the decode before the flight starts.\n\n```tsx\n// Before kicking off the morph animation\nfunction startFlight(fromRect: DOMRect, toRect: DOMRect, imgUrl: string) {\n  const preload = new Image();\n  preload.decoding = 'async';\n  preload.src = imgUrl;\n  // Wait for decode before mounting the flight ghost\n  preload.decode().then(() => {\n    mountFlightGhost(fromRect, toRect, imgUrl);\n  }).catch(() => {\n    // Decode failed (CORS, 404, etc.) — mount anyway with onError fallback\n    mountFlightGhost(fromRect, toRect, imgUrl);\n  });\n}\n```\n\n`HTMLImageElement.decode()` returns a Promise that resolves when the image is ready to paint synchronously. Combined with `loading=\"eager\"` (Trap 1), this ensures the first frame of the flight is fully rendered.\n\n---\n\n## Trap 8: Don't measure during the same tick you mutate\n\n**Symptom:** `getBoundingClientRect()` returns the wrong rect — usually the rect from BEFORE your DOM mutation, even though you just ran the mutation synchronously.\n\n**Cause:** the browser batches layout calculations. Reading `getBoundingClientRect()` forces a synchronous layout. But if you mutate the DOM in the same render and then immediately measure, you may read the cached layout that didn't include your mutation yet.\n\n**Fix:** separate mutation and measurement into two RAF ticks, OR use `useLayoutEffect` which guarantees the measurement runs after the React commit but before paint.\n\n```tsx\n// Two-RAF pattern for non-React mutation\nnode.classList.add('animating');\nrequestAnimationFrame(() => {\n  requestAnimationFrame(() => {\n    const rect = node.getBoundingClientRect();  // now reflects the class change\n    // ...\n  });\n});\n```\n\nSingle-RAF works most of the time but isn't reliable on WebView2 — the layout flush isn't always tied to the next animation frame the way it is in Chrome. Double-RAF is paranoid but robust.\n\n---\n\n## Trap 9: `setInterval` updates ONE piece of state but not the others derived from the same source\n\n**Symptom:** a UI panel polls some backend status every N seconds and updates correctly — except one field that refuses to refresh. It stays frozen at whatever value loaded at mount. No error in console, no devtools warning, no failed fetch. The data is fresh server-side; the panel shows it in some places and stale in others.\n\n**Cause:** a `setInterval` callback runs `setState(...)` for some derived values but forgets to also update others derived from the same source. Mount-time logic might initialize all of them via a single `checkStatus()` call, but the interval poll only refreshes the subset the original author remembered to wire up. The subset that's missing stays stuck at its mount-time value forever.\n\nThis is React state-management hygiene, not a WebView2 quirk — but it surfaces in this list because long-lived desktop apps have far more polling intervals than typical web apps (sync status, active-game watcher, network online/offline, OAuth token expiry). Each interval is a separate opportunity to miss a setter.\n\n**The trap:**\n\n```tsx\nfunction StatusPanel() {\n  const [state, setState] = useState<SyncState | null>(null);\n  const [lastSync, setLastSync] = useState<number | null>(null);\n\n  // Mount: both setters fire from one fetch\n  useEffect(() => {\n    checkStatus().then((r) => {\n      setState(r.state);\n      setLastSync(r.lastSyncedAt);  // ← runs at mount\n    });\n\n    // Interval: only ONE setter fires\n    const id = setInterval(() => {\n      checkStatus().then((r) => {\n        setState(r.state);  // ❌ forgot to also call setLastSync\n      });\n    }, 3000);\n    return () => clearInterval(id);\n  }, []);\n\n  return (\n    <>\n      <div>State: {state}<\/div>\n      <div>Last synced: {lastSync ? formatTime(lastSync) : '—'}<\/div>\n      {/* ← this is stuck at the mount-time value forever */}\n    <\/>\n  );\n}\n```\n\nThe trap is invisible because:\n- The mount-time path works perfectly. First render shows correct data.\n- The interval path also works for the OTHER state. So `state` updates correctly every 3s.\n- The user sees `state` change and trusts the panel is live. They don't notice `lastSync` is frozen.\n- No error, no warning, no exception. React doesn't track \"you fetched this value but never set state for it.\"\n\n**Fix:**\n\n```tsx\nconst id = setInterval(() => {\n  checkStatus().then((r) => {\n    setState(r.state);\n    setLastSync(r.lastSyncedAt);  // ✅ refresh ALL derived state\n  });\n}, 3000);\n```\n\n**Better fix — collapse the two paths into one helper so they can't drift:**\n\n```tsx\nasync function refreshStatus() {\n  const r = await checkStatus();\n  setState(r.state);\n  setLastSync(r.lastSyncedAt);\n}\n\nuseEffect(() => {\n  refreshStatus();\n  const id = setInterval(refreshStatus, 3000);\n  return () => clearInterval(id);\n}, []);\n```\n\nNow there's exactly ONE place that maps the fetch result to component state. Adding a new field forces you to touch the helper, which means the interval picks it up automatically.\n\n**Even better — single state object instead of multiple `useState` calls:**\n\n```tsx\nconst [status, setStatus] = useState<{ state: SyncState | null; lastSync: number | null }>({\n  state: null,\n  lastSync: null,\n});\n\nasync function refreshStatus() {\n  const r = await checkStatus();\n  setStatus({ state: r.state, lastSync: r.lastSyncedAt });\n}\n```\n\nOne setState call, one source of truth. The \"miss a setter\" failure mode is eliminated by construction.\n\n**How to audit existing code:**\n\nSearch for `setInterval` and check each one against the mount-time initialization for the same component:\n\n```bash\nrg 'setInterval' src/ -l | xargs -I{} grep -H -A 30 'setInterval' {}\n```\n\nFor each match, look at every `useState` in the file. If a state variable is set during mount but NOT inside the interval callback, it's almost certainly the bug — unless the value is truly immutable post-mount (and even then, prefer `useMemo` over `useState` for that).\n\n**Related but distinct:** stale closures from missing dependency arrays. `setInterval(() => setX(x + 1), 1000)` captures `x` at mount. The fix is `setX(prev => prev + 1)`. This is a different bug from the setter-mismatch above — Trap 9 is specifically about missing setter *calls*, not stale closure values.\n\n---\n\n## Trap 10: Tauri's asset protocol is NOT same-origin — canvas pixel reads silently taint\n\n**Symptom:** a canvas-based pixel probe (`drawImage` + `getImageData` for brightness/flatness/color sampling) throws `SecurityError` — or worse, you catch the error and \"trust\" the image, so the check is silently dead. Everything *looks* fine; the feature just never fires. A wrong \"same-origin, safe to sample\" comment can survive in-code for weeks.\n\n**Cause:** in a Tauri app the page origin is `http://localhost:1420` (dev) or `tauri://localhost` / `http://tauri.localhost` (prod), but local files served via `convertFileSrc` arrive from `http(s)://asset.localhost` — a **different origin**. (On Windows it's plain `http://asset.localhost`, so an `https`-only allowlist check also silently fails.) An `<img>` without usable CORS headers drawn to a canvas taints it; `getImageData` then throws. Adding `crossOrigin=\"anonymous\"` often breaks the *display* path instead, so teams remove it and the sampling dies quietly.\n\n**Fix:** don't sample pixels through the DOM at all. Route pixel reads through the backend: a Rust command reads the file bytes → return them (or hand back a `blob:` URL created from the bytes) → decode into an `ImageBitmap`/`Image` from the blob → canvas sampling is taint-free, because blob URLs share the page's origin. Keep the DOM `<img>` for display only.\n\n**Rule of thumb:** any \"read pixels back\" feature in a Tauri app needs the bytes route from day one. Audit for it: `grep -rn \"getImageData\" src/` and check what origin each source image actually loads from.\n\n## Trap 11: animating an ancestor's opacity cuts a child's `backdrop-filter` off from its backdrop\n\n**Symptom:** a frosted-glass child (e.g. a `backdrop-filter: blur()` shelf over a cover image) renders with its tint but **no blur/darkening of what's behind it** while an entrance/exit animation plays, then the frost \"pops in\" the moment the animation ends. Reads as a paint glitch; it's spec behavior.\n\n**Cause:** per the Filter Effects spec, an element with `opacity < 1` (also `filter`, `mask`, `mix-blend-mode`…) becomes a **backdrop root**: descendants' `backdrop-filter` may only sample content *within* that isolated group — not the page behind it. So a CSS keyframe animating the *parent's* opacity legally blinds every glass child for the entire animation (including any `animation-delay` with `both` fill). An element's **own** animated opacity does not isolate it.\n\n**Fix:** never animate opacity on an ancestor of a `backdrop-filter` element. Move the fade onto each piece individually — the glass layer animates its *own* opacity (fine), siblings animate theirs. `transform` on the ancestor is safe (not a backdrop-root trigger); it's specifically the group-creating properties.\n\n**How this bites in refactors:** the glass styles lived ON the animated element (worked); someone extracts the frost to a static child for a legitimate reason (e.g. isolating it from per-second repaints — see WebView2 rasterizer flakiness), and the pop-in regression appears only on the animated path. The refactor and the symptom look unrelated.\n\n## Symptoms → cause quick reference\n\n| Symptom | Likely trap |\n|---|---|\n| Image renders blank for 200-800ms on Windows only | Trap 1 — add `loading=\"eager\"` |\n| New item shows stale image briefly after navigation | Trap 2 — add `key={id}` |\n| Morph animation works in prod, breaks in dev | Trap 3 — use `useLayoutEffect` |\n| Top-row buttons unclickable on desktop builds | Trap 4 — add `pt-[44px]` clearance |\n| Modal positions wrong inside animated parents | Trap 5 — portal to `document.body` |\n| 15px horizontal jump when opening modals | Trap 6 — `scrollbar-gutter: stable` |\n| Flight/morph shows blank frame mid-animation | Trap 7 — pre-decode the image |\n| `getBoundingClientRect()` returns wrong rect | Trap 8 — separate mutation and measurement |\n| Polled panel updates some fields, others stay frozen | Trap 9 — interval callback misses a setter |\n| Canvas `getImageData` throws (or a caught check silently never fires) on local images | Trap 10 — asset.localhost isn't same-origin; sample via backend bytes → blob |\n| Frosted glass shows tint but no blur during an animation, pops in at the end | Trap 11 — ancestor opacity animation creates a backdrop root |\n\n---\n\n## What NOT to do\n\n- **Don't disable StrictMode to \"fix\" measurement bugs.** Fix the bug instead. StrictMode is catching a real issue — disabling it just hides it until production.\n- **Don't add `loading=\"lazy\"` blanket-style.** Above-the-fold images need eager loading. Lazy is correct for below-fold, not for everything.\n- **Don't use `transform: translate3d(0,0,0)` to \"promote to GPU layer\" without thinking.** It does promote, but it ALSO creates a new containing block for `fixed` descendants, which breaks modals (Trap 5).\n- **Don't rely on dev (Chrome) testing alone for visual polish.** Build the desktop binary and test on Windows + macOS targets at least once before declaring an animation \"done.\" The dev/WebView2 divergence is real."}, {"id": "windows-crash-reporter-child-busy-cursor.md", "title": "A crash-reporter child process spins the Windows busy cursor for ~5s on every launch — and the fix you'd reach for is unreachable from stable Rust", "kind": "dead-end-postmortem", "last_verified": "2026-07-21", "stack": ["windows", "rust", "tauri", "sentry", "crash-reporting"], "groups": ["Languages", "Platforms & Runtimes", "Reliability & Perf"], "description": "**Dead-end article (no fix on stable Rust).** Out-of-process minidump capture re-executes your binary as a windowless GUI-subsystem child, so Windows spins the busy cursor ~5s on every launch while the app sits idle and responsive. Identify it in 10 minutes (count processes in Task Manager; build release *unsigned* to exonerate Authenticode); `STARTF_FORCEOFFFEEDBACK` is the industry fix but is unreachable from `std::process::Command` on stable (`creation_flags()` is a decoy — different field); an early `PeekMessage` in the child is **measured** not to work. Pragmatic call: disable the minidump lane, keep the panic/JS lanes that actually catch bugs.", "content": "# A crash-reporter child process spins the Windows busy cursor for ~5s on every launch — and the fix you'd reach for is unreachable from stable Rust\n\n> **This is a dead-end article.** There is no working fix here on stable Rust as of\n> 2026-07-21. What it gives you is: how to identify this in about ten minutes\n> instead of three hours, which promising-looking fix is *measured* not to work,\n> and the pragmatic call that unblocks you. Written after a Playmoir session that\n> spent most of a night on it and shipped the workaround, not the fix.\n\n## The symptom\n\nA Windows desktop app launches. The window appears, fully rendered, fully\nresponsive — you can click things, everything works. But the mouse pointer shows\nthe spinning blue \"busy\" ring for **~5 seconds** on **every single launch**.\n\nThree things make this hard to place:\n\n- **The app isn't busy.** Its UI is interactive the whole time. Profiling the app\n  finds nothing, because nothing in it is slow.\n- **It never reproduces in a debug build.** Dev is clean; only release does it.\n- **It correlates with whatever you shipped recently**, so you'll blame the wrong\n  feature. In our case it landed alongside an auto-updater and code signing, and\n  we chased both for hours. It was neither.\n\n## The cause\n\nAny crash-reporting library that captures **native minidumps out-of-process**\nspawns a helper child. The common design (Crashpad, and every Rust crate in this\nspace) is to **re-execute your own binary** with a marker argument or env var, and\nhave it branch into a socket-server loop.\n\nThat child is compiled from the same binary, so on Windows it inherits the\n**GUI subsystem** flag. But it never opens a window and never pumps messages.\n\nFrom Microsoft's [`STARTUPINFOW` docs](https://learn.microsoft.com/en-us/windows/win32/api/processthreadsapi/ns-processthreadsapi-startupinfow), verbatim:\n\n> \"If a GUI process is being started and neither STARTF_FORCEONFEEDBACK or\n> STARTF_FORCEOFFFEEDBACK is specified, **the process feedback cursor is used.**\n> A GUI process is one whose subsystem is specified as 'windows.'\"\n\nand\n\n> \"The system turns the feedback cursor off **after the first call to GetMessage**,\n> regardless of whether the process is drawing.\"\n\nSo Windows starts the courtesy \"app is loading\" cursor for the child, waits for it\nto prove it's alive, never gets the signal, and runs the timer to expiry. The\ndocumented timing is 2s base, +5s once the process makes a GUI call.\n\n**Your app was never busy. Windows was waiting on an invisible second process.**\n\nThis also explains the debug-build immunity: debug builds are typically\n**console-subsystem** (`#![cfg_attr(not(debug_assertions), windows_subsystem = \"windows\")]`\nis the standard Tauri/Rust idiom), and the doc's rule only covers GUI processes.\n\n## Identifying it in ten minutes\n\n1. **Open Task Manager and count your processes.** Two entries for your app, only\n   one window? That's the crash reporter. This single check would have saved us\n   the entire night.\n2. **Toggle crash reporting off and relaunch.** If your app has a diagnostics\n   opt-out that skips the reporter init, the cursor should vanish. That confirms\n   the child is the cause without touching code.\n3. **Build release *unsigned*** (e.g. `tauri build --no-bundle`, which skips the\n   signing step). This is the discriminator that matters: signing and subsystem\n   both change between dev and release, so a dev-vs-release comparison can't tell\n   them apart. If the unsigned release build still spins, **Authenticode and\n   certificate revocation are exonerated** — a common and plausible-sounding red\n   herring, since new certs really do cause slow launches.\n\n## The fix everyone else uses — and why you probably can't\n\nPass `STARTF_FORCEOFFFEEDBACK` in `STARTUPINFO.dwFlags` when spawning the child.\nOne flag. Prior art, all converged independently:\n\n- **Chromium / Crashpad** — `client/crashpad_client_win.cc`: `startup_info.StartupInfo.dwFlags = STARTF_USESTDHANDLES | STARTF_FORCEOFFFEEDBACK;` (commit message: *\"add STARTF_FORCEOFFFEEDBACK to prevent busy cursor on process launch\"*). Inherited by Chrome, Edge, and every Electron app.\n- **CPython** — same flag in `popen_spawn_win32.py` (2024).\n- **Microsoft WSL** — [PR #14293](https://github.com/microsoft/WSL/pull/14293), sets it by default for spawned processes.\n\n**The Rust trap:** `std::process::Command` has **no stable API for\n`STARTUPINFO.dwFlags`**. The obvious candidate is a decoy —\n`CommandExt::creation_flags()` sets `dwCreationFlags`, a *different field*, and\n`CREATE_NO_WINDOW` / `DETACHED_PROCESS` concern console allocation only. They do\nnothing here. The correct API, `startupinfo_force_feedback`, landed in 1.89.0 but\nis still behind `#![feature(windows_process_extensions_startupinfo)]`\n([rust-lang/rust#141010](https://github.com/rust-lang/rust/issues/141010)) as of\n2026-07-21.\n\nConsequence: **any Rust crate spawning via `std::process::Command` physically\ncannot set this flag on stable.** Switching *your* project to nightly does not\nhelp — the spawn happens in the dependency's code, not yours. The only routes are\nforking the crate onto a hand-written `CreateProcessW`, or waiting for\nstabilization.\n\n## What does NOT work — measured, not assumed\n\n**Calling `PeekMessageW` early in the child does not clear the cursor.**\n\nThe reasoning is seductive: the docs say `GetMessage` clears it, `GetMessage`\nblocks so you can't use it, and `PeekMessage`'s `PM_NOYIELD` flag is documented as\n*\"prevents the system from releasing any thread that is waiting for the caller to\ngo idle\"* — implying that `PeekMessage` *without* it does signal idle. An archived\nMSDN thread states this outright.\n\nWe implemented it as the **first statement in the process**, verified via a file\nprobe written from inside the child (a windowless GUI process has nowhere to log,\nso a file is the only channel) that the branch executed and `PeekMessageW`\nreturned. **The cursor was completely unaffected.** Tried twice — once after the\ncrash-reporting SDK init, once as the literal first line — to rule out the call\nsimply happening too late.\n\nDo not spend time on this. If you want to try a variant, the only untested one is\n`PostThreadMessage` to self followed by a real `GetMessage` (which would return\nimmediately with a message queued) — but that's a hack layered on an approach\nalready proven not to work.\n\n## The pragmatic call: turn native minidumps off\n\nFor most apps this is the right answer, and it's usually a one-line feature flag.\n(Tauri + Sentry: `tauri-plugin-sentry = { version = \"0.5\", default-features = false }`\ndrops the `minidump` feature and with it `sentry-rust-minidump`,\n`minidumper-child`, `crash-handler`, `minidumper`.)\n\n**Only the minidump lane spawns the child.** Everything else survives: JS errors,\nunhandled rejections, UI error boundaries, **Rust panics**, and release-health\nsession tracking. None of those need a helper process.\n\nWhat you actually lose: access violations, stack overflows, heap corruption, and\ncrashes inside C/C++ dependencies — the classes a language-level panic hook can't\ncatch.\n\n**Weigh it honestly.** In our case the minidump lane had never caught a real bug\nin months of use; it had only ever fired on a deliberate test crash from a debug\nmenu, while every genuine crash we'd caught came through the panic and JS lanes.\nIf your app has heavy native surface (we had whisper.cpp, D3D screen capture,\nimage codecs) the calculus may differ — but \"we have native code\" is not the same\nas \"native crashes are the ones we actually see.\" Check your own data before\npaying a permanent fork to keep it.\n\n**Also worth knowing:** for a webview-based app (Tauri, Electron), **renderer\ncrashes are invisible to every option here.** WebView2/Chromium run renderers in\nseparate processes that an in-process handler can't observe. So the scariest\nfailure mode — \"the app just went white\" — isn't covered whether you keep\nminidumps or not. That materially lowers what you're giving up.\n\n## When to revisit\n\nAny of these unblocks the proper fix:\n\n- `windows_process_extensions_startupinfo` stabilizes in Rust → the crate can set\n  the flag with a one-line change.\n- The crash-reporter crate switches to a raw `CreateProcessW` spawn.\n- Your project gains enough native-crash volume to justify maintaining a fork.\n\n**File the upstream issue if it doesn't exist.** When we hit this, a search across\nevery relevant repo (`minidumper-child`, `sentry-rust-minidump`, `sentry-tauri`,\n`crash-handling`, `tauri-apps/tauri`) found **zero** reports — despite Crashpad,\nCPython and Microsoft all having fixed the identical bug. Nobody had connected\nthose dots publicly. A good report with that precedent attached is cheap and makes\nthe fix likely.\n\n## The meta-lesson\n\nThree separate hypotheses were reasoned out confidently and two were wrong: the\nauto-updater's network check (ruled out — it renders no UI and waits 5s before\neven starting), and Authenticode revocation on a fresh code-signing cert (ruled\nout by the unsigned release build). What finally resolved it was a **controlled\nexperiment changing one variable at a time**, not more reading.\n\nWhen a symptom appears in release but not dev, list *everything* that differs\nbetween those builds — subsystem, signing, optimization, bundled assets — and\nfind the build configuration that isolates one. Here that was\n\"release + unsigned,\" a combination neither dev nor the shipped installer\nproduces, and it killed a whole hypothesis in a single 40-second build."}, {"id": "write-triggered-enforcement-blind-to-deletion.md", "title": "Write-triggered enforcement is blind to deletion", "kind": "pattern", "last_verified": "2026-07-25", "stack": ["any", "docs", "tooling", "hooks", "claude-code"], "groups": ["Other", "Process & Meta"], "description": "A `PostToolUse`-style hook that fires on \"file written\" guarantees every NEW file gets a docs/index row, and is structurally blind to a row being DELETED — so a cleanup commit that removed a contiguous block (correctly finding its 4 phantom rows, silently taking 3 live neighbours) left a 643-line core file undiscoverable for 3.5 weeks with zero downstream signal. Includes the selection effect that makes it worse (most rows self-heal when the file is next touched, so the ones that STAY missing are the stable, load-bearing ones), the false-\"all clear\" regex trap when writing the verification scan (match the first table column only, not paths mentioned in neighbouring prose), and the one-second invariant check that replaces it. General rule: enforce invariants, not events — and ask of every hook, \"what happens when someone deletes?\"", "content": "# Write-triggered enforcement is blind to deletion\n\n**One-liner:** a hook that fires on \"file written\" can guarantee every *new* thing gets documented, and still let documentation silently disappear — because deleting a row in a catalog is not a write to the thing that row describes. Enforce the **invariant** (\"every source file has a row\"), not the **event** (\"every write produces a row\"). The invariant check is a one-second script; the event hook is half a guard that reads like a whole one.\n\n## Symptom\n\nA 643-line file — the single most important component on the app's main screen — had **no row in the repo's file index** for about three and a half weeks.\n\nNothing failed. No test, no build step, no linter, no CI job. `git status` was clean the whole time. The index's own enforcement hook was working correctly and firing on schedule.\n\nIt was found by accident, while doing unrelated work in that file.\n\n## The setup (why this felt airtight)\n\nThe project enforces \"one index row per source file\" with a `PostToolUse` hook: every time an agent writes a file, the path is appended to a pending list, and the session-end protocol refuses to complete until each pending path has a row in `docs/CODEBASE_INDEX.md`.\n\nThat is a real guard, and it works. Every file *created* since the hook landed has a row. The discipline problem it was built to solve — \"remember to document new files\" — is genuinely solved.\n\n## What actually happened\n\nWeeks earlier, a docs-reconciliation commit set out to do legitimate housekeeping: **remove index rows pointing at files that no longer existed** (renames, splits, deletions leave these behind). The commit message said so plainly:\n\n```\nCODEBASE_INDEX.md: remove 4 verified-phantom rows.\n```\n\nThe diff removed **10** rows and re-added **3** (those three were merely reordered). Net: **7** rows removed, against **4** intended.\n\nChecking each of the 7 against the filesystem afterwards:\n\n| Row removed | Reality |\n|---|---|\n| 4 of them | genuinely deleted files ✅ — exactly the 4 claimed |\n| 3 of them | **live files, still on disk** ❌ |\n\nThe author verified four phantoms, found four phantoms, and was right about all four. The edit then removed a **contiguous block** that happened to contain three correct neighbours. The commit message accurately reports the *intent*, which is the number that was verified — not the number that was removed.\n\nThen the self-healing kicked in and hid the damage: **9 of the 10 removed rows came back** over the following weeks, re-added naturally as later work touched those files and the hook fired. The one that never came back was a **stable** file — nobody had needed to modify it, so nothing re-triggered the hook.\n\nThat selection effect is the nastiest part. **The files that stay missing are exactly the stable, load-bearing ones** — the files most worth having documented, and the least likely to heal by accident.\n\n## Why nothing caught it — three independent reasons\n\n1. **The hook keys on the wrong event.** It fires when a file is *written*. Deleting that file's row in a catalog is a write to the *catalog*, not to the file. The two events are unrelated, so a create/update hook cannot see it by construction.\n\n2. **The artifact has no runtime consumer.** A missing index row does not throw, warn, fail a test, or degrade at runtime. It is an *absence*, and absences produce no signal. Compare a missing DB column — something eventually reads it and breaks. Nothing ever \"reads\" a docs row except a human or an agent looking something up, and both fail *silently* by concluding the thing doesn't exist.\n\n3. **Partial self-healing hides the rate.** Because most rows return by accident, the failure looks rarer than it is. You never see \"7 rows lost,\" you see \"one weird gap,\" long after the commit that caused it.\n\n## The near-miss while fixing it\n\nThe first verification scan reported **0 missing** and was wrong. It extracted every `` | `path` `` occurrence *anywhere in the file* — so a path mentioned inside **another row's prose description** counted as \"indexed.\"\n\nRows in this format describe their neighbours constantly (\"extracted from `Foo.tsx`\", \"same pattern as `bar.ts`\"), so the false-negative rate is high and biased toward exactly the well-connected files you care about.\n\n```python\n# WRONG — a path mentioned in any row's description counts as indexed\nlisted = set(re.findall(r'\\| `([^`]+)`', index_text))\n\n# RIGHT — anchor to the first column of a table row\nlisted = set(re.findall(r'(?m)^\\|\\s*`([^`]+)`\\s*\\|', index_text))\n```\n\nAnchored, the same scan found 2 real gaps it had just declared clean. **A verification script that can return a false \"all clear\" is worse than no script**, because it converts an open question into unearned confidence.\n\n## The fix\n\nStop enforcing the event. Check the invariant directly — it costs about a second:\n\n```python\nimport re\nfrom pathlib import Path\n\nindex  = open('docs/CODEBASE_INDEX.md', encoding='utf-8').read()\nlisted = set(re.findall(r'(?m)^\\|\\s*`([^`]+)`\\s*\\|', index))   # first column ONLY\n\nroots = ['packages/frontend/src', 'apps/server/src']            # your source roots\nskip  = {'node_modules', 'dist', 'target', '.turbo', 'vendor'}\nfound = [p.as_posix() for r in roots for p in Path(r).rglob('*')\n         if p.suffix in ('.ts', '.tsx', '.rs') and not set(p.parts) & skip]\n\nmissing = sorted(set(found) - listed)\nprint(f'MISSING: {len(missing)}')\nfor m in missing:\n    print('  ', m)\n```\n\nRun it at wrap/commit time. Two properties matter more than the code:\n\n- **It is stateless.** It doesn't care how a row went missing — deletion, bad merge, block edit, hook outage, a file arriving via `git mv`. It compares reality to the catalog and reports the delta.\n- **It cannot false-clear.** Anchoring to the first column is the whole difference between a guard and a comfort blanket.\n\nKeep the write-hook too. The two catch different things: the hook is *proactive* (documents at creation, while context is fresh), the scan is *reactive* (catches everything else). Neither subsumes the other.\n\n## Where this generalizes\n\nThe pattern is **any catalog with no runtime consumer, guarded by a create/update hook**:\n\n- File/module indexes, ADR lists, API doc pages, runbook links\n- Environment-variable documentation, feature-flag registries\n- `CODEOWNERS`, permission allowlists, monitoring alert inventories\n- Dependency/license manifests maintained alongside a lockfile\n\nThe diagnostic question, worth asking of every hook you write:\n\n> **\"What happens when someone *deletes*?\"**\n\nIf the answer is \"nothing,\" the enforcement covers one direction of a two-directional problem, and the gap will be invisible for as long as it takes someone to trip over it.\n\n## Two rules worth stealing\n\n1. **Enforce invariants, not events.** \"Every source file has a row\" is checkable in one second, from scratch, with no memory of how the tree got this way. \"Every write produces a row\" is an event subscription with blind spots you inherit forever.\n\n2. **Block edits take neighbours.** When a cleanup removes a contiguous range, verify the **whole range you touched**, not the items you set out to remove. Your commit message will report the count you verified — which is exactly why the extra removals never make it into the message, the review, or your memory of what you did.\n\n## Related\n\n- [n-copies-of-truth-drift-guard.md](./n-copies-of-truth-drift-guard.md) — the same parent thesis (\"build the guard, don't rely on discipline\") applied to *runtime schema* copies. Different mechanism: there the copies drift by omission at deploy time and the symptom is missing data; here a catalog loses rows and the symptom is nothing at all. Both fail silently, both are fixed by a script that fails loudly.\n\n## Cost of the fix\n\nOne script, about a second per run, nothing to maintain. Weighed against a core file being undiscoverable for 3.5 weeks — and the file that stays missing always being a stable, important one — this is not a close call."}], "tagsByGroup": {"Languages": ["css", "javascript", "rust", "sql", "typescript"], "Frameworks & Libraries": ["animation", "better-auth", "design-system", "framer-motion", "frontend", "react", "sqlx", "state-management", "tailwind", "tokio", "zod"], "Platforms & Runtimes": ["android", "capacitor", "desktop", "desktop-overlay", "electron", "ios", "mobile", "multiwindow", "node", "tauri", "threads", "vite", "webview2", "windows"], "Cloud & Backend": ["aws4fetch", "cloudflare-r2", "cloudflare-worker", "d1", "fly-io", "graphql", "http-api", "postgres", "presigned-urls", "s3", "s3-compatible", "sqlite", "supabase", "supabase-postgres", "wrangler"], "Data & Sync": ["codegen", "distributed-systems", "local-first", "local-first-sync", "migrations", "monorepo", "offline-first", "pnpm-monorepo", "powersync", "sync"], "Auth & Security": ["auth", "azure", "azure-cli", "azure-trusted-signing", "chrome", "code-signing", "distribution", "entra-id", "git", "jwt", "security", "sessions", "smartscreen", "steam-openid", "trusted-signing"], "Integrations": ["api-integration", "game-library-integration", "monetization", "steam", "vdf"], "Reliability & Perf": ["crash-reporting", "dom", "performance", "sentry"], "Process & Meta": ["any", "claude-code", "codebase-audit", "docs", "refactoring", "tooling"], "Other": ["accessibility", "analytics", "assets", "cdn", "cloudflare", "cmake", "compose", "cpp", "data-modelling", "dataviz", "debugging", "dependencies", "deploy", "design-systems", "dev-tooling", "fonts", "forms", "ggml", "gradle", "hooks", "html", "http", "image-processing", "information-architecture", "integrations", "jetpack-compose", "kotlin", "llama-cpp", "maven", "meta", "npm", "packaging", "powershell", "privacy", "process", "product", "product-design", "pypi", "python", "r2", "release-engineering", "reliability", "research", "simd", "spa", "testing", "theming", "ui", "ux", "verification", "virustotal", "web", "web-platform", "webview", "whisper-cpp", "windows-on-arm"]}, "groupOrder": ["Languages", "Frameworks & Libraries", "Platforms & Runtimes", "Cloud & Backend", "Data & Sync", "Auth & Security", "Integrations", "Reliability & Perf", "Process & Meta", "Other"], "kinds": ["architecture", "checklist", "dead-end-postmortem", "decision-record", "gotcha", "howto", "pattern", "playbook", "postmortem-playbook", "recipe", "reference"], "generatedFrom": 65}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("kb-data").textContent);
  var lessons = DATA.lessons;

  var KIND_HUE = {
    "howto": 150, "gotcha": 8, "pattern": 222, "architecture": 268,
    "playbook": 186, "decision-record": 220, "postmortem-playbook": 28,
    "dead-end-postmortem": 350, "checklist": 280, "reference": 200, "recipe": 45
  };
  function hueFor(kind) { return KIND_HUE.hasOwnProperty(kind) ? KIND_HUE[kind] : 210; }
  function kindLabel(kind) {
    return kind.split("-").map(function (w) { return w[0].toUpperCase() + w.slice(1); }).join(" ");
  }

  // ---------- state ----------
  var state = {
    kinds: new Set(),          // selected kind values (OR)
    tagsByGroup: {},           // group -> Set(tags) selected (OR within group, AND across groups)
    search: "",
    staleOnly: false,
    sort: "recent"
  };

  // ---------- freshness ----------
  var MS_PER_DAY = 86400000;
  function daysSince(dateStr) {
    if (!dateStr) return Infinity;
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return Infinity;
    return Math.floor((Date.now() - d.getTime()) / MS_PER_DAY);
  }
  function freshnessClass(days) {
    if (days > 182) return "#e0483e";   // stale, > ~6 months
    if (days > 91) return "#e0a83e";    // aging, > ~3 months
    return "#3ea86a";                   // fresh
  }

  // ---------- sidebar ----------
  var kindFacetEl = document.getElementById("kind-facet");
  var tagFacetsEl = document.getElementById("tag-facets");

  function kindCount(kind) {
    return lessons.filter(function (l) { return l.kind === kind; }).length;
  }
  function tagCount(tag) {
    return lessons.filter(function (l) { return l.stack.indexOf(tag) !== -1; }).length;
  }

  function buildSidebar() {
    var h = "<h4>Kind</h4>";
    DATA.kinds.forEach(function (k) {
      h += '<label class="facet-option" data-kind="' + k + '">' +
        '<input type="checkbox" value="' + k + '"> ' + kindLabel(k) +
        '<span class="count">' + kindCount(k) + "</span></label>";
    });
    kindFacetEl.innerHTML = h;
    kindFacetEl.querySelectorAll("input").forEach(function (cb) {
      cb.addEventListener("change", function () {
        if (cb.checked) state.kinds.add(cb.value); else state.kinds.delete(cb.value);
        render();
      });
    });

    var tagsHtml = "";
    DATA.groupOrder.forEach(function (group) {
      var tags = DATA.tagsByGroup[group] || [];
      if (!tags.length) return;
      tagsHtml += '<div class="facet-group"><h4>' + escapeHtml(group) + "</h4>";
      tags.forEach(function (tag) {
        tagsHtml += '<label class="facet-option" data-tag="' + escapeHtml(tag) + '" data-group="' + escapeHtml(group) + '">' +
          '<input type="checkbox" value="' + escapeHtml(tag) + '"> ' + escapeHtml(tag) +
          '<span class="count">' + tagCount(tag) + "</span></label>";
      });
      tagsHtml += "</div>";
    });
    tagFacetsEl.innerHTML = tagsHtml;
    tagFacetsEl.querySelectorAll("input").forEach(function (cb) {
      var label = cb.closest(".facet-option");
      var group = label.getAttribute("data-group");
      cb.addEventListener("change", function () {
        if (!state.tagsByGroup[group]) state.tagsByGroup[group] = new Set();
        if (cb.checked) state.tagsByGroup[group].add(cb.value);
        else state.tagsByGroup[group].delete(cb.value);
        render();
      });
    });
  }

  function setTagChecked(tag, group) {
    if (!state.tagsByGroup[group]) state.tagsByGroup[group] = new Set();
    state.tagsByGroup[group].add(tag);
    syncSidebarChecks();
    render();
  }

  function syncSidebarChecks() {
    kindFacetEl.querySelectorAll("input").forEach(function (cb) {
      cb.checked = state.kinds.has(cb.value);
    });
    tagFacetsEl.querySelectorAll("input").forEach(function (cb) {
      var group = cb.closest(".facet-option").getAttribute("data-group");
      cb.checked = !!(state.tagsByGroup[group] && state.tagsByGroup[group].has(cb.value));
    });
  }

  document.getElementById("clear-filters").addEventListener("click", function () {
    state.kinds.clear();
    state.tagsByGroup = {};
    state.staleOnly = false;
    state.search = "";
    document.getElementById("search").value = "";
    document.getElementById("stale-only").checked = false;
    syncSidebarChecks();
    render();
  });

  document.getElementById("stale-only").addEventListener("change", function (e) {
    state.staleOnly = e.target.checked;
    render();
  });
  document.getElementById("sort-select").addEventListener("change", function (e) {
    state.sort = e.target.value;
    render();
  });
  document.getElementById("search").addEventListener("input", function (e) {
    state.search = e.target.value.trim().toLowerCase();
    render();
  });

  // ---------- filter/sort ----------
  function matches(l) {
    if (state.kinds.size && !state.kinds.has(l.kind)) return false;
    for (var group in state.tagsByGroup) {
      var wanted = state.tagsByGroup[group];
      if (!wanted || !wanted.size) continue;
      var hit = l.stack.some(function (t) { return wanted.has(t); });
      if (!hit) return false;
    }
    if (state.staleOnly && daysSince(l.last_verified) <= 182) return false;
    if (state.search) {
      var hay = (l.title + " " + l.description + " " + l.kind + " " + l.stack.join(" ") + " " + l.content).toLowerCase();
      if (hay.indexOf(state.search) === -1) return false;
    }
    return true;
  }

  function sortLessons(list) {
    var copy = list.slice();
    if (state.sort === "title") {
      copy.sort(function (a, b) { return a.title.localeCompare(b.title); });
    } else if (state.sort === "kind") {
      copy.sort(function (a, b) { return a.kind.localeCompare(b.kind) || a.title.localeCompare(b.title); });
    } else if (state.sort === "stale") {
      copy.sort(function (a, b) { return daysSince(b.last_verified) - daysSince(a.last_verified); });
    } else {
      copy.sort(function (a, b) { return daysSince(a.last_verified) - daysSince(b.last_verified); });
    }
    return copy;
  }

  // ---------- rendering ----------
  var cardGrid = document.getElementById("card-grid");
  var resultCount = document.getElementById("result-count");
  var resultCountHeader = document.getElementById("result-count-header");
  var emptyState = document.getElementById("empty-state");
  var currentList = [];

  function render() {
    var filtered = sortLessons(lessons.filter(matches));
    currentList = filtered;
    resultCount.textContent = filtered.length + " of " + lessons.length + " lessons";
    resultCountHeader.textContent = filtered.length + "/" + lessons.length;
    emptyState.style.display = filtered.length ? "none" : "block";

    var html = "";
    filtered.forEach(function (l, i) {
      var days = daysSince(l.last_verified);
      var visibleTags = l.stack.slice(0, 5);
      var extra = l.stack.length - visibleTags.length;
      html += '<div class="card" data-id="' + escapeHtml(l.id) + '">' +
        '<div class="card-top">' +
          '<span class="badge" style="--hue:' + hueFor(l.kind) + '">' + escapeHtml(kindLabel(l.kind)) + "</span>" +
          '<span class="freshness-dot" style="background:' + freshnessClass(days) + '" title="last verified ' + escapeHtml(l.last_verified || "unknown") + '"></span>' +
          '<span class="card-date">' + escapeHtml(l.last_verified || "") + "</span>" +
        "</div>" +
        "<h3>" + escapeHtml(l.title) + "</h3>" +
        '<p class="desc">' + escapeHtml(l.description || "") + "</p>" +
        '<div class="tag-row">' +
        visibleTags.map(function (t) { return '<button class="tag-chip" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + "</button>"; }).join("") +
        (extra > 0 ? '<span class="tag-chip more">+' + extra + "</span>" : "") +
        "</div></div>";
    });
    cardGrid.innerHTML = html;

    cardGrid.querySelectorAll(".card").forEach(function (card) {
      card.addEventListener("click", function (e) {
        if (e.target.closest(".tag-chip")) return;
        openModal(card.getAttribute("data-id"));
      });
    });
    cardGrid.querySelectorAll(".tag-chip:not(.more)").forEach(function (chip) {
      chip.addEventListener("click", function (e) {
        e.stopPropagation();
        var tag = chip.getAttribute("data-tag");
        var group = null;
        for (var g in DATA.tagsByGroup) { if (DATA.tagsByGroup[g].indexOf(tag) !== -1) { group = g; break; } }
        if (group) setTagChecked(tag, group);
      });
    });
  }

  // ---------- modal ----------
  var backdrop = document.getElementById("modal-backdrop");
  var modalBadge = document.getElementById("modal-badge");
  var modalDate = document.getElementById("modal-date");
  var modalTags = document.getElementById("modal-tags");
  var modalBody = document.getElementById("modal-body");
  var currentIndex = -1;

  function openModal(id) {
    var idx = currentList.findIndex(function (l) { return l.id === id; });
    if (idx === -1) idx = lessons.findIndex(function (l) { return l.id === id; });
    showAt(idx);
    backdrop.classList.remove("hidden");
  }
  function showAt(idx) {
    if (idx < 0 || idx >= currentList.length) return;
    currentIndex = idx;
    var l = currentList[idx];
    modalBadge.textContent = kindLabel(l.kind);
    modalBadge.style.setProperty("--hue", hueFor(l.kind));
    modalDate.textContent = "last verified " + (l.last_verified || "unknown");
    modalTags.innerHTML = l.stack.map(function (t) { return '<span class="tag-chip">' + escapeHtml(t) + "</span>"; }).join("");
    modalBody.innerHTML = renderMarkdown(l.content);
    modalBody.scrollTop = 0;
    document.getElementById("modal-prev").disabled = idx === 0;
    document.getElementById("modal-next").disabled = idx === currentList.length - 1;
  }
  function closeModal() { backdrop.classList.add("hidden"); }
  document.getElementById("modal-close").addEventListener("click", closeModal);
  backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeModal(); });
  document.getElementById("modal-prev").addEventListener("click", function () { showAt(currentIndex - 1); });
  document.getElementById("modal-next").addEventListener("click", function () { showAt(currentIndex + 1); });
  document.addEventListener("keydown", function (e) {
    if (backdrop.classList.contains("hidden")) return;
    if (e.key === "Escape") closeModal();
    if (e.key === "ArrowLeft") showAt(currentIndex - 1);
    if (e.key === "ArrowRight") showAt(currentIndex + 1);
  });

  // ---------- mobile sidebar ----------
  var sidebar = document.getElementById("sidebar");
  document.getElementById("filters-toggle").addEventListener("click", function () {
    sidebar.classList.toggle("open");
  });

  // ---------- theme ----------
  var themeBtn = document.getElementById("theme-toggle");
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
  }
  var savedTheme = localStorage.getItem("kb-theme");
  if (savedTheme) applyTheme(savedTheme);
  themeBtn.addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme");
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next;
    if (!current) next = prefersDark ? "light" : "dark";
    else if (current === "dark") next = "light";
    else next = "dark";
    applyTheme(next);
    localStorage.setItem("kb-theme", next);
  });

  // ---------- tiny markdown renderer ----------
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderInline(text) {
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (m, code) {
      codes.push(code);
      return "␀" + (codes.length - 1) + "␀";
    });
    text = escapeHtml(text);
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (m, t, url) {
      return '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + t + "</a>";
    });
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/__(.+?)__/g, "<strong>$1</strong>");
    text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
    text = text.replace(/\b_(.+?)_\b/g, "<em>$1</em>");
    text = text.replace(/␀(\d+)␀/g, function (m, i) {
      return "<code>" + escapeHtml(codes[+i]) + "</code>";
    });
    return text;
  }

  function isHr(line) { return /^ {0,3}([-*_])( *\1){2,} *$/.test(line); }
  function isTableSep(line) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line) && line.indexOf("-") !== -1; }
  function splitRow(line) {
    var t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    return t.split("|").map(function (c) { return c.trim(); });
  }

  function renderMarkdown(md) {
    var lines = md.replace(/\r\n/g, "\n").split("\n");
    var out = [];
    var i = 0;
    var n = lines.length;

    function flushList(stack) {
      while (stack.length) out.push(stack.pop().tag === "ol" ? "</ol>" : "</ul>");
    }

    while (i < n) {
      var line = lines[i];

      if (/^\s*$/.test(line)) { i++; continue; }

      // fenced code block
      var fence = line.match(/^```(\S*)\s*$/);
      if (fence) {
        var buf = [];
        i++;
        while (i < n && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // skip closing fence
        out.push("<pre><code>" + escapeHtml(buf.join("\n")) + "</code></pre>");
        continue;
      }

      // heading
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var level = h[1].length;
        out.push("<h" + level + ">" + renderInline(h[2].trim()) + "</h" + level + ">");
        i++;
        continue;
      }

      // hr
      if (isHr(line)) { out.push("<hr>"); i++; continue; }

      // table
      if (line.indexOf("|") !== -1 && i + 1 < n && isTableSep(lines[i + 1])) {
        var header = splitRow(line);
        i += 2;
        var rows = [];
        while (i < n && lines[i].indexOf("|") !== -1 && !/^\s*$/.test(lines[i])) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        var t = "<table><thead><tr>" +
          header.map(function (c) { return "<th>" + renderInline(c) + "</th>"; }).join("") +
          "</tr></thead><tbody>";
        rows.forEach(function (r) {
          t += "<tr>" + r.map(function (c) { return "<td>" + renderInline(c) + "</td>"; }).join("") + "</tr>";
        });
        t += "</tbody></table>";
        out.push(t);
        continue;
      }

      // blockquote
      if (/^\s*>\s?/.test(line)) {
        var qbuf = [];
        while (i < n && /^\s*>\s?/.test(lines[i])) { qbuf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + qbuf.map(renderInline).join("<br>") + "</blockquote>");
        continue;
      }

      // list
      var ulMatch = line.match(/^(\s*)[-*+]\s+(.*)$/);
      var olMatch = line.match(/^(\s*)\d+[.)]\s+(.*)$/);
      if (ulMatch || olMatch) {
        var stack = [];
        var htmlOut = [];
        while (i < n) {
          var l2 = lines[i];
          if (/^\s*$/.test(l2)) { i++; continue; }
          var um = l2.match(/^(\s*)[-*+]\s+(.*)$/);
          var om = l2.match(/^(\s*)\d+[.)]\s+(.*)$/);
          if (!um && !om) break;
          var indent = (um || om)[1].length;
          var type = um ? "ul" : "ol";
          var text = (um || om)[2];
          while (stack.length && indent < stack[stack.length - 1].indent) {
            htmlOut.push(stack.pop().tag === "ol" ? "</ol>" : "</ul>");
          }
          if (!stack.length || indent > stack[stack.length - 1].indent) {
            htmlOut.push(type === "ol" ? "<ol>" : "<ul>");
            stack.push({ indent: indent, tag: type });
          } else if (stack[stack.length - 1].tag !== type) {
            htmlOut.push(stack.pop().tag === "ol" ? "</ol>" : "</ul>");
            htmlOut.push(type === "ol" ? "<ol>" : "<ul>");
            stack.push({ indent: indent, tag: type });
          }
          htmlOut.push("<li>" + renderInline(text) + "</li>");
          i++;
        }
        while (stack.length) htmlOut.push(stack.pop().tag === "ol" ? "</ol>" : "</ul>");
        out.push(htmlOut.join(""));
        continue;
      }

      // paragraph: gather consecutive plain lines
      var pbuf = [];
      while (i < n && !/^\s*$/.test(lines[i]) && !/^```/.test(lines[i]) && !/^(#{1,6})\s+/.test(lines[i]) &&
             !isHr(lines[i]) && !/^\s*>\s?/.test(lines[i]) &&
             !/^(\s*)[-*+]\s+/.test(lines[i]) && !/^(\s*)\d+[.)]\s+/.test(lines[i]) &&
             !(lines[i].indexOf("|") !== -1 && i + 1 < n && isTableSep(lines[i + 1]))) {
        pbuf.push(lines[i]);
        i++;
      }
      if (pbuf.length) out.push("<p>" + renderInline(pbuf.join(" ")) + "</p>");
      else i++; // safety valve
    }
    return out.join("\n");
  }

  // ---------- init ----------
  buildSidebar();
  render();
})();
</script>
</body>
</html>
