lement USED to be. If the source element is gone entirely (deleted, filtered out), skip the reverse transition and just fade — flying to empty space reads as a glitch, not a transition.\n\n## The trap inside \"if the source is gone, skip the transition\": detached is not absent\n\nThe advice above — *if the source element is gone entirely, skip the reverse transition* — is right, and the obvious implementation of it is wrong:\n\n```ts\nconst liveTile = container.querySelector(`[data-id=\"${id}\"]`);\nif (!liveTile) { teardownWithoutTransition(); return; }   // looks sufficient. isn't.\n```\n\nThat guard catches \"the element was removed from a container that is still on screen.\" It does **not** catch \"the container itself was unmounted,\" and the second case is the one that produces a spectacular visual bug.\n\n**Why the null check passes.** You captured `container` as a DOM reference when the transition started. When a framework unmounts a subtree it typically removes only the **outermost host node** of that subtree from the document — the descendants stay attached to that now-detached root (React's `commitDeletionEffects` calls `removeChild` once at the boundary rather than walking every grandchild). So your captured `container` is detached but structurally intact, and **`querySelector` traverses a detached subtree perfectly happily**. The lookup succeeds. You get back a real `HTMLElement`. Everything looks fine.\n\n**Why the result is a corner-flight.** Per CSSOM View, an element with no associated CSS layout box returns a zero `DOMRect` — and a detached element has no layout box. So `getBoundingClientRect()` returns `{x:0, y:0, width:0, height:0}`, and the reverse transition dutifully animates toward the viewport's top-left corner, shrinking to nothing.\n\n> **Signature to memorize: a transition flying to the top-left corner means a zeroed rect.** That's almost always a detached or `display:none` node, not a math error in your positioning code.\n\n**Two guards, at two different moments**, because they cover different windows:\n\n```ts\n// 1. At lookup — catches a container that was already unmounted.\nif (!liveTile || !liveTile.isConnected) { teardownWithoutTransition(); return; }\n\n// 2. At the instant the rect is committed to the flight — catches anything that\n//    unmounts DURING the close (an async re-query resolving, a sync from another\n//    device, a scroll-into-view preamble you awaited).\nconst rect = measuredEl.getBoundingClientRect();\nif (!measuredEl.isConnected || rect.width === 0 || rect.height === 0) {\n  teardownWithoutTransition(); return;\n}\n```\n\n**Guard the element you actually MEASURE, not the one you looked up.** If you use a descendant marker to pick the rect (e.g. the tile carries `data-id` but you measure a `[data-morph-rect]` child so the flight lands on just the cover), then a connected *tile* does not prove a connected *cover*. Test the node whose rect you are about to trust.\n\n**Why this reads as intermittent, and why that's misleading.** Whether you hit it depends on whether the container survived, which depends on your data — a list that renders `null` when empty unmounts its whole section when you remove the **last** item, but only removes one child when you remove one of three. Same click, two different code paths, selected by how many items happened to be left. It gets filed as a race and hunted for weeks. It isn't a race; it's deterministic per-case. (A genuine race exists *too* — the removal landing mid-transition — but it is a different, rarer bug, and conflating them sends you looking for timing jitter that isn't there.)\n\n**The structural fix, if you own the list:** don't let the container unmount. A section that renders a collapsed header at zero items instead of returning `null` cannot produce a detached container at all. Keep the guards anyway — they're shared code protecting every other surface that *does* unmount.\n\n## Scoping the lookup and \"render nothing when empty\" are mutually exclusive\n\nA follow-on that only appears once you fix a *different* bug, and it is worth knowing before you fix that one.\n\n**The other bug first.** A reverse flight has to find the element it should fly back to, usually `container.querySelector('[data-id=\"...\"]')`. If `container` is resolved with `closest('[data-morph-container]')` and the nearest such ancestor is the whole screen root, that lookup spans **every** surface on the page — so the flight lands on the first document-order match, which is the wrong card as soon as two surfaces render the same item. The fix is one attribute: give each list its own `data-morph-container` so the lookup is scoped to the list you actually clicked in.\n\n**What that attribute does to a list that unmounts when empty.** Before, an item card's `closest()` walked up to a screen-root container that never unmounts, so the detached-container bug above was *dormant* — the container outlived any list. The moment the list carries its own container attribute, an `if (!items.length) return null` becomes exactly the detached-container case: click the last item, the list empties, the `<ul>` unmounts, the flight measures a detached node, and the rect comes back zeroed.\n\nSo the two changes are individually correct and **jointly required**. Shipping the scoping attribute without making the list permanent trades a wrong-target bug for a zeroed-rect bug. Land them in the same commit.\n\n**And \"make the section permanent\" is not enough.** The node that must stay mounted is *the one carrying the attribute*, not its parent. This is wrong:\n\n```jsx\n<section>                                  {/* permanent — but not the container */}\n  {items.length > 0\n    ? <ul data-morph-container>{cards}<\/ul> {/* still unmounts */}\n    : <EmptyState />}\n<\/section>\n```\n\nThe section survives, the `<ul>` doesn't, and the container detaches exactly as before. One list has to render always and swap its *children*:\n\n```jsx\n<section>\n  <ul data-morph-container>\n    {isEmpty ? ghostPlaceholders : cards}\n  <\/ul>\n<\/section>\n```\n\nThere's a layout dividend for free: placeholders that hold the real grid's dimensions mean the first real item arriving moves nothing on the page, so you also stop the empty→populated transition from shoving content around.\n\n## What NOT to do\n\n- Don't scale a rasterized image/text node between two very different sizes as your primary technique — the intermediate blur is visible on anything but tiny size deltas.\n- Don't treat `if (!element)` as \"the element is gone.\" It only means *this lookup returned nothing*. A detached-but-intact subtree returns elements normally and measures as all zeros — check `isConnected` and a non-zero rect, on the node you actually measure.\n- Don't clip to either endpoint rect alone — always use the union bounding box, or content taller/wider than the smaller rect gets silently cut off.\n- Don't schedule a hand-off's two halves (reveal the real element / remove the ghost) for the same timestamp from two different mechanisms. Overlap them. Meeting exactly is a coin-flip between \"invisible\" and \"one-frame hole.\"\n- Don't soften an invisible snap into a crossfade to make it \"smoother\" without checking what the snap was hiding — the snap is usually invisible *because* another layer still covers it at that instant.\n- Don't add a per-list `data-morph-container` scope without also making that list permanent — the scope is what turns a dormant early-return-when-empty into a live detached-container bug, so the two fixes are jointly required, not independently optional.\n- Don't assume making the *section* permanent is enough. The node carrying the container attribute is the one that must never unmount; if the `<ul>` inside a permanent `<section>` still swaps out at zero items, nothing is fixed.\n- Don't assume \"same animation library, same `animate()` call\" means \"same execution thread\" for every property you're animating together. Verify the properties that must stay in lockstep are actually on the same thread; if one drifts, suspect a per-property engine fallback."}, {"id": "cloudflare-worker-setup.md", "title": "Cloudflare Worker + D1 Setup (from zero to deployed)", "kind": "recipe", "last_verified": "2026-05-14", "stack": ["cloudflare-worker", "d1", "wrangler"], "groups": ["Cloud & Backend"], "description": "Deploying a Cloudflare Worker + D1 from zero. Exact command sequence, secrets, CORS for native apps.", "content": "# Cloudflare Worker + D1 Setup (from zero to deployed)\n\n> The exact sequence. No fluff.\n\n## Prerequisites\n\n- Cloudflare account (free tier is fine)\n- `wrangler` installed (`npx wrangler` works without global install)\n- A Worker project with `wrangler.toml`\n\n## Step 1 — Log in\n\n```bash\ncd apps/cloud\nnpx wrangler login\n```\n\nOpens browser, authorizes the CLI. One-time.\n\n## Step 2 — Create D1 database\n\n```bash\nnpx wrangler d1 create my-db-name\n```\n\nOutput gives you the database ID. Copy it into `wrangler.toml`:\n\n```toml\n[[d1_databases]]\nbinding = \"DB\"\ndatabase_name = \"my-db-name\"\ndatabase_id = \"93857ccf-5d2b-47e6-b7d4-e449eac51cf6\"  # from output above\nmigrations_dir = \"migrations\"\n```\n\n## Step 3 — Apply migrations\n\nPut your schema in `migrations/0001_initial.sql`:\n\n```sql\nCREATE TABLE users (\n  id TEXT PRIMARY KEY,\n  email TEXT NOT NULL UNIQUE,\n  -- ...\n);\n```\n\nApply to remote:\n\n```bash\nnpx wrangler d1 migrations apply my-db-name --remote\n```\n\nApply to local (for `wrangler dev`):\n\n```bash\nnpx wrangler d1 migrations apply my-db-name --local\n```\n\n## Step 4 — Set secrets\n\nSecrets are env vars that don't go in `wrangler.toml` (which is in git). Set them via CLI:\n\n```bash\necho \"your-secret-value\" | npx wrangler secret put MY_SECRET_NAME\n```\n\nOr interactively:\n\n```bash\nnpx wrangler secret put MY_SECRET_NAME\n# paste value when prompted\n```\n\nFor a random session signing secret:\n\n```bash\nnode -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\" | npx wrangler secret put SESSION_SECRET\n```\n\n## Step 5 — Deploy\n\n```bash\nnpx wrangler deploy\n```\n\nOutput gives you the Worker URL: `https://my-worker.your-account.workers.dev`\n\n## Step 6 — Local dev\n\n```bash\nnpx wrangler dev --local --port 8787\n```\n\nRuns on `http://localhost:8787`. Use `--local` to use a local D1 mirror; without it, `wrangler dev` hits the real D1 (which is usually what you want for integration testing).\n\n## Gotchas\n\n1. **R2 buckets require enabling** — first time you try to create one, you'll get `error code 10042`. Enable R2 in the Cloudflare dashboard once per account, then it works from CLI.\n\n2. **Custom domains** — the `.workers.dev` URL is free and works forever. You don't need a custom domain for production. Add one later via Cloudflare dashboard → your Worker → Triggers → Custom Domains. No code changes needed.\n\n3. **Secrets can't be read back** — once set via `wrangler secret put`, you can't view the value. Only rotate/delete. Keep a copy in a password manager if you need to reference them.\n\n4. **`.dev.vars` for local dev** — put local-only secrets in `apps/cloud/.dev.vars` (gitignored). `wrangler dev` reads them automatically:\n   ```\n   GOOGLE_CLIENT_ID=...\n   GOOGLE_CLIENT_SECRET=...\n   ```\n\n5. **D1 database IDs are per-environment** — if you want separate dev/staging/prod databases, create three and use Wrangler environments:\n   ```toml\n   [env.production]\n   [[env.production.d1_databases]]\n   binding = \"DB\"\n   database_id = \"prod-id-here\"\n   ```\n\n6. **wrangler.toml changes don't require redeploy to take effect locally** — just restart `wrangler dev`. But remote changes always need `wrangler deploy`.\n\n7. **Check the deployed Worker version** — `wrangler deployments list` shows history. `wrangler rollback <version-id>` reverts.\n\n8. **wrangler crashes on ARM64 Windows hosts** — on Snapdragon X / ARM64 Windows machines (Surface Pro 11, etc.), `wrangler tail` and `wrangler deploy` both crash with a native binary error. The Node.js binary wrangler ships uses an x64-only native module. **Fix: run wrangler from WSL** (`wsl bash -c \"cd /mnt/c/... && npx wrangler deploy\"`) or from a separate x64 dev machine. We hit this when deploying from an ARM64 laptop in May 2026; WSL runs the x64 binary fine under emulation. As of writing (2026-05) there is no native ARM64 wrangler build.\n\n## Quick health check endpoint\n\nAlways add this — saves debugging time:\n\n```typescript\napp.get('/api/health', async (c) => {\n  try {\n    const result = await c.env.DB.prepare('SELECT 1 as ok').first();\n    return c.json({ status: 'ok', db: result?.ok === 1 });\n  } catch {\n    return c.json({ status: 'error', db: false }, 500);\n  }\n});\n```\n\nThen `curl https://your-worker.workers.dev/api/health` tells you everything's wired up.\n\n## CORS for native/mobile apps\n\nIf your Worker serves a native app (Tauri, Capacitor, mobile), you need permissive CORS:\n\n```typescript\nimport { cors } from 'hono/cors';\n\napp.use('/api/*', cors({\n  origin: [\n    'http://localhost:1420',     // Tauri dev\n    'tauri://localhost',          // Tauri prod (macOS)\n    'https://tauri.localhost',    // Tauri prod (Windows/Linux)\n    'capacitor://localhost',      // Capacitor iOS\n    'http://localhost',           // Capacitor Android\n  ],\n  allowHeaders: ['Content-Type', 'Authorization'],\n  allowMethods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS'],\n  credentials: true,\n}));\n```\n\nNote: for native apps, **don't rely on cookies** (different origins, cookie jars don't match). Use bearer tokens instead. See `tauri-desktop-oauth.md`."}, {"id": "compose-invisible-text-localcontentcolor.md", "title": "Your theme sets tokens, not defaults — Compose's `LocalContentColor` falls back to **black**", "kind": "gotcha", "last_verified": "2026-08-09", "stack": ["android", "compose", "kotlin", "ui", "theming", "debugging"], "groups": ["Other", "Platforms & Runtimes"], "description": "A complete, correct dark colour scheme, and every uncoloured `Text` still drew in **solid black on a near-black background** — invisible app-wide. `MaterialTheme` does not set `LocalContentColor` (0 references; `Surface` has 4), and its compositional default is literally `Color.Black`, so an app rooted in a `Box` with a `background` modifier never gets one. Ten-second identification: if the \"invisible\" text is perfectly legible on one pale image, it's black on purpose — and if exactly one screen looks right, check whether a `Scaffold` is quietly supplying a `Surface`. Includes the `javap` one-liners that settle it against the version you actually ship, the sibling bug (`darkColorScheme()` fills all ~48 omitted slots with Material's baseline — `surfaceContainerHigh` IS your AlertDialog background), the reflection guard that catches it, and the general rule: painting a colour is not declaring a context, and an implicit ambient default may be hostile rather than neutral (React context defaults, CSS `inherit`, DI ambients).", "content": "# Your theme sets tokens, not defaults — Compose's `LocalContentColor` falls back to **black**\n\n**One-liner:** an app with a complete, correct dark colour scheme rendered every game title, every screen heading and every uncoloured label in **solid black on a #0E0C0E background** — invisible on every screen. The palette was fine. The cause is that `MaterialTheme` does not set `LocalContentColor`; only `Surface` does. Root your UI in a `Box` with a `background` modifier instead of a `Surface`, and the ambient text colour stays at its compositional default, which is literally `Color.Black`. It survives compilation, unit tests, and a first pass on a real device.\n\n## The symptom\n\nSome text renders correctly, some is invisible, and the split looks arbitrary until you line it up:\n\n| Renders fine | Invisible |\n|---|---|\n| Anything passing an explicit `color = …` | Anything omitting `color` |\n| Text inside `Button` / `OutlinedButton` | Screen titles, item titles |\n| Text inside `Scaffold` / `Card` / `Surface` | Everything in a plain `Column` |\n\n**The clincher that identifies it in ten seconds:** find a light-coloured background somewhere in the app — an image, a pale cover, a light card. If the \"invisible\" text is *perfectly legible in black* there, the text is not faded, missing, or mis-styled. It is being drawn in black on purpose.\n\nThe second tell is asymmetry between screens. If exactly one screen looks right, check what wraps it. Here the sign-in screen was the only one built on a `Scaffold`, and `Scaffold` brings a `Surface` with it — so the one correct screen in the app was correct by accident, which is also why nobody caught it earlier.\n\n## The mechanism\n\nThree facts, each verifiable in about a minute against the artifact you actually compile against:\n\n1. **`LocalContentColor`'s default is `Color.Black`.** Not `Unspecified`, not \"inherit\" — black.\n2. **`MaterialTheme` never touches it.** It provides the colour scheme, the typography and the shapes. The scheme's `onBackground` / `onSurface` are *tokens available to components*, not an ambient default for bare `Text`.\n3. **`Surface` provides it**, deriving the content colour from its container colour.\n\nSo `Text(\"hi\")` with no `color` reads `LocalContentColor`, and if nothing upstream provided one, that is black.\n\nVerify rather than believe — decompile the exact version on your classpath:\n\n```bash\nunzip -o -q \"$GRADLE_CACHE/.../material3/jars/classes.jar\" 'androidx/compose/material3/*'\njavap -p -c 'androidx/compose/material3/ContentColorKt$LocalContentColor$1.class' | grep Black\n#   -> invokevirtual  androidx/compose/ui/graphics/Color$Companion.\"getBlack-0d7_KjU\":()J\n\njavap -p -c androidx/compose/material3/MaterialThemeKt.class | grep -c LocalContentColor   # -> 0\njavap -p -c androidx/compose/material3/SurfaceKt.class       | grep -c LocalContentColor   # -> 4\n```\n\nThat is the whole diagnosis: zero references in the theme, four in `Surface`.\n\n## Why `Modifier.background()` is the trap\n\n```kotlin\n// Paints a colour. Declares nothing.\nBox(Modifier.fillMaxSize().background(PmBgDeep)) { App() }\n\n// Paints a colour AND declares the content colour that goes with it.\nSurface(color = PmBgDeep) { App() }\n```\n\nThey look equivalent in a screenshot of an empty screen, and they are not the same thing at all. `background()` is a draw instruction. `Surface` is a semantic container: colour, content colour, elevation, shape, and the ambient values that go with them.\n\nAnyone reaching for `Box` + `background` at the app root — usually to get `Alignment.BottomCenter` for a floating nav bar, which is exactly what happened here — walks straight into it.\n\n## The fix, and where to put it\n\nProvide it **inside your theme wrapper**, not at the root:\n\n```kotlin\n@Composable\nfun AppTheme(content: @Composable () -> Unit) {\n    MaterialTheme(colorScheme = AppColors, typography = AppType) {\n        CompositionLocalProvider(LocalContentColor provides AppColors.onBackground, content = content)\n    }\n}\n```\n\nRoot-level would fix today's bug. Theme-level fixes it for every entry point at once — the shell, sign-in, dialogs, `@Preview` — and means a future root that forgets to be a `Surface` cannot reintroduce it. Nested `Surface`s still override it normally, so nothing else changes.\n\n## The sibling bug in the same file\n\nWhile you are there: **`darkColorScheme()` fills every slot you omit with Material's own baseline palette.** An unnamed slot is not unused — it is Material's purple-tinted neutral, waiting for the first stock component that reads it. There are ~48 slots; a hand-written theme typically names 15–20.\n\nThe two that bite first, because they are what stock components actually paint with:\n\n- **`surfaceContainerHigh`** — `AlertDialog`'s background.\n- **`surfaceContainerHighest`** — `Switch`'s unchecked track.\n\nAlso set **`surfaceTint = Color.Transparent`** unless you want tonal elevation: Material blends that colour into raised surfaces to imply height, which on a hand-built dark theme washes your accent across every card.\n\nGuard it by reflection rather than by a hand-written list, so a slot added by a future Compose release fails the build instead of silently defaulting:\n\n```kotlin\nprivate fun slots(scheme: ColorScheme): Map<String, Long> =\n    ColorScheme::class.java.methods\n        .filter { it.parameterCount == 0 && it.returnType == java.lang.Long.TYPE && it.name.startsWith(\"get\") }\n        .associate { it.name.removePrefix(\"get\").substringBefore('-').replaceFirstChar(Char::lowercase) to it.invoke(scheme) as Long }\n\n@Test fun `no slot is inherited from Material`() {\n    val inherited = slots(AppColors).filter { (k, v) -> slots(darkColorScheme())[k] == v }.keys\n    assertTrue(\"still Material's: $inherited\", inherited.isEmpty())\n}\n```\n\n**Match on return type, not on the `-0d7_KjU` name mangling.** That suffix is a hash of the value class's identity, not a contract; keying off it made the first version of this test match *nothing* and pass on an empty set. See [[negative-control-before-trusting-a-probe]] — an assertion over an empty collection is vacuously true, so pair this with a canary asserting it finds ≥40 slots.\n\n## The general rule\n\n**Painting a colour is not declaring a context, and a framework's implicit default may be actively hostile rather than neutral.**\n\nA theme object that carries a complete palette invites the assumption that it has configured everything downstream reads. It hasn't — it has published tokens. What consumes those tokens is a separate mechanism, and the gap between them is where an unset ambient value sits with whatever default its author picked years ago, for a light-theme world.\n\nThe same shape recurs anywhere there is an ambient/provider system with a default:\n\n- **React context** created with `createContext(someDefault)` — a component rendered outside the provider silently gets that default instead of erroring.\n- **CSS `inherit` chains** — a value that resolves to the initial value rather than the one you set two levels up.\n- **DI containers with implicit bindings**, thread-locals, request-scoped ambients.\n\nThe habit: when a default surprises you, **read the artifact you compile against** rather than the docs or your memory. One `javap`/decompile/source-jar peek settles it, and it settles it for the exact version you ship rather than for the version the blog post was written about.\n\n## Related\n\n- [[negative-control-before-trusting-a-probe]] — the guard test above is only a guard if it can fail; an empty set satisfies every \"none of these are wrong\" assertion.\n- [[edge-to-edge-scrim-paints-over-your-bleed]] — the same family's other member: there the paint was a system-bar scrim over a bleed; both were debugged as structure while every structural probe answered \"correct.\"\n- [[material-tier-glassmorphism-tokens]] — the translucent-surface token system this theme sits on top of.\n- [[webview2-react-render-traps]] — the same genre one platform over: framework defaults that behave differently than the environment you developed against."}, {"id": "count-downloads-behind-a-cdn.md", "title": "Counting downloads of a file behind a CDN or object store", "kind": "pattern", "last_verified": "2026-08-06", "stack": ["cloudflare", "r2", "s3", "cdn", "analytics", "release-engineering"], "groups": ["Cloud & Backend", "Other"], "description": "\"How many people downloaded it\" has no answer when the link points straight at an object store: R2/S3 report **bucket-wide** operations with no per-object breakdown (measured — 47 reads in 24h, dominated by ~30/day of the app's own update polls), and the zone analytics that could split by path is plan-gated and retention-limited, so it can never accumulate a launch-to-date total. Includes the `Data Retrieved: 0 B` trap (it's the Infrequent-Access retrieval-fee meter, not an egress counter). Fix is a redirect counter you own, and the trap that ruins it is **301**: cacheable by default, so every future download routes around your handler and the counter flatlines — indistinguishable from genuine failure, and you'll believe it. Plus why the auto-updater must stay on the direct URL, and why a tally beats an event log.", "content": "# Counting downloads of a file behind a CDN or object store\n\n**One-liner:** you shipped a desktop app, the download link points straight at your object store, and months later \"how many people downloaded it\" has no answer — because object stores report **bucket-wide** operation counts with no per-object breakdown, and the CDN analytics that *could* break down by path is plan-gated and retention-limited, so it can never accumulate a total. The fix is a redirect counter you own, and the one non-obvious trap is that it must be a **302**: a 301 gets cached by browsers and intermediaries, routes every future download around your handler, and silently freezes the counter at day one — which looks exactly like \"nobody is downloading.\"\n\n## The shape\n\nAny setup where a public file is served by something other than your application:\n\n- Installer / binary in R2, S3, GCS, or a release CDN\n- Download link on a marketing page pointing directly at that URL\n- Optionally an auto-updater polling a manifest from the *same* bucket\n\nThe direct link is correct engineering. It is fast, it is cheap, it survives your server being down, and it needs no code. It also means **your application never observes the download**, so the only record lives in whatever telemetry the storage layer offers.\n\nThat telemetry is worse than people assume.\n\n## Why the storage metrics can't answer it\n\nMeasured against Cloudflare R2 on 2026-08-06, and the shape generalises:\n\n| what the dashboard offers | what it actually tells you |\n|---|---|\n| Class A operations (writes) | your own uploads, mostly |\n| Class B operations (reads) | **every read of every object, pooled** |\n| Data Retrieved | `0 B` — see below |\n| Request distribution by region | where, not what |\n\n**There is no per-object breakdown.** Cloudflare's own docs are explicit that storage metrics are bucket-level and operations metrics aggregate by action type, not by key. So installer GETs and updater manifest polls land in one number.\n\nThat pooling is not a rounding error, it is a *majority*. Real numbers from the case below: 5 installs, each polling an update manifest every 4 hours, generate ~30 reads/day on their own. The observed 24-hour Class B count was **47**. The installer downloads were somewhere in the remaining handful. The metric is dominated by the thing you did not want to measure.\n\n### The `0 B` trap that looks like a contradiction\n\n\"Data Retrieved\" read **0 B** over 30 days while Class B operations read **1.28k**. That looks like broken telemetry or a miracle of caching. It is neither: on R2, *Data Retrieved is the Infrequent Access retrieval-fee meter*. Standard-class objects report zero there by definition, because there is no retrieval fee to meter.\n\n> **Do not read \"Data Retrieved: 0 B\" as \"no bytes were served.\"** It is a billing meter for one storage class, not an egress counter. Egress is free on R2 and therefore not metered here at all.\n\n### And the CDN analytics that could do it, won't\n\nZone-level analytics is the other reflex. It has a path dimension in principle, but it is plan-gated, and on the free tier the retention window is a rolling few days rather than history. Verify your own plan through the analytics settings-discovery endpoint rather than assuming a number — but the structural point holds regardless of what you find: **a rolling window cannot accumulate a launch-to-date total.** Even a generous retention only ever tells you about recent traffic.\n\nSo: no per-object breakdown, and no history. Both roads are closed.\n\n## The fix: a redirect counter you own\n\nPoint the *website's* download link at your own endpoint. It records the click and redirects to the real file.\n\n```js\n// GET /download?src=landing|beta\ndownloads.get('/', async (c) => {\n  const source = sourceSchema.parse(c.req.query('src'));   // enum + .catch(default)\n  const withinLimit = checkRateLimit(`download:${ip}`, 10, 60);\n\n  // HEAD is a link-checker or a prefetch, not a person getting the app.\n  if (c.req.method === 'GET' && withinLimit) {\n    try {\n      await pool.query(\n        `insert into download_clicks (source, count) values ($1, 1)\n         on conflict (occurred_on, source)\n         do update set count = download_clicks.count + 1`, [source]);\n    } catch (err) {\n      reportError(err);   // bookkeeping failed; the download must not\n    }\n  }\n\n  c.header('Cache-Control', 'no-store');\n  return c.redirect(INSTALLER_URL, 302);   // 302. NEVER 301. See below.\n});\n```\n\nFour properties do the work, and each one is a decision:\n\n**1. 302, never 301.** This is the trap. A permanent redirect is cacheable by default and browsers honour it aggressively — often for the life of the profile. Cache it once and every subsequent download from that browser goes straight to the file, never touching your handler again. Your counter then reports early adopters forever and flatlines, which is indistinguishable from genuine failure and will be believed, because a flat line is what you feared. Add `Cache-Control: no-store` too, for anything that caches by header rather than by status code.\n\n> Note on evidence: the 301-caching hazard is standard HTTP caching semantics and was **designed against**, not observed breaking. The R2 metric limitations above *were* measured.\n\n**2. Bookkeeping failure must never break the download.** Unknown `src`, tripped rate limit, database unreachable — every path still ends in the redirect. Counting is best-effort; the download is the product. Note the schema uses a `.catch(default)` rather than throwing on a bad value, for the same reason.\n\n**3. The source parameter is an enum, not free text.** It lands in a column. An open string from a query string is how a query string becomes a storage-injection surface.\n\n**4. It is an `<a href>` navigation, not a `fetch`.** So it is not a CORS request, needs no allowlist entry, and keeps the browser's native download handling. Resist \"improving\" it into a fetch: you would gain a CORS requirement and lose the download.\n\n## What NOT to route through it\n\n**Leave your auto-updater on the direct URL.** This is the judgement call that matters most, and the instinct to \"count everything\" is wrong here.\n\nAn updater fetching a manifest and a versioned binary is a library user-agent hitting a CDN, which is already a fragile path — see [bot-challenge-blocks-your-auto-updater.md](./bot-challenge-blocks-your-auto-updater.md), where the same host 403s `reqwest` and curl while serving browsers fine, and OTA survives by coincidence of user-agent rather than by configuration. Inserting a redirect into that path risks breaking every install's ability to update, **silently** (updater check-failures are deliberately quiet), in exchange for a number you can get better elsewhere.\n\nThe clean split:\n\n- **Downloads are website traffic.** Count them at the link.\n- **Updates and active use are app traffic.** Count them with an in-app ping, which tells you what versions are actually live — see [privacy-shaped-usage-analytics.md](./privacy-shaped-usage-analytics.md).\n\nThose answer different questions anyway. Downloads measure *intent*; opens measure *use*. Conflating them is how you end up proud of a download count that never became a user.\n\n## Store a tally, not an event log\n\nThe table is three columns:\n\n```sql\ncreate table download_clicks (\n  occurred_on date   not null default (now() at time zone 'utc')::date,\n  source      text   not null,\n  count       bigint not null default 0,\n  primary key (occurred_on, source)\n);\n```\n\nOne row per day per link, incremented. Not one row per click with a timestamp and an IP.\n\nThis is not premature optimisation, it is scope control. A per-click log with timestamps is a behavioural record of when people discover your product, and it will sit in your database for years being a liability nobody chose. The tally answers \"how many downloads on day X, from which link\" and is *structurally incapable* of answering anything else. Rate-limit on IP, then discard the IP; give it no column to land in.\n\n## The measured case\n\nA Windows desktop app, launched with the download link pointing straight at R2, no instrumentation of any kind. Two weeks later the state of knowledge was:\n\n| question | answer available |\n|---|---|\n| How many downloads? | **none** — pooled into bucket-wide reads dominated by update polls |\n| How many people opened it? | 5 installs (an in-app ping added later) |\n| Which version are they on? | all on the current release |\n| Did the website work? | 280 visits / 290 page views, all Core Web Vitals green |\n\nThe funnel that emerged once both counters existed: **280 site visits → 6 sign-ins → 5 installs opening the app → 1 outside person who created anything.** Every one of those numbers is cheap to collect and none of them existed at launch.\n\n**The retroactive part is the cost.** The counter starts at zero on the day you deploy it. Two weeks of downloads were unrecoverable, because the data needed to reconstruct them was never retained by anything. This is the entire argument for wiring it before launch rather than after.\n\n## Checklist\n\n1. **Before launch**, point the public download link at your own endpoint, not the bucket.\n2. **302 + `Cache-Control: no-store`.** Grep your codebase for `301` near any redirect you intend to count.\n3. **Every failure path still redirects.** Write the test that pulls the database down and confirms the file still downloads.\n4. **Bounded enum for the source param**, defaulted rather than thrown.\n5. **Leave the updater on the direct URL** and count active installs in-app instead.\n6. **Tally, not log.** Day grain, no identifier, no IP column.\n7. **Confirm what your storage metrics actually mean** before trusting a zero. Retrieval-fee meters, egress counters, and request counts are three different things.\n\n## Anti-patterns\n\n- ❌ **Reading bucket-wide request counts as download counts.** They are dominated by whatever polls most often, which is usually your own updater.\n- ❌ **301 on a counted redirect.** Cached, invisible, and it fails in the direction you will believe.\n- ❌ **Routing the auto-updater through the counter.** Risks silent OTA death to learn something an in-app ping answers better.\n- ❌ **Proxying the file bytes through your server** to count them. You pay egress and add a failure point in front of your own installer, to increment an integer.\n- ❌ **Waiting until you \"have users\" to add it.** The counter only ever knows the future. The cheapest day to add it is before the first release.\n- ❌ **Believing a flat counter without checking the redirect status.** Flat is the expected symptom of both \"no downloads\" and \"cached 301.\"\n\n## Related\n\n- [bot-challenge-blocks-your-auto-updater.md](./bot-challenge-blocks-your-auto-updater.md) — why the updater's path is fragile and must not be rerouted; same CDN, adjacent failure.\n- [privacy-shaped-usage-analytics.md](./privacy-shaped-usage-analytics.md) — the other half of the funnel: counting *use* rather than *intent*, without building a behavioural log.\n- [signed-but-flagged-download-reputation.md](./signed-but-flagged-download-reputation.md) — download *volume* under a stable signing identity is what clears SmartScreen/Chrome reputation warnings, which is another reason to actually know the number.\n- [instrument-before-patching.md](./instrument-before-patching.md) — the debugging-side sibling: when a system's decisions are invisible, add the trail rather than another patch."}, {"id": "cross-boundary-dev-events.md", "title": "Cross-boundary dev events — observability across Rust ↔ TS", "kind": "pattern", "last_verified": "2026-05-15", "stack": ["tauri", "electron", "capacitor", "rust", "typescript"], "groups": ["Languages", "Platforms & Runtimes"], "description": "Structured dev-event ring buffer that captures events from both sides of the Rust ↔ TS boundary. Catches silent failures (swallowed errors, missed setters, hidden 200-with-rejection responses) that `console.log` can't because it dies the moment F12 closes.", "content": "# Cross-boundary dev events — observability across Rust ↔ TS\n\n> Silent failures across the IPC boundary kill productivity. `console.log` survives until you close F12 and disappears forever. The pattern below is a structured, in-app ring buffer that captures events from BOTH sides of the boundary, survives panel closure, and turns silent bugs into discoverable ones.\n\n## The Problem\n\nApps with a frontend talking to a backend over IPC have three observability gaps that compound:\n\n1. **Backend logs you can't see.** Rust's `eprintln!`, Go's `log.Println`, Python's `print` — all go to a terminal you're not watching while clicking around the UI.\n2. **`console.log` that vanishes.** Open F12, see a log, close F12 to test something — the next log message lives in a dev-tools panel nobody is looking at.\n3. **Swallowed errors.** `.catch(() => {})` on fire-and-forget IPC calls is a common pattern. Errors die there silently for months until someone instruments.\n\nConcrete bugs we shipped behind this:\n- A Zod schema mismatch in an outbox writer threw on every single call. Wrapped in `.catch(() => {})`. Hid for **weeks** until manual instrumentation surfaced it.\n- A Rust sync push silently returned `Ok(())` after rejecting half the chunks. The HTTP error was in `eprintln!` which scrolled past the terminal we'd stopped watching.\n- A React `setInterval` ran `setState(...)` for one piece of state but not another. UI showed stale data; no error anywhere. Found only by adding event taps to both the source and the sink.\n\n## The Pattern: structured ring buffer + Tauri event bridge\n\nBoth sides of the IPC boundary write into a shared in-memory event ring buffer that the in-app debug screen renders live. The Rust side emits a Tauri event; the TS side has both a listener (Tauri → ring buffer) and a direct push function (`pushDevEvent`).\n\n```\n┌──────────────────────┐      tauri.emit(\"dev_log\", payload)       ┌─────────────────────┐\n│ Rust commands        │ ───────────────────────────────────────►  │ devLogListener.ts   │\n│   emit_dev_log(...)  │                                            │  pushDevEvent(...)  │\n└──────────────────────┘                                            └─────────┬───────────┘\n                                                                              │\n┌──────────────────────┐                                                      │\n│ React feature code   │                                                      ▼\n│   pushDevEvent(...)  │ ──────────────────────────────────────────► ┌─────────────────────┐\n└──────────────────────┘                                              │ debugStore (ring     │\n                                                                      │ buffer, max 500)     │\n                                                                      └─────────┬───────────┘\n                                                                                │\n                                                                                ▼\n                                                                      ┌─────────────────────┐\n                                                                      │ DebugScreen — live   │\n                                                                      │ log view + clear     │\n                                                                      └─────────────────────┘\n```\n\nThe ring buffer lives at module scope (not React state) so events from the Rust side that arrive before any component mounts still get captured. The debug screen subscribes via `useSyncExternalStore`.\n\n---\n\n## TypeScript side: ring buffer + listener\n\n### Event shape (shared between Rust and TS)\n\n```typescript\n// features/debug/types.ts\nexport type DevLogLevel = 'info' | 'warn' | 'error' | 'success';\n\nexport interface DevLogEvent {\n  timestamp: number;       // ms since epoch\n  level: DevLogLevel;\n  category: string;        // \"sync-outbox\", \"hotkey\", \"exe-map\", \"db\" — short tag\n  message: string;\n  data?: unknown;          // optional structured payload for click-to-expand\n}\n```\n\n### Ring buffer\n\n```typescript\n// features/debug/debugStore.ts\nimport { useSyncExternalStore } from 'react';\n\nconst MAX_EVENTS = 500;\n\nlet events: DevLogEvent[] = [];\nconst subscribers = new Set<() => void>();\n\nexport function pushDevEvent(event: DevLogEvent): void {\n  events = [event, ...events].slice(0, MAX_EVENTS);\n  subscribers.forEach((cb) => cb());\n}\n\nfunction getSnapshot() { return events; }\nfunction subscribe(cb: () => void) {\n  subscribers.add(cb);\n  return () => subscribers.delete(cb);\n}\n\nexport function useDevEvents(): DevLogEvent[] {\n  return useSyncExternalStore(subscribe, getSnapshot, getSnapshot);\n}\n```\n\nThree details that matter:\n- **Module-level state, not React state.** Events from Rust can arrive before any component mounts — usually during the first 50ms of app load. Module state captures them; React state would lose them.\n- **Newest-first array (not a queue).** Makes log views trivial — no `.reverse()` per render.\n- **Cap at ~500 events.** Unbounded growth is fine for a brief session but a long-running app accumulates memory. 500 is the right size to cover one bug-hunt without truncating useful context.\n\n### Tauri event listener (Rust → TS bridge)\n\n```typescript\n// features/debug/devLogListener.ts\nimport { listen } from '@tauri-apps/api/event';\nimport { pushDevEvent } from './debugStore';\n\nexport async function startDevLogListener() {\n  return listen<{\n    level?: string;\n    category?: string;\n    message?: string;\n    data?: unknown;\n  }>('dev_log', (event) => {\n    const payload = event.payload ?? {};\n    pushDevEvent({\n      timestamp: Date.now(),\n      level: normalizeLevel(payload.level),  // tolerant of malformed Rust payloads\n      category: typeof payload.category === 'string' ? payload.category : 'rust',\n      message: typeof payload.message === 'string' ? payload.message : '(no message)',\n      data: payload.data,\n    });\n  });\n}\n```\n\nMount this once in the App shell — gated on `import.meta.env.DEV` so it disappears entirely in production via Vite tree-shaking.\n\n---\n\n## Rust side: emit_dev_log helper\n\n```rust\n// commands/process_watch.rs (or wherever your first feature lands)\nuse serde_json::{json, Value as JsonValue};\nuse tauri::{AppHandle, Emitter};\n\n/// Emit a structured event into the in-app Debug screen pipeline.\n/// `pub(crate)` so sibling modules can mirror their eprintln chatter\n/// into the Debug screen (hotkey handler, sync push, etc).\npub(crate) fn emit_dev_log(\n    app: &AppHandle,\n    level: &str,\n    category: &str,\n    message: String,\n    data: Option<JsonValue>,\n) {\n    let _ = app.emit(\n        \"dev_log\",\n        json!({\n            \"level\": level,\n            \"category\": category,\n            \"message\": message,\n            \"data\": data,\n        }),\n    );\n}\n```\n\nThree details that matter:\n- **`pub(crate)` not `pub`.** This is dev infra, not a public API. Sibling modules can use it; outside callers can't.\n- **Ignore the `Result`.** `let _ = app.emit(...)`. If the event channel is broken, the dev log being silent is the least of your worries — and we don't want production panics on a logging error.\n- **Mirror, don't replace.** Keep your `eprintln!` / `tracing::info!` calls. The terminal log is still useful (cargo dev mode, CI logs, crash reports). `emit_dev_log` adds an in-app view; it doesn't subtract the terminal view.\n\n### Calling pattern\n\n```rust\nemit_dev_log(\n    &app,\n    \"success\",\n    \"hotkey\",\n    format!(\"Overlay window built for appid={}\", appid),\n    Some(json!({ \"appid\": appid })),\n);\n```\n\nOr with `error` for failures:\n\n```rust\nmatch build_result {\n    Ok(_) => emit_dev_log(&app, \"success\", \"hotkey\", \"Overlay built\".into(), None),\n    Err(e) => emit_dev_log(&app, \"error\", \"hotkey\", format!(\"Overlay build FAILED: {}\", e), None),\n}\n```\n\n---\n\n## TypeScript side: in-feature instrumentation\n\nOutside the Rust bridge, the TS side can `pushDevEvent` directly from feature code. This is where you instrument silent-fail paths:\n\n```typescript\n// features/sync/outbox.ts — instrument the fire-and-forget trackChanges\nexport async function trackChanges(table: string, rowId: number, fields: FieldChange[]) {\n  try {\n    await emitOutboxRows(table, rowId, fields);\n    pushDevEvent({\n      timestamp: Date.now(),\n      level: 'success',\n      category: 'sync-outbox',\n      message: `trackChanges ${table}#${rowId} emitted ${fields.length} field(s)`,\n      data: { table, rowId, fields: fields.map((f) => f.field) },\n    });\n  } catch (err) {\n    pushDevEvent({\n      timestamp: Date.now(),\n      level: 'error',\n      category: 'sync-outbox',\n      message: `trackChanges ${table}#${rowId} FAILED: ${String(err)}`,\n      data: { table, rowId, error: String(err) },\n    });\n    throw err;  // re-throw — instrumentation should not swallow\n  }\n}\n```\n\nThe **re-throw after logging** is important. The original `.catch(() => {})` swallowed errors. Replacing it with instrumentation that ALSO swallows just makes the bug instrument-visible but still production-broken. Log + re-throw turns the dev-event into a \"this errored\" signal AND keeps the error path live for upstream handling.\n\n---\n\n## What this caught for us\n\nReal bugs found by adding `pushDevEvent` / `emit_dev_log` calls, that had been silently broken for weeks:\n\n1. **Zod camelCase remap trap** — A select helper auto-converted snake_case columns to camelCase. The Zod schema still expected snake_case. Threw `expected number, received undefined` on every call. The `.catch(() => {})` swallowed it. Surfaced the instant we added `pushDevEvent` inside the catch block.\n2. **Worker push silently rejecting half the chunks** — Sync push HTTP responses included a 200 OK with a body containing per-row rejection arrays. Rust code only checked status code; rejections weren't surfaced. Added `emit_dev_log` for chunk responses including rejection counts — bug became obvious within one push cycle.\n3. **`setInterval` updating only half the state** — A status-poll interval called `setState(...)` for one variable but never `setLastSync(...)`. UI showed stale timestamps. No error anywhere. Found by event-tapping both the interval tick AND the IPC response — the responses showed fresh data, the UI didn't reflect it, narrowed to the missing setter call.\n\nThe general pattern: **any boundary where you don't directly see the data flowing should have an event tap.** It's cheap (~5 lines of code per tap), zero production cost (tree-shaken via `import.meta.env.DEV`), and pays for itself the first time a silent bug surfaces.\n\n---\n\n## When to instrument vs not\n\n**Instrument:**\n- Any IPC call where errors could be silently caught\n- Any background interval / scheduled task whose execution you don't visually observe\n- Any sync/network boundary (push, pull, retry paths)\n- Any \"fire and forget\" pattern in your codebase (`.catch(() => {})` is the smell)\n- Hot paths that surprise you when they fire too often (e.g. \"why did this trigger 12 times?\")\n\n**Don't instrument:**\n- Pure functions (their output is observable from the call site)\n- Render-path code (React DevTools handles this better)\n- Anything that fires hundreds of times per second — the ring buffer will fill with noise. If you really need it, sample (`if (Math.random() < 0.05)` or `if (counter % 50 === 0)`).\n- Anything that requires you to log sensitive data to reproduce (PII, auth tokens). Find another way.\n\n---\n\n## What NOT to do\n\n- **Don't use `console.log` for cross-boundary observability.** It works until you close DevTools, then evaporates. The whole point of the ring buffer is to survive panel closure.\n- **Don't ship the debug screen in production.** Gate every entry point on `import.meta.env.DEV` (Vite), `process.env.NODE_ENV === 'development'` (Webpack), or equivalent. Vite tree-shakes the entire feature directory if the imports are all dev-gated.\n- **Don't write the ring buffer to disk on every event.** It's a debugging tool, not an audit log. If you need persistent logs, write a separate file appender on a debounce — don't make every event hit `fs.writeFileSync`.\n- **Don't swallow errors AND instrument them.** Re-throw after logging. The instrumentation is supposed to make the error visible, not \"tame\" it.\n- **Don't let categories proliferate without a list.** \"sync-outbox\", \"hotkey\", \"exe-map\", \"db\" — keep the set small. If you have 30 categories, the filter UI is useless. Cap at ~10–15 and group narrower events under broader category tags.\n\n---\n\n## Reference implementation layout\n\nBuilt in a Tauri 2 + React + TS desktop app. File layout in a project of that shape:\n\n- TS ring buffer + hook: `packages/frontend/src/features/debug/debugStore.ts`\n- Tauri → TS bridge listener: `packages/frontend/src/features/debug/devLogListener.ts`\n- Event types (shared with Rust JSON): `packages/frontend/src/features/debug/types.ts`\n- In-app log viewer: `packages/frontend/src/features/debug/DebugScreen.tsx`\n- Rust `emit_dev_log` helper: `apps/desktop/src-tauri/src/commands/process_watch.rs` (lives wherever the first feature needs it; siblings re-use via `pub(crate)`)\n\nMount the Tauri listener once in your app shell, gated on dev mode:\n\n```typescript\n// App.tsx\nuseEffect(() => {\n  if (!import.meta.env.DEV) return;\n  let unlisten: (() => void) | undefined;\n  startDevLogListener().then((u) => { unlisten = u; });\n  return () => unlisten?.();\n}, []);\n```\n\nTotal cost: ~200 lines of code across 4 files. Zero production cost (tree-shaken). Pays for itself the first time a silent bug surfaces — which, in practice, has been within the first week of having it."}, {"id": "crossfade-luminance-gap-and-view-transitions.md", "title": "A cross-fade \"flash\" is a luminance gap, not a visibility problem", "kind": "gotcha", "last_verified": "2026-07-28", "stack": ["css", "react", "animation", "web-platform"], "groups": ["Frameworks & Libraries", "Languages", "Other"], "description": "Two transparent layers cross-fading at the same rate never sum to full coverage, so ~25% of the page background shows through the middle of every screen transition and reads as a flash. Includes the diagnostic that separates it from the visibility problem (shorten only the outgoing layer), why no amount of timing fixes it, why the obvious structural fix — opaque + stacked — kills the flash but converts it into apparent input latency (measured live, not theoretical), and how the View Transitions API removes the trade entirely by compositing opaque snapshots. Plus which variant you actually want (same-document, not cross-document) and the React &lt;19 `flushSync` caveat.", "content": "# A cross-fade \"flash\" is a luminance gap, not a visibility problem\n\n**One-liner:** two transparent layers cross-fading at the same rate never sum to full coverage, so your page background shows through the middle of every screen transition and reads as a flash — speeding up the outgoing layer doesn't fix it, making both layers opaque does but trades the flash for apparent input latency, and the View Transitions API removes the trade entirely because it composites opaque snapshots instead of live layers.\n\n## The setup that produces it\n\nThe standard SPA screen-switcher: every screen is an absolutely-positioned sibling, all mounted (so state and scroll survive), the active one at `opacity: 1` and the rest at `0`, all sharing one transition.\n\n```jsx\n<div className={`absolute inset-0 transition-all duration-280 ease-out\n                 ${active ? 'opacity-100' : 'opacity-0 translate-y-1'}`}>\n```\n\nThis looks correct and is what almost everyone writes.\n\n## The math\n\nThe containers are **transparent**, so the page background is a third participant. Compositing top-to-bottom:\n\n```\nresult = C_in·α_in  +  (1 − α_in)·[ C_out·α_out  +  (1 − α_out)·C_bg ]\n```\n\nWith both layers on the same curve, at the midpoint `α_in ≈ 0.56`, `α_out ≈ 0.44`:\n\n```\nresult = 0.56·C_in + 0.19·C_out + 0.25·C_bg\n```\n\n**A quarter of the page background is showing through the middle of every transition.** If your background is near-black and your screens have content brighter than it (they do), the composite dips darker and then recovers. That pulse is the \"flash.\" It is a *luminance* artifact, not a visibility one.\n\n## The diagnostic that separates the two defects\n\nThere are genuinely two things wrong with the naive cross-fade, and they need different fixes. Tell them apart by shortening **only the outgoing** layer:\n\n- **Ghost clears sooner, pulse gone** → you only had the visibility problem.\n- **Ghost clears sooner, pulse remains** → the luminance gap, which timing cannot fix.\n\nWorth computing per frame rather than eyeballing. With both layers at `duration-280 ease-out`, the visible ghost of the outgoing screen — `(1 − α_in)·α_out` — runs 0.64 at frame 1, 0.19 at frame 4, 0.03 at frame 8, and is still nonzero at frame 10 (~167ms at 60fps).\n\n**Where it becomes obvious:** when the destination doesn't occupy the same area as the source. A centred/narrow screen (a settings page, a modal-ish view) leaves margins where the outgoing full-width screen is completely unmasked, and the wider the display the larger those margins. The same transition is invisible on a laptop and glaring on an ultrawide — which is why it survives review for years.\n\n## Fix A — asymmetric durations (partial)\n\nDrop the outgoing layer to ~120ms, keep the incoming at 280ms:\n\n```jsx\nactive ? 'duration-280 opacity-100' : 'duration-120 opacity-0'\n```\n\nGhost clears by frame 5 instead of frame 10. Cheap, no structural change, and a real improvement. **It does not remove the flash**, because the gap is still there — it's just narrower.\n\n## Fix B — opaque and stacked (fixes the flash, introduces latency)\n\nPaint the containers opaque and put the incoming one on top, so the outgoing holds at full opacity underneath until it's covered:\n\n```jsx\nconst base = 'absolute inset-0 bg-[var(--background)] transition-all ease-out';\nactive ? `${base} z-10 duration-280 opacity-100`\n       : `${base} z-0 duration-0 delay-280 opacity-0`   // holds, then drops hidden\n```\n\nTotal coverage is 1 at every instant. No background bleed, no dip, only one pair of layers ever blending. **The flash is genuinely gone.**\n\n**And it feels broken.** Reported immediately in testing as: *\"the transition takes too long to even start now, feels like latency — it's like I click and then a quarter second later it changes.\"*\n\nThe cause is inherent, not a tuning miss: with the outgoing layer held at `opacity: 1`, the first frames are ~80% old screen (the incoming is only at 0.20 by frame 1 on a 280ms ease-out), so **nothing appears to happen for ~4 frames**. The transparent version changed the frame immediately precisely *because* the old layer was already dropping — the same property that caused the flash was also what made it feel responsive.\n\n### The trade, stated plainly\n\n| Approach | Flash | Perceived start |\n|---|---|---|\n| Transparent cross-fade | ✗ background gap | ✓ instant |\n| Opaque cover-up | ✓ none | ✗ dead first beat |\n\n**Untried middle worth trying before reaching for Fix C:** keep opaque + stacked (which kills the gap structurally) but drop the *incoming* duration to ~140–160ms so the change registers within 2–3 frames. The failed attempt above kept 280ms in, and that is what made it feel slow.\n\n## Fix C — View Transitions API (removes the trade)\n\n```js\ndocument.startViewTransition(() => updateTheDOM());\n```\n\nThe browser snapshots the old and new states as **opaque full-frame images** and cross-fades *those* above the live DOM. That gives both properties at once:\n\n- **No background gap** — the old snapshot is an opaque picture of the entire viewport, so there's nothing to punch through. (Fix B's goal.)\n- **Immediate perceived start** — the old snapshot begins fading at frame 1. (Fix B's casualty.)\n\nIt's also compositor-work on textures rather than two animating DOM trees, which matters on low-end integrated graphics.\n\n**Same-document, not cross-document.** These are different features and the names mislead. *Cross-document* (`@view-transition { navigation: auto }`) fires only on real URL navigation between two documents — irrelevant to an SPA, and completely irrelevant to a desktop shell with no URLs at all. *Same-document* is `document.startViewTransition()`, and that's the one for a state-driven screen switcher.\n\n**Caveats worth knowing before you commit:**\n\n1. **The DOM update must be synchronous inside the callback.** Frameworks that batch state updates need an escape hatch — in React before 19 that's `flushSync(() => setScreen(s))`. React 19 ships a `<ViewTransition>` component that removes the workaround, so this feature is a real argument in an upgrade discussion rather than a nice-to-have.\n2. **Remove your existing CSS transitions on those containers**, or both animations run and fight.\n3. **Reduced motion needs explicit wiring.** The default cross-fade is animation; if your app has its own motion-preference system (not just the media query), bridge it — see `motion-design-token-system.md`, which covers why a media query alone under-covers.\n4. Availability: same-document view transitions reached **Baseline \"Newly available\" on 2025-10-14**. Chromium (Chrome/Edge) from 111, WebKit from Safari 18, Gecko later still — sources disagree on the exact Firefox version, so check before relying on it there. Chromium-based webviews (Electron, Tauri's WebView2) inherit it, so desktop shells have had it since well before the web-at-large baseline. Note Firefox's initial implementation omitted view-transition *types*.\n\n## The meta-lesson\n\nThe instinct on a transition artifact is to reach for timing — make it faster, change the curve, add a delay. Both of the first two fixes here are timing fixes and neither solves the actual problem, because **the problem is compositing**. When an animation artifact survives every duration you try, stop tuning and write down what is actually on screen at the midpoint, layer by layer, with alphas. The arithmetic usually names the bug in one line.\n\nAnd it's worth asking early whether the platform already does this, because for the \"swap one full-screen view for another\" case it now does, natively and better.\n\n## What NOT to do\n\n- **Don't fix a cross-fade flash with timing.** If shortening the outgoing layer clears the ghost but leaves the pulse, no duration will help — the gap is structural.\n- **Don't hold the outgoing layer at full opacity to close the gap** without checking perceived responsiveness. It works, and it converts your flash into apparent input lag, which is worse.\n- **Don't test screen transitions only on the display you develop on.** A centred destination on a wide monitor unmasks the outgoing screen in the margins; the identical code looks fine on a laptop.\n- **Don't reach for cross-document view transitions in an SPA.** They require real URL navigation between documents. Same-document is the SPA feature.\n- **Don't assume `startViewTransition` composes with your existing CSS transitions.** Take yours out, or you'll be debugging two animation systems arguing about one property."}, {"id": "db-backed-auth-503-not-401.md", "title": "DB-backed session auth: a store outage must not answer 401, or every client \"gets signed out\" at once", "kind": "gotcha", "last_verified": "2026-07-23", "stack": ["node", "postgres", "http-api", "auth", "local-first"], "groups": ["Auth & Security", "Cloud & Backend", "Data & Sync", "Platforms & Runtimes"], "description": "When session verification moves from stateless (JWT signature) to stateful (opaque token in a sessions table), \"verify threw\" gains a second meaning: the catch-all `→ 401` that was safe for a JWT now converts a DB blip into a mass \"everyone got signed out\" incident. Tag store failures `transient` in the verifier, map them to 503 in EVERY http-facing caller (audit the copy-pasted inline guards), and keep the client tri-state (`valid/invalid/unreachable`) where only a literal 401 tears down session state. Applies to any auth check that does I/O (Redis sessions, OIDC introspection, entitlement gates).", "content": "# DB-backed session auth: a store outage must not answer 401, or every client \"gets signed out\" at once\n\n## Symptom\n\nYou migrate session verification from something stateless (a signed JWT checked\nin-process) to something stateful (an opaque token looked up in a sessions\ntable — the Lucia / Copenhagen-Book model). Everything works in testing. Then\nthe database has a blip — a failover, a connection-pool exhaustion, a deploy\nhiccup — and **every signed-in client simultaneously reports \"session expired,\nplease sign in again.\"** Users re-authenticate (or worse, can't, because the\nstore is still down), support lights up, and the incident reads like a mass\ncredential wipe when nothing about the sessions actually changed.\n\n## Cause\n\nStateless verification has a one-dimensional error space: the token is either\nvalid or it isn't. A signature check cannot *transiently* fail, so mapping\n\"verify threw\" → `401 Unauthorized` is safe, and most codebases write exactly\nthat:\n\n```js\ntry {\n  ctx.userId = await verifySession(token);\n} catch {\n  return unauthorized(); // fine for a JWT — fatal once verify can FAIL TRANSIENTLY\n}\n```\n\nThe moment verification involves I/O, the error space gains a second axis:\n**\"this credential is bad\" vs \"I currently cannot know.\"** The catch-all keeps\ncompiling and keeps passing every test you're likely to write (nobody unit-tests\n\"Postgres is down\"), but it now converts infrastructure weather into an\nauthentication verdict. Clients dutifully do what a 401 means: they discard the\nsession state and flip to signed-out UX.\n\nThe blast radius is worst in local-first apps, where the client deliberately\ntreats a stored session as durable truth: one bogus 401 doesn't just show a\nbanner, it tears down sync state the user then has to rebuild by re-authing.\n\n## Fix\n\nSplit the two failure axes at the lowest layer and preserve the split through\nevery caller:\n\n1. **In the verifier**, tag store failures so callers can distinguish them:\n\n```js\nexport async function verifySession(token) {\n  let rows;\n  try {\n    ({ rows } = await pool.query(SELECT_LIVE_SESSION, [hash(token)]));\n  } catch (e) {\n    const err = new Error(`session store unavailable: ${e.message}`);\n    err.transient = true; // infrastructure, not a verdict\n    throw err;\n  }\n  if (rows.length === 0) throw new Error('unknown, expired, or revoked session');\n  return rows[0].user_id;\n}\n```\n\n2. **In every HTTP-facing caller** (middleware, per-route guards, write-path\n   authenticators), map the tag: transient → `503` (or let it bubble to the\n   generic `500`), everything else → `401`. Audit ALL of them — the copy-pasted\n   inline guard someone wrote before the middleware existed is the one that\n   will keep collapsing both cases.\n\n3. **In the client**, make session validity a tri-state, not a boolean:\n   `valid | invalid | unreachable`. Only a literal `401` means the session is\n   dead; network errors and 5xx mean \"keep trusting the stored session and try\n   again later.\" A local-first app should stay quiet and fully functional\n   through `unreachable`.\n\n```ts\nif (res.ok) return 'valid';\nif (res.status === 401) return 'invalid';   // the ONLY signed-out signal\nreturn 'unreachable';                        // 5xx/network: trust the stored session\n```\n\nThe server and client halves are one contract: the server promising \"401 is a\nverdict, never weather\" is what makes the client's `invalid` branch safe to act\non destructively.\n\n## Notes\n\n- This failure mode is invisible until the first real DB blip in production —\n  which is exactly when you least want a novel incident. It was caught at\n  design time here only because the client tri-state already existed (a prior\n  bug fix) and the server migration had to answer \"which status keeps the\n  tri-state honest?\"\n- Same reasoning applies to any auth dependency that can transiently fail:\n  Redis session caches, OIDC introspection endpoints, entitlement lookups that\n  gate requests. If the check does I/O, \"check failed\" has two meanings and\n  needs two status codes.\n- Corollary for the migration itself: when you cut over from JWTs to the store,\n  old tokens missing the lookup SHOULD 401 (that's a real verdict — the\n  credential is dead by design). The one-time forced re-sign-in is the honest\n  path; keeping a legacy-accept branch \"to be gentle\" leaves two verifiers\n  alive indefinitely."}, {"id": "derive-dont-track-ui-flags.md", "title": "State with N reset paths WILL get stuck — derive it instead", "kind": "pattern", "last_verified": "2026-07-27", "stack": ["react", "frontend", "state-management", "data-modelling"], "groups": ["Frameworks & Libraries", "Other"], "description": "A boolean UI flag with more than a couple of reset paths (back button, Escape, nav-away, races...) will eventually get stuck true on the path someone forgot. Fix: derive it from state that's already correctly maintained, eliminating the reset action entirely. Same shape applies in the DATABASE: store when a rule was established and invalidation becomes a WHERE clause, deleting the listeners, the cleanup job and the race — and it works retroactively and across devices.", "content": "# State with N reset paths WILL get stuck — derive it instead\n\n*(Written first about UI flags; the same shape shows up in the database, see \"The same shape in your data model\" below.)*\n\n**One-liner:** if a boolean UI flag has to be explicitly cleared on more than a couple of exit paths (back button, Escape, outside-click, nav-away, a cancel button, a race with another action...), it will eventually get stuck true on whichever path someone forgets to wire up. The fix isn't \"find and patch the missing path\" — it's eliminating the reset action entirely by **deriving** the flag from state that's already correctly maintained elsewhere.\n\n## The failure shape\n\nA flag like `modalObscuringBackground` or `detailViewBlockingLibrary` starts as its own `useState`, set `true` on open and expected to be set `false` on close. Fine, until close turns out to have more than one door:\n\n- Back button\n- Escape key\n- Clicking outside\n- A sidebar navigation that jumps away without going through the normal close handler\n- Browser/router `popstate`\n- A \"quit\" or \"cancel\" ritual with its own code path\n- A race: the user triggers a new open while an old close is still mid-animation\n\nEvery one of these needs to remember to clear the flag. Miss any single one and the UI gets stuck in the blocked/obscured/locked state — usually intermittently, usually only on the path nobody tested last, and usually patched 3-5 times across separate sessions because each fix addresses the ONE path that was just discovered broken, not the shape of the bug.\n\n## The fix: derive, don't track\n\nAsk: is there already OTHER state in the component that's true exactly when this flag should be true, and false exactly when it shouldn't? If yes, delete the flag and compute it:\n\n```ts\n// BEFORE — an independent boolean every exit path must remember to clear\nconst [obscured, setObscured] = useState(false);\n// ...open path: setObscured(true)\n// ...close path A: setObscured(false)\n// ...close path B: (forgot!) — obscured stays stuck true forever\n\n// AFTER — derived from state that's already correctly set/cleared elsewhere\nconst obscured = selectedItemId !== null && !isClosing;\n```\n\n`selectedItemId` and `isClosing` both already have to be correct for the rest of the feature to work (the detail view can't render without `selectedItemId`; the close animation can't run without `isClosing`). Riding on state that already has to be right means there's no THIRD piece of state that can independently drift out of sync — the \"forgot to clear it on path N\" bug class is structurally impossible, because there's no clear-action left to forget.\n\n## The same shape in your data model: derive invalidation, don't handle it\n\nThe principle isn't about React, or booleans, or even UI. It's about **any stored fact that N different code paths are each responsible for clearing.** The database version is the same bug with a longer memory: a stale flag in a component dies on refresh, a stale flag in a row is wrong forever.\n\nThe canonical shape: a feature that promises \"remind me about this in two weeks — unless I come back on my own first.\" The obvious implementation stores `remind_at` and then has to *notice* the coming-back:\n\n- a listener on the app's own \"user did the thing\" path\n- another on the background/OS watcher that detects it happening outside the app\n- another on a manual entry the user creates by hand\n- another on the sync path, because it might have happened on their other device\n- a scheduled job to clean up reminders that are no longer relevant\n- and a race to reason about, between \"they came back\" and \"the reminder fired\"\n\nSix things to get right, and every one you miss produces the exact failure the feature exists to avoid: nagging someone who already came back.\n\n**The derived version stores one more timestamp and deletes all six.** Alongside *when it fires*, store *when the promise was made*:\n\n```sql\n-- reminder_at      when the nudge should surface\n-- reminder_set_at  when the user asked for it\n\n-- \"is this reminder still valid?\" — no listener, no job, no race\nWHERE reminder_at IS NOT NULL\n  AND (last_played_at IS NULL OR last_played_at <= reminder_set_at)\n```\n\n`last_played_at` was already maintained, for other reasons, by machinery that already had to be correct. Coming back moves it past `reminder_set_at`, and the reminder stops being valid **by construction** — not because anything observed the return and reacted to it.\n\nWhat this buys, beyond fewer lines:\n\n- **No missed events.** There is no subscriber to forget to register on the seventh path that means \"came back.\"\n- **No cleanup job.** Invalid rows aren't garbage to collect; they're just rows the predicate stops matching.\n- **No race.** \"Came back\" and \"fired\" can't interleave wrongly, because firing is a read of current state rather than a scheduled action queued in the past.\n- **Retroactively correct.** Rows written *before* the feature existed evaluate correctly the moment the column lands — an event-driven design can only ever know about events that happened after you started listening.\n- **Free across devices.** Two timestamps replicate through whatever sync you already have. An event-driven version needs the *event* to reach the other device, which is a much harder thing to guarantee than a value.\n\n### The recipe\n\nWhen you're about to write \"on X, clear Y,\" stop and ask two questions:\n\n1. **Is X already recorded somewhere durable?** Usually yes, and usually as a timestamp you already keep — `last_seen_at`, `updated_at`, `last_login_at`, a status column, a monotonically increasing counter.\n2. **Can Y be re-expressed as a comparison against it?** If so, store whatever anchor makes the comparison possible (typically \"when this rule was established\") and delete the clearing logic entirely.\n\nThe cost is usually one extra column. The saving is every future path that would otherwise have had to remember to clear it.\n\n### When it doesn't apply\n\n- **The invalidating event leaves no durable trace.** If nothing records that X happened, there's nothing to compare against, and you genuinely need to observe it. (Consider recording it — a timestamp column is cheaper than a subscriber network.)\n- **You need \"exactly once\" semantics.** Derived validity is a predicate, so it's naturally idempotent and stateless; if the thing must fire exactly once and never again, you still need to record the firing.\n- **The comparison gets expensive at scale.** A predicate over an unindexed column on millions of rows is worse than a maintained flag. Index it, or accept the flag with its N paths — but make that a measured decision, not the default.\n\n## When this applies\n\n- The flag is a pure function of state you already track for other reasons (existence of a selection, an in-progress-transition marker, a count being zero/non-zero).\n- You've already found yourself patching \"flag stuck true\" bugs more than once for the same flag — that's the signal the tracked-boolean approach has structurally too many exit paths, not that you haven't found the last one yet.\n\n## When it doesn't apply\n\n- The flag genuinely carries information no other state has — e.g. \"the user explicitly dismissed this warning\" isn't derivable from anything else; it has to be its own tracked fact (and in that case, the number of paths that can SET it is usually small and well-defined, unlike close/exit paths which tend to multiply over a project's life).\n- Deriving from multiple fast-changing pieces of state can occasionally introduce a one-render flicker if they don't update atomically — verify the derived value is correct across a render, not just eventually-consistent.\n\n## How to spot candidates in an existing codebase\n\nGrep for `useState` booleans whose setter appears in more than 2-3 distinct call sites/handlers within the same feature. That fan-out is the tell — a flag set/cleared from many places is a flag one of those places will eventually mis-handle. Check whether the same true/false shape already exists as a computable expression over other state before adding yet another explicit clear call to the newest exit path.\n\n---\n*Generalized from a real recurring bug (5+ patches across sessions before the structural fix) — the tracked flag was a \"library view is obscured/blurred behind an open detail panel\" boolean with 8 separate paths that could close the detail. Replaced with `selectedId !== null && !closing`.*"}, {"id": "dev-path-fallback-hides-missing-bundled-asset.md", "title": "A dev-path fallback hides a missing bundled asset from the only person who could catch it", "kind": "gotcha", "last_verified": "2026-08-10", "stack": ["tauri", "rust", "electron", "python", "packaging", "release-engineering", "desktop"], "groups": ["Languages", "Other", "Platforms & Runtimes"], "description": "Look for a bundled asset, fall back to a build-time path (`CARGO_MANIFEST_DIR`, `__dirname`, `__file__`), forget to actually bundle it, and the feature works for **exactly one machine on earth** — the one that compiled the binary, whose absolute path is now a string literal inside the shipped exe. Broken in 100% of installs, invisible to the only person who could catch it, and reported as \"it's flaky\" because the error says \"couldn't transcribe\" rather than \"file not found\". Ours survived four releases and was found by a friend. Delete the fallback (not `cfg!(debug_assertions)` it — that keeps the asymmetry), decide bundle-vs-download deliberately, grep the built binary for `C:\\Users\\` as a general detector, and give \"asset missing\" its own error so the UI stops inviting retries of something that can never succeed.", "content": "# A dev-path fallback hides a missing bundled asset from the only person who could catch it\n\n**One-liner:** when your app looks for a bundled asset and falls back to a path derived at build time (`CARGO_MANIFEST_DIR`, `__dirname`, `__file__`, a repo-relative path), that fallback resolves **on the machine that compiled the binary and nowhere else** — so if you forget to actually bundle the asset, the feature works perfectly for you, is broken in 100% of installed copies, and cannot be discovered by anyone whose report you would believe. The bug survives every release until an outsider tries the feature.\n\n## The shape\n\nYou add a feature needing a large asset — an ML model, a dictionary, a sample database, a binary helper. It's too big for git, so a setup script fetches it into the repo. Your locator is reasonable:\n\n```rust\nfn resolve_model_path(app: &AppHandle) -> Result<PathBuf, String> {\n    // 1. production: shipped alongside the executable\n    if let Ok(dir) = app.path().resource_dir() {\n        let bundled = dir.join(\"resources/models/model.bin\");\n        if bundled.is_file() { return Ok(bundled); }\n    }\n    // 2. dev convenience: the copy the setup script fetched\n    let dev = PathBuf::from(env!(\"CARGO_MANIFEST_DIR\")).join(\"resources/models/model.bin\");\n    if dev.is_file() { return Ok(dev); }\n\n    Err(\"model not found\".into())\n}\n```\n\nThen you defer the packaging work — \"wire up `bundle.resources` in the packaging pass\" — and never come back to it. Branch 1 never matches in production. Branch 2 always matches for you.\n\n`env!(\"CARGO_MANIFEST_DIR\")` is expanded **at compile time into a string literal**. The shipped binary contains, verbatim:\n\n```\nC:\\Users\\you\\Documents\\Projects\\YourApp\\apps\\desktop\\src-tauri\n```\n\nOn your machine that directory exists and holds the asset. On a user's machine it is a path into a stranger's filesystem. The lookup fails, the feature errors, and the error is whatever generic thing your UI says when that subsystem fails.\n\nSame trap, other ecosystems:\n\n| ecosystem | the fallback that only works at home |\n|---|---|\n| Rust / Tauri | `env!(\"CARGO_MANIFEST_DIR\")` |\n| Electron | `__dirname` outside the asar, or `path.join(app.getAppPath(), '../assets')` |\n| Python / PyInstaller | `os.path.dirname(__file__)` instead of `sys._MEIPASS` |\n| Go | `runtime.Caller(0)` to find source-relative data |\n| Java | a `src/main/resources` **file path** rather than `getResourceAsStream` |\n| Node CLI | `process.cwd()`, which works because you always run it from the repo |\n\n## Why it survives so long\n\nThree reinforcing blind spots, and they are the actual lesson:\n\n1. **The person best placed to notice is structurally unable to notice.** You test on the build machine. The build machine is the one machine where the bug is invisible. This is not carelessness; it is the topology.\n2. **The error message describes the symptom, not the cause.** A missing model surfaces as \"Couldn't transcribe that. Please try again.\" — which reads as flaky, invites a retry, and never says *file not found*. A user reports \"voice is broken sometimes.\" Nobody says \"your app is looking for a folder that only exists on your computer.\"\n3. **The docs claim it's already done.** The deferral gets written down as if completed. Our `.gitignore` said the file was *\"bundled into the production installer at build time via `bundle.resources`\"*. It never was. Every future reader — including the author — checks that comment, sees the problem is handled, and moves on. **A confident comment about an unfinished step is worse than no comment**, because it converts an open question into a settled one.\n\nOurs shipped in four consecutive releases and was found by a friend of the developer, on his own machine, on a
