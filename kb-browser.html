 feature the developer had \"tested\" many times.\n\n## The fix, in order of importance\n\n**1. Delete the compile-time fallback.** This is the whole lesson. Do not make it conditional on `cfg!(debug_assertions)`, which preserves the exact asymmetry — a dev build still succeeds where a user's fails. Remove it, so your dev run resolves the asset the same way a user's does and you *feel* the first-run path every time it changes. If the asset must exist for tests, let the tests pass an explicit path; test fixtures and runtime lookup are different concerns and should not share a code path.\n\n**2. Decide bundle-vs-download deliberately, then verify the decision landed.** Bundling is simplest but every desktop update mechanism that replaces the installer re-ships the payload — a 141MB model becomes 141MB on every release for every user, including those who never use the feature. Downloading on first use keeps it in the app data dir, where it survives updates and costs each user once. Either way, **check the built artifact rather than the config**:\n\n```bash\n# Does the thing you shipped actually contain the thing?\nls -R \"$INSTALL_DIR\" | grep -i model\n# And what path did the binary bake in?\nstrings App.exe | grep -iE '^[A-Za-z]:\\\\Users\\\\'   # any hit here is a bug\n```\n\nThat second command is the cheap general-purpose detector: **a shipped binary containing an absolute path into a developer's home directory is a defect**, whatever it's for.\n\n**3. Make \"asset missing\" a distinct, named error.** Not the generic failure the feature already has. Missing-asset and operation-failed need opposite UI — one offers setup, the other offers retry — and merging them produces a screen that invites users to retry something that can never succeed. A sentinel error value that survives the IPC boundary is enough.\n\n**4. Check before the user commits effort.** If the asset is missing, say so when they press the button, not after they have spoken a two-minute voice memo. The ordering is free and the difference in insult is large.\n\n## The generalisation worth keeping\n\n**Any fallback whose success depends on properties of the build machine is a bug detector that is disabled on the only machine that runs it.** Compile-time paths are the clearest case, but the family is larger: an env var set only in your shell, a service running only on your box, a file in your home directory, a locally-installed dependency. If a code path can only succeed where it was compiled, it is not a fallback — it is a way of not finding out.\n\n## See also\n\n- [march-native-ships-an-unrunnable-binary.md](./march-native-ships-an-unrunnable-binary.md) — the same generalisation one layer down, and the same feature one release later: having fixed the missing model, the next release shipped one compiled with `-march=native`, so the asset was finally present and the CPU refused the *code*. File paths are the obvious build-machine leak; **compile flags are the invisible one**.\n- [verify-the-artifact-your-user-receives.md](./verify-the-artifact-your-user-receives.md) — same family: what you built and what a stranger receives are different objects, and only one of them matters.\n- [bot-challenge-blocks-your-auto-updater.md](./bot-challenge-blocks-your-auto-updater.md) — if you fix this by downloading the asset at runtime, read this before choosing the host. Your own CDN may refuse your own app."}, {"id": "digit-led-snake-case-breaks-case-bridges.md", "title": "Digit-led snake_case segments break regex case bridges — loudly if you're lucky, silently if you're not", "kind": "postmortem-playbook", "last_verified": "2026-07-31", "stack": ["typescript", "zod", "sqlite", "sql", "tauri"], "groups": ["Cloud & Backend", "Frameworks & Libraries", "Languages", "Platforms & Runtimes"], "description": "Digit-led snake_case segments break regex case bridges: loudly if you're lucky, silently if you're not.", "content": "# Digit-led snake_case segments break regex case bridges — loudly if you're lucky, silently if you're not\n\n> Two sightings, one week apart, same regex.\n>\n> **2026-07-30 (loud):** one new SQLite column named `playtime_2weeks_minutes`\n> made the app report an EMPTY game library, a dead game-detail page, and a\n> failed first-run scan — over a fully intact table. A required Zod field turned\n> a key mismatch into an app-wide empty state. Diagnosable in an hour.\n>\n> **2026-07-31 (silent):** the months-old `intention_1…3` columns hit the same\n> regex in a path with no row schema and `?? null` fallbacks. Nothing threw.\n> Every backup restore quietly dropped six columns of user data and mirrored the\n> blanks to the cloud. Found only by reading the code.\n>\n> The second one is the reason this article has a second half. **The loud\n> failure is the lucky one.**\n\n## The symptom\n\nEvery surface that lists games goes empty at once. The data is verifiably\npresent (query the DB file directly). Error surfaces that show raw errors\ndisplay a ZodError like:\n\n```\n{ \"code\": \"invalid_type\", \"expected\": \"number\", \"received\": \"undefined\",\n  \"path\": [0, \"playtime2WeeksMinutes\"], \"message\": \"Required\" }\n```\n\nThe path names a field you *just added*, on a row that *has* the column.\n\n## The cause — two innocent pieces, one break\n\n**Piece 1: a hand-rolled snake→camel bridge.** Apps that bypass an ORM's query\nbuilder often remap SQL column names to code-style keys in one place:\n\n```ts\nfunction snakeToCamel(key: string): string {\n  return key.replace(/_([a-z])/g, (_, ch) => ch.toUpperCase());\n}\n```\n\nThat regex only matches a LETTER after the underscore. A digit-led segment\npasses through untouched:\n\n- `playtime_minutes` → `playtimeMinutes` ✓\n- `playtime_2weeks_minutes` → `playtime_2weeksMinutes` ✗ (underscore kept, no\n  key in the schema matches)\n\nThere is no spelling of a digit-led segment that camelizes cleanly — capitalizing\n`2` is a no-op, so even a \"fixed\" regex (`/_([a-z0-9])/g`) produces\n`playtime2weeksMinutes`, whose casing then has to be hand-matched in the schema\nand will surprise the next person. The segment naming is the problem, not the\nregex.\n\n**Piece 2: the field was REQUIRED in the row schema.** `z.number().int().nullable()`\nis nullable but NOT optional — the key must exist. So every `SELECT *` +\n`schema.parse(rows)` throws, and every caller's `catch` resolves to its empty\nstate. **The app fails closed, loudly-empty, everywhere at once** — which is at\nleast diagnosable. (Contrast the sibling failure in\n[[monorepo-stale-dist-zod-strip]]: there the parse *succeeds* and strips the\ncolumn silently. Required = everything visibly breaks; strip-mode = data\nquietly vanishes. Pick your poison, but know which one your boundary does.)\n\n## The fix\n\n1. **Rename the column to all-letter segments**: `playtime_two_weeks_minutes`\n   → bridges to `playtimeTwoWeeksMinutes`, matching the schema naturally.\n2. **Roll forward, never edit the applied migration.** The bad name had already\n   run on real databases (migration N). Editing N's SQL in place would leave\n   deployed DBs on the old column while fresh installs get the new one —\n   divergence with no error. Ship migration N+1:\n   `ALTER TABLE games RENAME COLUMN ... TO ...` (SQLite supports RENAME COLUMN\n   since 3.25).\n\n## The checklist (before adding any column)\n\n- Grep for the case bridge (`snakeToCamel`, `/_([a-z])/`, `camelize`) and\n  know its rules. If your project has one, **it is part of your naming\n  convention** whether documented or not.\n- Never start a snake_case segment with a digit. Spell it out (`two_weeks`,\n  not `2weeks`) — this also survives every other tool that assumes\n  letter-led segments (serde renames, GraphQL, ORMs).\n- Know which of THREE modes each parse boundary is in, because that decides\n  what a key mismatch does to you: **required-mode** (app-wide empty state,\n  loud, diagnosable) → **strip-mode** (column vanishes silently, see\n  [[monorepo-stale-dist-zod-strip]]) → **no schema + `?? default`** (data is\n  dropped and the code still looks correct — the worst, and the one that took a\n  second sighting to find).\n- Grep for bare `SELECT *` anywhere the results cross a bridge. Queries that\n  alias explicitly are patched, not fixed, and they hide the bug everywhere\n  else.\n- A required-field ZodError whose `path` names your newest field, over a table\n  you can prove is full, is a KEY-SHAPE mismatch, not missing data. Check the\n  bridge before checking the database.\n\n## Second sighting, different failure mode: no schema + a fallback = silent data loss\n\nFound 2026-07-31 in the same codebase, one day later, in a completely different\npath. Same regex, same digit-led column — but this time nothing threw, nothing\nwent empty, and nobody would ever have noticed. **This is the variant worth\nfearing.**\n\nThe columns were `intention_1 … intention_3` and `intention_1_done …`, which had\nexisted for months. The bridge mangles them exactly as you'd expect:\n\n- `intention_1` → `intention_1` (unchanged — no letter after the underscore)\n- `intention_1_done` → `intention_1Done` (a mongrel: only the `_d` converts)\n\n**Why the app looked fine for months.** The normal read path aliased in SQL:\n\n```sql\nSELECT intention_1 AS intention1, intention_1_done AS intention1Done, ...\n```\n\nExplicit aliases bypass the bridge entirely, so every screen worked. The bug\nlived only in a path that used a bare `SELECT *` — the backup exporter, which\nruns rarely and whose output nobody eyeballs.\n\n**Why it was silent rather than loud.** Unlike the outage above, this boundary\nhad no row schema to violate: the backup manifest was typed\n`z.array(z.record(z.unknown()))`, deliberately permissive. So the mangled keys\nsailed through, and the *importer* read the names it expected:\n\n```ts\ne.intention1 ?? null      // undefined -> null\ne.intention1Done ?? 0     // undefined -> 0\n```\n\nThe `??` fallbacks are the trap. They exist to tolerate missing optional data,\nand they cheerfully absorb a key-shape bug as if it were absent data. **Every\nrestore silently dropped all six columns** — every goal, every side quest, every\ncompletion state — and then mirrored those blanks to the cloud, propagating the\nloss to the user's other devices. Restored backups looked plausible: notes,\nlocations, milestones and screenshots all intact.\n\n### The generalisable lessons\n\n- **Explicit aliases hide bridge bugs, they don't fix them.** If some queries\n  alias and others use `SELECT *`, your bridge is only exercised where you\n  happened not to alias. Aliasing is a per-query patch masquerading as a fix —\n  grep for bare `SELECT *` and treat each one as an untested bridge call.\n- **A permissive schema is a bridge bug's best friend.** The \"fails loudly\"\n  behaviour above is a *feature*: it required a strict schema at the boundary.\n  Wherever you deliberately loosen validation (import/export, migrations,\n  telemetry, anything handling foreign or historical shapes), you have also\n  removed the thing that would have caught a key mismatch.\n- **`?? default` at a deserialisation boundary converts bugs into data loss.**\n  It cannot distinguish \"the producer never wrote this\" from \"the producer wrote\n  it under another name.\" If a field is required-in-practice, assert it rather\n  than defaulting it — or at minimum, log when the default fires.\n- **Bugs that reach a FILE FORMAT need a two-sided fix.** Repairing the writer\n  is not enough, because every file already on disk carries the broken shape.\n  The fix here aliased the six columns in the export *and* made the import read\n  both spellings (`e.intention1 ?? e.intention_1`). Drop the reader half and you\n  fix new backups while every existing one still restores empty — arguably worse,\n  since users believe they're covered.\n- **Aliasing on top of `*` beats replacing it.** `SELECT *, intention_1 AS\n  intention1, …` keeps future columns flowing automatically *and* means a\n  newly-written file restores correctly on an older build.\n\n### How to sweep for it\n\nBound the blast radius with one grep — you only care about columns with a digit\nafter an underscore:\n\n```bash\ngrep -oE \"'[a-z_]*_[0-9][a-z_]*'\" path/to/schema.ts | sort -u\n```\n\nIf that returns nothing, your bridge is safe by construction. If it returns\nsomething, check every bare `SELECT *` and every `?? default` that consumes\nthose rows. In the case above it returned exactly six names, all of them the\naffected ones — which turned \"audit the whole app\" into \"read two functions.\"\n\n## Bonus trap from the same outage\n\nAfter the rename, one machine kept validating against the OLD schema through a\nfull app restart — Vite's dep-optimizer cache (`node_modules/.vite`) had\npre-bundled the workspace package and survives restarts. See the \"third stale\nlayer\" section added to [[monorepo-stale-dist-zod-strip]]."}, {"id": "dry-modularity-audit-playbook.md", "title": "DRY / modularity audit playbook", "kind": "playbook", "last_verified": "2026-07-20", "stack": ["any", "refactoring", "codebase-audit"], "groups": ["Process & Meta"], "description": "Sibling to the security audit playbook: fan out read-only sweeps by code AREA (not trust domain), tier findings by drift-risk (already-bit-us / worthwhile / opportunistic) instead of line count, keep file-split candidates as a separate list, execute tier-by-tier as traceable separate commits.", "content": "# DRY / modularity audit playbook\n\nA repeatable way to find and fix real duplication in a codebase that's grown fast — sibling to `pre-launch-security-audit-playbook.md`, but for duplication/file-size instead of security. Same fan-out → synthesize → triage shape, different split axis and a different tiering criterion.\n\n## Shape: fan out read-only sweeps by CODE AREA, synthesize into ONE tiered report\nSplit by code area, not by trust-boundary domain: e.g. frontend data/sync, frontend UI + styles, native/Rust commands, server + shared core. Contrast with the security playbook's domain split (auth / data / client / frontend) — that split exists because security findings cluster at trust boundaries; DRY findings instead cluster inside a layer or language, so an area split surfaces more real duplication per agent. Report only — **no code changes in the audit pass itself.** The user reviews and prioritizes the tier list before any refactor lands.\n\n## The tiering axis is DRIFT RISK, not line count\n- **Tier 1 — already bit us, or actively drifting.** The copies have either already caused a real bug, or have visibly diverged from each other (proof the \"keep N copies in sync by hand\" discipline is already failing). This is correctness debt, not style debt — do it first.\n- **Tier 2 — worthwhile consolidations, not yet bitten.** Real duplication per the project's own DRY bar, where the extraction creates a genuinely reusable module/interface. Judge by the interface created and the blast-radius removed, **not raw line savings** — a \"plug-n-play modularity\" lens, not a diff-size lens.\n- **Tier 3 — small/opportunistic.** Dedupe only when you're already touching the file for another reason.\n- **File-split candidates are a SEPARATE list, not a tier.** \"Which files are too big\" and \"what's duplicated\" are different questions with different remedies — splitting a file changes nothing about duplication, and collapsing a duplication doesn't necessarily shrink any one file below a size cap. Keep them as two lists so a giant-but-non-duplicated file doesn't get miscategorized as a DRY finding (or vice versa).\n\n## Auditor rubric (signal, not noise)\n- Read-only; report only. Each Tier 1/2 finding needs exact file:line pairs for every duplicate site, a % identical estimate, and — for Tier 1 specifically — the concrete bug or observed drift that proves the risk is real, not hypothetical.\n- **Quote the project's own DRY bar in the prompt** (e.g. \"3+ identical uses = extract; 2 uses only when the shape is certain AND drift risk is real\") so every agent applies the same threshold instead of each inventing its own aggressiveness.\n- **State an explicit, non-arbitrary goal lens up front.** Without one, a DRY sweep degenerates into \"everything remotely similar is a finding\" — the opposite of signal. (\"Judged by the module/interface it creates and the blast-radius it removes... don't be overly aggressive/arbitrary — it should be valuable/worthwhile\" is a real instruction that worked.)\n- **Include a \"Verified non-findings\" section** — duplication that looks like a finding but should stay: a security-motivated non-collapse (don't let a client address arbitrary secret keys over IPC just to save 3 lines of shell command), a compile-time-guarded intentional redundancy, a deliberate cross-language duplication with no shared-source mechanism available. Mirrors the security playbook's \"Verified OK\" section: record what you checked and decided not to touch, so it isn't re-litigated next audit.\n\n## Sequencing: don't ship it all in one PR\n- Recommend an explicit sequence, not just a flat list — including what to **defer** and why. A finding that physically overlaps files another feature slice has mid-edit (uncommitted WIP) should be deferred past that slice landing, not raced into a merge conflict.\n- Execute tier-by-tier as **separate commits**, one logical consolidation per commit, each stating which report item(s) it closes (e.g. \"audit Tier1 1.1+1.6\"). Traceable back to the line item, independently revertible/bisectable.\n- Each execution commit should state what was verified (build green, live probe, specific repro) in the body — not just \"refactored X.\"\n\n## What a real Tier-1 fix looks like (concrete)\n- **Duplicated per-table delete list.** Two account-deletion routes hand-maintained the same multi-table `DELETE` list; one copy had already silently missed a table, causing a real production bug (an orphaned row synced back down as stale data). Fix: one `wipeUserData(client, id, options)` function; both routes call it. Bonus: an automated assert that the delete list covers every table in the app's write-allowlist, closing the gap for good — this is a fresh instance of `n-copies-of-truth-drift-guard.md`'s pattern, found via a DRY audit rather than a sync-schema audit.\n- **~85%-identical pipeline duplicated 3x.** A download-materialize / upload / sweep-pending / mirror-to-cloud skeleton (~55-100 lines) was copy-pasted per attachment kind (screenshots, audio, a lighter third variant), including a subtle bug-fix branch that had to be kept byte-identical by hand across copies. Fix: one parameterized module owning the four shared flows; kind-specific residue (column names, content-type derivation) stays as small config objects at each original call site. Net line count barely moved (+59 raw lines) — **log this \"honest accounting\" explicitly in the commit message.** A DRY refactor that doesn't shrink line count can still be the right call: the win is N independently-editable copies becoming 1, not bytes removed.\n\n## Lessons that recur\n- **The real yield is often \"how many places a future bug-fix must be applied by hand,\" not line count.** Report savings honestly, including near-zero or negative — the value is the copy count, not the byte count.\n- **The audit will also surface your best existing work as \"verified non-findings.\"** Treat a confirmed-correct consolidation as equally valuable output: it tells you that area doesn't need a second look, and it gives new findings a cited precedent to follow.\n- **Tier-1 findings are frequently fresh instances of a drift-guard problem** (hand-maintained lists/copies that must stay in lockstep) — pair the refactor with an automated assert wherever the finding was \"these N things must match,\" not just a shared function.\n- **Sequence around in-flight work explicitly.** A DRY audit reads the whole tree including uncommitted WIP; findings that overlap another slice's mid-edit files get deferred, not raced.\n\n## Related\n- [`pre-launch-security-audit-playbook.md`](./pre-launch-security-audit-playbook.md) — sibling playbook, same fan-out/synthesize/triage shape, split by trust-boundary domain instead of code area, severity instead of tier.\n- [`n-copies-of-truth-drift-guard.md`](./n-copies-of-truth-drift-guard.md) — Tier-1 findings that are \"N hand-maintained things that must match\" are instances of this pattern; pair the fix with an automated assert, not just a shared function.\n\n---\n*Captured from the Playmoir DRY/modularity audit, 2026-07-17 (4-agent sweep, ~600-800 line dedup opportunity found across Tier 1-3, Tier 1 executed as 6 separate commits over 2026-07-18).*"}, {"id": "duplicate-classifiers-diverge.md", "title": "The same judgement implemented twice — and the weaker copy is the one wired to something destructive", "kind": "gotcha", "last_verified": "2026-08-04", "stack": ["any", "desktop", "steam", "tauri", "integrations"], "groups": ["Integrations", "Other", "Platforms & Runtimes", "Process & Meta"], "description": "The same yes/no judgement about external data (\"is this a game?\") implemented three times by three methods of three qualities — and the naive one (name matching) turned out to govern the *quit ritual*, so closing a windowing utility prompted the user to journal a play session about it. Rank duplicate filters by blast radius, not visibility; the copy wired to an interruption is the one written as plumbing.", "content": "# The same judgement implemented twice — and the weaker copy is the one wired to something destructive\n\n**One-liner:** when an app has to answer a yes/no question about external data (\"is this a game?\", \"is this a real user?\", \"is this spam?\"), that judgement tends to get implemented independently in more than one place, using *different methods* of different quality — and the copy nobody audits is reliably the one attached to the most user-visible trigger. This is not schema drift. The copies were never trying to agree; they were written months apart by someone solving a local problem, and only one of them got the good method.\n\n## The concrete case\n\nA Steam journaling app needed to know \"is this appid a game, or is it a tool/demo/soundtrack/beta?\" That question got answered in **three** places:\n\n| Where | Method | Quality |\n|---|---|---|\n| Installed-library scan | Steam's own `common/type` from `appinfo.vdf` | authoritative |\n| Owned-library sync (Web API) | **nothing** | no filter at all |\n| Process watcher's exe map | **name matching** on a skip-list | provably weak |\n\nEach was locally reasonable. Together they produced two separate bugs:\n\n**Bug 1 — two paths disagreed.** The local scan correctly dropped non-games. The owned-library sync had no filter, so the moment a user signed in, every Application and Beta came straight back. Nobody noticed because each path was \"working.\"\n\n**Bug 2 — the weak copy governed the worst trigger.** The exe map feeds the process watcher, which decides whether the app's *quit ritual* fires. Its name skip-list (`[\"ost\", \"demo\", \"tool\", \"soundtrack\", …]`) could never match \"Borderless Gaming\" or \"Lossless Scaling\" — neither contains a token. So launching a windowing utility armed the watcher, and closing it **prompted the user to journal a play session about a windowing utility.**\n\nThat's the shape worth remembering: *the filter guarding a mere list was good; the filter guarding an interruption was the naive one.*\n\n## Why name matching always loses\n\nThe skip-list had already been patched once for a bug its own comment documents: `\"ost\"` as a substring matched **Lost** Soul Aside and **Ghost** of Tsushima, making them invisible to the watcher. The fix was whole-word matching — better, still wrong.\n\nMeasured over a real 389-app library, a name scan for `demo`/`ost`/`beta` flagged: *Democracy 4, Ghostrunner, Ghost of Tsushima, Banishers: Ghosts of New Eden, Lost Skies*. Every one a false positive. Meanwhile the two actual applications matched nothing.\n\n**If the platform exposes a real type field, a name heuristic is never the answer — it fails in both directions at once.**\n\n## How to find these in your own codebase\n\nGrep for the *question*, not the implementation. Every place that asks \"is this X?\" about the same external entity is a candidate:\n\n```bash\n# find every site that filters the same entity\ngrep -rn \"FROM games\" src/ | wc -l     # then read each one\n```\n\nThen sort the hits by **blast radius, not by visibility**. The list view showing a wrong row is cosmetic. The one wired to a notification, a modal, a delete, a purchase, or an outbound email is the one to fix first — and it is usually the one that got the cheap implementation, precisely because it was written as plumbing rather than as a feature.\n\n## The fixes, in order of value\n\n1. **One exported predicate, not N inline copies.** A shared function (`playableGameWhere(alias)`, `isGame(id)`) that every site calls. Same argument as a shared column list: copies that agree today drift tomorrow.\n2. **Authoritative source first, heuristic demoted to fallback.** Don't delete the name list — keep it for when the authoritative source is unreadable, and say so in a comment so nobody promotes it back.\n3. **Fix at the layer that makes the decision, not the layer that renders it.** In the case above, the overlay that showed the quit prompt resolved its target *by appid* — filtering there would have created a session with nowhere to land. The watcher was the right layer. Ask \"where is the choice made?\", not \"where did I see the bug?\"\n4. **Fail open, never closed.** An unclassifiable item must stay *visible*. If the authoritative source is missing or locked, hiding-on-unknown means a transient file-read failure empties the user's entire library.\n\n## Two traps in the classification itself\n\n- **Case.** 28 of the 389 apps reported a lowercase `game` where the rest reported `Game`. A naive `== \"Game\"` would have hidden 28 real games. Compare case-insensitively, and comment that it is load-bearing rather than defensive.\n- **Hiding can be stronger than you intend.** If a list view is the *only* route to an item's detail page, filtering it out makes the item unreachable — not dimmed. No detail, no settings, no way back. **A filter with no escape hatch shouldn't ship**; add the \"show hidden items\" toggle in the same change, off by default.\n\n## The rule worth carrying\n\n> Before adding a filter, grep for every other place that answers the same question. Rank them by what happens when they're wrong, not by how visible they are. The copy attached to an interruption is the one that was written as plumbing, and it is the one that's naive.\n\n## Related\n\n- [n-copies-of-truth-drift-guard.md](./n-copies-of-truth-drift-guard.md) — the *schema* version: N descriptions of the same data drifting apart.\n- [shared-schema-multiple-projections-drift.md](./shared-schema-multiple-projections-drift.md) — same-repo, same-commit drift across N producers feeding one schema.\n- [steam-library-integration.md](./steam-library-integration.md) — where `appinfo.vdf` and the librarycache layouts are covered."}, {"id": "edge-to-edge-scrim-paints-over-your-bleed.md", "title": "Edge-to-edge that never shows — the window IS drawing under the bar, and your own scrim is painting over it", "kind": "gotcha", "last_verified": "2026-08-11", "stack": ["android", "kotlin", "jetpack-compose"], "groups": ["Other", "Platforms & Runtimes"], "description": "`enableEdgeToEdge()` with a coloured `SystemBarStyle` (or a theme `android:statusBarColor`) makes two things true at once: your content genuinely renders under the status bar AND an opaque scrim paints over the bar zone so you can never see it. Insets report correctly and every layout probe answers \"yes, edge-to-edge,\" so the invisible bleed gets debugged as crop/height/anchor geometry — ours burned two sessions that way. Fix is `SystemBarStyle.dark(TRANSPARENT)` + transparent theme colour; the ten-second identification is a screenshot of the bar zone (flat theme colour = paint, cropped content = layout). A layout probe cannot detect a paint occlusion.", "content": "# Edge-to-edge that never shows — the window IS drawing under the bar, and your own scrim is painting over it\n\n**One-liner:** `enableEdgeToEdge()` with a coloured `SystemBarStyle` (or a theme `android:statusBarColor`) makes both of these true at once: your content genuinely renders under the status bar, AND an opaque paint layer covers the bar zone so you can never see it. Every geometry-level debugging step reads as sane — insets report correctly, layout math checks out — because the failure is not layout. It is paint.\n\n## The symptom\n\n\"Make the hero image bleed under the status bar\" appears to do nothing, repeatedly. The band gets taller by exactly the inset, insets report the right values, the wordmark centres in the right zone — and the bar area stays a flat app-coloured strip. Because every measurable geometry fact is correct, each attempt gets diagnosed as a *crop* problem, a *height* problem, an *anchor* problem. Ours burned attempts across **two separate sessions**, each ending in \"the bleed isn't worth the crop\" reasoning about an effect that was never visible in the first place.\n\n## The mechanism\n\nTwo independent paint sources can cover the bar zone, and both look like \"the app's background\" in a screenshot:\n\n1. `enableEdgeToEdge(statusBarStyle = SystemBarStyle.dark(someOpaqueColor))` — the scrim argument is not an icon-style hint; it is a colour the system paints behind the bar icons and **over your window content**. Passing your background colour there (a very natural reading of \"pin the bars to my dark theme\") re-creates a non-edge-to-edge look on top of a genuinely edge-to-edge window.\n2. The platform theme's `<item name=\"android:statusBarColor\">` — same effect, applied before Compose even starts, so it also covers the cold-start frame.\n\nThe trap is that `enableEdgeToEdge` did its job: the window extends, `WindowInsets.statusBars` reports the real inset, `statusBarsPadding()` works. Everything an engineer would probe to verify \"am I edge-to-edge?\" answers **yes**. The only wrong thing is a paint layer no layout query can see.\n\n## The fix\n\nBoth sources go transparent; legibility over art becomes your content's job (a top gradient under the clock):\n\n```kotlin\nenableEdgeToEdge(\n    statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT), // dark() = light icons\n    navigationBarStyle = SystemBarStyle.dark(barColor), // each bar decided separately\n)\n```\n\n```xml\n<item name=\"android:statusBarColor\">@android:color/transparent<\/item>\n```\n\nScreens that should NOT bleed simply keep their own `statusBarsPadding()` and show the window background there — a transparent bar costs them nothing.\n\n## The ten-second identification\n\nWhen a \"draw under the bar\" change appears to do nothing: **screenshot, then ask what the bar zone shows.** Cropped content = geometry problem, debug layout. A flat colour that matches your theme = paint problem, and no amount of height/crop/anchor work can ever fix it. Do this check FIRST — it is the difference between one minute and two sessions.\n\n## The general rule\n\n**A layout probe cannot detect a paint occlusion.** When an effect that \"should be visible\" isn't, verify the pixels before the geometry: something above your content in z-order may be honestly painting exactly what it was told to. Sibling of the LocalContentColor lesson — same platform, same family (\"presents as one class of bug, is actually paint\"), different layer.\n\n## Related\n\n- [[compose-invisible-text-localcontentcolor]] — the same \"debugged as X, was actually paint\" family: there the paint was black-on-black text; here it is a scrim over a bleed. In both, every structural probe answered \"correct.\"\n- [[negative-control-before-trusting-a-probe]] — the epistemics of why the geometry checks kept passing: they were probing a layer that was never the broken one."}, {"id": "exit-animation-props-captured-at-unmount.md", "title": "Exit-animation props are captured at unmount — a flag set in the same batch is too late", "kind": "gotcha", "last_verified": "2026-07-26", "stack": ["react", "framer-motion", "animation"], "groups": ["Frameworks & Libraries"], "description": "`AnimatePresence` animates a removed child using the element captured from the last render it appeared in, so a flag set in the same batch as the removal is too late and the wrong `exit` branch plays — silently, for months, until an unrelated change gives it a symptom. `flushSync` fix, the 30-second way to confirm which branch actually runs, and why any \"animate on the way out\" API has this shape. PLUS failure mode 2 (verified live): a re-render storm mid-exit can drop the exit's unmount entirely, stranding an invisible click-eating clone — mitigations, and the structural cure (timeline-owned unmount + live `animate` props, no exit bookkeeping to lose).", "content": "# Exit-animation props are captured at unmount — a flag set in the same batch is too late\n\n**One-liner:** `<AnimatePresence>` (and every API shaped like it) animates a removed child by re-rendering the element it captured from **the last render in which that child was present**. So any state your `exit` prop consults must already be committed *before* the render that removes the child. Setting the flag and triggering the removal in the same event handler batches them into one render — the child is gone in that render, so the captured `exit` still holds the OLD value, and the wrong exit variant plays. Nothing errors. It can sit wrong for months.\n\n## The failure shape\n\nYou have one overlay with several ways out, and you want a different exit per route:\n\n```tsx\n<AnimatePresence>\n  {isOpen && (\n    <motion.div\n      exit={\n        navigatingAway\n          ? { opacity: 0, transition: { duration: 0.4 } }   // flat fade, we're leaving\n          : { opacity: 0, transition: { duration: 0, delay: 0.7 } } // hold, then snap\n      }\n    />\n  )}\n<\/AnimatePresence>\n```\n\nand a handler that picks the route:\n\n```ts\nfunction handleNavigateAway(screen) {\n  setNavigatingAway(true);   // \"use the flat fade\"\n  closeOverlay();            // ...this is what sets isOpen = false\n}\n```\n\nThis reads correctly and is wrong. React batches both setters into one render. In that render `isOpen` is already `false`, so the child isn't rendered at all — `AnimatePresence` falls back to the element it kept from the *previous* render, whose `exit` closed over `navigatingAway === false`. Every nav-away silently runs the **other** branch.\n\n## Why it hides for so long\n\nAn exit animation that picks the wrong branch is still *an animation*. There's no error, no warning, no visual \"missing\" state — just the wrong choreography, which usually looks plausible enough that nobody questions it. In the case this was extracted from, the wrong branch was a 700ms opaque hold: the overlay simply sat there and then vanished, which reads as \"the app went to the next page.\" The bug only became visible months later when an unrelated change made part of that overlay independently animated, and suddenly the wrong branch leaked the previous screen into view.\n\nThat's the tell for this whole class: **a transition bug that appears the moment you touch something adjacent, in code you didn't change.** The branch was always wrong; you just gave it a symptom.\n\n## Fixes\n\n**1. Commit the flag in its own render, while the child still exists.** Targeted and minimal:\n\n```ts\nimport { flushSync } from 'react-dom';\n\nfunction handleNavigateAway(screen) {\n  setScreen(screen);\n  // flushSync so this lands in a render where the overlay is STILL MOUNTED.\n  // AnimatePresence captures exit props from the last render the child\n  // appeared in; batching this with the close below means it captures the\n  // stale value and picks the wrong exit.\n  flushSync(() => setNavigatingAway(true));\n  closeOverlay();\n}\n```\n\nNote the ordering requirement: `flushSync` must come *before* whatever removes the child, and the removal must not be inside the same `flushSync` callback.\n\n**2. Better where possible — don't branch on state set at close time.** If the exit variant is knowable from something already true while the overlay is open (how it was *opened*, which screen owns it), branch on that instead. State that was committed renders ago can't be stale. This is the same instinct as [derive-dont-track-ui-flags.md](./derive-dont-track-ui-flags.md): the most reliable flag is one nobody has to set at the right moment.\n\n**3. Keep the child mounted one render longer.** Gate removal on a separate \"exit armed\" state so the flag lands first and the removal happens on the next render. More moving parts than `flushSync`; reach for it only if you already need a staged teardown.\n\n## How to confirm it in 30 seconds\n\nGive each branch a wildly different, obviously distinguishable transition — `duration: 3` on one, `duration: 0` on the other — and trigger the path. If the one that plays isn't the one you expect, the props are stale. This beats logging, because a `console.log` inside the render body fires on renders that aren't the captured one and will happily print the value you *want* to see.\n\n## Failure mode 2: the exit's UNMOUNT can be dropped entirely (verified live, 2026-07-26)\n\nThe stale-capture bug plays the *wrong* exit. There's a worse cousin: the exit plays and the **removal never happens**. AnimatePresence keeps the leaving child mounted while it animates the captured snapshot, then unmounts it when the exit resolves — but that unmount is bookkeeping inside the library, and a heavy re-render storm landing mid-exit (a data-invalidation burst, a context flip re-rendering the app shell) can drop it. Diagnosed from live DOM dumps, not theory: a full-screen overlay stranded **mounted, laid out, `opacity: 0`, `pointer-events: auto`** — an invisible sheet eating every click, with zero running animations. The app looks frozen while rendering fine. Repeated three times with three different re-render triggers before the mechanism was captured.\n\nTwo mitigations work but leak (exit carries `pointerEvents: 'none'` + `transitionEnd: { visibility: 'hidden' }`, so a dropped unmount strands one *inert* subtree; per-open `key` so a poisoned exit entry can't swallow the next open). **The structural cure is to stop using exit-time bookkeeping for anything load-bearing:** render the overlay as a plain conditional, drive the exit visuals through `animate` props reading live state (a `closing` flag), and let your own close timeline clear the state — clearing it IS the unmount. A conditional render cannot strand: when state says closed, React unmounts; there is no library bookkeeping to lose. Bonus: every `flushSync` workaround from failure mode 1 becomes deletable, because live `animate` props never capture anything.\n\nWhen to accept the trade: you lose AnimatePresence's convenience of \"unmount whenever the exit happens to finish\" and must own the timing constants yourself. For a surface where a stranded invisible sheet means \"app unusable,\" that trade is obviously right; for a decorative toast, the mitigation pattern is enough.\n\n## The general rule\n\nAny API that animates something *on its way out* has to hold onto a snapshot of it, because the thing is by definition no longer in your tree. **Whatever that snapshot captured is what the exit will use.** React Transition Group, Vue's `<Transition>` with dynamic props, and hand-rolled \"keep the last child around while it animates\" wrappers all share the shape. When an exit is configurable, always ask: *at the instant this element left the tree, had my configuration already landed?*\n\n## What NOT to do\n\n- Don't \"fix\" it by adding a delay before the close call so the flag lands first. It works by accident, is timing-dependent, and breaks under load — this bug already lives in the gap between two schedulers, so don't add a third.\n- Don't move the exit config into a ref to dodge the capture. Motion reads the prop from the captured element; a ref read at exit time is not a supported hook and will vary by version.\n- Don't assume a branch is live because you can see it in the source. Any conditional inside an `exit` prop is a candidate for having never executed. When auditing exit choreography, verify *which branch actually runs*, not which branches exist."}, {"id": "instrument-before-patching.md", "title": "Instrument before patching — the rule for invisible-failure surfaces", "kind": "playbook", "last_verified": "2026-07-26", "stack": ["any"], "groups": ["Process & Meta"], "description": "The rule for invisible-failure surfaces: after one silent fix-failure, the next move is wiring the pipeline's own decisions into a dumpable trail, not another patch (measured: 3 correct-looking patches failed silently; the first instrumented capture named the real bug — an effect-cancellation race — in one shot). Includes the framework-free \"tripwire\" pattern for UI-wedge bugs: pre-mount arming, capture-phase click ring, hotkey DOM-facts dump persisted via backend with localStorage fallback, state machine stamped onto the DOM.", "content": "# Instrument before patching — the rule for invisible-failure surfaces\n\n**One-liner:** when a fix on some surface fails *invisibly* — the patch is plausibly correct, ships, and the symptom persists with no error anywhere — do not write the next patch. Wire the surface's own decisions into something dumpable first. Measured result from the sessions this was extracted from: **three consecutive correct-looking patches failed silently over two days; the first capture with decision-logging in place named the real bug in one shot** (an effect-cancellation race that no amount of staring at the patch sites could reveal, because every patch was downstream of the cancellation).\n\n## The failure shape\n\nSome pipeline makes internal decisions you can't see from the outcome: an image-resolution chain picking URLs, an animation state machine choosing exits, a sync layer reconciling rows. It misbehaves intermittently. Each fix attempt:\n\n1. reads the code, forms a plausible theory,\n2. patches the theorized spot — the patch is often *correct in isolation*,\n3. tests by outcome (\"is the symptom gone?\"), sees it's not (or worse, it flakes), goto 1.\n\nThe loop burns rounds because outcome-testing can't distinguish \"patch wrong\" from \"patch right but never reached\" from \"patch reached but its effect cancelled by something upstream.\" All three look identical: symptom persists.\n\n## The rule\n\n**Before fix attempt N+1 on any surface that has already eaten one invisible failure, the surface logs its own decisions.** Not `console.log` scattered during debugging and deleted after — a small permanent trail: which branch ran, which candidate won, what got cancelled, with enough context to replay the decision. Then reproduce once and read what it *says it did*. The bug names itself; deltas between \"what the code should do\" and \"what the trail shows\" are exactly the diagnosis.\n\n## The tripwire pattern (for \"app looks frozen/wedged\" bugs)\n\nWhen the failure mode is *the UI itself wedging*, the instrument must survive the patient:\n\n- **Framework-free by design.** If React is wedged, an instrument that renders through React dies with it. Vanilla listeners + imperative DOM only.\n- **Armed pre-mount, always on** (dev builds), not attached when debugging starts — intermittent bugs don't schedule appointments.\n- **A capture-phase input ring buffer** (last N pointer-downs, each with its `elementsFromPoint` hit-test stack) — shows what actually ate the clicks made *while frozen*.\n- **A global hotkey that snapshots the DOM facts open theories disagree about** — full-viewport fixed/absolute layers with computed pointer-events/opacity/visibility, `document.getAnimations()`, portal roots, a hit-test grid — and **persists to disk via the backend**, with a localStorage fallback if IPC is also down. The dump must survive the kill-and-restart that follows a freeze.\n- **Stamp the relevant state machine onto the DOM** (`data-*` attributes on `<html>` + a bounded in-memory transition log included in the dump), so the dump names the wedged variable directly instead of leaving it to inference.\n\nCost: ~250 lines, one evening. It converted \"recurring unexplainable freeze, three failed theories\" into a mechanism-level diagnosis from a single user-captured dump — twice, for two different bugs.\n\n## When it's overkill\n\nFirst failure on a surface, with a visible error or a deterministic repro — just fix it. The rule triggers on the *second* attempt at the same symptom, or the first attempt on a surface whose failures are known to be silent (fire-and-forget async, `catch {}` blocks, best-effort fallback chains). Corollary worth auditing for: every `catch(() => {})` in a dismiss/cleanup path is a future invisible failure — at minimum, log it to the trail."}, {"id": "keep-mounted-screens-stale-external-reads.md", "title": "Keep-mounted screens turn mount-only reads of external state into boot-time snapshots", "kind": "pattern", "last_verified": "2026-07-31", "stack": ["react", "tauri", "desktop", "state-management"], "groups": ["Frameworks & Libraries", "Platforms & Runtimes"], "description": "Keep-mounted screens turn mount-only reads of external state into boot-time snapshots — the screen looks live but is answering from whenever it first mounted.", "content": "# Keep-mounted screens turn mount-only reads of external state into boot-time snapshots\n\n> Caught twice in one hour on Playmoir (2026-07-31), on two different surfaces\n> reading the same OS fact, staleness pointing in both directions. The\n> architecture that causes it is common and deliberate: screens that never\n> unmount (visibility via a class toggle, so navigation is a cross-fade and\n> per-screen state survives). The cost is invisible until a second writer\n> shows up.\n\n## The failure shape\n\nA component reads externally-owned state (an OS registry flag, a file, another\nprocess's setting — anything the app does not own) in a mount-only effect:\n\n```tsx\nuseEffect(() => {\n  void isAutostartEnabled().then(setAutostart);\n}, []);\n```\n\nIn a router that unmounts screens, this re-runs on every visit and looks\ncorrect for years. In a keep-mounted shell, **mount is app boot** — the read\nhappens once per process. The toggle it renders is a boot-time snapshot:\n\n- Settings showed autostart OFF after another surface enabled it; a hard\n  reload (re-running mount) \"fixed\" it — the tell.\n- The subtle variant: a surface that resets **on departure** (a remount keyed\n  to leaving, so returning is fresh) reads the state at the moment the user\n  LEAVES — exactly one interaction before they change it on the next screen.\n  It re-read, and was still stale by one toggle.\n\nThe bug is invisible with one writer, because the only writer is also the only\nreader and it updates its own local state optimistically. It surfaces the day a\nSECOND writer appears (another screen, a tray menu, the OS itself via Task\nManager) — which is also the day you least expect a years-old read to be the\nproblem.\n\n## The fix: read on ARRIVAL, keyed on visibility\n\nThe shell already knows which screen is showing. Thread that down and key the\nread on it:\n\n```tsx\nuseEffect(() => {\n  if (!visible) return;\n  void isAutostartEnabled().then(setAutostart);\n}, [visible]);\n```\n\nEvery arrival re-reads; the surface can no longer disagree with reality by more\nthan one visit. Departure-keyed resets are the wrong moment for reads — reset\non departure if you must, but *read* on arrival.\n\n## Rules of thumb\n\n- **Own-state can be derived or evented; external state must be re-read.**\n  For flags your app owns, prefer deriving them from already-correct state\n  (see [[derive-dont-track-ui-flags]] — that pattern eliminates reset paths).\n  External state has no event you can subscribe to (the OS won't tell you\n  about Task Manager), so polling-on-arrival is the honest floor.\n- Audit trigger: **the moment you add a second writer for any external fact,\n  grep every reader of that fact for `}, [])`.** In a keep-mounted app, each\n  one is a boot snapshot.\n- \"A hard reload fixes it\" is the diagnostic signature — reload is the only\n  thing that re-runs mount-only effects in a keep-mounted shell.\n- Comments like \"read from the OS, never from a cached flag\" on a mount-only\n  effect are describing an intention the lifecycle doesn't deliver. The read\n  IS a cache; the question is only when it refreshes."}, {"id": "local-first-sync-with-d1.md", "title": "Local-First Sync to Cloudflare D1 — Patterns that survived contact with reality", "kind": "architecture", "last_verified": "2026-05-15", "stack": ["cloudflare-worker", "d1", "sqlite", "tauri"], "groups": ["Cloud & Backend", "Platforms & Runtimes"], "description": "13 patterns for building local-first sync against Cloudflare D1: field-level outbox, UUID identity, user-scoped writes, Worker-side defense, chunking that doesn't split row identity, tombstones with matched retention. The ones that survived production.", "content": "# Local-First Sync to Cloudflare D1 — Patterns that survived contact with reality\n\n> One month of building cross-device sync taught us roughly a dozen things that aren't in any tutorial. Most of them caused production incidents before we figured them out. This is the surviving design.\n\n## The Problem\n\nYou're building a local-first app: SQLite (or similar) on each device, cloud as an \"authoritative-but-optional\" mirror. Users want their data to appear on a second device without manual export/import. The naive approach — \"sync the rows\" — fails in subtle ways once two devices write concurrently or one device gets reinstalled.\n\nThis lesson is the patterns we used to make local-first sync against Cloudflare D1 actually work, including the bugs we shipped (and shipped fixes for) along the way.\n\n---\n\n## Architecture: 3 layers, 1 wire format\n\n```\n┌─────────────────┐    ┌──────────────────┐    ┌──────────────────┐\n│ Frontend writes │──→ │ Local outbox     │──→ │ Cloud Worker     │\n│ (React/TS)      │    │ (Rust IPC)       │    │ (Hono on D1)     │\n│                 │    │                  │    │                  │\n│ trackChanges()  │    │ sync_push        │    │ /api/sync/push   │\n│ on every INSERT │    │ sync_pull        │    │ /api/sync/pull   │\n│ /UPDATE         │    │ (sqlite outbox)  │    │ (D1 + R2)        │\n└─────────────────┘    └──────────────────┘    └──────────────────┘\n```\n\nFrontend feature code never talks to the cloud directly. It writes to a local `sync_outbox` table via `trackChanges()` and the Rust layer drains it. This decoupling is what makes the app work offline — when the Worker is unreachable, writes accumulate in the outbox and drain whenever connectivity returns.\n\n---\n\n## Pattern 1: Field-level outbox, NOT row-level\n\n**Wrong:** queue whole rows. `INSERT INTO sync_outbox (table, row_id, row_json) VALUES (...)`.\n\n**Right:** queue individual field changes. Each row is `(table, row_id, field, value, updated_at, uuid, parent_uuid)`.\n\nWhy: field-level is what makes per-field last-write-wins work. Device A edits notes; Device B edits status; both pushes drain cleanly and both edits land. Row-level forces you to merge JSON blobs or pick a winner-take-all, which destroys real user edits when two devices touch different fields on the same row.\n\nThe cloud stores a `field_timestamps` JSON column on each table that records when each field was last updated. Conflict resolution is per-field — compare the incoming `updated_at` against `field_timestamps[field]`, accept if newer, otherwise reject silently.\n\n```sql\n-- Local outbox row shape\nCREATE TABLE sync_outbox (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  table_name TEXT NOT NULL,           -- 'games', 'journal_entries', etc.\n  row_id INTEGER NOT NULL,            -- local SQLite rowid\n  uuid TEXT,                          -- cross-device identity (Pattern 2)\n  parent_id INTEGER,                  -- for child rows: local parent rowid\n  parent_uuid TEXT,                   -- for child rows: parent's cross-device uuid\n  field TEXT NOT NULL,                -- 'notes', 'status', 'deleted_at', etc.\n  value TEXT,                         -- JSON-encoded value; NULL = column is NULL\n  updated_at INTEGER NOT NULL,        -- ms since epoch, set by writer\n  user_id TEXT                        -- account scoping (Pattern 3)\n);\n```\n\n---\n\n## Pattern 2: UUID v4 from day 1 — NEVER use AUTOINCREMENT for cross-device identity\n\nThis was the most painful lesson. We initially used local SQLite `AUTOINCREMENT` ids as the cross-device identifier. It collapses the moment two devices independently observe the same logical row (e.g. both scan the same Steam library):\n\n- Device A inserts game \"ESO\" with `id=42`. Pushes to cloud.\n- Device B is fresh-installed, scans Steam, inserts game \"ESO\" with `id=42` (autoincrement starts at 1 on each device).\n- Device B pushes. Cloud sees two writes to game `id=42` — they conflict on every field, LWW picks one, the other device's edits silently lose.\n\n**Fix:** every row carries a `uuid` column (UUID v4) generated at INSERT time, client-side. The cloud uses `uuid` as the identity key. `client_id` (the local rowid) is wire-format-only, used to route field changes through the outbox; it never leaves the device as identity.\n\n```typescript\n// Frontend INSERT site\nconst uuid = crypto.randomUUID();\nawait db.exec('INSERT INTO games (uuid, name, ...) VALUES (?, ?, ...)', [uuid, name, ...]);\nawait trackGame(rowid, { uuid, name, ... });\n```\n\nFor child rows (e.g. `journal_entries.game_id`), the outbox row also carries `parent_uuid` — the parent's cross-device uuid. The cloud uses `parent_uuid` to resolve which cloud row this child belongs to, falling back to `parent_id` only for legacy rows that pre-date the uuid migration.\n\n**Backfill is pure SQL** — if your project ships before the migration, you can backfill UUIDs in a SQLite migration without any Rust/JS code:\n\n```sql\n-- Migration: backfill UUIDs for existing rows\nUPDATE games SET uuid =\n  lower(hex(randomblob(4))) || '-' ||\n  lower(hex(randomblob(2))) || '-4' ||\n  substr(lower(hex(randomblob(2))), 2) || '-' ||\n  substr('89ab', 1 + (abs(random()) % 4), 1) ||\n  substr(lower(hex(randomblob(2))), 2) || '-' ||\n  lower(hex(randomblob(6)))\nWHERE uuid IS NULL;\n```\n\nVerify with `SELECT uuid FROM games LIMIT 1` — the format should be `xxxxxxxx-xxxx-4xxx-[89ab]xxx-xxxxxxxxxxxx` (UUID v4 with the version + variant bits in the right positions).\n\n---\n\n## Pattern 3: User-scoped outbox writes — sign-out is NOT free\n\n**Bug we shipped:** sign out from account A, sign in as account B on the same device, and the rows account A had pending in the outbox would drain to **account B's cloud namespace** the moment the next push fired. Real cross-account data leak.\n\n**Fix:** every outbox row carries a `user_id` column. The Rust `sync_push` filters `WHERE user_id = ?` (active user). Rows tagged with a different `user_id` stay queued and only drain when that user signs back in.\n\nThree protocol changes you need:\n\n1. **Sign-in IPC** persists the user_id to `sync_meta` AND runs `UPDATE sync_outbox SET user_id = ? WHERE user_id IS NULL` to claim pre-sign-in writes for the first account that authenticates.\n2. **Sign-out IPC** clears the active user_id meta key. Subsequent offline writes land with `user_id = NULL` and get claimed by the next sign-in.\n3. **Push filter** scopes the SELECT by active user_id. Returns a clear error if the meta key is empty (recovery: re-sign-in).\n\n```rust\n// Sign-in\npub async fn sync_set_user_id(pool: &SqlitePool, user_id: String) -> Result<(), String> {\n    set_meta(&pool, \"user_id\", &user_id).await?;\n    sqlx::query(\"UPDATE sync_outbox SET user_id = ? WHERE user_id IS NULL\")\n        .bind(&user_id)\n        .execute(&pool)\n        .await\n        .map_err(|e| e.to_string())?;\n    Ok(())\n}\n```\n\n---\n\n## Pattern 4: Defense in depth — Worker-side cross-user identity check\n\nPattern 3 prevents leaks at the client. But a buggy or compromised client could send pushes tagged with the wrong user. The Worker MUST defend independently.\n\nBefore applying any row from a push, batch-SELECT all incoming uuids per table. The naive predicate is the trap — **the correct predicate is subtler than it looks**:\n\n### Wrong predicate (rejects legitimate writes)\n\n```typescript\n// ❌ DON'T: reject if ANY other user has this uuid\nfor (const row of leakRows) {\n  if (row.user_id !== currentUserId) {\n    rejectGroup(row.uuid);  // bug: also rejects when current user ALSO owns the uuid\n  }\n}\n```\n\nThis fails on the **historical-pollution case**: a uuid that exists under BOTH the current user (legitimately) AND another user (from a pre-fix leak). The legitimate write gets blocked because the predicate sees the foreign-user row first.\n\n### Correct predicate (group by uuid, check ownership across all rows)\n\n```typescript\n// ✅ DO: reject only if another user owns it AND I don't\nconst ownersByUuid = new Map<string, { hasMe: boolean; otherCount: number }>();\nfor (const row of leakRows) {\n  const e = ownersByUuid.get(row.uuid) ?? { hasMe: false, otherCount: 0 };\n  if (row.user_id === currentUserId) e.hasMe = true;\n  else e.otherCount += 1;\n  ownersByUuid.set(row.uuid, e);\n}\n\nfor (const [uuid, owners] of ownersByUuid) {\n  if (owners.hasMe) continue;       // I own it — accept (pollution case OR normal update)\n  if (owners.otherCount === 0) continue;  // No conflict — fall through to INSERT\n  rejectGroup(uuid);                // Exclusively another user's — REJECT\n}\n```\n\nThe downstream `UPDATE ... WHERE user_id = ? AND uuid = ?` is the actual cross-user isolation backstop. This check is just the early \"fail fast\" guard — it's safe to accept the pollution case because the SQL WHERE clause physically prevents touching another user's row regardless.\n\n### CRITICAL: ordering matters — run this AFTER identity reconciliation\n\nIf your push pipeline also has a \"steam_appid identity reconciliation\" phase (Pattern 10 sibling — rewriting incoming uuid to the user's canonical uuid when steam_appid matches), **that phase MUST run BEFORE the cross-user check**. Otherwise:\n\n1. Incoming uuid is from device X's local DB (pre-reconciliation).\n2. Cross-user check sees uuid belongs to another user, REJECTS.\n3. Phase that would have rewritten the uuid to the current user's canonical never runs.\n\n```typescript\n// Correct pipeline order:\n// Phase 1:   group + validate\n// Phase 1.5: steam_appid reconciliation (mutate group.uuid to current user's canonical)\n// Phase 1.7: cross-user uuid leak check (uses POST-mutation uuid)\n// Phase 2:   apply LWW + write batch\n```\n\nCost: one extra batched read per push (the leak check), no extra round-trip. Equivalent to row-level security in Postgres (which you can't enforce declaratively in D1).\n\n### Sign-off cases for the correct predicate\n\n| Cloud state for incoming uuid | Decision | Why |\n|---|---|---|\n| Nobody has it | ACCEPT | New row — let INSERT OR IGNORE handle it |\n| Only I have it | ACCEPT | Normal update on my row |\n| Another user has it, I don't | REJECT | Attack / forged uuid — defense fires |\n| Both another user AND I have it | ACCEPT | Pollution case — my UPDATE only touches my row |\n\n---\n\n## Pattern 5: Server-side allowed-fields whitelist\n\nNever let push payloads write arbitrary columns. Both the client AND the server should hold an explicit list of allowed `(table, field)` pairs.\n\n```typescript\nconst ALLOWED_FIELDS: Record<string, ReadonlySet<string>> = {\n  games: new Set(['name', 'platform', 'status', 'deleted_at', /* ... */]),\n  journal_entries: new Set(['notes', 'intention_1', 'deleted_at', /* ... */]),\n  journal_screenshots: new Set(['r2_key', 'sort_order', 'deleted_at']),\n};\n\nif (!ALLOWED_FIELDS[change.table]?.has(change.field)) {\n  errors.push(`rejected: ${change.table}.${change.field} not in whitelist`);\n  continue;\n}\n```\n\nMirror this on the pull side too — the client must reject server-sent fields it doesn't recognize (defends against a compromised server pushing into unsupported columns).\n\n---\n\n## Pattern 6: D1 `db.batch()` for chunking — drops subrequest count to near-constant\n\nD1 has a 50-subrequest-per-request limit on the free plan (1000 on paid). A naive push of N rows fires N separate `db.prepare().bind().run()` calls = N subrequests = backfills die at ~50 rows.\n\n**Fix:** wrap all writes in `env.DB.batch([...])`. Cloudflare counts a batched call as ~1-3 subrequests total regardless of statement count.\n\n```typescript\nconst statements = changes.map(c =>\n  env.DB.prepare(`UPDATE ${c.table} SET ${c.field} = ? WHERE uuid = ?`)\n    .bind(c.value, c.uuid)\n);\nconst results = await env.DB.batch(statements);\n```\n\nIn our case: 4000-row backfill dropped from ~15 min (timeouts + retries on rate limits) to <1 min after switching to `db.batch()`. The new bottleneck became the per-user rate limit, not subrequest budget.\n\n---\n\n## Pattern 7: Tokio Mutex to serialize push — kill the debounced/manual race\n\nIf you have both auto-push (debounced on outbox writes) AND manual \"Sync now\" buttons, they race. N parallel push calls each individually hit the per-user rate limit, all 429, burn the retry budget competing with each other.\n\n```rust\n// Process-wide push lock. OnceLock<Mutex<()>> initialized once.\nstatic SYNC_PUSH_LOCK: OnceLock<Mutex<()>> = OnceLock::new();\n\n#[tauri::command]\npub async fn sync_push(app: AppHandle) -> Result<SyncPushResult, String> {\n    let lock = SYNC_PUSH_LOCK.get_or_init(|| Mutex::new(()));\n    let _guard = lock.lock().await;\n    // ...rest of push logic; whoever holds the lock drains the outbox snapshot\n    // it read at start; next caller picks up rows added during the previous push\n}\n```\n\nAwaiting the lock is intentional — concurrent callers queue rather than fail. Each holder reads the outbox fresh, so a row written between two pushes still gets delivered in the second push.\n\n---\n\n## Pattern 8: Rate-limit + Retry-After exponential backoff\n\nThe Worker should rate-limit per user (e.g. 30-100 pushes/minute) using a sliding window. The client must honor `Retry-After` on 429:\n\n```rust\nconst MAX_RATE_LIMIT_RETRIES: u32 = 5;\nconst RATE_LIMIT_FALLBACK_SECS: u64 = 65;  // 60s window + 5s buffer\n\nlet mut retries: u32 = 0;\nlet resp = loop {\n    let r = client.post(...).send().await?;\n    if r.status().as_u16() == 429 && retries < MAX_RATE_LIMIT_RETRIES {\n        let wait_secs = r.headers()\n            .get(\"retry-after\")\n            .and_then(|v| v.to_str().ok())\n            .and_then(|s| s.parse::<u64>().ok())\n            .unwrap_or(RATE_LIMIT_FALLBACK_SECS);\n        let _ = r.text().await;  // drain body before sleeping\n        tokio::time::sleep(Duration::from_secs(wait_secs)).await;\n        retries += 1;\n        continue;\n    }\n    break r;\n};\n```\n\nPer-chunk retries (not per-request) — a long backfill can survive multiple rate windows without losing earlier progress.\n\n---\n\n## Pattern 9: Group-by-row chunking — fields of the same row MUST NOT split across chunks\n\nIf you naively split outbox rows into fixed-size chunks, you can split a single logical row's fields across two pushes. The server applies chunk 1 (some fields), then chunk 2 (other fields) — but if your server-side dedupe relies on a specific identity field (e.g. `steam_appid` for game rows), that field might not be in chunk 1, so chunk 1 inserts an orphan row with NULL identity. Now you have a polluted cloud row that's hard to clean up.\n\n**Fix:** group outbox rows by `(table, client_id)` before chunking. Pack greedily — never split a group. Oversize single groups (a row with >chunk-size fields) get their own chunk.\n\n```rust\nlet mut group_indices: HashMap<(String, i64), Vec<usize>> = HashMap::new();\nlet mut group_order: Vec<(String, i64)> = Vec::new();\nfor (idx, change) in all_changes.iter().enumerate() {\n    let key = (change.table.clone(), change.client_id);\n    if !group_indices.contains_key(&key) {\n        group_order.push(key.clone());\n    }\n    group_indices.entry(key).or_insert_with(Vec::new).push(idx);\n}\n\n// Greedy bin-pack\nlet mut packed_chunks: Vec<Vec<usize>> = Vec::new();\nlet mut current: Vec<usize> = Vec::new();\nfor key in &group_order {\n    let group = &group_indices[key];\n    if !current.is_empty() && current.len() + group.len() > PUSH_CHUNK_SIZE {\n        packed_chunks.push(std::mem::take(&mut current));\n    }\n    current.extend(group);\n}\nif !current.is_empty() {\n    packed_chunks.push(current);\n}\n```\n\nWe hit this in production: a 595-row backfill produced 479 orphan rows in cloud because ~50 game rows had their `steam_appid` field land in chunk N+1 while the rest of the fields landed in chunk N. Cleanup required a bespoke SQL script. Don't do this.\n\n---\n\n## Pattern 10: trackChanges ALWAYS emits identity fields\n\nRelated to Pattern 9: even if a write only touches one field, the `trackChanges` writer should emit the row's identity field alongside (e.g. `steam_appid` for games, `entry_type` for journal entries). This lets server-side dedupe always have the identity in scope for a row write, no matter which field-level change triggered the push.\n\n```typescript\nasync function trackGame(rowid: number, fields: Partial<Game>) {\n  const identity = await fetchGameIdentity(rowid);  // steam_appid + uuid\n  const enriched = {\n    steam_appid: identity.steam_appid,  // always included\n    ...fields,\n  };\n  await emitOutboxRows('games', rowid, enriched, identity.uuid);\n}\n```\n\nCheap defense — adds 1 extra outbox row per push at most (or zero if the field was already in the change set). Server-side dedupe gets simpler.\n\n---\n\n## Pattern 11: Tombstones with mirrored retention\n\nHard deletes don't sync. If Device A deletes a row and Device B is offline, B has no way to know — when B reconnects and pulls, the row is just *gone*, and B's local copy resurrects on the next push.\n\n**Fix:** soft-delete via a `deleted_at` timestamp column. Push the `deleted_at` field through sync like any other field. Cascade children-first (`UPDATE journal_screenshots SET deleted_at = ? WHERE entry_id IN (...)`, then entries, then the game). Then a startup GC purges rows whose `deleted_at` is past the retention window.\n\n```typescript\n// gc.ts — runs on app boot\nconst TOMBSTONE_RETENTION_DAYS = 30;\nconst cutoff = Date.now() - TOMBSTONE_RETENTION_DAYS * 86400000;\nawait db.exec('DELETE FROM games WHERE deleted_at IS NOT NULL AND deleted_at < ?', [cutoff]);\n// ... same for child tables\n```\n\n**Critical: retention window MUST match between client and server.** Mismatch causes resurrection bugs. Example: client retains 30 days, server retains 7 days. Device A deletes a row on day 0. Device B is offline. Day 8: server GCs the tombstone. Day 9: Device B comes online, pulls, sees no `deleted_at` for the row, has its own local copy, pushes it as a \"new\" row. Row resurrects.\n\nPin the constant in shared code or as a Worker env var; assert on startup if mismatched.\n\n---\n\n## Pattern 12: First-login backfill is one-shot, guarded by a meta flag\n\nWhen a user signs in for the first time on a device that already has local data, push ALL existing rows once. Use a `sync_meta.initial_backfill_done` flag to guard against re-backfilling.\n\n```typescript\nasync function maybeBackfill() {\n  const done = await getMeta('initial_backfill_done');\n  if (done === 'true') return;\n\n  const games = await db.exec('SELECT * FROM games WHERE deleted_at IS NULL');\n  for (const g of games) await trackGame(g.id, g);\n  // ... same for entries, screenshots\n\n  await setMeta('initial_backfill_done', 'true');\n}\n```\n\n**Known limitation:** sign-out and re-sign-in as a different account on the same PC will NOT re-backfill. The flag persists. For v1 this is acceptable; for multi-account UX, namespace the flag by `user_id`: `initial_backfill_done_${user_id}`.\n\n---\n\n## Pattern 13: Last-pulled-at reset on factory reset\n\nIf your app has a \"factory reset\" / \"disconnect and wipe\" path, it must reset `sync_meta.last_pulled_at` to 0. Otherwise the next sync won't pull anything because the server filters by `since > last_pulled_at` and your local data is gone.\n\n```rust\n// Factory reset path\nsqlx::query(\"DELETE FROM games\").execute(&pool).await?;\nsqlx::query(\"DELETE FROM journal_entries\").execute(&pool).await?;\nsqlx::query(\"DELETE FROM sync_outbox\").execute(&pool).await?;\nset_meta(&pool, \"last_pulled_at\", \"0\").await?;  // ← critical\n```\n\nSkipping this turns factory-reset into \"factory-reset-and-stay-empty-forever\" because the cloud will only send rows whose timestamp is > last_pulled_at, which is set to \"yesterday afternoon.\"\n\n---\n\n## What NOT to do\n\n- **Don't sync binary blobs through the outbox.** Cover images, audio files, etc. belong in R2 (or equivalent object storage). The outbox row carries the R2 key (a short string); the blob uploads on a separate transport. Putting blobs in the outbox makes pushes huge, slow, and exposes you to multipart-encoding fights.\n- **Don't rely on cookies for the sync auth token.** Native apps and webviews don't share cookie jars with the system browser. Use a bearer token, store it in your local DB (`sync_meta.auth_token`), and send `Authorization: Bearer ...` on every sync request.\n- **Don't trust `client_id` as identity** — it's only valid within one device. The only identity that crosses devices is `uuid`.\n- **Don't skip the per-field LWW comparison server-side.** \"I'll just take the latest push\" forgets that two devices can push concurrently and chunk ordering means the wrong write can win.\n- **Don't put the `Mutex` around the HTTP call only.** It has to wrap the outbox read + HTTP + outbox cleanup. Otherwise two callers each read the same outbox snapshot and double-push the same rows.\n\n---\n\n## Reference implementation layout\n\nThis pattern was first proven in a Tauri 2 + Cloudflare Worker + D1 desktop app. File layout in a project of that shape:\n\n- Outbox writers (TS): `packages/frontend/src/features/sync/outbox.ts`\n- Tombstone helpers (TS): `packages/frontend/src/features/sync/tombstones.ts`\n- GC (TS): `packages/frontend/src/features/sync/gc.ts`\n- Sync IPC commands (Rust): `apps/desktop/src-tauri/src/commands/sync/` (split: push, pull, status, auth, shared)\n- Worker sync handlers (TS): `apps/cloud/src/sync/{push,pull,gc,routes}.ts`\n- Shared types (TS): `packages/core/src/sync.ts` — wire-format types used by both client and Worker, validated via Zod"}, {"id": "local-fixture-reverts-under-authoritative-sync.md", "title": "A local-only dev fixture silently reverts under a sync engine that owns the same columns", "kind": "gotcha", "last_verified": "2026-07-29", "stack": ["local-first", "sync", "powersync", "sqlite", "dev-tooling", "reliability"], "groups": ["Cloud & Backend", "Data & Sync", "Other"], "description": "Your \"seed test data\" / \"backdate this record\" debug button writes locally, the UI renders it, and it evaporates seconds later because the sync engine upserts the server's row back down. The diagnostic is that it reverts **partially** — server-owned columns snap back, client-owned ones survive — which is proof of mechanism and also hands you the fix. Plus the trap that cost the most: a suppression flag existed, was correctly named and documented, and guarded a different sync path than the one doing the damage, which is worse than no flag at all.", "content": "# A local-only dev fixture silently reverts under a sync engine that owns the same columns\n\n**One-liner:** your \"seed some test data\" / \"backdate this record\" debug button writes to the local database, the UI renders it, and a few seconds later it evaporates — because a server-authoritative sync engine upserts the real row back down on its next tick; the giveaway is that it **partially** reverts (the columns the server owns snap back, the ones it doesn't survive), and the guard you already wrote to prevent this probably guards a different sync path than the one doing the damage.\n\n## Why this bites specifically in local-first apps\n\nDev tooling almost always predates the sync layer. When the app was local-only, \"UPDATE the row, reload, look at it\" was a complete and durable operation. Then sync lands, the server becomes authoritative for some columns, and every one of those debug helpers quietly becomes a write that gets rolled back — with no error, no log line, and no test failure, because nothing about a fixture asserts that it *stayed*.\n\nThe fixture still \"works\" in the sense that the write succeeds. It just doesn't persist.\n\n## The symptom, precisely\n\nNot \"it doesn't work.\" It's:\n\n1. Click the debug button. It reports success.\n2. The app reloads and the UI shows exactly what you expected.\n3. Within seconds — often before you've finished reading the screen — the data reverts and the UI empties.\n\nIf you're not watching closely you'll report this as \"it flashed and disappeared,\" and start looking at your render logic. The render logic is fine.\n\n## The diagnostic that identifies it in one query: partial revert\n\nThis is the tell, and it's what separates this from a UI bug, a race, or a bad query.\n\nDump the state *after* it reverts and compare against what the fixture wrote. You will find a split:\n\n| What the fixture wrote | State after revert | Who owns it |\n|---|---|---|\n| `journal_entries.created_at` shifted back 16 days | **still 16 days back** | client |\n| `games.last_played_at` set to 16 days ago | **back to 2 hours ago** | server |\n| `games.status` forced to `'playing'` | **back to `NULL`** | server |\n\nA UI bug does not revert three columns and leave a fourth. **A clean split along \"which side is authoritative for this column\" is proof of the mechanism**, and it also hands you the fix, because it tells you exactly which writes need help and which don't.\n\nConcretely, the offending path looks like this — an ordinary sync-down that upserts the whole row:\n\n```sql\n-- runs on every sync tick, from the server's copy\nINSERT INTO games (uuid, name, last_played_at, status, ...)\nVALUES (...)\nON CONFLICT(uuid) DO UPDATE SET last_played_at = excluded.last_played_at,\n                                status         = excluded.status, ...\n```\n\nNothing is wrong with that statement. It is doing its job. Your fixture just isn't part of the conversation.\n\n## The trap: a guard that names the right intent and the wrong mechanism\n\nHere's the part that cost the most time, and it generalises well beyond sync.\n\nThe codebase already had a flag for exactly this problem:\n\n```ts\n/** Debug-only flag set by the \"simulate stale data\" button. While truthy,\n *  auto-sync is suppressed so the backdated timestamp doesn't get\n *  overwritten by the real value on the next focus event. */\nexport const SIMULATE_KEY = 'simulate-active';\n```\n\nRead that comment. It states the exact failure. Someone had already hit this, understood it, and written a guard.\n\nThe guard suppressed **the focus-triggered library sync** — a client-initiated pull that fires when the window regains focus. The thing actually reverting the data was **the sync engine's down-stream write**, a completely different code path that the flag never touched.\n\nSo the flag was real, correctly named, correctly documented, and irrelevant. And it was *worse* than having no flag at all, because reading it convinces you the case is handled and sends you looking somewhere else.\n\n> **The generalisable rule:** when a guard exists for the symptom you're seeing and the symptom is happening anyway, do not assume the guard is buggy. Check whether it guards the mechanism you're actually facing. \"There's a flag for that\" is a hypothesis, not a finding.\n\n## Fixes, in order of how much they cost\n\n**1. Mirror the fixture write to the server.** If your client is already allowed to patch that column, the fix is one call — write locally *and* push the same value up, so the next sync-down agrees with you instead of correcting you:\n\n```ts\nawait db.execute(\"UPDATE games SET status = 'playing' WHERE id = $1\", [id]);\nawait patchRowInCloud(id, { status: 'playing' });   // <- the whole fix\n```\n\nCheck whether a *working* fixture elsewhere in the codebase already does this. Ours did: a different debug tool had the mirror call and a comment reading \"so the next down-sync agrees instead of reverting us.\" One helper had learned the lesson and the other hadn't.\n\n**2. Accept that some columns can't be mirrored, and make the fixture not need them.** Not every column is client-patchable. If a server-side integration owns it (a storefront's \"last played\" timestamp, a billing system's plan field), a client PATCH is either rejected by your allowlist or accepted and then clobbered by the next integration run. In that case, change what the *feature* reads while the fixture is active:\n\n```ts\n// Normally: the later of a logged session and the storefront's timestamp.\n// While simulating: the session timestamp alone — the only half a local\n// fixture can make stick, because the other is server-owned.\nconst touched = simulating\n  ? 'IFNULL(entry.created_at, 0)'\n  : 'MAX(IFNULL(entry.created_at,0), IFNULL(g.last_played_at,0))';\n```\n\nBe honest that this puts a dev-only branch inside a production query. It is a wart. It's justified when the alternative is a fixture layer bigger than the feature under test — but write down *why*, because the next person will otherwise delete it as debug cruft, and one such branch is a special case while two is a pattern that needs a real seam.\n\n**3. Build a fixture layer sync doesn't own.** A dev-only offline mode, a seeded local-only account, or a test double for the sync client. Correct, and usually more work than the thing you're testing.\n\n## The prevention\n\n**Any dev helper that writes to a synced table should be treated as production code with respect to the sync contract.** Practically:\n\n- When you add sync to an app that has debug tooling, audit that tooling. It won't announce that it broke.\n- Have fixtures assert persistence, not just the write — re-read after a sync tick, not immediately.\n- Put the reason in a comment at the fixture, naming the sync path, not just \"don't remove this.\"\n\n## Related\n\n- [powersync-steam-backend-architecture.md](./powersync-steam-backend-architecture.md) — the architecture this shows up in: server-authoritative rows streamed down over a local SQLite mirror.\n- [local-first-sync-with-d1.md](./local-first-sync-with-d1.md) — the general local-first sync shape.\n- [n-copies-of-truth-drift-guard.md](./n-copies-of-truth-drift-guard.md) — the same family of bug: two places that must agree, only one of which you edited.\n- [instrument-before-patching.md](./instrument-before-patching.md) — dumping the post-revert state instead of theorising is what turns this from a week into an hour."}, {"id": "local-sqlite-app-wide-change-signal.md", "title": "A local DB with no live-query layer needs ONE explicit \"data changed\" signal — or writers outside the original poke inventory go stale silently", "kind": "pattern", "last_verified": "2026-07-20", "stack": ["local-first", "sqlit
