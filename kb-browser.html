e", "tauri", "react", "sync"], "groups": ["Cloud & Backend", "Data & Sync", "Frameworks & Libraries", "Platforms & Runtimes"], "description": "A local DB with no live-query layer needs ONE coalesced \"data changed\" signal with every write choke point as a producer, or writers outside the original ad hoc poke inventory (a second window, a background sync engine) go stale with zero errors. Includes a debugging trap: verify data actually reached the layer before assuming the missing piece is the signal itself.", "content": "# A local DB with no live-query layer needs ONE explicit \"data changed\" signal — or writers outside the original poke inventory go stale silently\n\n**One-liner:** if your UI reads a plain local database (not a watchable/reactive store), no screen can subscribe to changes — every screen only re-queries when something explicitly tells it to. Building that \"something pokes it\" wiring feature-by-feature, ad hoc, guarantees you'll eventually add a writer (a second window, a background sync engine, an external event) that nobody's poke inventory covers, and it goes stale with no error anywhere.\n\n## The shape of the trap\nTwo data layers can coexist in one app with very different change-notification guarantees: a sync engine's own local replica is often watchable/reactive by design, while the app's actual query surface (a separate local SQLite file the sync layer mirrors *into*) frequently isn't. If your screens query the second layer, \"the sync engine mirrored the row\" and \"the currently-mounted screen knows to re-render\" are two completely separate facts — mirroring correctly is necessary but not sufficient.\n\nThe failure compounds because poke wiring gets built per-feature: screen A gets a refresh bump wired for the actions its author was thinking about (mount, an explicit sync button, window focus). Every writer outside that mental model — a **second window** in a multi-window desktop app, the sync engine's own background arrivals, another screen's write this screen's author didn't anticipate — reaches zero consumers. Multiple independent-looking bugs (a stale grid order, a stale detail screen, a stale list after a background save from another window) are frequently **one root cause wearing different clothes**. If you're finding \"yet another place that doesn't refresh\" more than once in a session, stop patching sightings individually and look for the systemic gap.\n\n## The fix: one coalesced signal, N producers, ONE consumer that already exists\n- **One event/signal** (\"data changed\"), tagged with a source for debugging — not a bespoke custom event per writer.\n- **Every write choke point is a producer**, including ones outside the obvious in-process call graph: bridge writes across windows with a native app-level event (don't assume \"same app\" means \"same JS heap\" in a multi-window desktop shell), and make the sync engine's own write-through/mirror step announce when it *actually changed rows*, not just when it ran.\n- **One consumer**: wire the new signal into the top-level \"refresh key\" / query-invalidation mechanism most apps already have for their explicit refresh button, coalesced (leading-edge instant + a short trailing debounce to fold a burst of arrivals into one re-render). You're not converting every screen to a live query — you're making sure the ONE lever that already re-queries everything gets pulled by everything that should pull it.\n- **Retire only the genuinely redundant ad hoc pokes it replaces.** Audit each existing custom event/counter individually; fold it in, or leave it with a comment stating why it's semantically distinct (see below).\n\n## The debugging trap this pattern's own postmortem surfaced: don't assume the wiring is what's missing\nWhen this was implemented for real, the flagship symptom (a stale grid after a cross-device sync) turned out NOT to be \"no signal existed\" — a refresh-bump wire had existed for a long time, and the consumer WAS listening. The actual bug was one layer deeper: the mirror step had a re-entrancy guard that silently **dropped** an incoming change notification arriving while an earlier batch was still being mirrored (a large first batch on cold boot creates exactly this window) — so the data never even reached local storage, and no amount of \"re-query on signal\" fixes a re-query that reads a row that was never written. Lesson: when \"add the missing signal\" is the theorized fix, verify the data actually reaches the layer a re-query would read from *before* assuming the signal itself is the gap. A debug trace at the mirror boundary (log every fire, every drop, every batch edge) is what caught this — not code review.\n\n## Least-privilege signal semantics: don't let a new generic signal steal an existing event's specific meaning\nBefore adding a broad \"data changed\" event, audit what your existing per-purpose events actually mean. Some are deliberately narrow for reasons unrelated to refreshing — one real example: an event whose entire job was suppressing a *different*, unrelated end-of-session behavior, not triggering a UI refresh. Folding it into the generic signal would silently break that other behavior. Keep purpose-built events purpose-built; add the generic signal alongside them, not as a blanket replacement for anything you haven't individually verified is redundant.\n\n## Related\n- [`derive-dont-track-ui-flags.md`](./derive-dont-track-ui-flags.md) — adjacent family: both are about UI state (a boolean flag; a \"should I re-query\" moment) hand-maintained via scattered reset/poke call sites instead of derived/centralized, and both bug classes are \"a path someone forgot.\"\n- [`n-copies-of-truth-drift-guard.md`](./n-copies-of-truth-drift-guard.md) — a different failure mode (schema shape, not change-notification) from the same \"local-first sync has non-obvious invisible failure classes\" family.\n\n---\n*Captured from Playmoir's BUG-51 reactivity pass, 2026-07-18 — filed as a narrow \"library grid order stale\" bug, widened same-day to a systemic fix after 3 independent sightings, shipped as one bounded block (4 pause-points, 7 commits), each fix live-verified on real 2-device hardware.*"}, {"id": "march-native-ships-an-unrunnable-binary.md", "title": "`-march=native` in a vendored dependency ships a binary that only runs on your build machine", "kind": "gotcha", "last_verified": "2026-08-11", "stack": ["cpp", "cmake", "rust", "ggml", "whisper-cpp", "llama-cpp", "simd", "packaging", "release-engineering", "desktop", "windows-on-arm"], "groups": ["Languages", "Other", "Platforms & Runtimes"], "description": "ggml (whisper.cpp / llama.cpp) defaults `GGML_NATIVE=ON`, i.e. `-march=native`, i.e. **\"compile for whatever CPU is doing the build.\"** Nothing warns you, every test passes, and the shipped exe contains ~12k AVX-512 instructions most users' CPUs cannot execute — the app launches and runs normally, then the whole **process vanishes** with `0xC000001D` STATUS_ILLEGAL_INSTRUCTION the moment that one subsystem runs. Diagnose it from the crash log alone in five minutes: convert the fault RVA to a file offset and read the first byte — `0x62` is EVEX (AVX-512), `0xC5`/`0xC4` is VEX (AVX/AVX2). Ours decoded to `vmovups zmm0`, faulting on the very first ZMM touch. AVX-512 is absent on Windows-on-ARM (Prism stops at AVX2), on **every Intel consumer chip since Alder Lake — fused off**, and on AMD before Zen 4, so a *newer* machine is more likely to break than an old one. Only one feature broke because rustc targets the baseline x86_64 while CMake targets your desk — which makes it invisible on the build machine **by construction**. Fix: `GGML_NATIVE=OFF`, which counterintuitively turns the explicit SSE4.2/AVX/AVX2/BMI2/FMA/F16C options **ON** (it is a floor, not \"no SIMD\"); beware `+i8mm` recreating the same bug in ARM form. Includes the dependency-free EVEX scanner to gate releases (positive-control it first), the warm-CMake-cache trap when re-verifying, the equivalents in Rust/Go/NumPy/PyTorch/Docker, and when native *is* right (runtime dispatch, not compile-time, for anything that travels).", "content": "# `-march=native` in a vendored dependency ships a binary that only runs on your build machine\n\n**One-liner:** ggml (whisper.cpp, llama.cpp) defaults `GGML_NATIVE=ON`, which means `-march=native` — *\"compile for whatever CPU is doing the build.\"* Nothing warns you, every test passes, and the artifact you ship contains instructions a large share of your users' CPUs cannot execute. The app launches and behaves perfectly, then dies with **`STATUS_ILLEGAL_INSTRUCTION`** the instant that one subsystem runs — and it is invisible on your machine *by construction*, because the only broken code path is the one your build machine runs flawlessly.\n\n## The shape\n\nYou embed a native ML library through a Rust/Node/Python wrapper. It builds fine. It works. You ship it.\n\nA user reports: *\"the app crashes when I press stop to transcribe.\"* Not \"transcription fails\" — the **whole process disappears**. No error dialog, no log line, no crash report.\n\nWindows Event Log:\n\n```\nFaulting application name: yourapp.exe, version: 1.3.1.0\nFaulting module name:      yourapp.exe          <- the exe itself, not a DLL\nException code:            0xc000001d           <- STATUS_ILLEGAL_INSTRUCTION\nFault offset:              0x000000000101abf6\n```\n\n`0xC000001D` is the give-away. It is not a null deref (`0xC0000005`), not a stack overflow, not your bug. **The CPU refused an opcode.**\n\n## Confirming it in about five minutes\n\nDo not guess which instruction set. Read the bytes at the fault offset — the fault offset is an RVA, so walk the PE section table to convert it to a file offset, then dump:\n\n```\nBytes at fault:  62 F1 7C 48 11 45 04\nPreceding:       C5 F8 57 C0\n```\n\nDecode by hand; you only need the first byte:\n\n| prefix | meaning |\n|---|---|\n| `0x62` | **EVEX → AVX-512** |\n| `0xC5` / `0xC4` | VEX → AVX / AVX2 |\n| `0x0F` | legacy SSE |\n\n`62 F1 7C 48 11 45 04` unpacks as EVEX with `L'L = 10` (512-bit) → `vmovups ZMMWORD PTR [rbp+0x4], zmm0`. The instruction immediately *before* it, `C5 F8 57 C0` (`vxorps xmm0,xmm0,xmm0`), is plain AVX and executes fine.\n\n**The fault lands exactly on the first ZMM touch.** That is a complete diagnosis, from a crash log, without a debugger, a symbol server, or a reproduction on your own hardware.\n\n## Why almost nobody has AVX-512\n\nThis is the part that makes it a shipping bug rather than an exotic one. AVX-512 is **absent** on:\n\n- **Windows-on-ARM** — the x64 emulator (Prism) implements up to AVX2/FMA/BMI2, nothing wider.\n- **Every Intel consumer CPU since Alder Lake (12th gen)** — present on the silicon, **fused off at the factory** because the E-cores lack it.\n- **AMD before Zen 4.**\n\nSo \"modern CPU\" is not the relevant axis, and a newer machine is *more* likely to lack it than an older one. If your build box is a Xeon, a Rocket Lake part, or Zen 4/5, you are in the small minority that can run what you shipped.\n\n## Why only one feature broke\n\nTwo compilers build the two halves of a typical app, with two different ISA policies:\n\n| half | compiler | ISA policy |\n|---|---|---|\n| your app code (UI, DB, networking) | rustc / tsc / etc. | **baseline** `x86_64` — SSE2 |\n| the vendored native lib | CMake, via the `-sys` crate | **`-march=native`** |\n\nLanguage toolchains target a conservative baseline by default; **C/C++ build systems for perf-critical libraries do the opposite**, because their primary audience compiles from source for their own machine.\n\nThe AVX-512 therefore exists *only* inside the ggml objects. Nothing executes them until the feature runs. The result reads like \"the transcribe feature is buggy,\" but transcribe was never buggy — it was the only feature whose machine code the user's CPU could not run.\n\n## The fix\n\n`whisper-rs-sys`'s `build.rs` forwards any `GGML_*` / `WHISPER_*` / `CMAKE_*` environment variable through as a CMake define, so this is a supported lever, not a patch:\n\n```toml\n# .cargo/config.toml\n[env]\nGGML_NATIVE = { value = \"OFF\", force = true }\n```\n\n**`OFF` does not mean \"no SIMD\"** — which is the reason people leave it ON. In `ggml/CMakeLists.txt`:\n\n```cmake\nif (GGML_NATIVE OR NOT GGML_NATIVE_DEFAULT)\n    set(INS_ENB OFF)     # NATIVE=ON  -> use -march=native\nelse()\n    set(INS_ENB ON)      # NATIVE=OFF -> enable an explicit baseline\nendif()\n\noption(GGML_SSE42 \"\" ${INS_ENB})\noption(GGML_AVX   \"\" ${INS_ENB})\noption(GGML_AVX2  \"\" ${INS_ENB})\noption(GGML_BMI2  \"\" ${INS_ENB})\noption(GGML_FMA   \"\" ${INS_ENB})\noption(GGML_F16C  \"\" ${INS_ENB})\n# GGML_AVX512 is a separate option, default OFF\n```\n\nTurning `GGML_NATIVE` **off** turns the explicit instruction-set options **on**. You get SSE4.2 + AVX + AVX2 + BMI2 + FMA + F16C and no AVX-512 — a safe ~2013-and-newer floor, and exactly the set Windows-on-ARM emulates. The perf difference versus AVX-512 is modest; the difference between \"runs\" and \"hard crash\" is not.\n\n### The same trap in ARM form\n\n`GGML_NATIVE=OFF` also disables the ARM `-mcpu=native` probe, so an ARM64 build falls back to baseline `armv8-a` and loses `+fp16`/`+dotprod`. That is a **speed** cost only — NEON is mandatory on ARM64.\n\nThe obvious recovery is `GGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16`. Be careful what you put in it: `+i8mm` is Oryon-and-newer, and requiring it **reintroduces the identical bug in ARM form**. Pin the floor you are willing to support, not the features your laptop happens to have. (Also check your compiler driver accepts the spelling — ggml passes it as a GNU-style `-march=`, and `clang-cl` is picky.)\n\n## Gate it, because you cannot feel this bug\n\nThe failure is silent at build time and only manifests on hardware you do not own. So verify the **artifact**, mechanically, every release. Scanning for the EVEX prefix in `.text` is enough and needs no toolchain:\n\n```js\n// EVEX is a 4-byte prefix starting 0x62. In 64-bit code 0x62 has no other\n// meaning (legacy BOUND is invalid), and P0 is RXBR'00mm — bits 3-2 must be\n// 00 and the opcode map (bits 1-0) is 1..3. That constraint is what stops\n// embedded data from reading as an instruction.\nfor (let i = textStart; i < textEnd; i++) {\n  if (buf[i] !== 0x62) continue;\n  const p0 = buf[i + 1];\n  if ((p0 & 0x0c) !== 0) continue;\n  const map = p0 & 0x03;\n  if (map < 1 || map > 3) continue;\n  hits++;\n}\n```\n\n**Positive-control it before you trust it** — run it against the known-bad binary and confirm it goes red. Ours reported 11,970 hits and exited 1 on the broken release; a gate never observed to fail is not evidence (see [negative-control-before-trusting-a-probe.md](./negative-control-before-trusting-a-probe.md)).\n\nTwo traps when re-checking after the fix:\n\n- **The native build is cached.** Cargo/CMake will happily reuse a warm build dir and not re-derive flags, so the gate can still fail after a correct config change. Clear the `-sys` crate's CMake cache before concluding the fix didn't work.\n- **Check the shipped exe, not an intermediate.** The static lib is not what users run.\n\n## Where else this lives\n\n`-march=native` is the famous one, but the family is \"build-host properties baked into a distributed artifact\":\n\n| ecosystem | the thing that bakes your machine in |\n|---|---|\n| CMake / C++ | `-march=native`, `-mtune=native`, `-mcpu=native` |\n| ggml / llama.cpp / whisper.cpp | `GGML_NATIVE=ON` (**the default**) |\n| Rust | `RUSTFLAGS=\"-C target-cpu=native\"` |\n| NumPy / SciPy from source | auto-detected CPU dispatch baseline |\n| PyTorch / TensorFlow custom builds | `-march=native`, or a CUDA arch list matching only your GPU |\n| Go | `GOAMD64=v3/v4` (v4 requires AVX-512) |\n| Docker | building on arm64 and shipping to amd64 hosts, or vice versa |\n\nThe general detector is the same in every case: **inspect the artifact for instructions/architectures narrower than your support floor** rather than trusting that the build \"worked.\"\n\n## When you *do* want native\n\nLegitimately: internal tooling on known hardware, HPC clusters where the build node matches the compute nodes, benchmarking, or a from-source install path where the user compiles on the machine that will run it. The rule is not \"never use native\" — it is **never use native for an artifact that travels.** If the binary crosses a machine boundary, the ISA must be a floor you chose, not a fact about your desk.\n\nFor a distributed app that genuinely needs the top-end path, the answer is **runtime dispatch**, not compile-time native: build several kernel variants, detect CPU features with `cpuid` at startup, and select. That is what ggml's `GGML_CPU_ALL_VARIANTS` + `GGML_BACKEND_DL` do, and what NumPy and modern libcs do. It costs binary size and build complexity, and it is the only way to be both fast and portable.\n\n## The transferable core\n\n**A default that optimizes for the developer's machine is a defect generator for anything you distribute**, and it is the hardest defect class to catch because the build machine is definitionally the one machine where it cannot reproduce. Vendored native dependencies are where this hides, because their defaults were chosen for a *compile-it-yourself* audience and you inherited them silently by adding one line to a manifest.\n\n**Audit the compile flags of native dependencies you did not configure.** You are shipping their defaults, and their defaults were not written with your users in mind.\n\n## See also\n\n- [dev-path-fallback-hides-missing-bundled-asset.md](./dev-path-fallback-hides-missing-bundled-asset.md) — the same family and, remarkably, the *same feature one release earlier*: 1.3.0 shipped a model the installer never bundled (hidden by a compile-time path), 1.3.1 fixed that and shipped an unrunnable one. Two consecutive \"works on the build machine\" bugs, two completely unrelated mechanisms. Its generalisation — *any code path whose success depends on properties of the build machine is a bug detector disabled on the only machine that runs it* — extends cleanly from file paths to instruction sets.\n- [verify-the-artifact-your-user-receives.md](./verify-the-artifact-your-user-receives.md) — adjacent but distinct: there the shipped bytes were the *wrong bytes*; here they are the right bytes that will not execute. Both end at the same rule — measure the artifact, not the build.\n- [negative-control-before-trusting-a-probe.md](./negative-control-before-trusting-a-probe.md) — before trusting the AVX-512 gate above, confirm it can go red."}, {"id": "material-tier-glassmorphism-tokens.md", "title": "A 3-tier translucent-surface (glassmorphism) token system, organized by ROLE", "kind": "pattern", "last_verified": "2026-07-08", "stack": ["css", "design-system"], "groups": ["Frameworks & Libraries", "Languages"], "description": "A 3-tier (thin/regular/thick) translucent-surface token system organized by interaction ROLE, not visual weight. The non-obvious fix for \"my modal doesn't look like glass\": a luminosity bump on the top tier independent of blur/opacity.", "content": "# A 3-tier translucent-surface (glassmorphism) token system, organized by ROLE\n\n**One-liner:** instead of letting every frosted/translucent panel in an app invent its own blur+opacity values, define a small tiered taxonomy keyed to **interaction role** (ambient chrome vs. persistent status vs. focused/modal), not just \"how much blur.\" The non-obvious payoff: the top tier needs a **luminosity bump**, not just more blur and opacity, or it reads as a flat dark box instead of glass.\n\n## The taxonomy\n\nThree tiers + a scrim, each mapped to a role rather than a vibe:\n\n| Tier | Role | Examples |\n|---|---|---|\n| **Thin** | Ambient, passthrough browsing chrome — present but not the focus | Sidebar, search/filter bar, a floating back-button pill |\n| **Regular** | Persistent, in-flow status — always visible while relevant, not blocking interaction | Toast notifications, a docked action bar, an in-page stats panel |\n| **Thick** | Focused / blocking — the user's full attention is on this surface | Modal dialogs, lightbox, an in-app overlay over dimmed content |\n\n```css\n--material-thin-bg:        rgba(16, 14, 18, 0.45);\n--material-thin-blur:      blur(14px) saturate(1.05);\n--material-thin-border:    rgba(255, 255, 255, 0.05);\n\n--material-regular-bg:     rgba(22, 20, 26, 0.78);\n--material-regular-blur:   blur(22px) saturate(1.1);\n--material-regular-border: rgba(255, 255, 255, 0.06);\n\n--material-thick-bg:       rgba(34, 30, 38, 0.82);\n--material-thick-blur:     blur(32px) saturate(1.15);\n--material-thick-border:   rgba(255, 255, 255, 0.06);\n\n--scrim-bg:                rgba(8, 6, 10, 0.72);\n--scrim-blur:               blur(6px) saturate(0.9);\n```\n\nBlur and opacity increase together tier-to-tier (14px/0.45 → 22px/0.78 → 32px/0.82) — that part matches every glassmorphism tutorial. The part that doesn't is the background RGB itself: `rgba(16,14,18,...)` → `rgba(22,20,26,...)` → `rgba(34,30,38,...)`. Each channel climbs, not just the alpha.\n\n## Why: \"my dialog doesn't look like glass, it looks like a dark box\"\n\nWhen a modal/thick-tier panel sits **over a scrim** (a dimming overlay on the background content), naively scaling up blur+opacity from the lower tiers makes intuitive sense — \"more modal = more blur, more opacity\" — but it produces a panel that reads as *another dark rectangle stacked on the dimmed backdrop*, not a floating lighter layer of glass above it. The panel and the scrim behind it converge toward the same darkness, so the eye can't separate \"the surface\" from \"the dimmed background it's floating over.\"\n\nThe fix is a **luminosity bump independent of blur/opacity**: the thick tier's background RGB is measurably lighter (34,30,38) than the thin tier's (16,14,18), tuned specifically against whatever the scrim's own darkness value is. This makes the panel read as *sitting above and lit relative to* the dimmed backdrop, rather than blending into it. Treat \"does this read as glass\" as a **three-variable** tuning problem — blur radius, alpha, and background luminosity — not a single opacity slider that gets cranked up for \"more important\" surfaces.\n\n## How to apply in a new project\n\n1. **Name tiers by role first**, pick values second. Ask \"is this ambient chrome, persistent status, or a focused/blocking surface?\" before touching blur radius numbers — the role tells you which tier's values to reach for, and prevents every new component from inventing a bespoke translucency.\n2. **When you add a \"bigger/more important\" tier**, don't just scale blur+opacity — check whether it sits over a scrim, and if so, independently tune the background's lightness against the scrim's own darkness so it separates visually instead of merging into it.\n3. **Publish the tiers as CSS custom properties** (or your framework's design-token equivalent) so every surface consumes `var(--material-thin-bg)` etc. instead of a hand-typed `rgba(...)` — this is what makes \"we changed how thick surfaces look\" a one-line edit instead of a grep-and-replace.\n4. Keep the tier count small (3 + scrim was enough for a real app with sidebars, toasts, modals, lightboxes, and an in-game overlay). Resist adding a 4th tier unless a genuinely distinct role emerges — more tiers just re-introduce the \"which one do I use\" ambiguity the taxonomy was meant to remove."}, {"id": "mobile-shell-decision.md", "title": "Mobile shell strategy — Capacitor vs native, and how we got it wrong twice", "kind": "decision-record", "last_verified": "2026-05-14", "stack": ["mobile", "ios", "android", "capacitor", "react"], "groups": ["Frameworks & Libraries", "Platforms & Runtimes"], "description": "Decision record: webview wrapper (Capacitor) vs native (SwiftUI + Compose) for mobile when your desktop is React. The reversal we made, why, and the framework for picking next time.", "content": "# Mobile shell strategy — Capacitor vs native, and how we got it wrong twice\n\n> A decision record for any project that's primarily a React/web app on desktop and needs a mobile presence later. We picked Capacitor, built around the assumption, then reversed to native — at non-trivial cost. This is what we learned.\n\n## The question\n\nYou're building a product whose desktop client is React + Tauri (or similar webview shell). You want it on mobile eventually. Three plausible paths:\n\n1. **Capacitor / Tauri Mobile / Tauri-equivalent webview wrapper.** Reuse the React codebase. One UI, three shells.\n2. **React Native.** Rewrite the UI in RN's idioms. Share business logic.\n3. **Native per platform.** SwiftUI for iOS, Compose for Android. Rebuild the UI twice. Share only data contracts.\n\nChoice (1) seems obviously right for a small team. Choice (3) seems indulgent. We picked (1) initially, then reversed to (3). Here's why.\n\n## The trap: webview parity is \"good enough\" until your product depends on feel\n\nChoice (1) genuinely works if your mobile UX is informational. A reader app, a settings dashboard, a CRUD form — Capacitor gives you the iOS/Android shell, your existing React renders inside it, push notifications and biometrics work via plugins, you ship.\n\nThe trap is what \"good enough\" hides:\n\n- **Native gestures don't work.** Swipe-to-go-back on iOS doesn't exist in your webview. You can fake it with touch event listeners but the inertia is wrong and users notice within minutes.\n- **Native animation timing doesn't match.** iOS Spring physics are tuned to platform conventions; CSS `transition: transform` produces \"similar\" motion that feels off. If your product has any animation language (morphs, hero flights, spring-based UI), webview can approximate but never match.\n- **Native typography rendering differs.** iOS uses SF Pro with subpixel positioning tuned to native frameworks. Webview text rendering is the WebKit/Blink pipeline — close but visibly different, especially for animated text.\n- **Scroll inertia and rubber-banding.** iOS's overscroll behavior is non-trivially different from web `overflow: auto`. You can css-trick parts of it. The full behavior takes native APIs.\n- **Keyboard handling.** Native keyboards animate in/out with platform-specific timing curves and offsets. Web `viewport` resizes are bolted-on and produce layout jumps.\n- **Memory pressure.** Webview shells carry their entire JS runtime in memory per app. Native apps don't. On 4GB iOS devices (still supported), a webview app gets killed in the background more aggressively.\n\nNone of these matter for a CRUD app. ALL of them matter for an animation-heavy product where motion is part of the product identity.\n\n## The reversal we made (and the cost)\n\n**Decision 1, 2026-04-07:** \"We're shipping desktop v1 first. Mobile lands via Capacitor — we'll wrap the React app. iOS bundle, Android bundle, same codebase.\"\n\nWe built an `apps/mobile` Capacitor shell scaffold and an `apps/web` PWA. Both shared 100% of the React UI from `packages/frontend`. Maybe a month of part-time work scoping plugins, build configs, and signing.\n\n**Decision 2, 2026-05-04:** \"Reverse. iOS will be SwiftUI native. Android will be Compose native. React stays desktop-only.\"\n\nWhat forced the reversal: by April 2026 the desktop app's animation system was the product's main differentiator. Library-to-detail morphs, hero crossfades, \"recalling a memory\" UX timing. None of it could be faithfully reproduced through a webview wrapper — and the entire product pitch depended on it feeling like *this product* and not \"a generic React app with a mobile chrome.\"\n\nThe cost of the reversal:\n- ~~`apps/mobile` (Capacitor)~~ — deleted (-1 high-severity npm vuln from the xmldom dependency chain, +66 packages dropped from lockfile)\n- ~~`apps/web` (PWA)~~ — deleted, was being kept current with mobile and dependent on the same flawed shared-UI assumption\n- ~1 month of bookkeeping work that didn't move the v1 ship forward\n- New constraint: mobile lands strictly post-desktop-v1 because the native builds are real work\n\nWhat we kept:\n- **`packages/core`** — Zod schemas and Worker API contract. Shared verbatim between React-on-desktop, SwiftUI-on-iOS (re-implemented as Swift types), Compose-on-Android (Kotlin types).\n- The general product design — flows, screens, copy. The IA transfers; the implementation doesn't.\n\n## When choice (1) is right anyway\n\nWe aren't saying \"never Capacitor.\" We're saying it has a specific failure mode that's invisible until late.\n\nCapacitor / Tauri Mobile is the right call when:\n- Your product is **informational-first** (read-heavy, CRUD-heavy). Reader, dashboard, settings, project tracker.\n- You have **zero custom motion/animation** as core product identity. Material/iOS defaults are fine.\n- Your team is **1-3 people** and you genuinely can't afford to triple-build the UI.\n- You **expect to migrate** to native if/when the product succeeds, and you're treating the webview shell as MVP infrastructure rather than the long-term answer.\n- You're shipping **enterprise/B2B**, where users tolerate \"different from native\" if the data is right.\n\nCapacitor is wrong when:\n- Your product has a **distinct motion language** — animations, transitions, gestures — that's part of why users like it.\n- Your product is **consumer**, especially on iOS, where users compare you to native apps daily.\n- You're building **anything with creative tooling** — drawing, music, video, AR — where input latency and native APIs matter.\n- You have **complex offline-first sync** with frequent local writes. Webview SQLite via plugins is slower than native CoreData/Room and the bridge tax adds up.\n\n## The decision framework we'd use next time\n\nAsk: **\"If a beta user said 'this feels exactly like the desktop app — same animations, same motion, same polish' — is that the *product winning*, or is that a *bug*?\"**\n\n- If \"the product winning\" → webview shell is too risky. Plan native from day 1, even if you defer building it.\n- If \"a bug\" → webview shell is fine. Ship Capacitor, focus on data/feature parity.\n\nWe assumed cross-platform parity was \"the product winning.\" It was the opposite. The desktop app's motion was specifically tuned to feel desktop-native (fast, dense, hover-driven); mobile needed its own motion language (touch-first, vertical, gestural). Trying to share UI between platforms would have produced something that felt like neither.\n\n## What to share between native mobile and React desktop\n\nOnce you commit to native mobile, the shared layer becomes much thinner. We share:\n\n| Shared | Not shared |\n|---|---|\n| Zod schemas (`packages/core`) | UI components |\n| Worker API contracts | Routing / navigation |\n| Type definitions (re-implemented per-platform) | State management |\n| Color palette names + values | Animation timing |\n| Copy strings (eventually, via i18n) | Screen layouts |\n\nThat's it. Trying to share more (e.g. business logic via WASM) usually fails — the call-site idioms are too different. SwiftUI's `@State` and Compose's `mutableStateOf` don't compose with a JS state machine bridged via FFI. Just rewrite.\n\n## What NOT to do\n\n- **Don't lock yourself into Capacitor by building infrastructure that ONLY makes sense in a webview shell.** Native bridges, web-style routing, web SQLite plugins — these are all replaceable, but if you've shipped six features that depend on them, the rebuild cost is real.\n- **Don't promise mobile users \"same experience as desktop\" if your desktop is animation-heavy.** Either build native and deliver it, or scope mobile to a different (simpler) experience and don't try to fake parity.\n- **Don't reuse the React Native or Capacitor \"I have a senior React dev\" argument** if your senior React dev has never shipped a native iOS or Android app. The frameworks claim cross-platform but the production bugs are platform-specific, and a senior React dev doesn't have the muscle memory to fix them.\n- **Don't underestimate the SwiftUI / Compose learning curve** for a team coming from React. Compose is closer to React-mental-model than SwiftUI is. Budget 4-6 weeks per platform for a senior to reach productive output from scratch.\n\n## When to re-evaluate\n\nRevisit the decision when:\n- You hit 80% feature parity on desktop and start scoping mobile in earnest.\n- The mobile platforms ship a major SwiftUI/Compose release that changes the curve (e.g. SwiftUI on visionOS opened new APIs that aren't bridgeable through webview).\n- Your team grows by 1-2 people who specifically have native experience.\n\nDon't revisit when:\n- A blog post says \"Capacitor X.Y is great now.\" Capacitor is always \"great now.\" The trap isn't Capacitor's quality — it's the fit to motion-heavy product identity.\n\n## References\n\n- This decision record is grounded in a real reversal logged in `DECISIONS.md` of one project. The general framing transfers to any team picking webview-shell vs native for an animation-heavy product.\n- Companion lesson: if you DO go native and need to share schemas + API contracts between platforms, see `local-first-sync-with-d1.md` for the wire-format pattern that survived native re-implementation."}, {"id": "monorepo-stale-dist-zod-strip.md", "title": "Stale workspace `dist/` + Zod strip = data that vanishes with zero errors — and the stacked-bug post-mortem that found it", "kind": "postmortem-playbook", "last_verified": "2026-07-31", "stack": ["pnpm-monorepo", "zod", "vite", "tauri", "powersync"], "groups": ["Data & Sync", "Frameworks & Libraries", "Platforms & Runtimes"], "description": "Workspace package consumed via `dist/` + Zod's default key-stripping = a new DB column that vanishes between SQLite and React with zero errors; git-clean says current, runtime runs week-old code. Plus the stacked-bug post-mortem method (verify pipeline STAGES: protocol-level stream capture, control-machine comparison) and the two-machine remote-agent runbook pattern (read-only rules, self-classifying diagnostic script).", "content": "# Stale workspace `dist/` + Zod strip = data that vanishes with zero errors — and the stacked-bug post-mortem that found it\n\n> Post-mortem of a cross-device sync bug (Playmoir BUG-48, 2026-07-03 → 07-04) that\n> burned two full sessions because it was actually TWO independent bugs stacked in\n> the same pipeline, each perfectly masking the other. The second bug is a\n> monorepo trap that will recur anywhere a workspace package ships compiled\n> output: **git said the code was current, but the runtime was importing a\n> 7-day-old build artifact, and a Zod parse boundary silently deleted the new\n> column from every row.** No error, no warning, no amount of restarting fixes it.\n\n## The symptom\n\nA new DB column (`session_summary`, an AI-generated per-session summary) synced\ncloud → device B, but device B's UI showed the raw fallback text. Device A\n(which generated the data) displayed fine. Every obvious check passed on\ndevice B: right branch, right commit, clean tree, fresh dev-server restarts,\ndata verified present in the local SQLite file.\n\n## The two stacked bugs\n\n1. **Server (real, found first):** PowerSync sync rules are FROZEN at deploy\n   time — a column added to Postgres after the last rules deploy is never\n   streamed, and redeploying byte-identical `SELECT *` rules is a no-op that\n   doesn't re-replicate. Fix: explicit column lists + real redeploy.\n   (Lesson already in `powersync-steam-backend-architecture.md` territory;\n   the yaml now carries a 5-layer migration-lockstep header.)\n2. **Client (invisible, found a day later):** the frontend imports its shared\n   types package (`@playmoir/core`) via `\"exports\": \"./dist/index.js\"` — the\n   **compiled artifact, not source**. Device B's `dist/` was last compiled\n   3 days before the column was added to the Zod schema. Zod object schemas\n   **strip unknown keys by default**, so `z.array(rowSchema).parse(rows)`\n   silently deleted the new field from every row between SQLite and React.\n   Fix: `pnpm --filter @playmoir/core build` + clear `node_modules/.vite` +\n   restart dev.\n\nEach bug masked the other: while bug 1 was live, no data reached device B, so\nbug 2 was unobservable. Once bug 1 was fixed, the data arrived — but bug 2 ate\nit at render time, which made the (correct!) server fix look like a failure and\nsent the investigation back through already-exonerated server levers.\n\n## Lesson 1 — \"git clean at the right commit\" does NOT mean \"runtime runs that code\"\n\nIf any workspace package resolves through `dist/`, the runtime code is only as\nfresh as the last **build**, not the last **pull**. `git status` / `git log`\ncannot see this. Neither can restarting the dev server — Vite happily re-imports\nthe same stale artifact forever (and may ALSO cache a pre-bundle of it in\n`node_modules/.vite`, so clear that too when in doubt).\n\n**Checks when a feature works on machine A but not machine B:**\n- `grep` the **built artifact** (not the source) for the new symbol:\n  `grep sessionSummary packages/core/dist/db/types.js` → 0 matches = smoking gun.\n- Compare the artifact's mtime against the date the schema last changed.\n- Machine A is your control: run the identical checks there first, so you know\n  what \"healthy\" looks like.\n\n**Structural fixes (pick per project):**\n- Make the dev task depend on building workspace deps (turbo `dependsOn: [\"^build\"]`)\n  or run the package's build in watch mode alongside dev.\n- Or point the package's `exports` at source for internal dev consumption\n  (custom condition / `publishConfig`), so there is no stale artifact to serve.\n- A CI/boot drift-guard that compares schema layers catches this class wholesale.\n\n**Resolution actually shipped (2026-07-18, ~2 weeks later):** the simplest version\nof the first bullet, applied without pulling in turbo's `dependsOn` graph —\ntwo one-line script changes closed both remaining gaps. Root package.json grew\na `\"prepare\": \"git config core.hooksPath .githooks && pnpm --filter @playmoir/core build\"`\n(runs on every `pnpm install`, on every machine, with no manual step — this\nalso happened to be the fix for the separate \"committed pre-push drift-guard\nhook was never locally activated\" gap, see `n-copies-of-truth-drift-guard.md`),\nand the frontend's `\"dev\"` script became\n`\"pnpm --filter @playmoir/core build && vite\"` so `pnpm dev` itself cannot boot\nagainst a stale `dist/`. Both changes are pure build hygiene — no\nmachine-specific paths, nothing to configure per developer.\n\n## Lesson 2 — a Zod parse boundary is also a data FILTER\n\nDefault Zod (`.strip()` mode) deletes unknown keys on parse. That's usually the\nsafe choice — but it means a schema-version mismatch doesn't error, it silently\nnarrows your data. When a field exists in the DB but is `undefined` in the UI,\nsuspect **the schema version the runtime actually loaded**, before suspecting\nthe query. (The same applies to any codegen'd validator/serializer: protobuf,\nOpenAPI clients, drizzle snapshots.)\n\n## Lesson 3 — stacked bugs: when a verified fix \"doesn't work,\" verify STAGES, not the endpoint\n\nThe killer anti-pattern: fix bug 1, re-test the END-TO-END symptom, see it still\nbroken, conclude the fix failed, keep digging in the same (now-healthy) layer.\n\nInstead, decompose the pipeline and find the FIRST stage where healthy and\nbroken machines diverge. Ours was:\n`cloud Postgres → server sync stream → client replica → local SQLite → query+parse → rendered pixels`\n\nStage checks that cracked it:\n- **Impersonate a fresh client at the protocol level.** We minted a real client\n  JWT with the server's signing key and `curl`ed the PowerSync `/sync/stream`\n  endpoint directly — ground truth of what the server sends, no dashboard, no\n  second device. (Generalizes: hit the sync/API endpoint as a new client and\n  read raw payloads.)\n- **Read the broken machine's DB file directly** (SQLite `mode=ro` URI works\n  fine while the app runs, WAL included).\n- **Only then** touch the app layer — by now the fault is boxed into two stages.\n\nCorollary: with the endpoint-only test, N stacked bugs cost O(N × whole-pipeline\ninvestigations). With stage checks, one pass finds them all.\n\n## Lesson 4 — two-machine debugging with a second agent + a committed runbook\n\nDevice B was physically elsewhere with a weaker agent (Sonnet) driving it. What\nworked extremely well:\n\n- Commit a **runbook file** to the repo; the remote agent pulls and follows it.\n- Open with hard **rules**: read-only, no fixes, no installs, exact allowed\n  commands, \"if anything errors, STOP and report verbatim.\"\n- Make the diagnostic script **self-classifying**: it prints `CASE: A/B/C/…`\n  with a one-line meaning, so the remote agent exercises zero judgment and\n  can't misread the data. Results come back as a committed report file.\n- Test the script on the healthy machine first (it must print the \"healthy\"\n  case there) before shipping it to the broken one.\n\n## Small verification gotchas that cost real time\n\n- `sum(col IS NOT NULL)` counts **empty strings** as present. UIs typically\n  treat `''` as absent (`value?.trim() || fallback`). Verify **content**\n  (`length(trim(col)) > 0` + sample the actual text), not just null-ness.\n- `grep -c` counts **lines**, not occurrences — NDJSON payloads are giant\n  single lines; 1 match may mean 65 values. Parse before concluding.\n- \"Fix applied\" ≠ \"fix confirmed\": our final server remedy WAS correct, but was\n  verified only minutes after applying, before the client could sync — logging\n  it as failed. Give propagation time a seat in the verdict.\n\n## A third stale layer: Vite's dep-optimizer cache (added 2026-07-31)\n\nA recurrence of this article's family, one layer up. Workspace packages that\nresolve like node_modules dependencies (`\"main\": \"./dist/index.js\"`) get\n**pre-bundled by Vite's dep optimizer and cached in `node_modules/.vite`** —\nand that cache survives dev-server restarts AND dist rebuilds. Symptom\nobserved live: a schema field was renamed, `dist/` on disk was verifiably\ncorrect (grep found only the new name), the app was fully restarted — and the\nruntime still validated against the OLD field name, throwing Required errors\nwith the old spelling in the ZodError path.\n\nSo the staleness checklist for \"git says current but runtime disagrees\" is now\nthree layers deep:\n\n1. **`dist/` vs `src/`** — the original trap above (rebuild the package).\n2. **Vite dep-optimizer cache** — `rm -rf <consumer>/node_modules/.vite` (or\n   start Vite with `--force`). A dist rebuild does NOT invalidate it.\n3. **The running process** — a reload/restart only helps after 1 and 2 are\n   actually clean.\n\nDiagnostic that pins layer 2: the error message contains an identifier that no\nlonger exists anywhere in `src/` OR `dist/` — the only place it can live is a\ncached bundle.\n\n## Related\n\n- [verify-the-artifact-your-user-receives.md](./verify-the-artifact-your-user-receives.md) — the same stale-artifact trap one boundary further out: `dist/` holding the *previous* release's content-hashed assets, so a bare `deploy dist` publishes the old build while every source-file check reads green. Same tell (git says current, the artifact isn't), same fix (the deploy command begins with the build command)."}, {"id": "motion-design-token-system.md", "title": "A motion design-token system that reduced-motion actually reaches", "kind": "pattern", "last_verified": "2026-07-28", "stack": ["react", "css", "framer-motion", "tailwind"], "groups": ["Frameworks & Libraries", "Languages"], "description": "A named easing/duration/preset module (mirrored as CSS vars) so JS and CSS animations can't drift apart, plus a real reduced-motion system: a 4-state preference, bridging into your JS animation library's OWN config (not just CSS), and a universal `!important` kill-switch for hardcoded utility-class durations that bypass the tokens. PLUS the exit-curve trap: a preset name says WHAT, not which DIRECTION. An easeOut curve spends ~80% of its travel in the first fifth of the duration, so on an opacity 1→0 exit it reads as a snap followed by a hang — \"it doesn't fade\" and \"there's a delay\" are one complaint, not two. But the correction is conditional: symmetric is right when the exit IS the animation, front-loaded is right when the user is waiting for what's BEHIND it, so a shared fade flag must carry *why* rather than just whether. Includes a tiny bezier evaluator for settling \"it feels laggy\" by measurement instead of argument.", "content": "# A motion design-token system that reduced-motion actually reaches\n\n**One-liner:** centralize animation curves + durations into a small named-preset module (mirrored as CSS custom properties), and treat \"respect reduced motion\" as a problem with THREE independent surfaces to wire — CSS transitions, your JS animation library's own engine, and the inevitable hardcoded utility classes that bypass both — not one media query.\n\n## Part 1 — the token system\n\nThree layers, in one small module (framework-agnostic; this example uses Framer/Motion-shaped presets, but the shape applies to GSAP, native Web Animations, or CSS-only projects):\n\n```ts\nexport const easings = {\n  ethereal: [0.22, 1, 0.36, 1],   // soft settle, mild overshoot — default curve\n  snap:     [0, 0, 0.2, 1],       // fast out — dismissals\n  suck:     [0.4, 0, 0.6, 1],     // accelerate-in/decelerate-out — \"retreat\" motions\n  material: [0.4, 0, 0.2, 1],     // neutral/unopinionated\n  decel:    [0.16, 1, 0.3, 1],    // pronounced decel — long settle tail\n} as const;\n\nexport const durations = {\n  instant: 0.15, quick: 0.25, medium: 0.4, slow: 0.6, lush: 0.8, // seconds\n} as const;\n\n// Named presets compose curve + duration for a SEMANTIC behavior.\n// Call sites use the name, never a raw tuple.\nexport const motions = {\n  stateChange: { duration: durations.quick, ease: easings.ethereal }, // hover/select feedback\n  reveal:      { duration: durations.slow,  ease: easings.ethereal }, // content entering\n  dismiss:     { duration: durations.quick, ease: easings.snap },     // content leaving, fast\n  settle:      { duration: 0.7,             ease: easings.decel },    // multi-layer close sequence\n} as const;\n```\n\n**Why named presets over raw numbers:** `transition={motions.reveal}` at a call site tells the next reader the *intent* (\"this is a content-entering animation\"), not just a number. It also means changing what \"reveal\" feels like across the whole app is a one-line edit instead of a grep-and-replace across every component that happened to use `{ duration: 0.6, ease: [0.22,1,0.36,1] }` inline.\n\n**The CSS mirror, and its risk:** the same values get hand-published as CSS custom properties (`--ease-ethereal: cubic-bezier(0.22, 1, 0.36, 1)`, `--duration-slow: 600ms`, `--motion-reveal: 600ms var(--ease-ethereal)`) so pure-CSS transitions and JS-driven animations read the *same* numbers instead of two authors independently guessing \"does 600ms feel like 0.6s?\" This is itself a two-copies-of-one-fact problem (see [`n-copies-of-truth-drift-guard.md`](./n-copies-of-truth-drift-guard.md)) — nothing enforces the JS module and the CSS file stay in sync except a code comment saying \"keep in sync with that file.\" For a small token set (5 easings × 5 durations) manual sync is a reasonable tradeoff; if your token count grows, generate the CSS block from the JS module at build time instead of hand-mirroring it.\n\n**Property-first CSS transitions, not `all`:** `transition: opacity var(--motion-reveal), transform var(--motion-reveal);` — naming the properties avoids the `transition: all` anti-pattern, which animates every property that happens to change (including ones you didn't intend, like a color inherited from a parent hover state) and fights the intent of a \"these two things move together\" design.\n\n## Part 2 — reduced motion has to reach three separate places\n\nMost apps wire `@media (prefers-reduced-motion: reduce)` into their CSS and consider it done. That only covers CSS-driven transitions. Two more surfaces silently keep animating at full speed unless you deliberately bridge them:\n\n### A four-state preference, not a binary toggle\n\n```\n'full'    → animate at full duration, even if the OS says reduce\n'auto'    → follow the OS prefers-reduced-motion media query\n'reduced' → an explicit middle tier: durations halved, motion still visible\n'off'     → zero duration, instant snap\n```\n\n`reduced` matters as its own state — some users want *less* motion without the jarring flatness of everything snapping instantly. Store it (localStorage or equivalent), reflect it onto `<html data-motion-pref=\"...\">` at module load (before first paint, so CSS sees the right state immediately), and dispatch a custom event on change so any already-mounted consumers resync without a reload:\n\n```ts\nfunction syncAttribute(): void {\n  document.documentElement.setAttribute('data-motion-pref', readPreference());\n}\nexport function setMotionPreference(pref: MotionPreference): void {\n  localStorage.setItem(STORAGE_KEY, pref);\n  syncAttribute();\n  window.dispatchEvent(new CustomEvent('motion-preference-change'));\n}\nsyncAttribute(); // module-load: CSS sees correct state before first render\n```\n\nCSS resolves layered overrides via specificity: `:root` sets full-duration defaults, an `@media (prefers-reduced-motion: reduce)` block flattens them, and `html[data-motion-pref=\"...\"]` attribute selectors — which beat both `:root` and the media query on specificity — apply the in-app override on top. `auto` simply has no attribute-selector rule, so it falls through to the media query. (This same attribute-beats-media-query layering technique is the standard way to implement \"OS default with an in-app override\" for ANY preference — dark mode included, not just motion.)\n\n### Bridge the preference into your JS animation library's own config\n\nThis is the step that's easy to skip and produces a \"the Off toggle does nothing\" bug: your JS animation library doesn't read your CSS custom properties or your `data-motion-pref` attribute — it has its own separate reduced-motion handling that you have to wire explicitly.\n\n```tsx\n// Framer/Motion example — MotionConfig has its OWN reducedMotion prop:\n// 'never' (ignore OS), 'user' (follow OS media query), 'always' (force zero)\nfunction prefToMotionMode(pref: MotionPreference): 'never' | 'user' | 'always' {\n  switch (pref) {\n    case 'full': return 'never';\n    case 'off':  return 'always';\n    default:     return 'user'; // 'auto' and 'reduced' both defer to the OS query here\n  }\n}\n\nexport function MotionProvider({ children }) {\n  const [pref, setPref] = useState(() => getMotionPreference());\n  useEffect(() => {\n    const handler = () => setPref(getMotionPreference());\n    window.addEventListener('motion-preference-change', handler);\n    return () => window.removeEventListener('motion-preference-change', handler);\n  }, []);\n  return <MotionConfig reducedMotion={prefToMotionMode(pref)}>{children}<\/MotionConfig>;\n}\n```\n\nWithout this provider, changing the in-app setting only affects elements whose animation is driven by CSS transitions reading the `--duration-*` vars. Anything animated via the JS library's own `animate`/`transition` props keeps its hardcoded values regardless of the setting — which reads to a user as \"I turned this off and it's still moving.\"\n\n### The universal kill-switch — because token coverage is never 100%\n\nIn any real codebase, some components WILL use a hardcoded Tailwind duration class (`duration-150`) or an inline `transition: ...300ms...` that bypasses the token vars entirely — refactoring every last one isn't worth blocking a ship on. The fix is a blanket CSS safety net scoped to the \"no motion wanted\" states:\n\n```css\nhtml[data-motion-pref='off'] *,\nhtml[data-motion-pref='off'] *::before,\nhtml[data-motion-pref='off'] *::after {\n  animation-duration: 0.001ms !important;\n  animation-delay: 0ms !important;\n  transition-duration: 0.001ms !important;\n  transition-delay: 0ms !important;\n}\n```\n\n**Use `0.001ms`, not `0ms`.** Some browsers/engines skip firing `transitionend`/`animationend` entirely for a strictly-zero-duration transition or animation. If any of your code waits on that event (e.g. to trigger a follow-up state change), a literal `0ms` can silently hang that logic forever. A near-zero duration keeps the event contract intact while being visually instant.\n\nThis kill-switch doesn't cover the JS-library-driven layer (that's `MotionProvider`'s job above) — it's specifically the backstop for CSS you don't control or haven't migrated to the token system yet.\n\n### The trap inside the kill-switch: near-zero duration *freezes* a loop, it doesn't neutralize it\n\n`animation-duration: 0.001ms !important` reads like \"turn the animation off.\" It doesn't. It leaves the animation *running*, just so fast the element renders at a single fixed point in the keyframe timeline — and for an **infinite/looping** animation, which point that is comes out effectively arbitrary. In practice engines pin it to the `0%` keyframe. That's harmless for a pulse that rests at its neutral value at 0% — but it's a real bug when the state the animation expresses is *carried by* the animated property.\n\nConcrete failure we hit: a \"syncing\" indicator was a bright band sweeping through the mark — `@keyframes { 0%,100% { opacity: .22 } 45% { opacity: 1 } }`. Under reduced motion the kill-switch froze it at the `0%` frame, i.e. its **dimmest** value (`.22`). Result: the \"busy\" state rendered *fainter than the idle resting state* — the exact opposite of the signal. Nobody notices in review because you don't test every looping animation with reduce-motion on; it surfaces as \"why does active look more off than idle?\"\n\n**The fix — give continuously-animated states a *designed* static form.** Where an animation communicates state (not just decoration), add an explicit reduced-motion rule that (a) sets `animation: none` — needed so the frozen keyframe value can't override your static value from the animation cascade origin, which outranks normal declarations — and (b) sets the property to a chosen held value that still reads as that state:\n\n```css\n/* Match the kill-switch's own conditions exactly, so behavior is consistent */\nhtml[data-motion-pref='off'] .mark[data-state='syncing'] .echo,\n@media (prefers-reduced-motion: reduce) {\n  html:not([data-motion-pref='full']) .mark[data-state='syncing'] .echo {\n    animation: none;      /* stop the loop so the value below actually applies */\n    opacity: .85;         /* a bright, HELD \"busy\" — not the frozen .22 */\n  }\n}\n```\n\nDecorative loops (a glow pulse that rests neutral at 0%) can keep riding the blanket kill-switch — they freeze to a fine value. It's only the loops whose *meaning lives in the animated property* that need the explicit held state. Audit rule: for every `infinite` keyframe, ask \"what does its 0% frame look like, and is that an acceptable static picture of this state?\" If no, it needs a designed reduced-motion hold.\n\n## Part 3 — a preset name says WHAT, not WHICH DIRECTION\n\nCurves get chosen on entrances, where \"soft settle\" is easy to judge by eye. Then the same named preset gets reused on an exit, and it misbehaves in a way nobody can articulate.\n\n**The mechanism.** An easeOut-family curve spends most of its travel early. `ethereal: [0.22, 1, 0.36, 1]` is an easeOutQuint: roughly 80% of the way there in the first fifth of the duration. On an entrance that's the whole point — the thing arrives, then settles. On an **opacity 1→0 exit** it means the layer is essentially invisible a fifth of the way in, and then the remaining 80% of the duration is spent animating something nobody can see.\n\nUsers report that as **two complaints that are actually one**: \"it doesn't fade\" (because the visible part was over in 80ms) *and* \"there's a delay\" (because the element isn't torn down until the 400ms transition ends). Both are the same curve.\n\n**But the obvious correction — \"use a symmetric curve on exits\" — is wrong half the time.** It depends on what the user is waiting for:\n\n| The exit is… | User is waiting for | Right curve | Why |\n|---|---|---|---|\n| The animation itself (dismissing something, nothing behind it competes) | the exit | symmetric, e.g. `suck: [0.4, 0, 0.6, 1]` | they're watching it leave; front-loading makes it a snap |\n| In the way (navigating to a destination already rendered behind it) | what's **behind** it | front-loaded, e.g. `ethereal` | the layer is an obstacle; travel that starts instantly keeps the motion coupled to the click |\n\nMeasured on a 400ms opacity 1→0, the two curves differ enormously in the window that matters:\n\n| t | `ethereal` opacity | `suck` opacity |\n|---|---|---|\n| 50ms | 0.52 | 0.97 |\n| 100ms | 0.24 | 0.86 |\n| 200ms | 0.04 | 0.50 |\n\n`suck` stays above every visibility threshold **~150ms longer**. On a dismissal that's a pleasant fade. On a navigation it reads as *input latency* — a dead first beat where nothing appears to happen, then a mid-curve drop, reported as \"harsher\" and \"I can still see the old screen.\"\n\n**Consequence for your token system:** if one flag drives several exits, it must carry **why**, not just whether.\n\n```ts\n// Not: fadeExit: boolean\ntype FadeExit = null | 'navigating-away' | 'dismissed';\nconst ease = fadeExit === 'dismissed' ? easings.suck : easings.ethereal;\n```\n\nOne flag, one fade, several triggers — but the curve is chosen by intent. Adding a second boolean instead splits the source of truth and they drift.\n\n### Method: compute the curve, don't argue about feel\n\nBoth of the calls above were settled in about a minute by evaluating the bezier rather than debating it. Worth keeping around:\n\n```js\nconst bez = (p1, p2, t) => 3*(1-t)**2*t*p1 + 3*(1-t)*t*t*p2 + t**3;\nconst solveT = (x1, x2, x) => {            // bisect for t given x\n  let lo = 0, hi = 1;\n  for (let i = 0; i < 60; i++) {\n    const m = (lo + hi) / 2;\n    bez(x1, x2, m) < x ? (lo = m) : (hi = m);\n  }\n  return (lo + hi) / 2;\n};\n// progress at time-fraction x for cubic-bezier(x1,y1,x2,y2)\nconst progress = ([x1, y1, x2, y2], x) => bez(y1, y2, solveT(x1, x2, x));\n```\n\nThis matters beyond settling arguments: a user reporting \"it feels laggy\" is reporting something *physical*, and the curve either confirms it or doesn't. In the case above the user independently counted frames off a screen capture and their count matched the computed opacity table to within one frame. Treat feel complaints as measurable, because they are.\n\n## What NOT to do\n\n- **Don't reuse an entrance curve on an exit without asking what the user is waiting for.** A decel curve is right when the exit *is* the animation and wrong when the user is waiting for whatever is behind it — same curve, opposite verdicts.\n- **Don't dismiss \"it feels laggy\" as subjective.** Evaluate the bezier at 3-4 timestamps; it takes a minute and it either confirms the report or rules it out.\n- **Don't assume CSS media-query coverage means you're done.** Test with your JS animation library's most commonly used component with the OS \"reduce motion\" setting on — if it still animates at full speed, you're missing the provider bridge.\n- **Don't use exactly `0ms` in a universal kill-switch** — use a near-zero value so `transitionend`/`animationend` still fire.\n- **Don't skip the \"reduced\" middle tier** if your users are diverse — accessibility guidance increasingly recognizes that \"some motion, less of it\" and \"zero motion\" are different needs, not the same request at different intensities.\n- **Don't assume the near-zero-duration kill-switch \"turns off\" a looping animation** — it freezes it at an arbitrary keyframe (usually `0%`). Any `infinite` animation whose meaning is carried by the animated property needs an explicit reduced-motion `animation: none` + a designed held value, or the state renders as whatever its 0% frame happens to be (which can be its *dimmest/emptiest* — the opposite of the intended read)."}, {"id": "n-copies-of-truth-drift-guard.md", "title": "N copies of one schema must agree — build the drift-guard, don't rely on discipline", "kind": "pattern", "last_verified": "2026-08-01", "stack": ["any", "local-first-sync", "monorepo", "codegen", "zod", "deploy"], "groups": ["Data & Sync", "Frameworks & Libraries", "Other", "Process & Meta"], "description": "Any app where one \"thing\" is described in 2+ independent schema copies (DB, sync rules, client schema, shared validators, server write-allowlist, build artifacts) will drift silently. The fix is an automated script that diffs the copies and fails the build — not a checklist. Covers four variants the guard itself cannot catch: a stale clone (internal-consistency checks pass perfectly on stale copies); a \"reader\" that is secretly a writer (a bootstrap/REST path whose unconditional upsert ERASES columns it never selected); the DEPLOYED copy (a checker that reads the repo tests agreement, not reality — and in CRUD-sync engines one unknown column rejects the whole write and jams the ordered queue behind it, so a single un-deployed file presents as \"all sync is broken\"); and the WRITE side (a write to a non-authoritative copy is temporary and reverts later, at a distance, looking like a reactivity bug — dev/seed tooling is where it bites). The deployed variant has a nastier sub-case: patch two copies in ONE commit and they are still not synchronised in production, because a cross-language pair ships through two different release mechanics — the commit is the alibi, the staleness splits your users by tier, and the check is a timestamp comparison between the last deploy and the last commit touching that directory.", "content": "# N copies of one schema must agree — build the drift-guard, don't rely on discipline\n\n**One-liner:** any app where a single piece of data is *described* in more than one independently-maintained place will drift, silently, no matter how careful you are — because the failure mode isn't an error, it's data quietly not showing up. The fix is a small script that diffs the copies and fails the build, not a checklist saying \"remember to update all of them.\"\n\n## The general shape (not specific to sync apps)\n\nThink of it as **N copies of the same address book.** As long as they're identical, mail gets delivered. The moment you add a field to the \"thing,\" every copy has to learn about it — and copies are, by construction, independent artifacts that don't know about each other:\n\n- A database schema (columns that exist)\n- A replication/sync layer's field allowlist (PowerSync sync rules, ElectricSQL shapes, a GraphQL resolver's selected fields)\n- A client-side schema/type the app validates incoming data against (Zod, io-ts, a hand-written interface)\n- A shared validator library consumed via a **compiled artifact** (`dist/`) that can itself go stale independently of its source\n- A server-side write-allowlist (which columns a client is permitted to write back)\n- Generated code from a schema-definition language (protobuf `.proto` → N language bindings, OpenAPI spec → generated client, GraphQL SDL → generated types)\n\nAny stack that has **2 or more** of these for the same conceptual \"thing\" is exposed. Playmoir has six (Postgres, `powersync-sync-rules.yaml`, the PowerSync client schema, `packages/core`'s Zod types, the server's `WRITABLE` column allowlist, and `packages/core/dist`'s build-artifact freshness) — but the pattern is the same whether it's 2 layers or 6.\n\n## Why it's insidious: the failure mode is silence, not an error\n\nThis is what makes it worse than a normal bug class — **nothing throws.**\n\n- Validation libraries with strip-unknown-keys-by-default semantics (Zod's default `.parse()` behavior, and most others) don't error when a payload has fewer fields than expected — they just don't populate the field. A dropped column looks identical to \"this value is empty,\" not \"this value failed to load.\"\n- Replication/sync engines often **freeze field lists at deploy time.** Redeploying byte-identical rules (`SELECT *`, or an unchanged shape definition) is frequently a no-op — the engine doesn't re-diff and re-stream historical rows just because you re-clicked deploy. A column added to the source DB after the last rules deploy is invisibly never sent, forever, until someone notices.\n- Workspace-package / monorepo builds resolve through a **compiled artifact**, not source. `git status` is clean, the source file has the new field, but the runtime is running a build from days ago. No tooling surfaces this by default — restarting the dev server re-imports the *same* stale artifact.\n- The tool that WOULD catch a lot of this (`tsc`, a real type-checker) frequently **isn't in the hot path.** Vite/esbuild/swz transpile-only pipelines strip types without checking them; you only get the error if you separately run `tsc --noEmit`, and most projects don't wire that into every dev-server restart.\n\nPut together: you can add a field to your \"source of truth,\" ship it, and have it be silently absent on some device/client/environment for days, with a fully green build and no console error anywhere.\n\n## Concrete incidents (Playmoir, 2026-06 → 2026-07)\n\nTwo independent production bugs, same root shape, ~10 days apart:\n\n1. **`session_summary` column** (an AI-generated field) synced to Postgres but the PowerSync sync rules were still the pre-column version — redeploying the (byte-identical-looking, but actually stale) rules didn't re-stream it. Separately, one device's `packages/core/dist` was compiled 3 days before the Zod schema added the field, so even after the sync-rules fix landed, Zod silently stripped the column from every row on that device. Two bugs stacked, each masking the other — see `monorepo-stale-dist-zod-strip.md` for the full postmortem.\n2. **`installed` columns** (a free-tier install-state feature) went missing from one of the schema layers in the very same session this lesson was written, and nothing caught it — because `tsc` doesn't run automatically in this project's dev loop.\n\nBoth were caught by a human noticing wrong behavior in the UI, not by tooling. Both cost a debugging session that a 30-line script would have prevented.\n\n## The stale-clone variant: a git-backed source of truth that nobody pulled\n\nThe N-copies problem has a time-axis twin that no consistency check can catch: **a local clone of a source of truth is stale by default, and a stale clone doesn't look broken — it looks complete and self-consistent.** Two independent instances hit the SAME day (2026-07-25): a project checkout opened 8 commits behind (its status docs confidently reported a closed item as the next action — `git status` said \"up to date,\" which only compares against the last-fetched ref), and a knowledge-base clone used to answer \"is this topic already covered?\" while 16 commits behind (it reported \"not covered\" for topics that were, nearly filing a duplicate).\n\nThe structural point: **internal-consistency checks cannot detect staleness.** Stale copies of a set of documents agree with each other perfectly. The only defense is procedural and dumb: *any workflow step that READS a git-backed source of truth starts with a fetch/pull* — session-start protocols, coverage checks, doc generators, anything. Put the pull IN the step's script/checklist, before the read, not as general advice. And treat \"up to date with origin/X\" from `git status` as meaning \"up to date with the last time this machine talked to the remote,\" which without a fetch can be days.\n\n## The destructive variant: a \"reader\" that is secretly a writer\n\nEverything above assumes the failure mode is **absence** — a field silently doesn't arrive. There is a nastier sibling where the failure mode is **destruction**, and the drift-guard as described will not catch it, because the offending layer isn't a schema copy at all.\n\nThe setup: two independent paths populate the same rows. A streaming/replication path (the one everybody thinks about), and a **bootstrap or fallback path** — a plain REST endpoint that fetches \"the current set\" and writes it locally on login, on a manual refresh, or for users who aren't on the streaming tier. The second path is filed mentally under *reading*, so it never occurs to anyone that it's a copy of the truth.\n\nThen someone adds a column, walks the documented lockstep (DB → sync rules → client schema → write allowlist → server registry), and ships. The bootstrap endpoint isn't on that list, so its `SELECT` still doesn't carry the new column. Now look at what it does with what it fetched:\n\n```sql\nINSERT INTO games (id, name, reminder_at, ...)\nVALUES ($1, $2, $3, ...)\nON CONFLICT(id) DO UPDATE SET\n  name        = excluded.name,\n  reminder_at = excluded.reminder_at,   -- <-- unconditional\n  ...\n```\n\n`excluded.reminder_at` is NULL, because the source this path fetched from never selected the column. So every routine library refresh **erases a value the user set**, on a path whose entire job was supposed to be reading. Not \"the field doesn't show up.\" The field is destroyed, repeatedly, in the background.\n\nWhy it survives all the usual nets:\n\n- **The lockstep checklist misses it** — the checklist enumerates *schema layers*, and this is a *route*.\n- **The drift-guard misses it** — the guard compares column lists between schema definitions. A hand-written `SELECT` inside a request handler isn't one of them.\n- **Nothing throws.** A partial row is a perfectly valid row.\n- **It only reproduces on the second write.** The first sync sets the value; the erasure needs a later refresh, so it won't show up in the \"does it save?\" test you just ran.\n\nIn the incident this comes from, the only thing that caught it was that the call site was **strictly typed** — adding two fields to the shared input interface made the compiler point at the one caller that couldn't supply them. With a loosely typed boundary (`any`, a bare `as`, an untyped JSON handoff) it ships as silent, recurring data loss.\n\n### Three fixes, in order of leverage\n\n1. **When adding a column, enumerate WRITE PATHS, not schema layers.** Grep the codebase for everything that ends in `INSERT` / `ON CONFLICT` / `UPSERT` / `PATCH` against that table and ask each one \"can this run with a partial source?\" A path that can write a row IS a copy of the truth, whatever you call it.\n2. **Make partial-source upserts structurally incapable of erasing.** Either omit the column from the `DO UPDATE SET` list on that path, or write it defensively so a missing source value preserves what's there:\n   ```sql\n   reminder_at = COALESCE(excluded.reminder_at, games.reminder_at)\n   ```\n   Pick per column deliberately: `COALESCE` means the path can never clear the field, which is wrong for columns where NULL is a meaningful value the path is authoritative for (a tombstone being lifted, a status being unset). The general rule is that **only a path that is authoritative for a column may write NULL to it.**\n3. **Type the boundary strictly, precisely so the compiler forces the question.** The strict interface is what converted \"silent data loss discovered by a user weeks later\" into \"the build fails and names the file.\" This is the payoff for not reaching for `any` at sync boundaries.\n\n### The generalized tell\n\n> If a code path can write a row, it is one of the N copies — even when everyone on the team describes it as a reader.\n\nBootstrap fetches, \"refresh\" buttons, import/restore flows, admin backfill scripts, and cache-warming jobs are all in this category. They tend to be written early, when the table has five columns and carrying all of them is trivially easy, and they quietly become erasers as the table grows.\n\n## The deployed variant: the copy your drift-guard cannot see\n\nBuild the script from the section below and you close the gap between the copies **in the repo**. There is one more copy, and it is the one that actually serves traffic: **the deployed artifact.** A checker that reads files on disk is structurally incapable of seeing it, so it reports green while production is broken.\n\nThe shape (Playmoir, 2026-07-27): a column was added and the full lockstep walked — Postgres migration applied, sync rules deployed, client schema, write-through, both upsert paths, PATCH allowlist, and the server's `WRITABLE` registry. Every layer agreed. `check:sync-contract` passed. The commit was pushed. **The server was never redeployed.** The `WRITABLE` change existed in git and nowhere else.\n\nWhy the blast radius was total rather than partial, and this is the part worth stealing:\n\n- CRUD-style sync engines capture a write's **full replicated column set**, not just the columns your statement touched. So one unknown column doesn't drop that column — it invalidates the entire row write.\n- The server validated with a **strict** schema (`.strict()` / `additionalProperties: false`), which is correct and is what you want. Combined with the above, it rejects the whole payload.\n- Upload queues drain **in order**. The rejected transaction never completes, so everything queued behind it is stuck too — including writes that have nothing to do with the new column.\n\nNet effect: a single missing column on one deployed file presented to the user as *\"all backup is broken, and Retry doesn't help.\"* Retry cannot help, because the payload is permanently invalid against the deployed schema; it isn't a transient fault, so retrying forever is the correct behavior and also useless.\n\n**The tell in the record:** every previous server change's log entry said \"server deployed + verified.\" The one that broke it said only \"pushed.\" If your handoff notes distinguish those two words, the diff between them is a deploy you owe.\n\nThree defenses, in order of leverage:\n\n1. **Expose the deployed version.** A `/version` endpoint returning the commit SHA turns \"is prod current?\" from an act of memory into one HTTP request — and lets the drift-guard compare it to `HEAD` for the server directory.\n2. **Fail the check when the server dir has commits newer than the last recorded deploy.** Cheap, no infrastructure, catches exactly this.\n3. **At minimum, name the step.** If \"deploy the server\" is implied rather than written in the lockstep checklist, it will be skipped by whoever is tired.\n\n> The generalized rule: **a contract test that only reads the repo is testing agreement, not reality.** Agreement between copies you can see says nothing about the copy you can't.\n\n### The lockstep sub-variant: one commit, two release mechanics\n\nThe section above is about a deploy someone *forgot*. This one is worse, because nobody forgot anything and the discipline was followed exactly.\n\nThe setup: the same logic lives in two languages — a prompt, a validation rule, a pricing table — because the two call sites are a native client and a server (see `byo-api-key-client-direct-tier.md` for why that duplication is sometimes correct). The accepted practice is to patch **both copies in lockstep, in one commit**. Do that and the copies are byte-correct and provably synchronised in git.\n\nThey are still not synchronised in production, because **the two copies ship through different release mechanics.** The native copy is compiled into the app binary and reaches users when they update. The server copy reaches users when someone runs `deploy`. One commit, two cadences, no signal anywhere that half of it is still on the shelf.\n\nPlaymoir, 2026-08-01: a prompt gained entity-tagging instructions; both copies were patched together and the commit landed at 03:52. The last server release had gone out at ~01:45 — **two hours before the commit existed.** Every generation for the next twelve hours ran the old prompt. `pnpm check` passed, the cross-layer contract check passed, the pre-push hook passed. Nothing was wrong with the code.\n\nTwo things make this specifically hard to notice:\n\n- **The commit is the alibi.** \"Both copies patched in lockstep\" is what you'd write in the message, and it's true. Someone auditing later reads the diff, sees both files changed together, and concludes the surface is consistent — which it is, in the only place they're looking.\n- **It splits your users by tier, so testing on the wrong account shows nothing.** The routing fork (native-direct vs. via-your-server) usually maps to an entitlement: bring-your-own-key users take the native path, subscribers take the server path. So the fix was live *immediately* for BYO users and *not at all* for subscribers. Whoever tests decides whether the bug exists. Here the dev account had no personal key, which is the only reason it surfaced at all.\n\n**The mechanical tell, and it's better than reading handoff notes:** compare the deployment's timestamp to the commit's. `fly releases -a <app>` (or your platform's equivalent) against `git log -1 --format=%cd -- <server-dir>`. If the newest release predates the newest commit touching that directory, the deployed copy is stale — one command, no memory involved, and it answers the question for *every* duplicated-logic pair at once rather than per-feature.\n\n**Don't debug the display layer first.** The natural first move when tagged output doesn't render is to suspect the renderer. Query the datastore instead and look at what was actually *written* — if the stored values have no tags in them, the problem is upstream of every line of UI code, and you've skipped the entire front-end investigation. In this incident that was one read-only query against a copy of the local DB, and it turned a display bug into a deploy bug in about a minute.\n\n\n## The write-side variant: writing to the copy that loses\n\nThe variants above are about *reads* — a field that doesn't arrive, or arrives and erases. There's a write-side twin: **in a system where one copy is authoritative, a write to a non-authoritative copy is temporary, and it un-does itself later and somewhere else.**\n\nConcretely (same project, same day): a dev tool backdated some timestamps by writing straight to local SQLite with raw SQL. It worked — the UI updated, the feature became testable. Then, minutes later and after an unrelated user action, the rows reverted. The mirror layer was **one-way, cloud → local**: it exists to write server-delivered rows into the local DB, and its own header said it does not push. So the local edit was never propagated, and the next time the server re-delivered those rows the original values came back.\n\nWhat makes this expensive to diagnose:\n\n- **It fails at a distance.** The bug surfaces after an unrelated action (anything that triggers a sync), so the write and the failure aren't adjacent in time or in the user's mental model. The reported symptom was \"I clicked X and unrelated thing Y broke.\"\n- **It looks like a reactivity bug.** Data that was on screen and then isn't reads as a stale-cache or re-render problem. It is worth checking whether the surface *re-queried* — if a full remount still shows the old state, the data genuinely changed and the UI is innocent. That single check redirects the whole investigation.\n- **Dev and seed tooling is where it bites**, because that's the code most likely to reach for raw SQL and least likely to go through the app's write helpers. It's also the code nobody reviews.\n\nThe rule: **any write path must go through whatever
