<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Base Browser</title>
<style>
  :root {
    --bg: #f5f6f8;
    --bg-elevated: #ffffff;
    --bg-sunken: #ebedf1;
    --text: #1a1b1f;
    --text-dim: #62636c;
    --border: #dfe1e6;
    --accent: #3355dd;
    --accent-bg: #e8ecfd;
    --code-bg: #f0f1f4;
    --shadow: 0 4px 16px rgba(20, 22, 30, 0.08);
  }
  :root[data-theme="dark"] {
    --bg: #131417;
    --bg-elevated: #1b1c20;
    --bg-sunken: #202126;
    --text: #eceef2;
    --text-dim: #9497a3;
    --border: #2d2f36;
    --accent: #7d95ff;
    --accent-bg: #262c47;
    --code-bg: #202126;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131417; --bg-elevated: #1b1c20; --bg-sunken: #202126;
      --text: #eceef2; --text-dim: #9497a3; --border: #2d2f36;
      --accent: #7d95ff; --accent-bg: #262c47; --code-bg: #202126;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height: 1.5;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    display: flex; align-items: center; gap: .75rem;
    padding: .8rem 1.2rem; border-bottom: 1px solid var(--border);
    background: var(--bg-elevated); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 1.05rem; margin: 0; white-space: nowrap; font-weight: 700; }
  header .sub { font-size: .75rem; color: var(--text-dim); white-space: nowrap; }
  #search {
    flex: 1; min-width: 120px; padding: .5rem .75rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-sunken); color: var(--text);
    font-size: .9rem; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .icon-btn {
    background: var(--bg-sunken); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: .45rem .6rem; cursor: pointer; font-size: .9rem;
  }
  .icon-btn:hover { border-color: var(--accent); }
  #filters-toggle { display: none; }

  .layout { display: flex; flex: 1; min-height: 0; }
  #sidebar {
    width: 260px; flex-shrink: 0; padding: 1rem; overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--bg-elevated);
    max-height: calc(100vh - 57px); position: sticky; top: 57px;
  }
  .facet-group { margin-bottom: 1.1rem; }
  .facet-group h4 {
    text-transform: uppercase; font-size: .68rem; letter-spacing: .06em;
    color: var(--text-dim); margin: 0 0 .4rem; font-weight: 700;
  }
  .facet-option {
    display: flex; align-items: center; gap: .45rem; font-size: .84rem;
    padding: .2rem 0; cursor: pointer; user-select: none; color: var(--text);
  }
  .facet-option input { accent-color: var(--accent); cursor: pointer; }
  .facet-option .count { margin-left: auto; color: var(--text-dim); font-size: .74rem; }
  .facet-option.disabled { opacity: .35; }
  #clear-filters {
    width: 100%; margin-top: .3rem; padding: .45rem; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    cursor: pointer; font-size: .8rem;
  }
  #clear-filters:hover { border-color: var(--accent); color: var(--accent); }

  main { flex: 1; padding: 1rem 1.2rem; min-width: 0; }
  #result-count { font-size: .82rem; color: var(--text-dim); margin-bottom: .7rem; }
  #card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: .8rem;
  }
  .card {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
    padding: .9rem 1rem; cursor: pointer; transition: border-color .12s, transform .12s;
    display: flex; flex-direction: column; gap: .4rem;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card-top { display: flex; align-items: center; gap: .5rem; }
  .badge {
    font-size: .68rem; font-weight: 700; padding: .18rem .55rem; border-radius: 999px;
    background: hsl(var(--hue) 65% 92%); color: hsl(var(--hue) 55% 32%); white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) {
    .badge { background: hsl(var(--hue) 40% 22%); color: hsl(var(--hue) 70% 78%); }
  }
  :root[data-theme="dark"] .badge { background: hsl(var(--hue) 40% 22%); color: hsl(var(--hue) 70% 78%); }
  :root[data-theme="light"] .badge { background: hsl(var(--hue) 65% 92%); color: hsl(var(--hue) 55% 32%); }
  .freshness-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .card-date { font-size: .72rem; color: var(--text-dim); margin-left: auto; }
  .card h3 { margin: 0; font-size: .98rem; line-height: 1.3; }
  .card .desc {
    font-size: .84rem; color: var(--text-dim); margin: 0;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: auto; padding-top: .3rem; }
  .tag-chip {
    font-size: .7rem; padding: .12rem .5rem; border-radius: 999px;
    background: var(--accent-bg); color: var(--accent); cursor: pointer; border: none;
    font-family: inherit;
  }
  .tag-chip.more { background: transparent; color: var(--text-dim); }
  #empty-state { text-align: center; color: var(--text-dim); padding: 3rem 1rem; font-size: .9rem; }

  #modal-backdrop {
    position: fixed; inset: 0; background: rgba(10, 10, 14, .55);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 2rem 1rem;
  }
  #modal-backdrop.hidden { display: none; }
  #modal {
    background: var(--bg-elevated); border-radius: 14px; box-shadow: var(--shadow);
    max-width: 820px; width: 100%; max-height: 88vh; display: flex; flex-direction: column;
    border: 1px solid var(--border);
  }
  #modal-header {
    display: flex; align-items: center; gap: .6rem; padding: .8rem 1.1rem;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  #modal-meta { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; flex: 1; min-width: 0; }
  #modal-tags { display: flex; flex-wrap: wrap; gap: .3rem; }
  #modal-controls { display: flex; gap: .35rem; margin-left: auto; }
  #modal-body { padding: 1.1rem 1.4rem 1.6rem; overflow-y: auto; }
  #modal-body h1 { font-size: 1.4rem; margin-top: 0; }
  #modal-body h2 { font-size: 1.15rem; margin-top: 1.6rem; border-top: 1px solid var(--border); padding-top: 1rem; }
  #modal-body h3 { font-size: 1rem; margin-top: 1.2rem; }
  #modal-body p { font-size: .92rem; }
  #modal-body li { font-size: .92rem; margin: .25rem 0; }
  #modal-body code {
    background: var(--code-bg); padding: .1rem .35rem; border-radius: 4px;
    font-size: .85em; font-family: "SF Mono", Consolas, Menlo, monospace;
  }
  #modal-body pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: .8rem 1rem; overflow-x: auto;
  }
  #modal-body pre code { background: none; padding: 0; }
  #modal-body blockquote {
    border-left: 3px solid var(--accent); margin: .8rem 0; padding: .1rem 1rem;
    color: var(--text-dim);
  }
  #modal-body table { border-collapse: collapse; width: 100%; margin: .8rem 0; font-size: .85rem; }
  #modal-body th, #modal-body td { border: 1px solid var(--border); padding: .4rem .6rem; text-align: left; }
  #modal-body th { background: var(--bg-sunken); }
  #modal-body a { color: var(--accent); }
  #modal-body hr { border: none; border-top: 1px solid var(--border); margin: 1.2rem 0; }

  @media (max-width: 860px) {
    #sidebar {
      position: fixed; top: 57px; left: 0; bottom: 0; z-index: 20; width: 82vw;
      max-width: 320px; box-shadow: var(--shadow); max-height: none;
      transform: translateX(-100%); transition: transform .15s;
    }
    #sidebar.open { transform: translateX(0); }
    #filters-toggle { display: inline-flex; }
    header h1 { font-size: .92rem; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="filters-toggle" class="icon-btn" aria-label="Toggle filters">☰</button>
    <h1>Knowledge Base</h1>
    <input id="search" type="search" placeholder="Search titles, tags, content…">
    <span class="sub" id="result-count-header"></span>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">🌓</button>
  </header>
  <div class="layout">
    <aside id="sidebar">
      <div class="facet-group" id="kind-facet"></div>
      <div id="tag-facets"></div>
      <div class="facet-group">
        <h4>Freshness</h4>
        <label class="facet-option"><input type="checkbox" id="stale-only"> Stale only (&gt;6 months)</label>
      </div>
      <div class="facet-group">
        <h4>Sort</h4>
        <select id="sort-select" style="width:100%; padding:.35rem; border-radius:8px; background:var(--bg-sunken); color:var(--text); border:1px solid var(--border);">
          <option value="recent">Recently verified</option>
          <option value="stale">Least recently verified</option>
          <option value="title">Title (A–Z)</option>
          <option value="kind">Kind</option>
        </select>
      </div>
      <button id="clear-filters">Clear all filters</button>
    </aside>
    <main>
      <div id="result-count"></div>
      <div id="card-grid"></div>
      <div id="empty-state" style="display:none;">No lessons match the current filters.</div>
    </main>
  </div>
</div>

<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-meta">
        <span id="modal-badge" class="badge"></span>
        <span id="modal-date" class="card-date"></span>
        <div id="modal-tags"></div>
      </div>
      <div id="modal-controls">
        <button id="modal-prev" class="icon-btn" aria-label="Previous">‹</button>
        <button id="modal-next" class="icon-btn" aria-label="Next">›</button>
        <button id="modal-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script id="kb-data" type="application/json">{"lessons": [{"id": "always-on-top-overlay-vs-exclusive-fullscreen.md", "title": "Always-on-top overlays vs exclusive-fullscreen games: out-painted but still eating clicks", "kind": "gotcha", "last_verified": "2026-07-27", "stack": ["windows", "tauri", "desktop-overlay"], "groups": ["Platforms & Runtimes"], "description": "An always-on-top window can't out-paint an exclusive-fullscreen game but STILL wins hit-tests from the z-order: an invisible click-eater whose stolen focus minimizes the game (and whose hover-paused auto-dismiss never fires). Painting and input routing are separate systems. Fix is to bow out like Windows' own toasts do — `SHQueryUserNotificationState`, treating only `QUNS_RUNNING_D3D_FULL_SCREEN` as exclusive (borderless reports `QUNS_BUSY` and composites fine) — checked at fire time AND via a lifetime watcher (launcher-first games claim the display AFTER your window opens). Why click-through and more-topmost-flags are dead ends; disclose the limitation in settings.", "content": "# Always-on-top overlays vs exclusive-fullscreen games: out-painted but still eating clicks\n\n**One-liner:** an always-on-top window cannot out-paint a game running in TRUE exclusive fullscreen (the game owns the display), but the window **keeps winning hit-tests from the z-order** — so you get an invisible click-eater: a click \"on the game\" lands on your hidden window, steals focus, and the exclusive-fullscreen game minimizes on focus loss. The OS-sanctioned answer is to bow out, using the same signal Windows uses to suppress its own toasts: `SHQueryUserNotificationState`.\n\n## Symptom\n\n- Your app pops a notification/recap/overlay window (borderless + always-on-top + maximized) around the time a game launches.\n- The game paints over it — user never sees your window.\n- Later, a click \"in the game\" inexplicably **minimizes the game**, revealing your window sitting there.\n- If the window has an auto-dismiss countdown that pauses on hover: it may never self-clear, because the invisible window still receives mouse events, and the game's own cursor sitting mid-screen counts as hovering (observed as \"stuck forever\"; the hover-pause mechanism is the consistent explanation).\n- Bonus at-open hazard: building the window with focus (`.focused(true)` in Tauri) steals focus at creation — if the game is *already* exclusive-fullscreen at that moment, it minimizes with no click at all.\n\n## Cause\n\nPainting and hit-testing are **separate systems**. Exclusive fullscreen hands the display to the game's swap chain — DWM stops compositing other windows, so \"always on top\" wins nothing. But the window is still in the z-order for input routing: `WM_MOUSE*` goes to whatever hit-testing finds, which is your invisible topmost window. Clicking it gives it foreground focus; exclusive-fullscreen D3D apps minimize when they lose focus. That's the whole failure: invisible for output, first-in-line for input.\n\nTiming trap: if your window fires on process start (game_started-style watcher), launcher-first games pass any **fire-time-only** check — the launcher isn't fullscreen — and the game claims the display *after* your window is already up. Detection must run for the window's whole lifetime, not just at open.\n\n## What does NOT work (measured or structurally dead)\n\n- **More topmost/always-on-top flags.** Painting isn't the layer you lost. Nothing you set on your window makes DWM composite over an exclusive swap chain.\n- **Click-through (`set_ignore_cursor_events`) as the whole fix.** It removes the click-eater but creates a chicken-and-egg: a click-through window can't be clicked when it IS legitimately visible (over a borderless game). Re-enabling on hover requires native cursor polling, and for a maximized window \"inside bounds\" is always true — you'd need the content-card rect from the webview, and re-enabling in that region reintroduces the click-steal exactly where users click.\n- **Drawing over exclusive fullscreen at all.** The only way (what Steam/Discord/RTSS overlays do) is injecting into the game's render pipeline — anticheat-hostile, out of the question for a normal desktop app.\n\n## Fix: bow out like the OS does\n\n`SHQueryUserNotificationState` is the Windows shell's own \"should notifications stay away\" probe:\n\n- `QUNS_RUNNING_D3D_FULL_SCREEN` → a D3D app owns the display exclusively. **Bow out.**\n- `QUNS_BUSY` → fullscreen-ish but composited (borderless fullscreen, F11 apps, presentations). **DWM composites you fine — keep the overlay.** Do not treat BUSY as exclusive or you'll suppress yourself for most modern games.\n\nCheck it at **two points**:\n\n1. **Fire time** — skip creating the window entirely (also prevents the `.focused(true)` steal from minimizing an already-fullscreen game).\n2. **A lifetime watcher** — poll every ~1.5s while the window lives; the moment the game goes exclusive, quietly destroy your window (it's invisible at that point anyway, so there is nothing to lose and a click-eater to remove).\n\nRust (windows crate, feature `Win32_UI_Shell`):\n\n```rust\nfn exclusive_fullscreen_active() -> bool {\n    use windows::Win32::UI::Shell::{SHQueryUserNotificationState, QUNS_RUNNING_D3D_FULL_SCREEN};\n    match unsafe { SHQueryUserNotificationState() } {\n        Ok(state) => state == QUNS_RUNNING_D3D_FULL_SCREEN,\n        Err(_) => false, // probe failure → assume composited; worst case is pre-fix behavior\n    }\n}\n\n// after building the window:\nstd::thread::spawn(move || loop {\n    std::thread::sleep(std::time::Duration::from_millis(1500));\n    if window.is_visible().is_err() { break; }   // destroyed by any dismiss path → done\n    if exclusive_fullscreen_active() {\n        let _ = window.destroy();\n        break;\n    }\n});\n```\n\nHold the window **handle** in the watcher, not the label — any dismiss path (button, click-away, timer, hotkey dead-man, a re-fire's replace-destroy) invalidates the handle and the loop self-terminates. A label-based loop races with rebuilds under the same label.\n\n**UX complement:** disclose it. One line in settings (\"games in exclusive fullscreen hide overlays entirely, so this steps aside for them; borderless fullscreen shows it\") converts a mystery no-show into expected behavior. This matches user expectations already set by Windows toasts and Steam popups, which also don't appear over exclusive fullscreen.\n\n## Caveats\n\n- **Fullscreen Optimizations (Win10/11)** convert many technically-\"fullscreen\" games into a composited flip-model mode; those may not report `QUNS_RUNNING_D3D_FULL_SCREEN`. Failure mode is benign: your overlay stays, which is pre-fix behavior — and for FSO games it usually actually paints. The population that DOES report exclusive is old ports and FSO-opted-out titles — exactly the ones that break overlays.\n- **Verification honesty:** the failure mechanism here (invisible window → click → focus steal → game minimized) was observed live. The fire-time probe's efficacy was verified only indirectly in the origin project (on retest the overlay didn't appear and nothing stranded; a non-qualifying trigger wasn't fully ruled out). The API itself is the documented notification-suppression signal.\n\n## Related\n\n- [tauri-multiwindow-dev-hmr-stranding.md](./tauri-multiwindow-dev-hmr-stranding.md) — the sibling failure class for the same window shape (dev reloads wedging an always-on-top webview whose dismiss paths are all JS-side).\n- [instrument-before-patching.md](./instrument-before-patching.md) — the click-ring/hit-test tripwire that turns \"clicks vanish\" reports into named DOM/window facts."}, {"id": "azure-cli-windows-auth-traps.md", "title": "Azure CLI auth on Windows: three stacked traps that break \"just sign in again\"", "kind": "gotcha", "last_verified": "2026-07-22", "stack": ["windows", "azure", "azure-cli", "trusted-signing", "entra-id"], "groups": ["Auth & Security", "Platforms & Runtimes"], "description": "Re-authenticating `az` on Windows hides three stacked traps: the prompt is a native WAM dialog, not a browser (so \"nothing opened\" and `BROWSER` overrides are ignored — `az config set core.enable_broker_on_windows=false` restores the browser flow); device-code flow gets blocked with AADSTS530035 days after tenant creation when Microsoft auto-enables security defaults (\"it worked two days ago\" is true and useless); and the picker pre-offers the personal Microsoft account, whose failure text (\"add as an external user\") reads like broken setup but just means wrong-account-clicked. Pre-flight any signing pipeline with a 2-second `az account get-access-token --scope …codesigning…` so an expired token can't hang the build at `Signing …`.", "content": "# Azure CLI auth on Windows: three stacked traps that break \"just sign in again\"\n\nAny project that signs Windows builds with **Azure Trusted Signing** (or uses\n`az` for anything) will eventually hit an expired token mid-pipeline and need to\nre-authenticate. On Windows in 2026 that simple act hides **three independent\ntraps that stack**, and each one produces a misleading symptom. This article is\nthe ten-minute path through what cost a release evening of dead ends.\n\nContext that makes it worse: the token expiry usually surfaces **inside a build\npipeline** (a signtool dlib waiting silently), so the first symptom isn't an\nauth error — it's a build that hangs forever at the `Signing …` step.\n\n## Trap 1 — the sign-in prompt is not in any browser\n\n`az login` on modern Windows defaults to the **WAM broker** (Web Account\nManager): a *native Windows dialog*, not a browser page. Users hunt for a\nbrowser tab that does not exist, or find the little native box and mistake it\nfor something else entirely (\"why did a Windows thing pop up?\").\n\nWorse: while the broker is active, **the `BROWSER` environment variable does\nnothing** — there is no browser launch to redirect. If you've been trying to\nsteer the login into a specific browser/profile and \"nothing opens,\" this is\nwhy. The CLI meanwhile prints `Select the account you want to log in with`\nas if everything is fine.\n\n**Fix:**\n\n```\naz config set core.enable_broker_on_windows=false\n```\n\nNow `az login` opens a real browser page (localhost-redirect flow). `BROWSER`\npointed at a chrome.exe works from here — the tab opens in the last-active\nprofile. And because it's a plain web login, it can be completed in ANY\nbrowser on the machine; the localhost redirect doesn't care which browser\nfinishes it.\n\n## Trap 2 — device-code flow is blocked on new tenants (AADSTS530035)\n\nThe classic workaround for browser confusion is `az login --use-device-code`\n(user opens microsoft.com/devicelogin anywhere, types a code). On a **new Entra\ntenant this fails** with:\n\n> AADSTS530035: Access has been blocked by security defaults.\n\nMicrosoft **auto-enables \"security defaults\" on new tenants days after\ncreation** — device-code flow is a phishing vector, so it gets blocked. The\nnasty part is the timeline: device-code login *worked* during initial setup\n(day 0), then silently stopped (day ~2+) with no action on your part. \"It\nworked two days ago\" is true and useless.\n\nDo NOT disable security defaults to unblock it — they're what's protecting the\naccount that signs your releases. Use the browser flow from Trap 1.\n\n## Trap 3 — the account picker offers the wrong account, with a misleading error\n\nPersonal machines are signed into a personal Microsoft account (Windows itself,\nconsumer services). The picker (WAM or web) **pre-offers that personal\naccount**; picking it against a work tenant yields:\n\n> Selected user account does not exist in tenant '…' and cannot access the\n> application '04b07795-8ddb-461a-bbee-02f9e1bf7b46' in that tenant. The\n> account needs to be added as an external user in the tenant first.\n\nThat \"needs to be added as an external user\" instruction reads like a broken\nsetup requiring admin surgery. It isn't — it just means **you clicked the wrong\naccount**. (`04b07795-…` is the Azure CLI's own well-known app id, another\nred-herring detail.) Click \"Use another account\" and enter the org account.\n\n## The one-command resolution\n\nAfter disabling the broker (Trap 1), pin BOTH the tenant and the scope so the\nlogin can't wander into the wrong tenant and mints a token the signing dlib can\nuse immediately:\n\n```\naz login --tenant <TENANT_ID> --scope \"https://codesigning.azure.net/.default\"\n```\n\nVerify non-interactively (this is also the right *pre-flight check* before any\nrelease build — a 2-second command that would have flagged the expiry before\nthe pipeline hung):\n\n```\naz account get-access-token --scope \"https://codesigning.azure.net/.default\" --query expiresOn -o tsv\n```\n\nIf that prints a timestamp with no prompt, the signing step will run silently.\nIf it prints \"run az login…\", fix auth BEFORE starting the build.\n\n## Symptom → trap map\n\n| Symptom | Trap |\n|---|---|\n| Build hangs forever at `Signing …` | expired token → dlib waiting on an interactive prompt somewhere |\n| \"Nothing opened\" after `az login` | 1 — the prompt is a native Windows dialog, not a browser |\n| `BROWSER` env var ignored | 1 — broker active, no browser launch exists |\n| AADSTS530035 on device-code | 2 — security defaults auto-enabled on the new tenant |\n| \"account does not exist in tenant / add as external user\" | 3 — wrong account picked; not a setup problem |"}, {"id": "bot-challenge-blocks-your-auto-updater.md", "title": "Your CDN's bot challenge blocks library user-agents, and an auto-updater is a library user-agent", "kind": "gotcha", "last_verified": "2026-08-10", "stack": ["cloudflare", "tauri", "rust", "release-engineering", "reliability"], "groups": ["Languages", "Other", "Platforms & Runtimes"], "description": "Put an update manifest behind Cloudflare and it serves browsers fine while 403-ing `reqwest`, curl's default and empty user-agents, so auto-update can be dead for every user while the download page works — and because updater check-failures are deliberately silent, nobody reports it. Includes why BOTH obvious tests lie (curl's own UA is a blocked signature; a browser UA proves nothing you shipped), how to read the real UA out of the dependency source, a measured UA/status table, the 200-with-HTML variant that fails in your JSON parser instead of the transport, and why passing today is an accident you're depending on rather than a decision anyone made.", "content": "# Your CDN's bot challenge blocks library user-agents, and an auto-updater is a library user-agent\n\n**One-liner:** put your update manifest behind Cloudflare (or any WAF with bot management) and the endpoint will serve browsers perfectly while 403-ing `reqwest`, `python-requests`, curl's default and empty user-agents — so your auto-updater can be dead for every user while the download page works fine, and because updater check-failures are deliberately silent, nobody will ever report it. Worse, the classifier reads your TLS/HTTP fingerprint as well as your user-agent, so curl and Node's fetch sending the IDENTICAL updater UA get 200 and 403 respectively — meaning no client your build script can call is able to prove OTA works, and every obvious way to test it gives you a confidently wrong answer.\n\n## The setup that produces it\n\nAny desktop app that self-updates from a static manifest:\n\n```\nhttps://releases.example.com/latest.json      <- updater polls this\nhttps://releases.example.com/App_1.2.3.msi    <- updater then downloads this\n```\n\nServed from object storage (R2/S3) behind a CDN, on a subdomain of a zone with bot management enabled. Nothing about this is unusual, and nothing about it looks risky — it's a static JSON file.\n\nThe CDN doesn't know the difference between \"a bot scraping my release artifacts\" and \"my own product asking whether it should update.\" It classifies on request signature, and the loudest signal is the `User-Agent` header.\n\n## Why it fails silently, which is the actual problem\n\nUpdate clients almost universally swallow check failures on purpose. Tauri's plugin, Sparkle, Squirrel — none of them surface \"I couldn't reach the update server\" to the user, and they're right not to: a modal every launch because someone's coffee-shop wifi is flaky would be worse than the bug.\n\nSo the failure mode is:\n\n- Users keep running an old version.\n- No error dialog, no crash, no support ticket.\n- Your download page works, so manual installs succeed and *look* like proof the endpoint is fine.\n- Your own dev machine updates fine if you ever tested from a browser.\n\nThere is no signal. You find this by going looking for it.\n\n## Both obvious tests lie to you\n\nThis is the part worth internalising.\n\n```bash\n# Test 1: \"let me just curl it\"\ncurl -s https://releases.example.com/latest.json\n# -> HTML: \"Just a moment...\" / 403\n```\n\nConclusion you'll draw: **the endpoint is broken.** Wrong. curl's default UA (`curl/8.x`) is itself a blocked signature. You've reproduced a block that your app never hits.\n\n```bash\n# Test 2: \"ok, let me use a real browser UA\"\ncurl -s -A \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/140.0\" \\\n  https://releases.example.com/latest.json\n# -> {\"version\":\"1.2.3\",...}\n```\n\nConclusion you'll draw: **the endpoint is fine, curl was just being weird.** Also wrong. You've now proven browsers work, which was never in question.\n\nNeither test touched the thing you actually ship. So the obvious correction is \"test with the exact UA string my client sends\" — and that is better, but it is **still not sufficient**, for a reason worth its own section.\n\n## The UA is not the whole classifier — and this invalidates the fix you just reached for\n\nMeasured on the same live endpoint, same day, sending the **identical** `tauri-plugin-updater/2.10.1` user-agent:\n\n| Client | Result |\n|---|---|\n| curl | **200** |\n| Node `fetch` (undici) | **403** |\n\nSame header, opposite outcomes. And Node's fetch is challenged **even when it sends a full Chrome user-agent**. So the WAF is fingerprinting the client's TLS handshake and HTTP/2 behaviour (JA3/JA4-style), not just reading a header.\n\nThe consequence is uncomfortable and worth stating plainly: **no HTTP client available to your build script can faithfully impersonate the one inside your app.** curl passing proves curl passes. Node failing proves Node fails. Neither is `reqwest`-in-Tauri.\n\nWhich means:\n\n- A script-based \"OTA works\" check is **not achievable**. You can verify the artifact is published, correct and reachable; you cannot verify your updater can read it.\n- If you build that check anyway and call it verification, you've built the same trap as the guard that watches the wrong path — a green signal that means less than it claims.\n- **The only conclusive test is behavioural:** install an older build and confirm it offers the update.\n\nThis is also why the fix below is \"exempt the path,\" not \"allowlist the UA.\" An exemption is a property of the endpoint and holds for every client. A UA allowlist still leaves you at the mercy of a fingerprint you don't control and can't test.\n\n## Find the real user-agent, don't guess it\n\nFor `tauri-plugin-updater` it's built from the crate's own Cargo metadata:\n\n```rust\n// tauri-plugin-updater/src/updater.rs\nconst UPDATER_USER_AGENT: &str = concat!(env!(\"CARGO_PKG_NAME\"), \"/\", env!(\"CARGO_PKG_VERSION\"));\n// => \"tauri-plugin-updater/2.10.1\"\n```\n\nSo read it out of the dependency source rather than assuming:\n\n```bash\ngrep -rn \"user_agent\\|USER_AGENT\" ~/.cargo/registry/src/*/tauri-plugin-updater-*/src/*.rs\n```\n\nThen test with it — **and test the artifact download too, not just the manifest.** They're two separate requests and can be matched by different rules:\n\n```bash\nUA=\"tauri-plugin-updater/2.10.1\"\ncurl -s  -A \"$UA\" -o /dev/null -w \"manifest %{http_code}\\n\" https://releases.example.com/latest.json\ncurl -sI -A \"$UA\"                -w \"artifact %{http_code}\\n\" https://releases.example.com/App_1.2.3.msi\n```\n\nMeasured on a live Cloudflare zone with default bot settings (2026-07-29), **all via curl** — remember from the section above that a different client sending these same strings can get different answers, so read this as \"which UAs curl gets away with,\" not as your app's fate:\n\n| User-Agent | Result |\n|---|---|\n| `curl/8.x` (curl default) | **403** + challenge HTML |\n| *(empty / no UA header)* | **403** |\n| `reqwest` / `reqwest/0.12` | **403** |\n| `Mozilla/5.0 … Chrome/140.0` | 200 |\n| `tauri-plugin-updater/2.10.1` | 200 |\n\n## The uncomfortable part: you're passing by accident\n\nNote what that table actually says. `reqwest` is blocked. `tauri-plugin-updater` is not. The updater **is** a reqwest client — it just overrides the UA with its own crate name, and \"tauri-plugin-updater\" happens not to match any bot signature.\n\nThat is not a design decision anyone made on your behalf. It is a coincidence you are depending on. Which means:\n\n- A plugin release that dropped the custom UA would fall back to reqwest's default and **break OTA for everyone, silently**, on a dependency bump that looked routine.\n- Swapping to your own HTTP client for the update check does the same thing.\n- Cloudflare tightening a managed ruleset does the same thing, with no change on your side at all.\n\n## Two failure shapes, and the second one is nastier\n\n**403 + HTML.** Clean-ish: the client sees an HTTP error and gives up.\n\n**200 + HTML.** Some challenge configurations return `200` with an interstitial body. Now your updater gets a successful response containing `<!DOCTYPE html>` where it expected JSON, and fails in the parser instead of the transport. If your error handling distinguishes \"network error\" (retry later, stay quiet) from \"malformed manifest\" (something is badly wrong), this lands in the wrong bucket and stays quiet too.\n\n## What to actually do\n\n1. **Exempt the release path.** A WAF / Bot Management skip rule scoped to `releases.example.com/*`. This is the only fix that is a property of the *endpoint* rather than of a client you can't test, and it's the one that makes every other check meaningful. These are static public artifacts; the download link is public anyway, so there is nothing being protected.\n2. **Log update-check failures somewhere you'll see them**, even while staying silent in the UI. Silent-to-the-user must not mean silent-to-you — a counter in your error reporter turns a permanently invisible bug into a graph that goes flat. Given you cannot test the client from a script, this is your real detector.\n3. **Assert what you actually can at release time:** that the manifest is published, parses, names the version you just shipped, and points at an artifact that returns 200. Useful, and *not* the same claim as \"the updater can read it\" — label it accordingly so a green run doesn't get quoted as proof later.\n4. **If you can't get an exemption, pin the UA** (`MyApp-Updater/1.2.3`) so at least a dependency bump can't change it underneath you — while remembering the fingerprint half is still outside your control.\n\n## Update 2026-08-10: three corrections from living with this\n\n### 1. On Cloudflare's free plan, the recommended fix does not exist\n\n\"Exempt the release path\" assumes you can write a WAF custom rule with a **Skip** action. Skip cannot bypass **Bot Fight Mode**, the free-plan feature. It can only bypass **Super Bot Fight Mode**, which is Pro and up. The names differ by one word and the capability differs completely, and the dashboard does not tell you this at the point of decision — you find out from the docs after building the rule.\n\nSo on a free zone your options collapse to three, none of them the scoped exemption:\n\n1. **Turn Bot Fight Mode off**, which is zone-wide. Often fine, because the zone in question is usually a marketing site plus a bucket of deliberately-public installers: no login, no forms, no origin server, no egress billing. Worth checking what it is actually protecting before assuming it is protecting something.\n2. **Upgrade** to get the scopeable version.\n3. **Move the update feed to a host without bot filtering** — your own API server, which the app already talks to. This fixes every *future* update permanently, but **cannot rescue installed copies**, because the endpoint is compiled into the binaries already in the field. One manual reinstall is unavoidable, so if you are going to do it, do it *before* the release that people will be reinstalling anyway.\n\nNote also what Bot Fight Mode actually tests: it hands the client a **JavaScript challenge**. A desktop app has no JS engine, so it cannot pass — not \"looks suspicious and gets flagged\", but *structurally incapable of passing*. There is no header, UA, or good behaviour that fixes it from the client side.\n\n### 2. The symmetry: a probe that FAILS is no more trustworthy than one that passes\n\nThe section above establishes that curl passing proves nothing about your app. The inverse is equally true and much easier to fall for, because a failure feels like discovering a bug rather than making a claim.\n\nI built what should have been the perfect probe: a `#[test]` **inside the application's own crate**, using the app's own `reqwest` at the app's own version with feature unification identical to the shipped binary, replicating `tauri-plugin-updater`'s exact request — its UA read out of the dependency source, with and without its default `Accept: application/json`.\n\n```\n[ota] updater-shaped request: 403 Forbidden\n[ota] same UA, no Accept:     403 Forbidden\n```\n\nConclusion drawn: OTA is dead for every user. Consequence: an hour spent on stranded-user mitigation, a security-settings decision pushed at the product owner, and a ledger entry announcing an outage.\n\nThen a real installed build self-updated, first try.\n\n**A same-language, same-crate, same-version imitation of your client is still not your client.** Something differed — TLS backend selected at link time, connection reuse, IP reputation, per-path rules, request timing — and finding out which was never worth the effort, because the behavioural test is cheap and definitive. The rule to carry: **a probe result is evidence about the probe.** In both directions. State probe findings as \"my imitation was refused\", never as \"the updater is broken\", and let the behavioural test settle it before anyone changes their infrastructure.\n\n### 3. If you add a runtime asset download, it will be blocked even when the updater is not\n\nThis is the corollary that bit us. The updater passes this host. Our own downloader, fetching an ML model from **the same host, the same day**, was refused — and users saw it, because unlike an update check, a user-initiated download fails loudly:\n\n```\nThe download server returned 403 Forbidden for the voice model.\n```\n\nSo \"OTA works\" tells you nothing about the next thing you host there. Any in-app fetch you add (model, dictionary, data pack, asset bundle) is a fresh client the classifier has never seen.\n\n**The cheap insurance is a source chain with a pinned hash:**\n\n```rust\nconst MODEL_SOURCES: [&str; 2] = [\n    \"https://releases.example.com/models/model.bin\",   // ours, preferred\n    \"https://huggingface.co/org/repo/resolve/main/model.bin\",  // upstream\n];\n// try in order; verify sha256 before installing whatever arrives\n```\n\nYour host first, so you are not dependent on a third party and so first-party service resumes automatically if the rule is ever relaxed. Upstream second, so a bot policy cannot take the feature down. **The pinned checksum is what makes the second source safe** — whoever serves the bytes, only the bytes you pinned are ever installed, so a fallback host is a delivery choice rather than a trust decision.\n\n## Generalises beyond updaters\n\nAnything non-browser fetching from a WAF-protected origin has this shape: crash-symbol uploads, license checks, telemetry, package managers pulling from your CDN, a mobile app hitting a marketing-site JSON endpoint, webhook receivers. The common thread is that **the browser path is the one you test and the library path is the one you ship**, and a WAF is specifically built to tell those apart.\n\n## Related\n\n- [signed-but-flagged-download-reputation.md](./signed-but-flagged-download-reputation.md) — the sibling problem on the same artifact: it's signed, it's clean, and SmartScreen warns anyway.\n- [instrument-before-patching.md](./instrument-before-patching.md) — the discipline that turns \"OTA seems broken?\" into a measured table instead of a guess.\n- [verify-the-artifact-your-user-receives.md](./verify-the-artifact-your-user-receives.md) — how to sidestep this challenge entirely when a human is in the loop: if they download from the real link and scan *that*, matching its digest against your local build proves the served bytes without any programmatic fetch of the CDN."}, {"id": "byo-api-key-client-direct-tier.md", "title": "BYO API key as a free tier: call the third-party API from native code, never from webview JS", "kind": "pattern", "last_verified": "2026-08-01", "stack": ["tauri", "desktop", "rust", "api-integration", "monetization"], "groups": ["Integrations", "Languages", "Platforms & Runtimes"], "description": "Let users paste their own API key and call a metered third-party API directly instead of through your server, for a genuine free tier. The client-direct call must run from native code (key custody + CORS), one low branch point forks the network call only, one predicate per capability (never widen a shared \"isPremium\"), and a free key's real rate limit needs its own concurrency/retry tuning, not the paid path's. Getting the predicates right is only half of it: audit the OFFERS as well as the gates — a capability correctly open to BYO users was advertised only on a subscription edge, so a whole tier had it and was never told.", "content": "# BYO API key as a free tier: call the third-party API from native code, never from webview JS\n\n**One-liner:** when a paid feature calls a metered third-party API (an LLM, a rate-limited web API) through your own server, you can offer a genuine free tier by letting the user paste their OWN key and calling the third-party API directly from the app instead of through your server. But \"client-direct\" should mean **from native code** (Rust/Tauri command, Electron main process, native mobile networking), never a `fetch()` in the web/renderer layer — and the routing, entitlement, and error-handling design has several non-obvious traps beyond \"just add an if-statement.\"\n\n## The core routing pattern: fork at ONE low branch point, not per-caller\nBranch as close to the network boundary as possible. Concretely: the function that generates an AI summary reads \"is there a saved personal key?\" **once**, and forks only the network call itself — everything before (read local data) and after (write the result, using the identical column set either way) is the same code regardless of path. This is deliberately the lowest place you could branch. The alternative — checking \"which mode am I in\" at every call site that might invoke the feature — means every caller duplicates the routing logic. With the branch pushed down to one place, existing callers (a forward-summary trigger, a narrative-weave feature, a bulk backfill job) gained the free path with **zero changes to their own code**.\n\n## Do the client-direct call from native code — two independent reasons, not one\n1. **Key custody.** A key that only ever exists in OS-encrypted native storage (DPAPI/Keychain) and a native HTTP client is never exposed to the DOM/JS execution context at all — immune to any XSS or supply-chain compromise of the web layer. That's a materially different trust model than \"key sits in a JS variable, sent via `fetch()`.\"\n2. **CORS.** Third-party APIs are not guaranteed to set permissive CORS headers for arbitrary origins. A webview `fetch()` straight to a vendor's REST endpoint can simply be blocked by the browser's CORS enforcement depending on their headers and your webview's origin — a failure mode that doesn't exist for a native HTTP client (reqwest, etc.), which has no same-origin concept at all.\n\n**Concrete storage shape that reused cleanly across two unrelated keys (Steam + Gemini):** split the concern into a **crypto module** (encrypt/decrypt only — e.g. `protect_secret(plaintext) -> \"dpapi:v1:<base64>\"`, `reveal_secret(marker) -> plaintext`, `is_protected(value)`) and a separate **KV-accessor module** that layers `put_secret`/`load_secret`/`clear_secret` on top of a generic local key-value table. Two details worth stealing directly:\n- **Marker-prefix the ciphertext** (`dpapi:v1:...`) instead of assuming every value in that column is encrypted. It lets `is_protected()` distinguish \"encrypted\" from \"not yet migrated\" from \"explicitly cleared,\" and lets you version the scheme later without a migration that touches every row.\n- **An empty string is the \"no secret\" sentinel**, not a NULL/missing-row check — simplifies every call site to one falsy check instead of an existence check plus a value check.\n- Because the crypto and the accessor are separate modules, adding the SECOND key (Gemini, after Steam already existed) took **zero new crypto code** — pure reuse of the KV+encryption split, only a new accessor call site. That reuse is the actual payoff of splitting these two concerns instead of writing one bespoke \"store this key\" function per feature.\n\n## Entitlement design: one predicate per CAPABILITY, composed with OR — never widen a shared \"isPremium\" boolean\nThe natural bug: BYO key unlocks feature X, so it gets OR'd into a general \"is this user premium\" check, which then accidentally also unlocks feature Y (e.g. cloud sync) that BYO was never meant to grant. What held up under repeated gating additions: keep every capability behind its **own named predicate** (`canUseAi()`, `hasUnlimitedAi()`, `isSyncEntitled()`), each composed explicitly — `isSubscribed() || hasByoKey()` for the AI ones, `isSubscribed()` alone (deliberately **not** OR'd with the BYO check) for the sync one. Comment WHY a predicate excludes BYO right at its definition (\"BYO never unlocks sync\") — the omission looks like a bug to someone who doesn't know it's deliberate, and will get \"fixed\" wrong otherwise.\n\nModel tiers *within* a capability precisely, too: distinguish \"some free generations via a trial counter\" from \"unlimited via subscription OR BYO key\" as two different predicates. A trial-limited state can't actually complete a bulk operation (a full-history backfill) the way unlimited access can — reusing the wrong predicate for a bulk operation silently strands the user partway through with no explanation.\n\n### Getting the predicates right is only half of it — audit the OFFERS too\n\nNamed per-capability predicates fix *who can do the thing*. They do nothing about **who gets told the thing exists**, and those are separate code paths that drift apart silently.\n\nThe failure (Playmoir, 2026-08-01): the bulk-backfill capability was correctly gated on `hasUnlimitedAi()` (subscription **or** BYO key). But the modal that *offers* the backfill — the \"you're in, want to catch up your history?\" moment — fired on a `isSubscribed()` false→true edge, because it was written when subscription was the only way to get there. Net result: a BYO-key user had the capability the entire time and was **never told**. Nothing was broken, nothing threw, and the feature was reachable if you went looking in settings. It was simply invisible to a whole tier of users, indefinitely.\n\nThis is structurally invisible for a reason: the capability check and the discovery check are usually **far apart in the codebase** (a settings card vs. an app-root modal), written months apart, and neither is wrong on its own terms. A test that asks \"can a BYO user run a backfill?\" passes.\n\nThe audit that catches it: for each capability predicate, grep every reference and **sort the call sites into two piles — gates and offers** (banners, nudges, upgrade modals, empty-state CTAs, notification rows, onboarding steps). Every offer for capability X must use the *same predicate* as the gate for X, or be able to say why not in one sentence. Where an offer fires on a **transition** rather than a state, the predicate in the edge-detector is the one that matters — and it's the easiest to overlook, because it often sits inside a `useEffect` rather than next to any UI.\n\nOne migration trap when you fix one: an offer that fires on an edge usually persists an \"already shown this\" flag, baselined from the *old* predicate. Widening the predicate makes previously-ineligible users read as a fresh conversion, so the offer fires once for everyone who was silently excluded. That is usually the correct outcome — it's the offer they should have had — but decide it deliberately and say so in the release notes, rather than being surprised by a support ticket.\n\n## Reuse the SAME server-side persistence path regardless of which route fetched the data\nClient-direct doesn't have to mean client-only. Fetch the source data via the free/native path, then hand the *result* to the exact same downstream write logic the paid/server-key path already uses (extract it into one shared function if it wasn't already). Don't duplicate the persistence/multi-device-sync implementation per source — fork only the narrow \"how did we obtain this data\" step, converge everything after that onto one path.\n\n## Free tiers carry REAL, LOWER rate limits than your paid path — tune both separately\nA free BYO key usually has the vendor's own free-tier rate limit, materially tighter than whatever pooled/paid capacity your server-side key gets (e.g. a free LLM key capped at ~10 requests/minute vs. a paid server key with much more headroom). Reusing your paid path's concurrency/retry tuning against a free key doesn't just run slower — it can make the feature look **stuck** (\"progress climbs but nothing completes\"), because a retry-burst built to smooth over paid-infrastructure blips keeps re-saturating the free key's tiny per-minute window before anything clears it. Fixes that generalize:\n- Give the free/BYO path its **own concurrency + pacing profile** (one paced worker near the key's known limit) instead of sharing tuning constants with the paid path (several concurrent workers).\n- Cut retries to a single attempt on the free path. A burst-retry designed for transient paid-infra blips is actively harmful against a hard per-minute cap — let the failed unit resume on the next run instead of retrying immediately and eating more of the budget.\n- Surface the real upstream error text (the literal 429 message) in the UI instead of a generic \"failed.\" Free-tier throttling is expected and self-resolving; a user staring at a silently stalled progress bar will assume the feature is broken instead of \"wait a minute, rerun.\"\n\n## Cross-language prompt/logic duplication is an accepted cost — guard it with pointer comments, not tooling\nWhen \"client-direct\" crosses a LANGUAGE boundary (native Rust calling an LLM directly vs. your JS server doing the same), there's no shared-source mechanism available — unlike same-language duplication, which should get an automated drift-guard script (see `n-copies-of-truth-drift-guard.md`). Port the prompt/logic **verbatim** and accept the duplication deliberately, but leave an explicit pointer comment at **both** copies naming the sibling file and stating \"keep in sync.\" This is weaker than a script — nothing fails a build if they drift — but it's the correct minimum for a boundary a script genuinely can't reach cheaply. Record the acceptance as a locked decision, not an open TODO, so a later DRY audit doesn't flag it as an unaddressed finding.\n\n**The pointer comments are necessary and still not sufficient, and this bit us.** They keep the copies matching *in the repo*. They say nothing about whether both copies are **live** — and a cross-language pair almost by definition ships through two different release mechanics (the native copy compiles into the app binary, the server copy needs a deploy). Patch both in one commit, follow the practice exactly, and production can still run one old copy for as long as nobody deploys. Worse, the split usually follows the entitlement fork described above, so the stale copy only affects *one tier* — and whichever tier your dev account is on decides whether you ever see it. See the \"lockstep sub-variant\" in [`n-copies-of-truth-drift-guard.md`](./n-copies-of-truth-drift-guard.md) for the incident and the timestamp check that catches it.\n\n## Related\n- [`n-copies-of-truth-drift-guard.md`](./n-copies-of-truth-drift-guard.md) — the general \"must stay in lockstep\" problem; this lesson's cross-language duplication is the one case where the guard-script fix isn't available and a documented exception is the right call.\n- [`steam-library-integration.md`](./steam-library-integration.md) — the three-tier Steam import model (local scan / OpenID identity / user's-own-key) this pattern extends into tier 3; read it first for the ToS/rate-limit reasoning that justifies a \"bring your own key\" tier at all.\n- `tauri-desktop-security-hardening.md` — assumes you already have a secure local secret store (DPAPI/Keychain); this lesson doesn't re-derive that part.\n\n---\n*Captured from Playmoir's Steam Tier 3 (2026-07-16/17, personal Steam Web API key) and BYO AI key (2026-07-17, personal Gemini key) features — both shipped, both live-verified end-to-end.*"}, {"id": "categorical-palette-validate-dont-eyeball.md", "title": "Don't eyeball a categorical palette — validate it, and check whether colour was doing any work at all", "kind": "gotcha", "last_verified": "2026-08-04", "stack": ["any", "design-systems", "dataviz", "accessibility", "css"], "groups": ["Languages", "Other", "Process & Meta"], "description": "A hand-picked \"obviously distinct\" palette failed colour-blind separation at ΔE 4.8 (protan) and a single-hue ramp failed at ΔE 9.2 for *normal* vision. Run the validator, it takes 30 seconds. The bigger lesson: when it fails, check whether the 2px gaps were carrying the distinction already — colour derived from user content can be floored for contrast against a background, never for separation from each other.", "content": "# Don't eyeball a categorical palette — validate it, and check whether colour was doing any work at all\n\n**One-liner:** a hand-picked set of \"obviously distinct\" colours routinely fails colour-blind separation, and you cannot tell by looking — running a ΔE validator takes about thirty seconds and kills bad palettes before they ship. The bigger lesson sits one level up: when the measurement fails, the right move is usually *not* a better palette, because the spacing/gaps between marks were often carrying the distinction already, and the colour was decoration you were about to spend accessibility budget defending.\n\n## The setup\n\nA per-month \"rotation strip\" in a journaling app: a 4px horizontal bar split into segments, one per game played that month, width proportional to share. The obvious design was a colour per game.\n\nIt even looked free. The app **already derived a per-game accent colour** from cover art (a Vibrant → DarkVibrant → Muted → … cascade with a WCAG 3:1 floor against the background). So each segment could wear \"the colour that game *is*\" — Borderlands red, Stardew green — at zero cost, and it satisfied the categorical-colour rule that **colour must follow the entity, never its rank** (sort segments by share and colour by position, and the same game changes colour month to month).\n\nThe user asked the question that broke it: *\"what if it's 10 different games, how many colours can we use?\"*\n\n## What the measurement said\n\nRunning the five mock colours through a palette validator (OKLab ΔE, dark surface `#171517`):\n\n```\n[FAIL] Lightness band      4 of 5 outside band\n[FAIL] CVD separation      worst adjacent pair ΔE 4.8 (protan)\n[PASS] Normal-vision floor worst adjacent ΔE 17.5\n[PASS] Contrast vs surface all 5 >= 3:1\n```\n\n**ΔE 4.8 under protanopia** means two of those segments are the same colour to a red-blind viewer. Nothing about the mock looked wrong.\n\nThe obvious fallback — one hue, five lightness steps — failed *worse*:\n\n```\n[FAIL] Normal-vision floor  worst adjacent ΔE 9.2 — below the floor of 15\n```\n\nUnder 15 means people with **full colour vision** can't reliably tell the steps apart. Five distinguishable segments in a 4px bar is hard in *any* scheme.\n\n## The generalisable findings\n\n**1. Art-extracted / user-derived colours can never be validated in advance.** The existing contrast floor guaranteed each colour was readable **against the background**. It said nothing about whether two colours were distinguishable **from each other**, and it structurally can't — the palette isn't known until runtime. Two dark-fantasy covers can both extract to the same muddy brown and no floor will notice. *If your palette is derived from user content, mutual separation is not a property you can guarantee. Don't build an encoding that depends on it.*\n\n**2. The gaps were doing the work.** The segments already had a 2px surface-coloured gap between them (a standard stacked-bar spec). Once that was noticed, the fix wrote itself: **one colour, gap-separated, width = share.** Segment count still reads as \"how many,\" widths still read as \"in what proportion,\" and:\n\n- N colours for N entities becomes a non-problem — 10 items is the same problem as 2\n- It cannot fail colour-blindness, because nothing needs telling apart *by colour*\n- It stops fighting a design language built on a single accent\n\n**3. Cap the segments anyway, for a different reason.** Ten hairline slivers in a 4px bar is unreadable at any palette. Top N + a dimmed \"+N more\" is a *legibility* limit, not a colour one — worth stating in the code comment so the next person doesn't \"fix\" it by reintroducing hues.\n\n**4. Ask what the mark is actually encoding.** A legend-less strip encoding *identity* by colour needs a key, which it doesn't have. But this strip's job was **shape** — how many, in what proportion — with identity available on hover and from the rows below it. Identity was never colour's job; realising that is what made the palette optional.\n\n## The rule worth carrying\n\n> Before choosing categorical colours: run the validator. When it fails, don't reach for a better palette first — ask whether spacing, position, or size is already carrying the distinction. Very often colour was decoration, and deleting it is cheaper and more accessible than defending it.\n\nAnd the corollary that costs nothing:\n\n> Any colour derived from user content (cover art, avatars, uploaded images, tenant branding) can be floored for contrast against a *background*, never for separation from *each other*. Don't design an encoding that assumes otherwise.\n\n## Cheap checks\n\n- **ΔE ≥ 8 (OKLab ×100) between adjacent categorical colours** for colour-vision-deficiency safety; **≥ 15 for normal vision** as a hard floor.\n- Validate against the **actual surface colour**, and separately for light and dark — a dark-mode palette is a selection, not an automatic inversion.\n- 2px surface-coloured gaps between stacked segments. Frequently the whole fix.\n\n## Related\n\n- [n-copies-of-truth-drift-guard.md](./n-copies-of-truth-drift-guard.md) — same instinct in a different domain: compute the check, don't rely on discipline."}, {"id": "chase-industry-stats-to-a-primary-source.md", "title": "Chase the stat to a primary source before it becomes a constant", "kind": "playbook", "last_verified": "2026-07-28", "stack": ["process", "research", "product", "meta"], "groups": ["Other"], "description": "Confident industry numbers often trace to nothing: vendor marketing copy citing vendor marketing copy. Worked example + **negative result** — no published days-lapsed→return-probability curve for games exists in public sources (searched the ten vendors who would hold it; the ones with data gate it). The real peer-reviewed 9–14 day convergence is a churn-PREDICTION threshold tuned against false positives, i.e. when a player stops being worth money, not when they'd enjoy returning — a swap that had already reached a code constant's justifying comment. Three-tier labelling (hard data / design convention / opinion), the reference-class check that survives a valid citation, and what to do when nothing survives: argue from ASYMMETRY OF ERROR using your own system (which direction is free?) rather than a borrowed number.", "content": "# Chase the stat to a primary source before it becomes a constant\n\n**One-liner:** the confident-sounding industry numbers you build a product decision on (\"users churn after 7–14 days\", \"27% are reactivatable on day 1\") very often trace to nothing — unattributed vendor marketing copy citing other unattributed vendor marketing copy. Chase every number to a primary source *before* it lands in a slide, a doc, or worse, a constant in your codebase. And when the chase comes up empty, say so out loud rather than quietly keeping the number.\n\nThis is a **negative result** as much as a method: for one specific, heavily-marketed question, the data does not exist in public.\n\n## The failure shape\n\nIt runs in three stages and takes months:\n\n1. **A number enters a doc with a vague attribution.** \"Industry playbooks treat 7–14 days of inactivity as lapsed.\" \"Per GDC talks.\" No link, or a link to a blog that also has no link.\n2. **The doc becomes the citation.** Later work cites *your own doc* rather than the original, which no longer exists as far as anyone can check.\n3. **The number becomes a constant.** Someone picks a default — a timeout, a threshold, a window — and writes a code comment justifying it: *\"14 sits at the sweet spot of the win-back research (7–14 days).\"* Now it is load-bearing and it looks researched.\n\nThe tell that you are in stage 3: a comment or a slide that names a *body* of research rather than a *paper*. \"The win-back research\", \"industry convention\", \"studies show\".\n\n## The worked example\n\nA product needed a default for \"remind me about this game in N days\". The existing constant was 14, justified in a code comment by \"the sweet spot of the win-back research (7–14 days)\". Chasing it:\n\n**What evaporated.** Every circulating re-engagement-timing figure traced to unattributed vendor blog copy — \"up to 27% of players can be reactivated on day 1\", \"first push between 3–7 days for casual games and 7–14 for deeper session-based games\", \"65% of users return within 30 days with push enabled\" (attributed to a company, no study, no date findable). Searched the vendors who would hold real data — GameAnalytics, deltaDNA, Unity/ironSource, Amplitude, AppsFlyer, Adjust, Airship, Braze, CleverTap, Pushwoosh. **The ones with the data gate it; the ungated pages assert numbers without sourcing.**\n\n**What survived, but meant something else.** There *is* a real 9–14 day convergence, and it is peer-reviewed: Runge et al. (IEEE CIG 2014) define churn as *\"14 consecutive days of inactivity\"*; Periáñez et al. use 9 days for VIPs and 13 for paying users, chosen because it *\"yields less than 10% false churners.\"* Independent studios landing in the same band is meaningful.\n\nBut read what those actually are: **churn-*prediction* thresholds, tuned so a revenue model does not emit false positives.** They answer \"when has this player stopped being worth money\", not \"when would this person enjoy coming back\". The original claim had silently swapped one for the other.\n\n**What pointed the opposite way.** The strongest evidence for the actual product was a number nobody had thought to look for: Newzoo's *State of PC and Console Games 2025* reports games **6+ years old are 67% of PC play time**. On PC, returning to an old game is the dominant mode of play — so a mobile live-ops churn window was the wrong reference class by an order of magnitude.\n\n**Net result:** the number stayed roughly the same, but it stopped being a lie about where it came from, and the doc gained a correction entry. That doc had *already* logged one fabricated stat caught the same way (a \"14-day gap → 80% never finish\" figure attributed to Bethesda/Ubisoft GDC talks that do not exist). Same shape, second occurrence, ~4 weeks apart.\n\n## The method\n\n1. **Grep your own docs and code for numbers with vague attributions.** Search for \"studies show\", \"industry\", \"research\", \"GDC\", \"best practice\", and any bare percentage. A number with no link is a number with no source until proven otherwise.\n2. **Follow every citation one hop further than feels necessary.** Vendor blog → cited blog → cited blog. If the chain terminates in another marketing page, the number is decoration.\n3. **Label what you find, and keep the labels visible.** Three tiers is enough: **hard data** (measured, published, methodology stated), **design convention** (what shipped products do — real evidence of *belief*, not of effectiveness), **opinion** (asserted, unsourced). Put the tier next to the number permanently, not in a review note.\n4. **Check the reference class, not just the citation.** A perfectly sound mobile free-to-play statistic can be worthless for a single-player desktop product. This is the failure that survives step 2 — the source is real, and still doesn't apply.\n5. **When nothing survives, write down that nothing survived.** \"No published curve exists; here is where I looked\" is a durable finding that stops the next person spending an afternoon. It is also the honest input to step 6.\n\n## When there is no data: argue from asymmetry instead\n\nThe useful move when a number is genuinely unknowable is to stop trying to find the right value and ask **which direction of error is cheaper.** That question often *does* have a rigorous answer, and it usually lives in your own system rather than in the literature.\n\nIn the worked example: the reminder's predicate auto-cancels the moment the user returns on their own. So a reminder that fires **too early costs nothing** — it silently never fires. One that fires **too late costs the entire window** and cannot be recovered. Asymmetric cost, one free direction, take it. The default moved down.\n\nThat reasoning is defensible, cheap, testable against your own code, and — importantly — it does not decay when someone finally publishes real numbers. Record the asymmetry in the constant's doc comment, not the borrowed statistic.\n\n## Checklist\n\n- [ ] Does this number have a link to a **primary** source (paper, platform report, company engineering post with methodology)?\n- [ ] Have I followed the citation chain to its end rather than to the first plausible-looking page?\n- [ ] Does the source measure **the thing I am claiming**, or a proxy for it (revenue-model churn ≠ human intent; install-cohort retention ≠ lapsed-veteran return)?\n- [ ] Is the **population** mine? Mobile F2P, enterprise SaaS and single-player desktop do not share a timescale.\n- [ ] Is the number about to become a **constant**? Raise the bar: comments outlive slides and get trusted more.\n- [ ] If the chase failed, have I written \"no evidence found, searched X/Y/Z\" somewhere durable — and switched to an asymmetry argument?\n- [ ] Does the doc holding these numbers have a **corrections log**? Once you have caught one, you will catch more; a log turns that into a visible pattern instead of a repeated surprise.\n\n## Related\n\n- [[instrument-before-patching]] — the same instinct applied to debugging: get the real measurement before acting on the plausible story.\n- [[resolve-versions-from-the-registry-not-a-search-index]] — the same rule for a mechanical fact rather than a research one: a search index is a cache, the registry's metadata endpoint is the primary source, and a stale-but-valid version pin reads as deliberate forever.\n- [[subset-bundled-fonts]] — a number that became a code comment without anyone measuring it, and what the measurement actually said."}, {"id": "clip-path-shared-element-morph.md", "title": "Shared-element \"morph\" transitions: a clip-path FLIP variant, and why mixing animation engines causes jutter", "kind": "pattern", "last_verified": "2026-07-29", "stack": ["react", "css", "framer-motion", "animation"], "groups": ["Frameworks & Libraries", "Languages"], "description": "A FLIP-transition variant using a union-bbox + `clip-path` instead of scale-transform (no blurry rescaling), plus a non-obvious gotcha: mixing your animation library's JS interpolator with WAAPI/CSS-transitioned properties in one coupled transition causes visible drift — keep every property on the same thread Also covers the discrete cousin of that bug: a morph's end hand-off (reveal the real element / remove the ghost) scheduled for the same instant by two different mechanisms is a coin-flip between \"invisible\" and \"one-frame hole\" — overlap them instead of meeting, and beware softening an invisible snap into a crossfade without checking what the snap was covering. AND the guard that looks sufficient and isn't: `if (!element)` does not catch a DETACHED container — frameworks remove only the outermost host node of an unmounted subtree, `querySelector` traverses detached subtrees perfectly happily, and `getBoundingClientRect` then returns all zeros, flying the transition into the viewport's top-left corner. Top-left = zeroed rect. Check `isConnected` on the node you actually *measure*, at both lookup and commit — and note it presents as intermittent only because which code path you get is selected by your data. ALSO: scoping the reverse-flight lookup with a per-list container attribute and rendering `null` when the list is empty are MUTUALLY EXCLUSIVE — the scope is what promotes a dormant early-return into a live detached-container bug, so both fixes must land together; and making the *section* permanent is not enough, because the node carrying the attribute is the one that must never unmount.", "content": "# Shared-element \"morph\" transitions: a clip-path FLIP variant, and why mixing animation engines causes jutter\n\n**One-liner:** the classic FLIP technique (clone the element, animate `transform: scale()` from the start rect to the end rect) blurs images and warps text because it's literally rasterizing content at intermediate sizes. An alternative: size a single ghost element to the **union bounding box** of both rects, render the content at each target's *native* size inside it, and animate `clip-path` to reveal one region then the other. `transform` only ever translates — it never scales — so nothing is ever rendered at a stretched size.\n\n## The technique\n\n1. **Compute the union box**: as wide/tall as whichever of the two rects (source, destination) is larger in each dimension. Pin the ghost element there.\n2. **Two clip-path insets**, each cropping the union box down to one of the real rects:\n   ```ts\n   const boxW = Math.max(target.width, source.width);\n   const boxH = Math.max(target.height, source.height);\n   const sourceClip = `inset(0px ${boxW - source.width}px ${boxH - source.height}px 0px round ${sourceRadius})`;\n   const targetClip  = `inset(0px ${boxW - target.width}px  ${boxH - target.height}px  0px round ${targetRadius})`;\n   ```\n3. **`transform: translate(dx, dy)`** moves the whole union box between the two rects' positions — never a scale.\n4. **Two images (or content layers) at their OWN native size**, both absolutely positioned at the union box's top-left, crossfading at a timed pivot partway through the transition — rather than one image being stretched from small to large.\n5. **Corner radii read from the real elements' own CSS variables** (not hardcoded px), so the morph's rounding matches whatever the destination component actually uses — if the theme's radius token changes later, the morph stays in sync automatically instead of drifting into a mismatched corner on landing.\n\nThis generalizes FLIP to \"shared element transitions between two differently-shaped, differently-cropped containers\" (e.g. a square grid thumbnail morphing into a wide banner) without ever rasterizing a scaled bitmap.\n\n**Gotcha this technique specifically avoids:** if you naively size the ghost to only ONE of the two rects (say, the destination banner) and clip-path down to the smaller source rect, you clip content that's taller than the destination — e.g. a portrait-oriented source card whose caption/footer sits below the banner's height gets silently cut off. Always size the ghost to the **union**, never to either rect alone.\n\n## The gotcha that costs the most debugging time: don't mix animation engines on one coupled transition\n\nIf your JS animation library drives `transform`/`opacity` via the browser's native Web Animations API (WAAPI) — which runs on the **compositor thread**, no per-frame JS — but you also hand it `clip-path` in the same `animate()`/`transition` call, many libraries fall back to their own **JS interpolator** for `clip-path` specifically (WAAPI support for `clip-path` interpolation is inconsistent across browsers, so libraries often special-case it). That JS interpolator runs on `requestAnimationFrame` on the **main thread** — a different clock than the compositor.\n\nResult: `transform` and `clip-path` are supposed to move in lockstep (the union-box position and its crop should update together), but they're being driven by two different schedulers. Under any main-thread pressure (React re-renders, other work queued), the two drift apart frame-to-frame — visible as jutter/shimmer where the crop boundary doesn't quite track the translating box.\n\n**Fix: drive `clip-path` via a native CSS transition, applied imperatively, so it also lands on the compositor thread:**\n\n```ts\nuseLayoutEffect(() => {\n  const el = ghostRef.current;\n  if (!el) return;\n  // Mount at the START clip with no transition (instant) — flush layout —\n  // then re-enable the transition and set the END clip. The offsetHeight\n  // read forces the browser to register the 'none' transition before the\n  // target value change, so the next paint actually starts a transition\n  // instead of jumping straight to the end state.\n  el.style.transition = 'none';\n  el.style.clipPath = startClip;\n  void el.offsetHeight;                 // flush\n  el.style.transition = `clip-path ${durationMs}ms ${easingCss}`;\n  el.style.clipPath = endClip;\n}, [phase, startClip, endClip]);\n```\n\nMeanwhile `transform`/`opacity` keep going through the JS library's normal `animate` prop (WAAPI path). Now all THREE properties ride the same thread with matched timing, and the drift disappears. The general rule: **when a shared-element transition couples multiple CSS properties that must move in exact lockstep, verify they're all on the same animation engine/thread — don't assume your animation library treats every property identically under the hood.** If one property's browser-native interpolation support is shakier than another's (clip-path is the common offender), that property is the one likely to get silently downgraded to a different execution path.\n\n## The other timing trap: discrete hand-offs must OVERLAP, never meet\n\nThe section above is about two engines drifting during a *continuous* animation. This one is its discrete cousin, and it produces an intermittent flash rather than jutter.\n\nEvery shared-element morph ends in a hand-off: the flying ghost (or the expanded surface) goes away, and the real element it was standing in for becomes visible. The whole illusion rests on those two things being pixel-identical at that instant — which is exactly why it's tempting to schedule both for the same timestamp.\n\nDon't. If the two events are driven by different mechanisms — say a CSS `animation-delay` revealing the real element, and your animation library's `AnimatePresence` unmounting the ghost — they are two independent clocks aimed at one moment. A single frame of skew resolves one of two ways:\n\n- **Ghost leaves last** → both are on screen for a frame. Invisible, because they're identical. Fine.\n- **Ghost leaves first** → neither is on screen for a frame. A hole punched through to whatever is behind. **That's the flash.**\n\nYou don't control which one wins, and it varies run to run with main-thread load — so the bug is intermittent, unreproducible on demand, and reads like a rendering glitch rather than a logic error.\n\n**The rule: schedule the incoming element to appear BEFORE the outgoing one leaves, with enough margin to absorb scheduling jitter (~100ms is plenty).** An overlap is invisible by construction — the two surfaces matching is the premise of the morph. A gap is never invisible.\n\n```\n      reveal real element (t=300)\n              ↓\n  ─────────────┬──────────────────\n               │  both present    │   ← invisible, this is the safe zone\n  ─────────────┴──────────────────\n                        ↑\n              unmount ghost (t=400)\n```\n\nConcretely, if the retraction runs 400ms, reveal the underlying element at ~300ms rather than at 400ms. During the overlap the retracting surface is opaque and on top, and by 300ms an ease-out curve has it at ~97% of its final size — the two are indistinguishable.\n\nTwo corollaries:\n\n- **Prefer a step to a fade at a hand-off.** Reveal the incoming element with a ~0ms opacity step early, not a fade timed to land exactly at the swap. A fade timed to the instant is the same race with extra frames in which to notice it.\n- **An \"invisible snap\" only stays invisible while something still covers it.** The snap is doing its job *because* another layer is on top when it fires. If you later soften that snap into a crossfade \"to make it smoother,\" you remove the cover and expose everything the snap was hiding — reliably making the transition worse. That's a real regression that shipped in the project this was extracted from, in a commit whose message says it was fixing the very symptom it caused.\n\n\n\n**Adaptive wait for an async-mounted measurement target**, instead of a fixed timeout guess:\n\n```ts\nconst startFlight = (attemptsLeft = 12) => {\n  const target = document.querySelector('[data-morph-target]');\n  if (target) {\n    const r = target.getBoundingClientRect();\n    if (r.width > 0 && r.height > 0) { /* got it — start the transition */ return; }\n  }\n  if (attemptsLeft > 0) {\n    requestAnimationFrame(() => startFlight(attemptsLeft - 1));\n    return;\n  }\n  /* bounded fallback rect after ~12 frames (~200ms) so the transition never hangs */\n};\n```\nrAF-polling (bounded, e.g. 12 attempts ≈ 200ms) adapts to real mount latency — a fast machine starts the transition within a frame or two, a slow one gets a longer wait automatically — without a fixed `setTimeout` guess that's either too short (races the target's mount) or wastes time on fast machines. The width/height `> 0` check specifically catches \"mounted but not yet laid out,\" which a plain existence check (`if (target)`) would miss.\n\n**Re-measure the LIVE source rect at reverse-transition time, not the rect captured at click time.** If the source element's position can change while the destination is open (grid reflow, filter/sort change, window resize), the reverse transition must re-query the source element's current position via a stable identifier (a `data-id` attribute), not reuse the stale rect from when the forward transition started — otherwise the reverse animation flies to where the e
