<title>Vibe Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---------- tokens: light is the base; dark redefines tokens only ---------- */
  :root {
    --paper: #f4f5f2;
    --surface: #ffffff;
    --sunken: #e9ebe6;
    --ink: #161d1b;
    --ink-2: #55615d;
    --ink-3: #8a948f;
    --line: #d5dad4;
    --line-strong: #b9c1bb;
    --accent: #0e6f66;
    --accent-ink: #0b5a53;
    --accent-soft: #d5ece7;
    --code-bg: #eef0ec;
    --fresh: #2f9e60;
    --aging: #c98a1e;
    --stale: #cf4a3f;
    --stale-soft: #fbe9e6;
    --shadow: 0 12px 32px rgba(22, 29, 27, 0.14);
    --chip-l: 90%;
    --chip-s: 55%;
    --chip-text-l: 30%;
    --font-display: "Bricolage Grotesque", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, "SF Mono", Menlo, monospace;
    --rail-w: 252px;
    --list-w: 392px;
    --header-h: 60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e1312; --surface: #141a19; --sunken: #1a2220;
      --ink: #e4e9e6; --ink-2: #93a09b; --ink-3: #66736e;
      --line: #25302d; --line-strong: #37453f;
      --accent: #46c3ad; --accent-ink: #7fdcca; --accent-soft: #143b35;
      --code-bg: #101615;
      --fresh: #4fc27a; --aging: #e0a53c; --stale: #e6685c; --stale-soft: #3a1f1c;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      --chip-l: 22%; --chip-s: 38%; --chip-text-l: 78%;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0e1312; --surface: #141a19; --sunken: #1a2220;
    --ink: #e4e9e6; --ink-2: #93a09b; --ink-3: #66736e;
    --line: #25302d; --line-strong: #37453f;
    --accent: #46c3ad; --accent-ink: #7fdcca; --accent-soft: #143b35;
    --code-bg: #101615;
    --fresh: #4fc27a; --aging: #e0a53c; --stale: #e6685c; --stale-soft: #3a1f1c;
    --shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    --chip-l: 22%; --chip-s: 38%; --chip-text-l: 78%;
  }

  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; height: 100%;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent-ink); }

  /* ---------- frame ---------- */
  #kb {
    display: grid; height: 100vh; height: 100dvh;
    grid-template-columns: var(--rail-w) var(--list-w) minmax(0, 1fr);
    grid-template-rows: var(--header-h) minmax(0, 1fr);
    grid-template-areas: "head head head" "rail list read";
  }
  header {
    grid-area: head; display: flex; align-items: center; gap: 14px; padding: 0 18px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; min-width: 0; }
  .brand h1 {
    font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em;
    margin: 0; font-variation-settings: "opsz" 40;
  }
  .brand .sub { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: .02em; }
  .collections { display: flex; gap: 2px; margin-left: 8px; padding: 3px; background: var(--sunken); border-radius: 8px; }
  .collections button {
    border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; font-weight: 500;
    color: var(--ink-2); font-size: 13.5px;
  }
  .collections button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .search {
    flex: 1; display: flex; align-items: center; gap: 8px; min-width: 160px; max-width: 560px;
    border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 0 10px; height: 36px;
  }
  .search:focus-within { border-color: var(--accent); }
  .search svg { width: 15px; height: 15px; color: var(--ink-3); flex-shrink: 0; }
  .search input { flex: 1; border: 0; background: transparent; outline: 0; min-width: 0; font-size: 14px; }
  .search kbd {
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; background: var(--surface);
  }
  .hdr-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 10px;
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px; color: var(--ink-2); font-size: 13px;
  }
  .icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
  .icon-btn svg { width: 16px; height: 16px; }
  #rail-toggle, #back-to-list { display: none; }

  /* ---------- rail ---------- */
  #rail {
    grid-area: rail; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface);
    padding: 16px 14px 32px; scrollbar-width: thin;
  }
  .rail-section { margin-bottom: 18px; }
  .rail-section > h4 {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 8px; font-weight: 500;
  }
  .facet {
    display: flex; align-items: center; gap: 9px; padding: 4px 6px; border-radius: 6px; cursor: pointer;
    font-size: 13.5px; user-select: none;
  }
  .facet:hover { background: var(--sunken); }
  .facet input { accent-color: var(--accent); margin: 0; }
  .facet .n { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .facet.zero { opacity: .4; }
  .kind-dot { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--hue) var(--chip-s) 50%); flex-shrink: 0; }
  details.group { border-top: 1px solid var(--line); padding: 6px 0; }
  details.group summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--ink-2); padding: 4px 6px; border-radius: 6px;
  }
  details.group summary::-webkit-details-marker { display: none; }
  details.group summary::before { content: ""; width: 0; height: 0; border: 4px solid transparent; border-left-color: var(--ink-3); margin-left: 2px; transition: transform .12s; }
  details.group[open] summary::before { transform: rotate(90deg); }
  details.group summary .n { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  details.group summary.active { color: var(--accent-ink); }
  .rail select {
    width: 100%; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); padding: 0 8px; font-size: 13px;
  }
  #clear-filters {
    width: 100%; height: 32px; border-radius: 6px; border: 1px dashed var(--line-strong); background: transparent;
    color: var(--ink-2); font-size: 13px; margin-top: 4px;
  }
  #clear-filters:hover { border-color: var(--accent); color: var(--accent-ink); }
  .doc-nav a {
    display: block; padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13.5px;
  }
  .doc-nav a:hover { background: var(--sunken); }
  .doc-nav a.current { background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }
  .doc-nav .section-title { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 14px 0 6px; }
  .doc-nav .section-title:first-child { margin-top: 0; }

  /* ---------- list ---------- */
  #list { grid-area: list; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--paper); }
  .list-head {
    display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 8px; font-size: 12.5px; color: var(--ink-2);
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .list-head strong { color: var(--ink); font-weight: 600; }
  .list-head .stat { font-family: var(--font-mono); font-size: 11.5px; }
  .list-head .stat i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
  #rows { overflow-y: auto; flex: 1; scrollbar-width: thin; }
  .row {
    display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 0 10px; padding: 11px 16px 11px 14px;
    border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; background: transparent; border-left: 0; border-right: 0; border-top: 0;
    font-family: inherit;
  }
  .row:hover { background: var(--surface); }
  .row[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
  .row .mark { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: hsl(var(--hue) var(--chip-s) 50%); }
  .row h3 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.35; letter-spacing: -0.005em; text-wrap: pretty; }
  .row p {
    margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row .meta { grid-column: 2; display: flex; align-items: center; gap: 8px; margin-top: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .row .meta .kind { text-transform: uppercase; letter-spacing: .06em; color: hsl(var(--hue) var(--chip-s) var(--chip-text-l)); }
  .fresh-mark { display: inline-flex; align-items: center; gap: 5px; }
  .fresh-mark i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .fresh-mark[data-f="fresh"] i { background: var(--fresh); }
  .fresh-mark[data-f="aging"] i { background: var(--aging); }
  .fresh-mark[data-f="stale"] i { background: var(--stale); }
  .row .meta .tags { margin-left: auto; color: var(--ink-3); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 45%; }
  #empty { padding: 40px 20px; text-align: center; color: var(--ink-2); font-size: 14px; }

  /* ---------- reader ---------- */
  #reader { grid-area: read; overflow-y: auto; min-height: 0; background: var(--paper); scrollbar-width: thin; }
  .reader-inner { display: grid; grid-template-columns: minmax(0, 78ch) 1fr; gap: 0 40px; padding: 28px 40px 80px; }
  article { min-width: 0; }
  .art-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); margin-bottom: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11px; letter-spacing: .04em;
    background: hsl(var(--hue) var(--chip-s) var(--chip-l)); color: hsl(var(--hue) var(--chip-s) var(--chip-text-l)); text-transform: uppercase; font-weight: 500;
  }
  .stamp { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .stamp i { width: 8px; height: 8px; border-radius: 50%; }
  .stamp[data-f="fresh"] i { background: var(--fresh); }
  .stamp[data-f="aging"] i { background: var(--aging); }
  .stamp[data-f="stale"] i { background: var(--stale); }
  .src { margin-left: auto; text-decoration: none; color: var(--ink-3); }
  .src:hover { color: var(--accent-ink); }
  article h1.title {
    font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.12;
    letter-spacing: -0.02em; margin: 0 0 14px; text-wrap: balance; font-variation-settings: "opsz" 96;
  }
  .lede { font-size: 16px; color: var(--ink-2); margin: 0 0 22px; text-wrap: pretty; border-left: 2px solid var(--accent); padding-left: 14px; }
  .stale-note {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; margin: 0 0 22px;
    background: var(--stale-soft); color: var(--ink); font-size: 13.5px; border: 1px solid color-mix(in srgb, var(--stale) 35%, transparent);
  }
  .stale-note b { color: var(--stale); font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; white-space: nowrap; }
  .tagline { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 26px; }
  .tag {
    font-family: var(--font-mono); font-size: 11.5px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-2); text-decoration: none;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent-ink); }

  .md { font-size: 15.5px; line-height: 1.65; }
  .md > :first-child { margin-top: 0; }
  .md h1 { font-family: var(--font-display); font-size: 24px; margin: 2em 0 .6em; letter-spacing: -0.015em; text-wrap: balance; }
  .md h2 { font-family: var(--font-display); font-size: 21px; font-weight: 600; margin: 2em 0 .6em; padding-top: .9em; border-top: 1px solid var(--line); letter-spacing: -0.01em; text-wrap: balance; }
  .md h3 { font-size: 16.5px; font-weight: 600; margin: 1.6em 0 .5em; }
  .md h4 { font-size: 14.5px; font-weight: 600; margin: 1.4em 0 .4em; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
  .md p { margin: .85em 0; }
  .md li { margin: .3em 0; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md ul { list-style: none; }
  .md ul > li { position: relative; }
  .md ul > li::before { content: ""; position: absolute; left: -1.05em; top: .72em; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); }
  .md ul ul > li::before { background: transparent; border: 1px solid var(--ink-3); }
  .md code { font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); padding: .1em .4em; border-radius: 4px; border: 1px solid var(--line); }
  .md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 1em 0; font-size: 13px; line-height: 1.55; }
  .md pre code { background: none; border: 0; padding: 0; font-size: inherit; }
  .md blockquote { margin: 1em 0; padding: 4px 16px; border-left: 3px solid var(--accent-soft); color: var(--ink-2); background: var(--surface); border-radius: 0 8px 8px 0; }
  .md blockquote p { margin: .5em 0; }
  .md .tbl { overflow-x: auto; margin: 1em 0; border: 1px solid var(--line); border-radius: 8px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .md th, .md td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  .md th { background: var(--sunken); font-weight: 600; font-size: 12.5px; }
  .md tr:last-child td { border-bottom: 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  .md img { max-width: 100%; border-radius: 8px; }
  .md a { text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .md a.internal::after { content: " →"; font-size: .85em; color: var(--ink-3); }
  .md p strong:first-child { color: var(--ink); }
  .md kbd, .md .num { font-variant-numeric: tabular-nums; }

  .toc { position: sticky; top: 28px; align-self: start; font-size: 12.5px; display: none; }
  .toc h5 { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; font-weight: 500; }
  .toc a { display: block; color: var(--ink-2); text-decoration: none; padding: 3px 0 3px 10px; border-left: 1px solid var(--line); line-height: 1.35; }
  .toc a.l3 { padding-left: 22px; color: var(--ink-3); }
  .toc a:hover { color: var(--accent-ink); border-left-color: var(--accent); }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); }
  .pager button { flex: 1; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; color: var(--ink); }
  .pager button:hover { border-color: var(--accent); }
  .pager button small { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
  .pager button.next { text-align: right; }
  .pager button:disabled { visibility: hidden; }
  .reader-empty { padding: 80px 40px; color: var(--ink-2); max-width: 60ch; }
  .reader-empty h2 { font-family: var(--font-display); font-size: 26px; margin: 0 0 10px; color: var(--ink); }

  @media (min-width: 1500px) { .toc { display: block; } }
  @media (max-width: 1100px) {
    #kb { grid-template-columns: var(--list-w) minmax(0, 1fr); grid-template-areas: "head head" "list read"; }
    #rail {
      position: fixed; top: var(--header-h); left: 0; bottom: 0; width: 300px; z-index: 30; transform: translateX(-100%);
      transition: transform .16s ease; box-shadow: var(--shadow);
    }
    #rail.open { transform: translateX(0); }
    #rail-toggle { display: inline-flex; }
    .reader-inner { padding: 22px 28px 60px; }
  }
  @media (max-width: 720px) {
    #kb { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "list"; }
    #reader { display: none; position: fixed; inset: var(--header-h) 0 0 0; z-index: 20; }
    #kb.reading #reader { display: block; }
    #kb.reading #list { display: none; }
    #back-to-list { display: inline-flex; }
    .brand .sub, .search kbd { display: none; }
    .collections { margin-left: 0; }
    .reader-inner { padding: 18px 18px 60px; }
    header { gap: 8px; padding: 0 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="kb">
  <header>
    <button id="rail-toggle" class="icon-btn" aria-label="Filters">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M4 8h8M6 12h4"/></svg>
    </button>
    <button id="back-to-list" class="icon-btn" aria-label="Back to list">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <div class="brand"><h1>Vibe Knowledge Base</h1><span class="sub" id="brand-sub"></span></div>
    <div class="collections" role="tablist">
      <button id="tab-lessons" aria-pressed="true">Lessons</button>
      <button id="tab-process" aria-pressed="false">Process</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input id="search" type="search" placeholder="Search titles, tags, text" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="hdr-actions">
      <a class="icon-btn" id="repo-link" href="https://github.com/haithemobeidi/knowledge-base" target="_blank" rel="noopener" title="Open the repository">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 .8a7.2 7.2 0 0 0-2.3 14c.4.1.5-.2.5-.4v-1.3c-2 .4-2.4-.9-2.4-.9-.3-.8-.8-1-.8-1-.7-.5 0-.5 0-.5.7.1 1.1.8 1.1.8.7 1.1 1.8.8 2.2.6.1-.5.3-.8.5-1-1.6-.2-3.3-.8-3.3-3.6 0-.8.3-1.4.7-1.9-.1-.2-.3-.9.1-1.9 0 0 .6-.2 2 .7a6.9 6.9 0 0 1 3.6 0c1.4-.9 2-.7 2-.7.4 1 .2 1.7.1 1.9.5.5.7 1.1.7 1.9 0 2.8-1.7 3.4-3.3 3.6.3.2.5.7.5 1.4v2c0 .2.1.5.5.4A7.2 7.2 0 0 0 8 .8z"/></svg>
      </a>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/></svg>
      </button>
    </div>
  </header>

  <aside id="rail">
    <div id="rail-lessons">
      <div class="rail-section" id="kind-facet"></div>
      <div class="rail-section">
        <h4>Freshness</h4>
        <label class="facet"><input type="checkbox" id="stale-only"> Stale only <span class="n" id="stale-count"></span></label>
      </div>
      <div class="rail-section rail">
        <h4>Sort</h4>
        <select id="sort-select">
          <option value="recent">Recently verified</option>
          <option value="stale">Least recently verified</option>
          <option value="title">Title A to Z</option>
          <option value="kind">Kind</option>
        </select>
        <button id="clear-filters">Clear filters</button>
      </div>
      <div class="rail-section" id="tag-facets"></div>
    </div>
    <nav id="rail-process" class="doc-nav" hidden></nav>
  </aside>

  <section id="list">
    <div class="list-head" id="list-head"></div>
    <div id="rows"></div>
    <div id="empty" hidden>Nothing matches. Clear a filter or shorten the search.</div>
  </section>

  <section id="reader"><div id="reader-content"></div></section>
</div>

<script id="kb-data" type="application/json">__KB_DATA_JSON__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("kb-data").textContent);
  var LESSONS = DATA.lessons;
  var DOCS = DATA.docs || [];
  var LESSON_BY_ID = {}; LESSONS.forEach(function (l) { LESSON_BY_ID[l.id] = l; });
  var DOC_BY_ID = {}; DOCS.forEach(function (d) { DOC_BY_ID[d.id] = d; });
  var DOC_BY_BASENAME = {}; DOCS.forEach(function (d) { var b = d.source.split("/").pop(); DOC_BY_BASENAME[b] = DOC_BY_BASENAME[b] || d; });
  var REPO = "https://github.com/haithemobeidi/knowledge-base/blob/main/";

  var KIND_HUE = {
    "gotcha": 10, "pattern": 215, "howto": 150, "playbook": 190, "architecture": 265,
    "postmortem-playbook": 30, "dead-end-postmortem": 350, "decision-record": 225,
    "checklist": 280, "reference": 200, "recipe": 45
  };
  function hueFor(k) { return KIND_HUE.hasOwnProperty(k) ? KIND_HUE[k] : 210; }
  function kindLabel(k) { return k.split("-").map(function (w) { return w[0].toUpperCase() + w.slice(1); }).join(" "); }

  var DAY = 86400000;
  function daysSince(s) { if (!s) return Infinity; var d = new Date(s + "T00:00:00"); return isNaN(d) ? Infinity : Math.floor((Date.now() - d) / DAY); }
  function freshness(days) { return days > 182 ? "stale" : days > 91 ? "aging" : "fresh"; }
  function freshWord(f) { return f === "stale" ? "stale" : f === "aging" ? "aging" : "fresh"; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // ---------- state ----------
  var state = { collection: "lessons", kinds: new Set(), tags: {}, search: "", staleOnly: false, sort: "recent", current: null, currentType: null };
  var visible = [];

  // ---------- markdown ----------
  function renderInline(text) {
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (m, c) { codes.push(c); return "␀" + (codes.length - 1) + "␀"; });
    text = esc(text);
    text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (m, alt, url) { return '<img alt="' + alt + '" src="' + url + '">'; });
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, url) { return linkHtml(url, t); });
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(.+?)__/g, "<strong>$1</strong>");
    text = text.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
    text = text.replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, "$1<em>$2</em>");
    text = text.replace(/~~(.+?)~~/g, "<del>$1</del>");
    text = text.replace(/␀(\d+)␀/g, function (m, i) { return "<code>" + esc(codes[+i]) + "</code>"; });
    return text;
  }
  function linkHtml(url, label) {
    var m = url.match(/^(?:\.\/)?([\w.\-]+\.md)(#.*)?$/);
    if (m && LESSON_BY_ID[m[1]]) return '<a class="internal" href="#lesson/' + esc(m[1]) + '">' + label + "</a>";
    var base = url.split("#")[0].split("/").pop();
    if (/\.md$/.test(base) && DOC_BY_BASENAME[base]) return '<a class="internal" href="#doc/' + esc(DOC_BY_BASENAME[base].id) + '">' + label + "</a>";
    if (/^https?:\/\//.test(url)) return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + label + "</a>";
    return "<span>" + label + "</span>";
  }
  function slug(s) { return s.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60); }
  function isHr(l) { return /^ {0,3}([-*_])( *\1){2,} *$/.test(l); }
  function isTableSep(l) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.indexOf("-") !== -1; }
  function splitRow(l) { return l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); }); }

  function renderMarkdown(md) {
    var lines = md.replace(/\r\n/g, "\n").split("\n"), out = [], i = 0, n = lines.length, headings = [], seen = {};
    while (i < n) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }
      if (/^\s*<!--/.test(line)) { while (i < n && lines[i].indexOf("-->") === -1) i++; i++; continue; }
      var fence = line.match(/^\s*```(\S*)\s*$/);
      if (fence) {
        var buf = []; i++;
        while (i < n && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code class="lang-' + esc(fence[1] || "text") + '">' + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }
      var h = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (h) {
        var level = h[1].length, html = renderInline(h[2]), id = slug(h[2]) || "h";
        if (seen[id]) id += "-" + (++seen[id]); else seen[id] = 1;
        if (level === 2 || level === 3) headings.push({ level: level, id: id, text: h[2].replace(/`/g, "") });
        out.push("<h" + level + ' id="' + id + '">' + html + "</h" + level + ">");
        i++; continue;
      }
      if (isHr(line)) { out.push("<hr>"); i++; continue; }
      if (line.indexOf("|") !== -1 && i + 1 < n && isTableSep(lines[i + 1])) {
        var header = splitRow(line); i += 2; var rows = [];
        while (i < n && lines[i].indexOf("|") !== -1 && !/^\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        var t = '<div class="tbl"><table><thead><tr>' + header.map(function (c) { return "<th>" + renderInline(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        rows.forEach(function (r) { t += "<tr>" + r.map(function (c) { return "<td>" + renderInline(c) + "</td>"; }).join("") + "</tr>"; });
        out.push(t + "</tbody></table></div>");
        continue;
      }
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < n && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + renderMarkdown(q.join("\n")).html + "</blockquote>");
        continue;
      }
      var um = line.match(/^(\s*)[-*+]\s+(.*)$/), om = line.match(/^(\s*)\d+[.)]\s+(.*)$/);
      if (um || om) {
        var stack = [], lo = [], openLi = false;
        while (i < n) {
          var l2 = lines[i];
          if (/^\s*$/.test(l2)) { i++; continue; }
          var u2 = l2.match(/^(\s*)[-*+]\s+(.*)$/), o2 = l2.match(/^(\s*)\d+[.)]\s+(.*)$/);
          if (!u2 && !o2) {
            // continuation line of the previous item (indented text)
            if (openLi && /^\s{2,}\S/.test(l2) && !/^\s*```/.test(l2)) { lo.push(" " + renderInline(l2.trim())); i++; continue; }
            break;
          }
          var ind = (u2 || o2)[1].length, type = u2 ? "ul" : "ol", txt = (u2 || o2)[2];
          while (stack.length && ind < stack[stack.length - 1].indent) { lo.push("</li>" + (stack.pop().tag === "ol" ? "</ol>" : "</ul>")); }
          if (!stack.length || ind > stack[stack.length - 1].indent) {
            if (stack.length && openLi) { /* nest inside open li */ }
            lo.push(type === "ol" ? "<ol>" : "<ul>"); stack.push({ indent: ind, tag: type }); openLi = false;
          } else if (stack[stack.length - 1].tag !== type) {
            lo.push("</li>" + (stack.pop().tag === "ol" ? "</ol>" : "</ul>") + (type === "ol" ? "<ol>" : "<ul>")); stack.push({ indent: ind, tag: type }); openLi = false;
          }
          if (openLi) lo.push("</li>");
          lo.push("<li>" + renderInline(txt)); openLi = true;
          i++;
        }
        if (openLi) lo.push("</li>");
        while (stack.length) lo.push(stack.pop().tag === "ol" ? "</ol>" : "</ul>");
        out.push(lo.join(""));
        continue;
      }
      var p = [];
      while (i < n && !/^\s*$/.test(lines[i]) && !/^\s*```/.test(lines[i]) && !/^(#{1,6})\s+/.test(lines[i]) && !isHr(lines[i]) &&
             !/^\s*>\s?/.test(lines[i]) && !/^(\s*)[-*+]\s+/.test(lines[i]) && !/^(\s*)\d+[.)]\s+/.test(lines[i]) &&
             !(lines[i].indexOf("|") !== -1 && i + 1 < n && isTableSep(lines[i + 1]))) { p.push(lines[i]); i++; }
      if (p.length) out.push("<p>" + renderInline(p.join(" ")) + "</p>"); else i++;
    }
    return { html: out.join("\n"), headings: headings };
  }

  // ---------- rail: facets ----------
  var kindFacetEl = document.getElementById("kind-facet"), tagFacetsEl = document.getElementById("tag-facets");
  function buildRail() {
    var h = "<h4>Kind</h4>";
    DATA.kinds.forEach(function (k) {
      var c = LESSONS.filter(function (l) { return l.kind === k; }).length;
      h += '<label class="facet"><input type="checkbox" value="' + esc(k) + '"><span class="kind-dot" style="--hue:' + hueFor(k) + '"></span>' + esc(kindLabel(k)) + '<span class="n">' + c + "</span></label>";
    });
    kindFacetEl.innerHTML = h;
    kindFacetEl.querySelectorAll("input").forEach(function (cb) {
      cb.addEventListener("change", function () { if (cb.checked) state.kinds.add(cb.value); else state.kinds.delete(cb.value); render(); });
    });
    var th = "<h4>Stack</h4>";
    DATA.groupOrder.forEach(function (g) {
      var tags = DATA.tagsByGroup[g] || []; if (!tags.length) return;
      th += '<details class="group" data-group="' + esc(g) + '"><summary>' + esc(g) + '<span class="n">' + tags.length + "</span></summary>";
      tags.forEach(function (t) {
        var c = LESSONS.filter(function (l) { return l.stack.indexOf(t) !== -1; }).length;
        th += '<label class="facet" data-group="' + esc(g) + '"><input type="checkbox" value="' + esc(t) + '">' + esc(t) + '<span class="n">' + c + "</span></label>";
      });
      th += "</details>";
    });
    tagFacetsEl.innerHTML = th;
    tagFacetsEl.querySelectorAll("input").forEach(function (cb) {
      var g = cb.closest(".facet").getAttribute("data-group");
      cb.addEventListener("change", function () {
        state.tags[g] = state.tags[g] || new Set();
        if (cb.checked) state.tags[g].add(cb.value); else state.tags[g].delete(cb.value);
        render();
      });
    });
    var stale = LESSONS.filter(function (l) { return freshness(daysSince(l.last_verified)) === "stale"; }).length;
    document.getElementById("stale-count").textContent = stale;
  }
  function syncRail() {
    kindFacetEl.querySelectorAll("input").forEach(function (cb) { cb.checked = state.kinds.has(cb.value); });
    tagFacetsEl.querySelectorAll("input").forEach(function (cb) {
      var g = cb.closest(".facet").getAttribute("data-group");
      cb.checked = !!(state.tags[g] && state.tags[g].has(cb.value));
    });
    tagFacetsEl.querySelectorAll("details.group").forEach(function (d) {
      var g = d.getAttribute("data-group"), on = !!(state.tags[g] && state.tags[g].size);
      d.querySelector("summary").classList.toggle("active", on);
      if (on) d.open = true;
    });
    document.getElementById("stale-only").checked = state.staleOnly;
    document.getElementById("sort-select").value = state.sort;
  }
  function selectTag(tag) {
    var g = null; for (var k in DATA.tagsByGroup) if (DATA.tagsByGroup[k].indexOf(tag) !== -1) { g = k; break; }
    if (!g) return;
    state.collection = "lessons"; state.tags = {}; state.tags[g] = new Set([tag]); state.kinds.clear(); state.search = "";
    document.getElementById("search").value = "";
    setCollection("lessons"); syncRail(); render();
  }
  document.getElementById("clear-filters").addEventListener("click", function () {
    state.kinds.clear(); state.tags = {}; state.staleOnly = false; state.search = ""; document.getElementById("search").value = ""; syncRail(); render();
  });
  document.getElementById("stale-only").addEventListener("change", function (e) { state.staleOnly = e.target.checked; render(); });
  document.getElementById("sort-select").addEventListener("change", function (e) { state.sort = e.target.value; render(); });
  document.getElementById("search").addEventListener("input", function (e) { state.search = e.target.value.trim().toLowerCase(); render(); });

  // ---------- rail: process nav ----------
  function buildDocNav() {
    var nav = document.getElementById("rail-process"), h = "", last = null;
    DOCS.forEach(function (d) {
      if (d.section !== last) { h += '<div class="section-title">' + esc(d.section) + "</div>"; last = d.section; }
      h += '<a href="#doc/' + esc(d.id) + '" data-id="' + esc(d.id) + '">' + esc(d.title) + "</a>";
    });
    nav.innerHTML = h;
  }

  // ---------- filtering ----------
  function matchesLesson(l) {
    if (state.kinds.size && !state.kinds.has(l.kind)) return false;
    for (var g in state.tags) { var w = state.tags[g]; if (w && w.size && !l.stack.some(function (t) { return w.has(t); })) return false; }
    if (state.staleOnly && freshness(daysSince(l.last_verified)) !== "stale") return false;
    if (state.search && (l.title + " " + l.description + " " + l.kind + " " + l.stack.join(" ") + " " + l.content).toLowerCase().indexOf(state.search) === -1) return false;
    return true;
  }
  function sorted(list) {
    var c = list.slice();
    if (state.sort === "title") c.sort(function (a, b) { return a.title.localeCompare(b.title); });
    else if (state.sort === "kind") c.sort(function (a, b) { return a.kind.localeCompare(b.kind) || a.title.localeCompare(b.title); });
    else if (state.sort === "stale") c.sort(function (a, b) { return daysSince(b.last_verified) - daysSince(a.last_verified); });
    else c.sort(function (a, b) { return daysSince(a.last_verified) - daysSince(b.last_verified) || a.title.localeCompare(b.title); });
    return c;
  }

  // ---------- list ----------
  var rowsEl = document.getElementById("rows"), emptyEl = document.getElementById("empty"), headEl = document.getElementById("list-head");
  function render() {
    if (state.collection === "lessons") {
      visible = sorted(LESSONS.filter(matchesLesson));
      var stale = LESSONS.filter(function (l) { return freshness(daysSince(l.last_verified)) === "stale"; }).length;
      var aging = LESSONS.filter(function (l) { return freshness(daysSince(l.last_verified)) === "aging"; }).length;
      headEl.innerHTML = "<strong>" + visible.length + "</strong> of " + LESSONS.length + " lessons" +
        '<span class="stat" title="verified within 3 months"><i style="background:var(--fresh)"></i>' + (LESSONS.length - stale - aging) + "</span>" +
        '<span class="stat" title="3 to 6 months"><i style="background:var(--aging)"></i>' + aging + "</span>" +
        '<span class="stat" title="older than 6 months: verify before relying on it"><i style="background:var(--stale)"></i>' + stale + "</span>";
      rowsEl.innerHTML = visible.map(function (l) {
        var f = freshness(daysSince(l.last_verified));
        return '<button class="row" data-id="' + esc(l.id) + '" style="--hue:' + hueFor(l.kind) + '" aria-current="' + (state.current === l.id ? "true" : "false") + '">' +
          '<span class="mark"></span><div><h3>' + esc(l.title) + "</h3>" + (l.description ? "<p>" + esc(l.description) + "</p>" : "") + "</div>" +
          '<div class="meta"><span class="kind">' + esc(kindLabel(l.kind)) + '</span><span class="fresh-mark" data-f="' + f + '"><i></i>' + esc(l.last_verified || "undated") + '</span><span class="tags">' + esc(l.stack.slice(0, 4).join(" · ")) + "</span></div></button>";
      }).join("");
    } else {
      visible = DOCS.filter(function (d) { return !state.search || (d.title + " " + d.description + " " + d.content).toLowerCase().indexOf(state.search) !== -1; });
      headEl.innerHTML = "<strong>" + visible.length + "</strong> of " + DOCS.length + " process docs <span class=\"stat\">how sessions start, run, end and carry over</span>";
      rowsEl.innerHTML = visible.map(function (d) {
        return '<button class="row" data-id="' + esc(d.id) + '" style="--hue:190" aria-current="' + (state.current === d.id ? "true" : "false") + '">' +
          '<span class="mark"></span><div><h3>' + esc(d.title) + "</h3><p>" + esc(d.description) + '</p></div><div class="meta"><span class="kind">' + esc(d.section) + '</span><span class="tags">' + esc(d.source) + "</span></div></button>";
      }).join("");
    }
    emptyEl.hidden = visible.length > 0;
    rowsEl.querySelectorAll(".row").forEach(function (b) { b.addEventListener("click", function () { location.hash = (state.collection === "lessons" ? "#lesson/" : "#doc/") + b.getAttribute("data-id"); }); });
    document.getElementById("brand-sub").textContent = LESSONS.length + " lessons · " + DOCS.length + " process docs";
  }

  // ---------- reader ----------
  var readerEl = document.getElementById("reader-content"), readerPane = document.getElementById("reader");
  function showLesson(id) {
    var l = LESSON_BY_ID[id]; if (!l) return showEmpty();
    state.current = id; state.currentType = "lesson";
    var days = daysSince(l.last_verified), f = freshness(days), md = renderMarkdown(l.content.replace(/^#\s+.*\n/, ""));
    var idx = visible.indexOf(l), prev = idx > 0 ? visible[idx - 1] : null, next = idx >= 0 && idx < visible.length - 1 ? visible[idx + 1] : null;
    readerEl.innerHTML = '<div class="reader-inner"><article>' +
      '<div class="art-meta"><span class="chip" style="--hue:' + hueFor(l.kind) + '">' + esc(kindLabel(l.kind)) + "</span>" +
      '<span class="stamp" data-f="' + f + '"><i></i>verified ' + esc(l.last_verified || "never") + " · " + freshWord(f) + (isFinite(days) ? " · " + days + "d" : "") + "</span>" +
      '<a class="src" href="' + REPO + esc(l.id) + '" target="_blank" rel="noopener">' + esc(l.id) + "</a></div>" +
      '<h1 class="title">' + esc(l.title) + "</h1>" +
      (f === "stale" ? '<div class="stale-note"><b>stale</b><span>Last verified ' + esc(l.last_verified) + ", more than six months ago. The freshness rule applies: re-check it against the current tool or API before relying on it, then bump the date.</span></div>" : "") +
      (l.description && !/\*\*One-liner:?\*\*/.test(l.content) ? '<p class="lede">' + esc(l.description) + "</p>" : "") +
      '<div class="tagline">' + l.stack.map(function (t) { return '<a class="tag" href="#" data-tag="' + esc(t) + '">' + esc(t) + "</a>"; }).join("") + "</div>" +
      '<div class="md">' + md.html + "</div>" +
      '<div class="pager"><button class="prev" ' + (prev ? 'data-id="' + esc(prev.id) + '"' : "disabled") + "><small>previous</small>" + (prev ? esc(prev.title) : "") + "</button>" +
      '<button class="next" ' + (next ? 'data-id="' + esc(next.id) + '"' : "disabled") + "><small>next</small>" + (next ? esc(next.title) : "") + "</button></div>" +
      "</article>" + tocHtml(md.headings) + "</div>";
    afterShow();
  }
  function showDoc(id) {
    var d = DOC_BY_ID[id]; if (!d) return showEmpty();
    state.current = id; state.currentType = "doc";
    var md = renderMarkdown(d.content.replace(/^#\s+.*\n/, ""));
    var idx = visible.indexOf(d), prev = idx > 0 ? visible[idx - 1] : null, next = idx >= 0 && idx < visible.length - 1 ? visible[idx + 1] : null;
    readerEl.innerHTML = '<div class="reader-inner"><article>' +
      '<div class="art-meta"><span class="chip" style="--hue:190">' + esc(d.section) + '</span><a class="src" href="' + REPO + esc(d.source) + '" target="_blank" rel="noopener">' + esc(d.source) + "</a></div>" +
      '<h1 class="title">' + esc(d.title) + "</h1>" + (d.description ? '<p class="lede">' + esc(d.description) + "</p>" : "") +
      '<div class="md">' + md.html + "</div>" +
      '<div class="pager"><button class="prev" ' + (prev ? 'data-id="' + esc(prev.id) + '"' : "disabled") + "><small>previous</small>" + (prev ? esc(prev.title) : "") + "</button>" +
      '<button class="next" ' + (next ? 'data-id="' + esc(next.id) + '"' : "disabled") + "><small>next</small>" + (next ? esc(next.title) : "") + "</button></div>" +
      "</article>" + tocHtml(md.headings) + "</div>";
    afterShow();
  }
  function tocHtml(hs) {
    if (hs.length < 3) return "<div></div>";
    return '<nav class="toc"><h5>On this page</h5>' + hs.map(function (h) { return '<a class="l' + h.level + '" href="#' + h.id + '" data-anchor="' + h.id + '">' + esc(h.text) + "</a>"; }).join("") + "</nav>";
  }
  function showEmpty() {
    state.current = null;
    readerEl.innerHTML = '<div class="reader-empty"><h2>Pick a lesson</h2><p>Every entry here was paid for by a real bug or a real decision. Filter by kind or stack on the left, search with <kbd>/</kbd>, move with <kbd>j</kbd> and <kbd>k</kbd>.</p></div>';
  }
  function afterShow() {
    readerPane.scrollTop = 0;
    document.getElementById("kb").classList.add("reading");
    rowsEl.querySelectorAll(".row").forEach(function (b) { b.setAttribute("aria-current", b.getAttribute("data-id") === state.current ? "true" : "false"); });
    var cur = rowsEl.querySelector('.row[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: "nearest" });
    document.querySelectorAll("#rail-process a").forEach(function (a) { a.classList.toggle("current", a.getAttribute("data-id") === state.current); });
    readerEl.querySelectorAll(".tag").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); selectTag(a.getAttribute("data-tag")); }); });
    readerEl.querySelectorAll(".pager button[data-id]").forEach(function (b) { b.addEventListener("click", function () { location.hash = (state.currentType === "lesson" ? "#lesson/" : "#doc/") + b.getAttribute("data-id"); }); });
    readerEl.querySelectorAll(".toc a").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); var t = document.getElementById(a.getAttribute("data-anchor")); if (t) t.scrollIntoView({ block: "start", behavior: "smooth" }); }); });
    document.title = (state.currentType === "lesson" ? LESSON_BY_ID[state.current].title : DOC_BY_ID[state.current].title) + " · Vibe Knowledge Base";
    store("kb-last", location.hash);
  }

  // ---------- collections + routing ----------
  function setCollection(c) {
    state.collection = c;
    document.getElementById("tab-lessons").setAttribute("aria-pressed", c === "lessons" ? "true" : "false");
    document.getElementById("tab-process").setAttribute("aria-pressed", c === "process" ? "true" : "false");
    document.getElementById("rail-lessons").hidden = c !== "lessons";
    document.getElementById("rail-process").hidden = c !== "process";
    store("kb-collection", c);
  }
  document.getElementById("tab-lessons").addEventListener("click", function () { setCollection("lessons"); render(); location.hash = "#lessons"; });
  document.getElementById("tab-process").addEventListener("click", function () { setCollection("process"); render(); location.hash = "#process"; });

  function route() {
    var h = location.hash || "";
    var m;
    if ((m = h.match(/^#lesson\/(.+)$/))) { if (state.collection !== "lessons") { setCollection("lessons"); } render(); showLesson(decodeURIComponent(m[1])); }
    else if ((m = h.match(/^#doc\/(.+)$/))) { if (state.collection !== "process") { setCollection("process"); } render(); showDoc(decodeURIComponent(m[1])); }
    else if (h === "#process") { setCollection("process"); render(); document.getElementById("kb").classList.remove("reading"); if (state.currentType !== "doc") showEmpty(); }
    else { setCollection("lessons"); render(); document.getElementById("kb").classList.remove("reading"); if (state.currentType !== "lesson") showEmpty(); }
    document.getElementById("rail").classList.remove("open");
  }
  window.addEventListener("hashchange", route);

  // ---------- keyboard ----------
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (e.key === "/" && tag !== "input" && tag !== "textarea") { e.preventDefault(); document.getElementById("search").focus(); return; }
    if (tag === "input" || tag === "textarea") { if (e.key === "Escape") e.target.blur(); return; }
    if (e.key === "j" || e.key === "ArrowDown" && e.altKey) { step(1); e.preventDefault(); }
    if (e.key === "k" || e.key === "ArrowUp" && e.altKey) { step(-1); e.preventDefault(); }
    if (e.key === "Escape") { document.getElementById("kb").classList.remove("reading"); document.getElementById("rail").classList.remove("open"); }
  });
  function step(d) {
    var idx = -1; visible.forEach(function (x, i) { if (x.id === state.current) idx = i; });
    var n = idx + d; if (idx === -1) n = d > 0 ? 0 : visible.length - 1;
    if (n < 0 || n >= visible.length) return;
    location.hash = (state.collection === "lessons" ? "#lesson/" : "#doc/") + visible[n].id;
  }

  // ---------- chrome ----------
  document.getElementById("rail-toggle").addEventListener("click", function () { document.getElementById("rail").classList.toggle("open"); });
  document.getElementById("back-to-list").addEventListener("click", function () { document.getElementById("kb").classList.remove("reading"); });
  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
  var savedTheme = load("kb-theme"); if (savedTheme) applyTheme(savedTheme);
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme"), dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = !cur ? (dark ? "light" : "dark") : cur === "dark" ? "light" : "dark";
    applyTheme(next); store("kb-theme", next);
  });

  // ---------- init ----------
  buildRail(); buildDocNav(); syncRail();
  if (!location.hash) {
    var last = load("kb-last");
    if (last && (/^#lesson\//.test(last) && LESSON_BY_ID[decodeURIComponent(last.slice(8))] || /^#doc\//.test(last) && DOC_BY_ID[decodeURIComponent(last.slice(5))])) { history.replaceState(null, "", last); }
    else { var newest = sorted(LESSONS)[0]; if (newest) history.replaceState(null, "", "#lesson/" + newest.id); }
  }
  route();
})();
</script>
