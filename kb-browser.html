le? Take it over statics.\n- [ ] Subsetting with `--layout-features='*'` so kerning survives?\n- [ ] Do the ranges include the **punctuation your own strings contain**, not just A–Z?\n- [ ] Is each weight really being loaded, or is the renderer faking it from one file?\n- [ ] Licence text shipped **and reachable in the UI** if this goes to a store?\n- [ ] Subsetting scripted, ranges pinned, output committed?\n\n## Related\n\n- [[monorepo-stale-dist-zod-strip]] — the other kind of committed-artifact staleness: output checked in and silently older than its source.\n- [[chase-industry-stats-to-a-primary-source]] — same disease one domain over: a confident number that nobody traced before it became load-bearing."}, {"id": "supabase-rls-with-own-backend.md", "title": "Supabase RLS when YOUR server (not the Supabase SDK) fronts the database", "kind": "howto", "last_verified": "2026-06-29", "stack": ["supabase", "postgres", "powersync", "security"], "groups": ["Auth & Security", "Cloud & Backend", "Data & Sync"], "description": "When your own server + a sync layer (PowerSync/Electric) front Postgres, RLS isn't your auth model — but you must still enable deny-all RLS to lock Supabase's auto-on PostgREST/anon API. Why it's free (owner + replication bypass), the FORCE foot-gun, and a fresh-project checklist.", "content": "# Supabase RLS when YOUR server (not the Supabase SDK) fronts the database\n\n**One-liner:** If your app reaches Postgres through your own backend + a replication-based sync layer (PowerSync, ElectricSQL, etc.) instead of the Supabase client SDK, RLS is **not** your authorization model — but you must still **enable RLS deny-all** to lock the auto-generated PostgREST/anon API that Supabase ships **on by default**.\n\n---\n\n## The trap (it bites in both directions)\n\nTwo opposite mistakes, both common:\n\n1. **\"Just enable RLS and you're secure.\"** False when your auth is app-level. RLS with per-tenant *policies* is a heavy architectural commitment — policy design across tables, request-scoped DB roles, extra roundtrips, and real slowdown on serverless (e.g. ~2x on Cloudflare Workers + Hyperdrive, because request-scoped context means transactions and no connection-pool caching). If your isolation already lives in your server (scoped queries) + sync rules, you do **not** want RLS as your auth model. (See the widely-shared *\"Just enable RLS and you won't be hacked — no, it's not that simple\"* critique — it's correct, for the model it describes.)\n\n2. **\"We don't use the Supabase API, so RLS doesn't matter.\"** Also false. Supabase auto-generates a **PostgREST REST + GraphQL API on every project, enabled by default**, reachable with the **anon key** — which is *designed to be public/shippable*. If your tables have RLS **off**, anyone with the project ref + anon key can read/write every row through that API, **bypassing your server entirely.** That's the actual disaster the \"enable RLS\" warnings are about.\n\n---\n\n## The resolution: deny-all backstop (no policies)\n\nEnable RLS with **zero policies** on every public table:\n\n```sql\nalter table public.<each_table> enable row level security;\n```\n\nThis is essentially **free** in this architecture, because your two real access paths bypass RLS:\n\n- **Writes** go through your server as the **table-owner role** (Supabase pooler default user `postgres.<ref>` = the `postgres` owner). Table owners **bypass RLS** unless you set `FORCE ROW LEVEL SECURITY` (don't). Writes unaffected.\n- **Reads/sync** go through **logical replication** (PowerSync/Electric read the WAL). Replication is **not subject to RLS at all**; per-user row filtering happens in the **sync rules** (`SELECT * FROM t WHERE user_id = auth.user_id()`), not RLS. Sync unaffected.\n\nSo deny-all RLS locks only the `anon`/`authenticated` PostgREST surface — the door you don't use — while leaving the doors you do use wide open. It's a **backstop, not your auth model.** Your real isolation stays in the server's owner-stamped, scoped queries + the sync rules.\n\nNote: none of the \"RLS is slow/complex\" objections apply here — there are **no policies** to design and **no query-path cost** (your app never queries through an RLS-bound role).\n\n---\n\n## Foot-guns\n\n- **Never add `FORCE ROW LEVEL SECURITY`** with no policies — it subjects the owner role to RLS too and denies every write → \"production returns empty for everyone.\" This is the single way to brick it.\n- **Verify the connection role is the owner** before enabling. If your server connects as a *non-owner* role, deny-all would block its writes. (Check the username in `DATABASE_URL` — pull just the part before the password.)\n- **Instantly reversible**: `alter table ... disable row level security`. So \"enable → smoke-test one write → roll back if it breaks\" is a completely safe loop. The scary \"empty data\" outcome is a 5-second revert here, not a disaster.\n- **Codify it as a migration** (`NNNN_enable_rls.sql`), not ad-hoc dashboard SQL, so a rebuild re-applies it. Idempotent — re-enabling an already-enabled table is a no-op.\n- Supabase's **Security Advisor** flags RLS-disabled public tables; deny-all clears those warnings too.\n\n---\n\n## When you WOULD want real per-tenant policies\n\nOnly if you later let clients hit Supabase **directly** — e.g. a mobile app using the Supabase SDK instead of routing through your own server. Then you're back in the heavy per-tenant-policy world (and should weigh the serverless cost). As long as everything funnels through your own server + sync layer, deny-all is the right and cheap posture.\n\n---\n\n## Checklist for a new Supabase + own-backend project\n\n1. Server connects as the `postgres` owner via the pooler `DATABASE_URL`. ✓ bypasses RLS.\n2. Sync layer (PowerSync/Electric) does per-user filtering in **sync rules**, not RLS. ✓\n3. Ship a `NNNN_enable_rls.sql` migration: `enable row level security` on **every** public table, **no policies, no FORCE**.\n4. Smoke-test one write after enabling — confirms the owner bypass holds.\n5. Authorization itself lives in the server (stamp `user_id` server-side, scope every write `WHERE user_id = <session>`). RLS is the backstop, that is the lock.\n\n---\n\n*Captured from the Playmoir pre-paywall security pass, 2026-06-29. Backend context: see [`powersync-steam-backend-architecture.md`](./powersync-steam-backend-architecture.md).*"}, {"id": "suspect-the-statistic-before-the-threshold.md", "title": "When a classifier is wrong on many inputs, suspect the STATISTIC before the THRESHOLD", "kind": "gotcha", "last_verified": "2026-08-03", "stack": ["any", "image-processing", "ux"], "groups": ["Other", "Process & Meta"], "description": "A `if measure(x) < T` rule has two places to be wrong, and the threshold is the seductive one. When it misfires on a LARGE FRACTION of inputs, the measure is the bug and no cut point can save you. Measured: a \"too dark to see?\" check misclassified 86 of 419 logos via two compounding flaws — luma underrates saturated colour (pure blue scores 29), and a mean gets eaten by anti-aliasing and glow (one logo: mean 53, actual mark 204). Fix: max-channel, high percentile, restricted population. Includes the one-minute diagnostic and the non-image analogues (p50 latency, average session length, overall accuracy).", "content": "# When a classifier is wrong on many inputs, suspect the STATISTIC before the THRESHOLD\n\n**One-liner:** a rule of the form `if measure(x) < T then treat x specially` has two places to be wrong, and the threshold is the seductive one because it is a single number you can nudge; when the rule misfires on a *large fraction* of inputs, the number is almost never the problem — the thing you are measuring is. Measured case: a \"is this logo too dark to see?\" check misclassified **86 of 419** inputs, and no value of `T` could have fixed it, because two independent flaws in the measure were compounding.\n\n## The shape\n\nYou need a yes/no judgement about a piece of content: is this image too dark, is this audio too quiet, is this text too long, is this response too slow. So you reduce it to one number and compare against a constant.\n\nThat is the right architecture. The trap is what happens when it misbehaves:\n\n1. Someone reports a wrong call on input A. You nudge `T`.\n2. Input B breaks the other way. You nudge back.\n3. Now A and C are wrong. You start talking about \"tuning.\"\n\n**Threshold-tuning cannot fix a bad statistic.** If the measure doesn't separate the two populations, no cut point does either — you're choosing which errors to make, not removing them. The diagnostic is cheap and nobody runs it:\n\n> Dump the measure for a batch of known-good and known-bad inputs and **look at the two distributions.** If they overlap, stop touching `T`.\n\nA good statistic looks like this (real numbers from the case below):\n\n```\nshould-treat:   0, 0, 0, 0, 0, 0, 0, 0, 5, 20, 37, 40\nshould-not:     120, 164, 169, 204, 211, 222, 253, ...\n                          ^^^^^^ enormous gap ^^^^^^\n```\n\nA bad one has the two lists interleaved. Then the threshold is a coin flip dressed as a parameter.\n\n## The case: \"is this logo too dark to draw on a dark background?\"\n\nSteam ships each game a transparent-PNG wordmark. Some are pure black and vanish against a dark banner, so those get flipped to a white silhouette. Everything else draws as authored.\n\nFirst implementation, and it looks completely reasonable:\n\n```ts\n// mean Rec. 601 luma over every pixel with alpha > 16\nlum += 0.299*r + 0.587*g + 0.114*b;\nconst isDark = lum / inkCount < 90;\n```\n\nIt flagged **98 of 419** logos as dark. The true number is 12. Users hit five wrongly-bleached logos within minutes of looking.\n\nTwo independent bugs, both invisible in code review, both obvious in the data.\n\n### Flaw 1 — luma underrates saturated colour\n\nRec. 601 luma weights green at `0.587` and blue at `0.114`. That is correct for *perceived brightness* and wrong for *\"can you see it.\"*\n\n| colour | luma | max channel |\n|---|---|---|\n| pure red `#FF0000` | **76** | 255 |\n| pure blue `#0000FF` | **29** | 255 |\n| mid grey `#4C4C4C` | 76 | 76 |\n\n**Pure blue scores 29.** A vivid blue wordmark and a near-black one are indistinguishable to a luma threshold. The live example was a red wordmark scoring luma 68 — bleached to white, then invisible against light artwork. Its max-channel score was 120.\n\n> **Rule of thumb:** use luma when you're asking *how bright does this look*. Use max channel (HSV **value**) when you're asking *is there anything here at all*. They diverge exactly on saturated colour, which is what logos and brand marks are made of.\n\n### Flaw 2 — the mean is eaten by anti-aliasing and glow\n\nLogos carry feathered edges and soft outer glows. Those pixels are semi-transparent with near-black RGB, they pass a permissive alpha cutoff, and **there are a lot of them**.\n\nOne logo measured **48% solid pixels**. Its mean read 53. The wordmark a human sees reads 204. The average was describing the halo, not the mark.\n\nThe question is never \"what does this image average.\" It is \"**is the brightest substantial part visible.**\" That is a high percentile over the *solid* pixels:\n\n```ts\n// alpha >= 128 is the mark; below that is glow and anti-aliasing\nif (a >= ALPHA_SOLID) hist[Math.max(r, g, b)]++;\n// ...then walk the histogram to the 80th percentile\n```\n\nA 256-bucket histogram gives you any percentile in `O(n)` with fixed memory, so **the percentile costs nothing over the mean** — there is no performance argument for the worse statistic.\n\n### Result\n\n| | flagged as \"dark\" | of |\n|---|---|---|\n| mean of luma over all ink | 98 | 419 |\n| p80 of max-channel over solid ink | **12** | 419 |\n\nSame threshold-shaped rule. Same architecture. 86 fewer wrong answers, and the surviving separation is so wide that the exact cut point stopped mattering — anything from ~50 to ~100 gives identical results.\n\n**That last property is the tell of a good statistic: the threshold becomes boring.** If your results swing wildly on small changes to `T`, you have not found the right measure yet.\n\n## Generalising\n\nThe two flaws are instances of two general failure modes. Both apply well outside images.\n\n**1. The measure is weighted for a different question than the one you're asking.** Luma answers \"perceived brightness,\" you asked \"visibility.\" Similar mismatches:\n\n- **p50 latency** to answer \"is this fast enough\" — users experience the tail; use p95/p99.\n- **Average session length** to answer \"is this engaging\" — one 8-hour idle session drowns fifty real ones.\n- **Overall accuracy** on imbalanced classes — 99% accuracy is worthless at 1% base rate.\n- **Character count** to answer \"will this fit\" — proportional fonts, CJK width, emoji clusters.\n\n**2. The aggregate is dominated by a population you don't care about.** The glow pixels outnumbered the mark. Similar:\n\n- Mean response time swamped by cached responses.\n- Average file size swamped by thousands of tiny assets.\n- Mean colour of a photo with a large flat background.\n\nThe fix in both cases is the same two moves: **restrict the population** (solid pixels only / uncached only / real sessions only), then **pick an order statistic instead of a mean** (p80, p95, median) so outliers and long tails stop steering.\n\n## Checklist\n\nWhen a threshold rule misfires:\n\n1. **Count the failures.** One wrong input is a threshold problem. A large fraction is a statistic problem. This is the whole diagnostic and it takes a minute.\n2. **Dump both distributions** for known-good and known-bad. Overlap means stop tuning.\n3. **Ask what the measure is weighted for**, and whether that is your actual question.\n4. **Ask what population it averages over**, and whether most of it is stuff you care about.\n5. **Restrict, then use a percentile.** Cheap with a histogram.\n6. **Re-derive the threshold from the new gap** and write the measured numbers into the code comment. A threshold with its calibration data next to it survives; a bare constant invites the next person to nudge it.\n\n## Anti-patterns\n\n- ❌ **Tuning the threshold twice.** If the second nudge is needed, the first was treating a symptom. Go look at the distributions.\n- ❌ **Hand-maintaining an exception list.** Per-input overrides are threshold-tuning with extra steps, and the list grows forever.\n- ❌ **Trusting a plausible detector without checking false positives.** A first attempt here used per-row edge-energy to spot letterboxed images; it *looked* principled and flagged two obviously-correct inputs. Always test a detector against inputs you are certain about, in *both* directions — a detector validated only on true positives is not validated.\n- ❌ **Shipping a bare magic number.** Write down what you measured, on how many inputs, and where the gap was.\n\n## Related\n\n- [instrument-before-patching.md](./instrument-before-patching.md) — the sibling failure: when the pipeline's *decisions* are invisible rather than its *measure* being wrong. Both are \"stop writing patches, go get data,\" applied one layer apart.\n- [chase-industry-stats-to-a-primary-source.md](./chase-industry-stats-to-a-primary-source.md) — same instinct pointed at external numbers instead of your own."}, {"id": "tauri-desktop-oauth.md", "title": "Desktop OAuth for Tauri 2 Apps (Windows/macOS/Linux)", "kind": "howto", "last_verified": "2026-07-22", "stack": ["tauri", "better-auth", "cloudflare-worker"], "groups": ["Cloud & Backend", "Frameworks & Libraries", "Platforms & Runtimes"], "description": "Google OAuth in Tauri 2 desktop apps (localhost callback + bearer tokens). The flow, code, gotchas, what NOT to do.", "content": "# Desktop OAuth for Tauri 2 Apps (Windows/macOS/Linux)\n\n> Learned the hard way (2026-04-13). This is the pattern that works.\n\n## The Problem\n\nDesktop apps (Tauri, Electron, etc.) can't use standard browser OAuth because:\n- The system browser and the app's webview have **separate cookie jars**\n- Cross-origin cookies between `localhost:1420` (webview) and `localhost:8787` (auth server) don't work\n- Custom URL schemes (`myapp://callback`) are fragile on Windows — deep link registration only works in production installers, not dev mode\n- Libraries like `@daveyplate/better-auth-tauri` try to bridge this with deep links + cookies but are unreliable on Windows\n\n## The Solution: Localhost Callback + Bearer Tokens\n\nThis is how VS Code, GitHub CLI, JetBrains, and most desktop apps do OAuth. Proven, reliable, no cookie dependencies.\n\n### Flow\n\n```\n1. User clicks \"Sign in with Google\"\n2. App starts a temporary HTTP server on a fixed port (e.g. 127.0.0.1:17927)\n3. App opens system browser to Google OAuth with redirect_uri=http://127.0.0.1:17927\n4. Google authenticates → redirects browser to http://127.0.0.1:17927?code=ABC&state=XYZ\n5. App's localhost server catches the code\n6. App sends the code to your backend (e.g. Cloudflare Worker)\n7. Backend exchanges code with Google → gets user info → creates session → returns bearer token\n8. App stores bearer token locally (SQLite, localStorage, secure storage)\n9. All subsequent API calls use Authorization: Bearer {token}\n```\n\n### Why a Fixed Port?\n\nGoogle's \"Web application\" OAuth client type requires **exact** redirect URIs including the port. You can't use a random port unless you switch to a \"Desktop app\" client type (which requires PKCE and has no client secret).\n\nRegister `http://127.0.0.1:17927` (or whatever port you choose) in Google Cloud Console → Credentials → Authorized redirect URIs.\n\n## Implementation\n\n### 1. Rust/Tauri Side\n\n**Cargo.toml:**\n```toml\ntauri-plugin-oauth = \"2\"\n```\n\n**lib.rs:**\n```rust\n.plugin(tauri_plugin_oauth::init())\n```\n\n**capabilities/default.json:**\n```json\n\"oauth:allow-start\",\n\"oauth:allow-cancel\"\n```\n\nNote: there is NO `oauth:default` permission — you must use the explicit allow permissions.\n\n### 2. Frontend (TypeScript/React)\n\n**Install:**\n```bash\npnpm add @fabianlars/tauri-plugin-oauth@2\n```\n\n**Sign-in flow:**\n```typescript\nimport { start, cancel, onUrl } from '@fabianlars/tauri-plugin-oauth';\nimport { openUrl } from '@tauri-apps/plugin-opener';\n\nasync function handleSignIn() {\n  // 1. Start localhost OAuth server on fixed port\n  const port = await start({ ports: [17927] });\n  const redirectUri = `http://127.0.0.1:${port}`;\n  \n  // 2. Generate CSRF state\n  const state = crypto.getRandomValues(new Uint8Array(24))\n    .reduce((s, b) => s + b.toString(16).padStart(2, '0'), '');\n\n  // 3. Build Google OAuth URL\n  const params = new URLSearchParams({\n    client_id: 'YOUR_GOOGLE_CLIENT_ID',\n    redirect_uri: redirectUri,\n    response_type: 'code',\n    scope: 'openid email profile',\n    state,\n    access_type: 'offline',\n    prompt: 'consent',\n  });\n\n  // 4. Listen for the callback BEFORE opening browser\n  const unlisten = await onUrl((urlString) => {\n    const url = new URL(urlString);\n    const code = url.searchParams.get('code');\n    const returnedState = url.searchParams.get('state');\n    \n    if (returnedState !== state) throw new Error('CSRF mismatch');\n    if (!code) throw new Error('No code received');\n    \n    // 5. Exchange code with your backend\n    exchangeCodeWithBackend(code, redirectUri).then(({ token }) => {\n      // 6. Store token locally\n      storeToken(token);\n    }).finally(() => {\n      unlisten();\n      cancel(port);\n    });\n  });\n\n  // 7. Open browser\n  await openUrl(`https://accounts.google.com/o/oauth2/v2/auth?${params}`);\n}\n```\n\n### 3. Backend (Cloudflare Worker / any server)\n\nThe backend needs an endpoint that:\n1. Receives `{ code, redirectUri }` from the app\n2. Exchanges the code with Google's token endpoint\n3. Fetches user info from Google\n4. Creates/finds user in your database\n5. Creates a session and returns a bearer token\n\n```typescript\n// POST /api/auth/exchange-code\napp.post('/api/auth/exchange-code', async (c) => {\n  const { code, redirectUri } = await c.req.json();\n  \n  // Exchange with Google\n  const tokenRes = await fetch('https://oauth2.googleapis.com/token', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },\n    body: new URLSearchParams({\n      code,\n      client_id: env.GOOGLE_CLIENT_ID,\n      client_secret: env.GOOGLE_CLIENT_SECRET,\n      redirect_uri: redirectUri,\n      grant_type: 'authorization_code',\n    }),\n  });\n  \n  const tokens = await tokenRes.json();\n  \n  // Get user info\n  const userRes = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {\n    headers: { Authorization: `Bearer ${tokens.access_token}` },\n  });\n  const user = await userRes.json();\n  \n  // Create session, return bearer token\n  const session = await createSession(user);\n  return c.json({ token: session.token, user: { name: user.name, email: user.email } });\n});\n```\n\n### 4. Google Cloud Console Setup\n\n1. Go to [Google Cloud Console](https://console.cloud.google.com)\n2. APIs & Services → Credentials → Create OAuth 2.0 Client ID\n3. Application type: **Web application** (not Desktop — Web lets you use a client secret)\n4. Authorized redirect URIs: add `http://127.0.0.1:17927`\n5. Save the Client ID and Client Secret\n\n## What NOT to Do\n\n- **Don't use deep links for OAuth** (`myapp://callback`) — unreliable on Windows, requires installer-level URL scheme registration, cookies don't transfer\n- **Don't use `@daveyplate/better-auth-tauri`** — v0.1.6, single maintainer, broken on Windows, relies on cross-origin cookies\n- **Don't use cookies for auth in native apps** — use bearer tokens stored locally\n- **Don't use random ports** unless your OAuth client type is \"Desktop app\" (which requires PKCE)\n- **Don't use Tauri's HTTP plugin** (`@tauri-apps/plugin-http`) as a fetch replacement to \"fix\" cookies — it has its own cookie jar issues\n\n## Key Dependencies\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `tauri-plugin-oauth` | 2.0.0 | Rust — localhost OAuth server |\n| `@fabianlars/tauri-plugin-oauth` | ^2.0.0 | JS — start/cancel/onUrl API |\n| `@tauri-apps/plugin-opener` | ^2.5.0 | JS — open URL in system browser (`openUrl`) |\n\n## Gotchas\n\n1. **No `oauth:default` permission** — use `oauth:allow-start` and `oauth:allow-cancel` explicitly in your capabilities JSON\n2. **`@tauri-apps/plugin-opener` exports `openUrl`, not `open`** — the API name differs from what you might expect\n3. **Rust `#[serde(rename_all = \"camelCase\")]`** — if your Tauri commands return structs with multi-word fields, add this attribute or the JS side will see `undefined` for `logged_in` instead of `loggedIn`\n4. **better-auth token format** — if using better-auth's `bearer()` plugin, session tokens must be HMAC-SHA256 signed with base64url-no-pad encoding (not standard base64). The plugin uses `createHMAC(\"SHA-256\", \"base64urlnopad\")` for verification.\n5. **Google propagation delay** — after adding a redirect URI in Google Cloud Console, it can take 5 minutes to several hours to propagate. Usually < 2 minutes for new URIs.\n\n6. **Listener stays bound if user closes the browser tab mid-flow** — the most common production bug with this pattern. If the user clicks Sign in, the browser opens, and then they close the tab before completing OAuth (or kill it because they changed their mind), the localhost listener on your fixed port stays bound. Subsequent sign-in attempts fail with \"address already in use\" until the app is fully restarted. **Mitigation**: wrap the `start()` + `onUrl()` flow with a ~2-minute timeout that calls `unlisten()` + `cancel(port)`, plus surface a Cancel button in the UI that triggers the same teardown. The naive \"user will come back to the tab\" assumption fails ~10% of the time in practice.\n\n   ```typescript\n   const TIMEOUT_MS = 2 * 60 * 1000;\n   const timeoutId = setTimeout(() => {\n     unlisten();\n     cancel(port).catch(() => {});\n     setSignInError('Sign-in timed out. Try again.');\n   }, TIMEOUT_MS);\n\n   // Inside onUrl callback, clearTimeout(timeoutId) before the exchange call.\n   // Inside the Cancel button handler, do the same teardown + clearTimeout.\n   ```\n\n7. **The listener dies on component UNMOUNT — so never host this flow in a transient/dismissable UI surface.** Gotcha #6 is about the browser tab closing; this is about the *host component* closing. The correct cleanup for this pattern is teardown on unmount (`useEffect(() => () => tearDown(), [])` — cancel the port + `unlisten()`), because you must not leak the localhost server. But that same correct cleanup means: **whatever component calls `start()`/`onUrl()` must stay mounted for the entire round-trip** (open browser → user authenticates → loopback redirect fires `onUrl`). If you host the flow inside a popover, dropdown, or any panel that unmounts on click-outside / focus-steal / navigation, then the instant that surface closes — which happens the moment the system browser steals focus, or the user clicks away — the component unmounts, `tearDown()` runs, the loopback listener is gone, and the callback **silently never lands**. It works in every quick test (you don't click away) and fails constantly in the wild.\n\n   **Fix**: host the sign-in flow on a surface that stays mounted — a Settings page, a dedicated dialog that doesn't dismiss on outside-click, or an app-level sign-in host exposed via a store/context. From a transient surface (e.g. a notification popover offering \"Sign in to resume backup\"), **route the user to the persistent surface** rather than running the flow inline. Generalizes beyond OAuth: any teardown-on-unmount subscription whose success depends on an out-of-band event landing later (loopback servers, WebSocket handlers, `postMessage` listeners, deep-link handlers) must not live in a surface that unmounts as part of normal interaction. (Playmoir, 2026-07-21: the notification hub's expired-session \"Sign in\" routes to Settings/Connections for exactly this reason — the hub panel is a Radix Popover that unmounts on close.)\n\n## Reference Implementation Layout\n\nThis pattern was first proven in a Tauri 2 + Cloudflare Worker + better-auth desktop app. The file layout you'd recreate in any project of that shape:\n\n- Exchange endpoint (Worker): `apps/cloud/src/auth/exchange.ts`\n- Frontend OAuth flow (React): `packages/frontend/src/features/sync/SyncAccountSection.tsx`\n- Auth client helpers: `packages/frontend/src/features/sync/auth-client.ts`\n- Rust sync commands with bearer auth: `apps/desktop/src-tauri/src/commands/sync.rs`"}, {"id": "tauri-desktop-security-hardening.md", "title": "Tauri 2 desktop security-hardening checklist", "kind": "checklist", "last_verified": "2026-06-29", "stack": ["tauri", "security"], "groups": ["Auth & Security", "Platforms & Runtimes"], "description": "Pre-launch hardening checklist for Tauri 2: asset-scope traversal, least-privilege `opener`, `#[cfg(debug_assertions)]` to drop debug commands from release, path-containment for file commands, the XSS lynchpin that makes the rest live-or-dormant.", "content": "# Tauri 2 desktop security-hardening checklist\n\nReusable pre-launch hardening for a Tauri (Rust + WebView) desktop app.\n\n**Threat-model calibration:** a local user already controls their own machine, so \"user can read their own DB/files\" is NOT a finding. The real risks are **untrusted DATA** (cloud-synced content, deep links, third-party-sourced strings) crossing into code/path/SQL execution, and the **blast radius an XSS would have** given the capabilities you granted.\n\n## 1. Asset-protocol scope — beware broad globs\n`app.security.assetProtocol.scope` in `tauri.conf.json` controls what the webview can read via `asset://`. A glob like `**/SomeApp/**` matches that segment **anywhere on disk** — it can expose credential/config files far beyond what you actually read.\n- Scope to the **narrowest real path** (e.g. `**/appcache/librarycache/**`, your app-data dirs) — never a broad app-root glob.\n- Each unnecessary glob is a file-exfil vector the moment an XSS lands.\n\n## 2. `opener` allow-list — least privilege\n`opener:allow-open-url` with `https://*` / `http://*` / `scheme://*` lets (an XSS in) the webview open arbitrary URLs or fire arbitrary custom-scheme verbs.\n- Allow only the exact URLs you open: e.g. `steam://run/*` + your specific `https://your-api.example.com/*`, not wildcards.\n- Audit by grepping the frontend for every `openUrl(` / `open(` call before narrowing — usually only 1–3.\n\n## 3. Keep debug commands out of release\nDev-only IPC commands (process enumeration, on-demand capture, seed generators) ship in the binary unless gated.\n- Put `#[cfg(debug_assertions)]` on BOTH the command `fn` AND its entry in `generate_handler![]` (Tauri supports `#[cfg(...)]` on individual handler entries).\n- Grep the handler list for `debug_*` / `dev_*` / `seed_*` before shipping.\n\n## 4. Path-contain every command that takes a path from the frontend\nAny `#[tauri::command]` that receives a `file_path: String` and reads/writes/deletes it can be handed an arbitrary path by (an XSS in) the webview.\n```rust\nlet root = app.path().app_data_dir()?.join(\"subdir\");\nlet canon_root = std::fs::canonicalize(&root)?;\nlet canon = std::fs::canonicalize(&input_path)?;          // also proves it exists\nif !canon.starts_with(&canon_root) { return Err(\"path outside app dir\".into()); }\n```\n- Make ONE `canonical_under(candidate, root)` helper and reuse it (don't reimplement per command).\n- Exception: a true save-dialog destination is legitimately anywhere — accept those, but know the command can't *prove* it came from the dialog.\n\n## 5. CSP — don't ship dev origins\nThe CSP in `tauri.conf.json` applies to release too. Strip dev-only entries (`http://localhost:<devport>`) so a release XSS can't reach local services. Keep `script-src 'self' 'wasm-unsafe-eval'` (no `unsafe-inline` for scripts); `style-src 'unsafe-inline'` is normal/low-risk.\n\n## 6. The XSS lynchpin (items 1, 2, 4 are amplifiers)\nThose items only become exploitable when untrusted text renders as HTML. So the load-bearing check: **does any synced / third-party / user string ever hit `dangerouslySetInnerHTML` / `innerHTML` without escaping?** Route all such rendering through one escape-then-stitch helper. If that holds, the amplifiers are dormant; if it breaks, they're all live. Verify it explicitly — don't assume.\n\n## 7. `sql:allow-execute` to the webview\ntauri-plugin-sql exposes raw SQL to JS by design (the frontend owns DB writes) → an XSS = full local DB control. Acceptable *only* while item 6 holds. Longer term, move writes behind narrow Rust commands so you can drop `sql:allow-execute`.\n\n## 8. Secrets on disk\nTokens/keys written to the local DB or files should be wrapped with the OS facility — Windows **DPAPI** (`CryptProtectData`), macOS Keychain, Linux libsecret — not stored plaintext.\n\nThe **updater signing key** deserves its own line: passphrase-less at `~/.tauri/<app>.key` (the default) means anything that can read one file can ship signed code to every install, and the naive fix — regenerate with a password — **strands every existing install** because the pubkey is compiled into shipped binaries. Same-keypair rekey procedure + verification pattern: [`tauri-updater-key-passphrase-without-stranding.md`](./tauri-updater-key-passphrase-without-stranding.md) (added 2026-07-29).\n\n## Verify\n`cargo check` in **both** debug and release after `#[cfg]`-gating — the release build is what proves the gated symbols and their handler entries stay consistent (a mismatch only errors in one profile).\n\n---\n*Captured from the Playmoir pre-paywall security pass, 2026-06-29. See also `tauri-desktop-oauth.md`, `tauri-sqlite-direct-sqlx.md`.*"}, {"id": "tauri-ipc-serde.md", "title": "Tauri IPC Serde Conventions (Rust ↔ TypeScript)", "kind": "gotcha", "last_verified": "2026-04-13", "stack": ["tauri", "rust"], "groups": ["Languages", "Platforms & Runtimes"], "description": "Always add `#[serde(rename_all = \"camelCase\")]` to Rust structs crossing the Tauri IPC boundary. Hidden `undefined`-field bug.", "content": "# Tauri IPC Serde Conventions (Rust ↔ TypeScript)\n\n> Save yourself an hour of \"why is this field undefined?\" debugging.\n\n## The Gotcha\n\nRust structs serialize with `snake_case` field names by default. TypeScript code expects `camelCase`. Tauri's IPC just pipes the JSON through — it doesn't auto-convert.\n\nResult: `status.loggedIn` is `undefined` on the JS side because the actual field is `logged_in`.\n\n## The Fix\n\nAlways add `#[serde(rename_all = \"camelCase\")]` to any Rust struct that:\n- Is returned from a `#[tauri::command]`\n- Is deserialized from JS input\n- Has any field with more than one word\n\n```rust\nuse serde::Serialize;\n\n#[derive(Debug, Serialize)]\n#[serde(rename_all = \"camelCase\")]  // ← ALWAYS add this\npub struct SyncStatusResult {\n    logged_in: bool,        // becomes \"loggedIn\" in JS\n    device_id: String,      // becomes \"deviceId\" in JS\n    last_pulled_at: i64,    // becomes \"lastPulledAt\" in JS\n    outbox_count: i64,      // becomes \"outboxCount\" in JS\n}\n```\n\n## How to Spot the Bug\n\nSymptom: TypeScript code like this silently fails:\n```typescript\nconst status = await invoke<SyncStatus>('sync_status');\nif (status.loggedIn) { ... }  // always false, even after login\n```\n\nDebug: log the raw response:\n```typescript\nconsole.log(JSON.stringify(await invoke('sync_status')));\n// Output: {\"logged_in\":true,...}  ← snake_case gives it away\n```\n\n## Single-Word Fields Don't Show the Bug\n\nThis is why the bug hides — structs with only single-word fields serialize the same in both conventions:\n\n```rust\npub struct SyncPushResult {\n    pushed: i64,\n    accepted: i64,\n    rejected: i64,\n    errors: Vec<String>,\n}\n// JS sees: { pushed, accepted, rejected, errors } — works without rename_all\n```\n\nSo you can have a codebase where half the structs work and half don't, depending on whether any field happens to have a word break.\n\n## Rule of Thumb\n\n**Add `#[serde(rename_all = \"camelCase\")]` to every struct that crosses the Tauri IPC boundary, full stop.** Even if all fields are single-word today — your future self will add a `foo_bar` field and forget.\n\n## Also Applies To\n\n- `#[tauri::command]` parameter structs (input deserialization)\n- Events emitted with `app.emit()` and received in JS\n- Any `Serialize` + `Deserialize` struct sent through `invoke`\n\n## Reference\n\nSerde docs: <https://serde.rs/container-attrs.html#rename_all>"}, {"id": "tauri-multiwindow-dev-hmr-stranding.md", "title": "Multi-window Tauri + Vite dev: an entry-file edit can strand an always-on-top window", "kind": "gotcha", "last_verified": "2026-07-26", "stack": ["tauri", "vite", "multiwindow"], "groups": ["Platforms & Runtimes"], "description": "In dev, every open Tauri window is a Vite client: an entry-file edit (never Fast-Refreshable) full-reloads ALL of them, and a reload into a transparent always-on-top window can wedge its IPC — stranding a window whose every dismiss path was webview-side JS. The Rust global-hotkey dead-man (destroy() never consults the webview), the dev workflow rule, and why the design flaw is prod-real even though the trigger is dev-only.", "content": "# Multi-window Tauri + Vite dev: an entry-file edit can strand an always-on-top window\n\n**One-liner:** in dev, every open Tauri window is a connected Vite client. An edit to a module that can't Fast Refresh (the entry file always qualifies — it has no component exports) triggers a **full page reload in every connected webview at once**. A reload forced into a secondary window mid-life can wedge that webview's IPC — and if every way to dismiss that window lives in its own JS, you now have a frameless, transparent, always-on-top window stranded over the desktop that nothing in the app can remove.\n\n## Symptom\n\nWhile an agent/dev is saving files, a secondary window (in-game overlay, recap splash, tray popover) suddenly:\n\n- re-renders blank or with empty data (its post-reload fetches failed),\n- ignores every dismiss affordance — button, click-away, auto-dismiss timer, hotkey handled in JS,\n- may show a **ghost of its pre-reload frame** behind the live render (transparent windows don't clear the old compositor frame),\n- survives closing the main window (close-to-tray keeps the process alive; the stranded window belongs to that process).\n\nTask Manager appears to be the only way out. The terminal shows the tell:\n\n```\n[vite] (client) hmr invalidate /src/main.tsx Could not Fast Refresh (\"true\" export is incompatible)\n```\n\n— repeated once per connected webview. That message is vite-plugin-react's (badly worded) way of saying the module has no refreshable component exports; the invalidation reaches the entry, so Vite falls back to `full-reload`, pushed to **all** clients.\n\n## Cause chain\n\n1. Entry files (`main.tsx` with `createRoot`, window-mode branching) can never Fast Refresh → any edit to them = full reload everywhere. Component-file edits are safe (they self-accept).\n2. The reload lands in a webview that was mid-lifecycle; its IPC bridge can come back wedged (data queries fail, `invoke` rejects).\n3. Every dismiss path funnels through webview-side IPC — typically one shape: `getCurrentWindow().destroy().catch(() => {})`. With IPC dead, `destroy()` rejects and the `.catch` **swallows it silently**. All escape routes were the same broken route.\n\n## Fix (two layers)\n\n**Design layer — the dead-man must live in Rust, never in the window's own JS.** Register a global shortcut whose handler destroys the overlay-family windows directly:\n\n```rust\n// In the global-shortcut handler — pure Rust, works when the webview is brain-dead:\npub fn destroy_overlay_windows(app: &AppHandle) -> bool {\n    let mut destroyed = false;\n    for label in [\"overlay\", \"recap\"] {\n        if let Some(win) = app.get_webview_window(label) {\n            let _ = win.destroy();   // never consults the webview\n            destroyed = true;\n        }\n    }\n    destroyed\n}\n```\n\nReuse an existing muscle-memory hotkey if you have one (e.g. the same combo that opens the overlay: \"clear any stuck overlay first, else open\"). The property that matters: `WebviewWindow::destroy()` is a window-manager operation — it succeeds regardless of the webview's health.\n\n**Workflow layer — close secondary windows before saving files in dev**, especially before edits to the entry or any non-Fast-Refreshable module. If an AI agent is doing the editing, make this an explicit session rule; the agent's save bursts are exactly the trigger.\n\n## Scoping — is this a production bug?\n\nThe *trigger* is dev-only: shipped builds have no Vite and no live-reload. But the *design flaw* it exposes — all dismiss paths behind a single fragile IPC call with a swallowed error — is production-real; anything else that kills the webview's JS (crash loops, OOM, a wedged render) strands the window identically. Ship the Rust dead-man regardless. (A crashed-webview fallback UI does not cover this: the webview here is alive enough to render, just unable to execute its dismiss.)\n\n## What NOT to do\n\n- Don't add retry loops around `destroy()` in JS — if IPC is dead, retries are dead too.\n- Don't make the escape \"close the main window\" — close-to-tray apps keep the process (and the stranded window) alive.\n- Don't auto-destroy overlay windows on every reload/game-exit as the fix — a healthy overlay may be holding unsaved user input (a half-typed note); destroying it costs data. The dead-man is user-invoked for exactly this reason."}, {"id": "tauri-sentry-debug-id-envelope-drop.md", "title": "Turning ON source-map symbolication silently deletes every JS error report in a Tauri app", "kind": "gotcha", "last_verified": "2026-07-24", "stack": ["tauri", "rust", "sentry", "javascript", "vite", "crash-reporting"], "groups": ["Languages", "Platforms & Runtimes", "Reliability & Perf"], "description": "Turning ON source-map symbolication silently deletes 100% of your JS error reports in a Tauri app: `@sentry/vite-plugin` injects debug IDs → `@sentry/browser` attaches a `debug_meta` image of `type: \"sourcemap\"` → `sentry-types`' closed `DebugImage` enum has no such variant → `Envelope::from_slice` fails → `tauri-plugin-sentry`'s `if let Ok(...)` (no `else`) drops the envelope with zero diagnostics, while Rust panics keep flowing so the dashboard looks alive. Ten-minute identification checklist (the decisive test: deliberate Rust panic vs JS error — if only one lane lands, it's the JS→native boundary), the vendored-crate fix with the two serde traps (`rename = \"sourcemap\"` not snake_case; keep every field `Option<String>` so the fix can't reintroduce a strict-parse drop), and the general rule that `if let Ok(x) = parse(...)` at any boundary is a silent data destroyer.", "content": "# Turning ON source-map symbolication silently deletes every JS error report in a Tauri app\n\n> The fix causes the bug. Before you wire up source maps, JS errors arrive in\n> Sentry (unreadable, minified). The moment you add `@sentry/vite-plugin` so the\n> stack traces become readable, **every JavaScript event stops arriving** — with\n> no error, no warning, and no failed network request anywhere. Rust panics keep\n> flowing the whole time, so the dashboard looks alive.\n>\n> Hit and independently root-caused in Playmoir (Tauri 2 + React +\n> `tauri-plugin-sentry`) on 2026-07-24 after most of a night. It had already\n> been diagnosed publicly seven weeks earlier — see **Upstream status** for the\n> credit and, more usefully, for why an accepted root cause still has no fix.\n\n## The symptom\n\n- `Sentry.captureException()` fires. You can prove it: a `console.log` right\n  before it runs, a breadcrumb, a debugger break. The call happens.\n- Nothing appears in Sentry. Not delayed — never.\n- **Rust panics and breadcrumbs from the same app arrive fine.** So the DSN is\n  right, the network is fine, the project is right, the release exists.\n- It only happens in **release** builds. Dev is clean.\n- It started when you turned on symbolication, which is the last thing you'd\n  suspect, because symbolication is supposed to be a *display* concern.\n\nThat last point is what makes this expensive. Everyone's instinct is that\nsource maps affect how a trace is *rendered*, not whether the event is\n*delivered*. Here they decide delivery.\n\n## The cause chain\n\nFive links, each individually reasonable:\n\n1. **`@sentry/vite-plugin` injects debug IDs** into your bundle. That is its\n   entire job: stamp each file with an ID so Sentry can match a minified frame\n   to an uploaded source map.\n2. **`@sentry/browser` >= 7.44 notices those IDs** and attaches a\n   `debug_meta.images` entry to every event:\n   ```json\n   { \"type\": \"sourcemap\", \"code_file\": \"...\", \"debug_id\": \"...\" }\n   ```\n3. **In a Tauri app the JS SDK does not POST to Sentry.** `tauri-plugin-sentry`\n   installs a transport that hands the serialized envelope to Rust over IPC\n   (the plugin's `envelope` command) so both language sides share one client,\n   one release, one session.\n4. **The Rust side parses that envelope with `sentry-types`**, whose\n   `DebugImage` enum is `#[serde(tag = \"type\", rename_all = \"snake_case\")]` over\n   a **closed** set: `apple`, `symbolic`, `proguard`, `wasm`. There is no\n   `sourcemap` variant. `Envelope::from_slice` fails with\n   `unknown variant \"sourcemap\"`.\n5. **The plugin ignores the parse result.** The command is shaped\n   `if let Ok(envelope) = Envelope::from_slice(&bytes) { ... }` — with **no\n   `else`**. A parse failure is indistinguishable from \"nothing happened.\"\n\nNet effect: one unknown enum variant, added by a build plugin from the *same\nvendor*, silently discards 100% of your JavaScript telemetry.\n\n## Identify it in ten minutes instead of six hours\n\nRun these in order. Each one halves the search space.\n\n1. **Prove capture fires.** `console.log` immediately before\n   `captureException`. If it logs, stop debugging your capture code — it is\n   correct, and every hour spent on Sentry init options is wasted.\n2. **Compare against the native side.** Trigger a deliberate Rust panic. If\n   Rust events land and JS events don't, the problem is **at the JS→native\n   boundary**, not in SDK configuration, DSN, sampling, or filters. This is the\n   highest-value single test.\n3. **Check whether your bundle carries debug IDs.** Grep the built assets for\n   `debugId` / `sentry-dbid`. Present = you are in the failure mode. Absent =\n   this article is not your bug.\n4. **Confirm by removing the trigger.** Temporarily drop `@sentry/vite-plugin`\n   from the build, rebuild, retest. Events come back (minified). That single\n   observation identifies the whole chain and is worth doing before you write\n   any patch.\n\nDo NOT bother reading the plugin's network layer, adding `beforeSend` logging,\nor raising sampling rates. Nothing is being *rejected*; something is being\n*dropped without a code path*.\n\n## The fix, until upstream moves\n\nVendor `sentry-types` and add the missing variant. Wire it in with\n`[patch.crates-io]` so the whole dependency tree (`sentry`, `sentry-core`,\n`tauri-plugin-sentry`) resolves to your copy:\n\n```toml\n# src-tauri/Cargo.toml\n[patch.crates-io]\nsentry-types = { path = \"vendor/sentry-types\" }\n```\n\nTwo non-obvious details in the patch itself:\n\n**The wire name is `sourcemap`, not `source_map`.** The enum carries\n`rename_all = \"snake_case\"`, so the derived name for a `SourceMap` variant\nwould be `source_map` and would not match. It needs an explicit rename:\n\n```rust\n#[serde(rename = \"sourcemap\")]\nSourceMap(SourceMapDebugImage),\n```\n\n**Make every field optional, and keep `debug_id` a `String`, not a `Uuid`.**\n\n```rust\npub struct SourceMapDebugImage {\n    #[serde(default, skip_serializing_if = \"Option::is_none\")]\n    pub code_file: Option<String>,\n    #[serde(default, skip_serializing_if = \"Option::is_none\")]\n    pub debug_id: Option<String>,\n    #[serde(default, skip_serializing_if = \"Option::is_none\")]\n    pub debug_file: Option<String>,\n}\n```\n\nThis patch exists *because* a strict parse silently ate whole events. Re-adding\nstrictness inside the fix — a required field, a typed `Uuid` that rejects an\noddly formatted ID — would recreate the same class of failure one layer down.\nRelay validates this server-side anyway. Parse loosely at the boundary you do\nnot control.\n\nKeep the vendored copy byte-identical to the published crate apart from the\npatch, with every change marked by a greppable comment (`PLAYMOIR PATCH`), so a\nfuture upstream release can be diffed against it. Exempt the directory from your\nrepo's file-size / docs-coverage rules; it is third-party code.\n\n## Upstream status\n\nAll of the following verified on **2026-07-24** by reading the sources directly,\nnot from memory.\n\n**Prior art — this was diagnosed publicly before we hit it.** Credit where it's\ndue: `ottosson` posted the identical cause chain (closed `DebugImage` enum →\n`InvalidItemPayload` → the plugin's error-free `if let Ok`) on\n[bundler-plugins#916](https://github.com/getsentry/sentry-javascript-bundler-plugins/issues/916)\non **2026-06-02**, with a minimal reproducer\n([sentry-vite-plugin-repro](https://github.com/ottosson/sentry-vite-plugin-repro))\nand a fix fork. The `sentry-tauri` maintainer agreed the next day. If you land\nhere, read that thread first — it is the canonical write-up. Cross-posted at\n[sentry-tauri#35](https://github.com/timfish/sentry-tauri/issues/35).\n\n**Nothing has shipped since.** `timfish/sentry-tauri`'s last commit is\n2026-02-11 (predating the diagnosis), so the silent `if let Ok` is still live,\nand `getsentry/sentry-rust` master still has no `sourcemap` variant.\n\n**The fix is filed in the wrong place.** As of today a GitHub search of\n`getsentry/sentry-rust` for a `sourcemap` / `DebugImage` issue returns **zero\nresults**. The diagnosis lives entirely on the *bundler plugin's* tracker, which\nis the one repo that turned out not to be at fault. That is very likely why a\nseven-week-old accepted root cause has produced no fix: nobody opened it against\nthe crate that has to change. If you are blocked on this, filing there is worth\nmore than another +1 on #916.\n\n**Remove the vendor when** upstream ships a `sourcemap` `DebugImage` variant (or\ntolerant envelope parsing) AND `tauri-plugin-sentry` depends on that release.\nThen delete `vendor/` plus the `[patch.crates-io]` block, bump the deps, and\nre-run a deliberate JS crash to confirm delivery still works. Re-check this at\ndependency-bump time, not on a calendar.\n\n## The transferable lessons\n\nThree, in descending order of how often they will bite you again:\n\n1. **`if let Ok(x) = parse(...)` at a boundary is a silent data destroyer.**\n   Any parse-and-discard without an `else` converts a schema mismatch into\n   nothing at all. At a telemetry boundary this is particularly cruel: the\n   system whose job is reporting failures fails by reporting nothing. If you own\n   such a boundary, log the parse error even if you cannot recover.\n2. **A closed enum deserialized from a producer you don't control is a\n   time bomb.** The producer will add a variant eventually. Prefer a tolerant\n   fallback (`#[serde(other)]`, or capturing unknown variants into a raw value)\n   for anything crossing a version boundary, especially when both sides ship on\n   independent release cycles from the same vendor.\n3. **Verify observability end to end, deliberately, per lane.** \"Sentry is\n   wired up\" is not a state you can assume from a green build. Trigger a real\n   error in *each* lane (JS, native, server) against a *release* build. Playmoir\n   only found this because someone pressed a deliberate-crash button in a signed\n   build and compared lanes; ordinary usage would have shown a quiet dashboard\n   and been read as \"no bugs.\""}, {"id": "tauri-sqlite-direct-sqlx.md", "title": "Tauri + SQLite with direct sqlx access (alongside tauri-plugin-sql)", "kind": "howto", "last_verified": "2026-05-15", "stack": ["tauri", "rust", "sqlite", "sqlx"], "groups": ["Cloud & Backend", "Frameworks & Libraries", "Languages", "Platforms & Runtimes"], "description": "Opening your own sqlx pool alongside `tauri-plugin-sql`. Plus the migration-not-registered footgun that shipped a silent feature regression.", "content": "# Tauri + SQLite with direct sqlx access (alongside tauri-plugin-sql)\n\n> Pattern for projects where the JS side uses `tauri-plugin-sql` for read/write but Rust commands also need direct DB access. Plus the migration footgun that cost us a whole session.\n\n## When you need this\n\n`tauri-plugin-sql` is great for JS-side DB access: SELECT/INSERT/UPDATE from your React code, no IPC wrapper needed per query. But once Rust commands need DB access — say, an OAuth flow that writes `auth_token` to `sync_meta`, or a sync push that reads from `sync_outbox` — you hit a wall:\n\n**`tauri_plugin_sql`'s `DbPool` is `pub(crate)`.** You can't `.state::<DbInstances>()` and reach in. Their team intentionally hid it so consumers don't lock themselves into the plugin's internal connection pool.\n\nThe workaround is straightforward but non-obvious: **open your own `sqlx` pool against the same SQLite file.** Both pools coexist safely because SQLite WAL mode allows multiple concurrent readers + serialized writers at the filesystem level.\n\n## The pattern\n\n```rust\n// commands/your_feature.rs\nuse sqlx::SqlitePool;\nuse tauri::{AppHandle, Manager};\n\nasync fn open_db(app: &AppHandle) -> Result<SqlitePool, String> {\n    let app_dir = app\n        .path()\n        .app_config_dir()\n        .map_err(|e| format!(\"No app config dir: {}\", e))?;\n    let db_path = app_dir.join(\"myapp.db\");  // same file tauri-plugin-sql uses\n    let url = format!(\"sqlite:{}\", db_path.display());\n    SqlitePool::connect(&url)\n        .await\n        .map_err(|e| format!(\"Failed to open DB: {}\", e))\n}\n\n#[tauri::command]\npub async fn my_command(app: AppHandle) -> Result<String, String> {\n    let pool = open_db(&app).await?;\n    let row = sqlx::query(\"SELECT value FROM sync_meta WHERE key = ?\")\n        .bind(\"auth_token\")\n        .fetch_optional(&pool)\n        .await\n        .map_err(|e| e.to_string())?;\n    // ...\n}\n```\n\n### Why this is safe (and why people get nervous)\n\nThe first time you do this, you ask: \"isn't opening a second pool to the same DB file a recipe for corruption?\" No. SQLite handles this fine:\n\n- **WAL mode allows concurrent readers.** N pool connections all reading at once = no contention.\n- **Writers serialize at the file level.** Both pools' write attempts are queued by SQLite itself; no extra coordination needed in your code.\n- **Both pools see each other's commits.** WAL means a commit on one pool is visible to readers on the other pool within milliseconds (after the next read transaction starts).\n\nWhat you DO have to be careful about:\n- **Don't try to share an in-flight transaction across pools.** Each pool's transactions are isolated. A `BEGIN` on pool A is not visible to pool B until the COMMIT lands.\n- **Don't init each pool with conflicting PRAGMAs.** The plugin sets WAL/journal mode at startup; let it. Your sqlx pool inherits the file's mode.\n\n## The migration footgun — your migration MIGHT NEVER RUN\n\nThis is the bug that ate a full session and shipped to production briefly. **Every new migration file MUST be appended to your `migrations` vec in `lib.rs`. There is no auto-discovery.**\n\nMost tutorials show migrations like this:\n\n```rust\n.plugin(\n    tauri_plugin_sql::Builder::default()\n        .add_migrations(\n            \"sqlite:myapp.db\",\n            vec![\n                Migration {\n                    version: 1,\n                    description: \"initial schema\",\n                    sql: include_str!(\"../migrations/0001_initial.sql\"),\n                    kind: MigrationKind::Up,\n                },\n                // ...\n            ],\n        )\n        .build(),\n)\n```\n\nWhat's not stated is that **the `vec!` is the entire source of truth for which migrations run.** If you add `migrations/0020_add_user_id.sql` to your filesystem but forget to append a `Migration { version: 20, ... }` entry to that `vec!`, the SQL file might as well not exist. No error. No warning at build time. No warning at runtime. Migration silently no-ops.\n\nWe shipped exactly this bug: an entire feature (BUG-22 cross-account outbox scoping) was \"complete\" with code that referenced the new `user_id` column, but the column was never added because the migration was never registered. The code path that read the column got `0 rows` results and silently ate the feature.\n\n**Mitigation patterns:**\n\n1. **Treat the `migrations` vec as the schema's source of truth, NOT the filesystem.** When you add a SQL file, also add the vec entry in the same commit. A pre-commit hook can enforce this (grep for `migrations/000*_` files vs `version: N` in lib.rs and complain on mismatch).\n\n2. **Drift assertion on startup.** Run a quick check at app boot that compares your schema's expected columns against the actual columns SQLite reports via `PRAGMA table_info`. If a column you expect is missing, panic loudly with a message that names the migration that should have added it. This catches both \"forgot to register\" and \"migration ran on an older version of the file.\"\n\n3. **`_sqlx_migrations` table introspection.** `tauri-plugin-sql` keeps a record of applied migrations. After a migration runs, verify with:\n   ```bash\n   sqlite3 ~/AppData/Roaming/com.your-app/myapp.db \\\n     \"SELECT version, description, installed_on FROM _sqlx_migrations ORDER BY version DESC LIMIT 5\"\n   ```\n   If your latest version isn't there, the migration didn't run.\n\n4. **Numbering convention enforced by linter.** We use a strict `NNNN_description.sql` pattern (`0001_`, `0002_`, ...) and a script that walks the migrations dir + checks each file has a matching `version: N` entry in `lib.rs`. If you regularly touch migrations, this is worth ~30 minutes to write.\n\n## WAL mode semantics in 30 seconds\n\n- **Multiple readers, single writer**, serialized at file level by SQLite.\n- **Writers don't block readers** (and vice versa, mostly). A long-running SELECT won't make an INSERT wait.\n- **`wal-checkpoint`** rolls the WAL into the main DB file. Happens automatically; you usually don't manage it.\n- **`.db-wal` and `.db-shm` sidecar files** are normal — don't delete them outside the app. They're how WAL coordinates between processes.\n- **Backups must capture all three files** (`.db`, `.db-wal`, `.db-shm`) or use `VACUUM INTO` / the SQLite backup API to write a checkpoint-included single file.\n\n## Pure-SQL UUIDv4 backfill (no Rust generation needed)\n\nIf you need to backfill UUIDs for existing rows during a migration (see local-first-sync-with-d1.md Pattern 2), you don't need Rust code. SQLite's `randomblob()` + `hex()` produces valid UUID v4 from pure SQL:\n\n```sql\n-- migrations/NNNN_add_uuid_backfill.sql\nALTER TABLE games ADD COLUMN uuid TEXT;\n\nUPDATE games SET uuid =\n  lower(hex(randomblob(4))) || '-' ||\n  lower(hex(randomblob(2))) || '-4' ||\n  substr(lower(hex(randomblob(2))), 2) || '-' ||\n  substr('89ab', 1 + (abs(random()) % 4), 1) ||\n  substr(lower(hex(randomblob(2))), 2) || '-' ||\n  lower(hex(randomblob(6)))\nWHERE uuid IS NULL;\n\nCREATE UNIQUE INDEX IF NOT EXISTS idx_games_uuid ON games(uuid);\n```\n\nDecoded: 4 + 2 + 2 + 2 + 6 = 16 bytes (32 hex chars + 4 dashes = 36 char UUID). The literal `'-4'` after the second hyphen enforces UUID version 4. The `substr('89ab', ...)` picks one of `8`, `9`, `a`, `b` for the variant bit position (UUID v4 requires `[89ab]` for the first hex digit of the 4th group).\n\nVerify the result with `SELECT uuid FROM games LIMIT 5` and check the format matches `xxxxxxxx-xxxx-4xxx-[89ab]xxx-xxxxxxxxxxxx`.\n\n## Schema drift detection at startup (recommended)\n\nWe added a drift check that runs on app boot and panics if expected columns are missing. Cheap insurance against the migration-not-registered footgun:\n\n```rust\nasync fn assert_schema(pool: &SqlitePool) {\n    let expected: &[(&str, &[&str])] = &[\n        (\"games\", &[\"id\", \"uuid\", \"name\", \"status\", \"deleted_at\"]),\n        (\"sync_outbox\", &[\"id\", \"table_name\", \"row_id\", \"uuid\", \"user_id\"]),\n        // ... pin every table you care about\n    ];\n\n    for (table, cols) in expected {\n        let actual: Vec<String> = sqlx::query(&format!(\"PRAGMA table_info({})\", table))\n            .fetch_all(pool)\n            .await\n            .expect(\"schema check failed\")\n            .into_iter()\n            .map(|r| r.get::<String, _>(\"name\"))\n            .collect();\n\n        for col in *cols {\n            assert!(\n                actual.contains(&col.to_string()),\n                \"schema drift: expected column {}.{} missing. \\\n                 Was the migration registered in lib.rs?\",\n                table, col\n            );\n        }\n    }\n}\n```\n\nCall from your setup hook. ~2ms total at boot, catches the entire class of \"I forgot to register the migration\" bugs the instant you launch the app.\n\n## The `selectRows()` snake_case → camelCase remap trap\n\nIf your project layers a typed query helper on top of `tauri-plugin-sql` that auto-converts SQL column names from snake_case to camelCase (idiomatic for Drizzle-defined schemas where `steam_appid` in SQL = `steamAppid` in TS), **every Zod schema downstream MUST use camelCase**, not the SQL column name.\n\nThis is a near-invisible failure mode. The Zod error reads `expected number, received undefined` at path `[0, \"steam_appid\"]` — which looks like \"the data is bad\" rather than \"I asked for a key that no longer exists in the remapped row.\"\n\n### The trap\n\n```typescript\n// lib/db.ts — the snake→camel remap happens here\nfunction remapRow(row: Record<string, unknown>): Record<string, unknown> {\n  const out: Record<string, unknown> = {};\n  for (const [k, v] of Object.entries(row)) {\n    out[snakeToCamel(k)] = v;  // steam_appid → steamAppid\n  }\n  return out;\n}\n\nexport async function selectRows(sql: string, params: unknown[] = []) {\n  const db = await getDb();\n  const raw = await db.select<Record<string, unknown>[]>(sql, params);\n  return raw.map(remapRow);  // returns camelCase keys\n}\n\n// features/sync/outbox.ts — the schema mismatch\nconst steamAppidLookupRowsSchema = z.array(\n  z.object({ steam_appid: z.number().int().nullable() }),  // ❌ snake_case\n);\n\nasync function lookupGameSteamAppid(rowId: number): Promise<number | null> {\n  const rows = steamAppidLookupRowsSchema.parse(\n    await selectRows('SELECT steam_appid FROM games WHERE id = ?', [rowId]),\n    // selectRows returned [{ steamAppid: 306130 }]\n    // schema expected [{ steam_appid: ... }]\n    // Zod throws \"expected number, received undefined\"\n  );\n  return rows[0]?.steam_appid ?? null;\n}\n```\n\n### The fix\n\n```typescript\nconst steamAppidLookupRowsSchema = z.array(\n  z.object({ steamAppid: z.number().int().nullable() }),  // ✅ camelCase\n);\n\nasync function lookupGameSteamAppid(rowId: number): Promise<number | null> {\n  const rows = steamAppidLookupRowsSchema.parse(\n    await selectRows('SELECT steam_appid FROM games WHERE id = ?', [rowId]),\n  );\n  return rows[0]?.steamAppid ?? null;  // ✅ camelCase accessor\n}\n```\n\nThe SQL column name in the SELECT stays snake_case (that's the source-of-truth schema). Only the Zod schema and the JS-side accessor switch to camelCase to match the post-remap shape.\n\n### Why this hides for so long\n\nThe trap is universal across any single-column lookup — `userId`, `parentUuid`, `steamAppid`, anything multi-word. But single-word columns like `uuid`, `value`, `name` round-trip cleanly because snake_case = camelCase. So your codebase can have 10 working lookup helpers and one silently broken one that only blows up on a code path that returns multi-word columns.\n\nThe failure was masked at the call site too — single-field updates emitting `.catch(() => {})` (the \"fire and forget outbox write\" pattern) swallowed every Zod error for weeks. Bug surfaced only when we instrumented `trackChanges` to push every success/failure into an in-app debug pipeline.\n\n### How to audit\n\n```bash\n# Find every Zod schema that uses snake_case keys after a selectRows-style helper\nrg 'z\\.object\\(\\{\\s*\\w+_\\w+:' src/\n```\n\nThen for each match, check whether the matching `selectRows` call returns remapped rows. The snake_case → camelCase remap is almost always centralized — finding it once tells you the whole codebase's convention.\n\n### Pair with observable error surfaces\n\nDon't write `.catch(() => {})` on outbox emissions. Even a `console.error` is enough to catch this class of bug in F12. Better: route to a structured dev-event ring buffer that survives panel closure (`pushDevEvent(...)` pattern). Silent-fail outbox writes can hide for entire release cycles.\n\n---\n\n## Common gotchas\n\n1. **`sqlx::query` vs `sqlx::query_as` for typed rows.** If you want typed structs, derive `sqlx::FromRow` and use `query_as::<_, MyStruct>(...)`. For ad-hoc reads, plain `query` returns `SqliteRow` and you call `.get::<T, _>(\"col\")` per field.\n\n2. **Always use `Option<String>` for nullable columns.** A `SELECT value FROM sync_meta WHERE key = ?` returning a row with `value = NULL` panics if you `.get::<String, _>(\"value\")`. Pin the type to `Option<String>`.\n\n3. **`sqlx::query(\"...\").bind(x).execute(&pool)` doesn't return `rows_affected` by default** — it returns a `SqliteQueryResult` which has `.rows_affected()` as a method. Check it for UPDATE/DELETE if you care about whether the row matched.\n\n4. **Don't pass `&str` to `.bind()` for variable-length params and expect them to outlive an async boundary** unless you `.to_string()` first. Rust's borrow checker usually catches this but the error message is opaque (\"future is not Send\"). When in doubt, `.bind(s.to_string())`.\n\n5. **Path handling on Windows.** `format!(\"sqlite:{}\", db_path.display())` works on all OSes including Windows, but be careful of backslashes if you build the URL with `format!` and a quoted path. The `display()` impl handles this; manual string concat doesn't.\n\n## What NOT to do\n\n- **Don't try to bypass `pub(crate)` on the plugin's pool with `unsafe` or feature flags.** It will break on the next plugin minor version. Just open your own pool.\n- **Don't run schema migrations from BOTH `tauri-plugin-sql` AND your sqlx pool.** Pick one (the plugin) and let it own migrations. Your sqlx pool just reads the migrated schema.\n- **Don't open a pool per request.** `open_db()` should ideally return a clone of a pool stored in Tauri state (`app.state::<SqlitePool>()`), not a fresh pool every call. For a v1 it's fine to open per-command (sqlx is fast); for production, hoist the pool to state at setup time.\n\n## Reference implementation layout\n\n- Migration files: `apps/desktop/src-tauri/migrations/NNNN_description.sql`\n- Migration registration: `apps/desktop/src-tauri/src/lib.rs` (in `.add_migrations(...)` call)\n- Shared db open helper: `apps/desktop/src-tauri/src/commands/sync/shared.rs` (or wherever your first feature needed it)\n- Schema drift assertion: called from Tauri `.setup(|app| ...)` hook"}, {"id": "tauri-updater-key-passphrase-without-stranding.md", "title": "Add a passphrase to an existing Tauri updater key — without stranding every install", "kind": "howto", "last_verified": "2026-07-29", "stack": ["tauri", "security", "release-engineering"], "groups": ["Auth & Security", "Other", "Platforms & Runtimes"], "description": "The Tauri updater secret key is usually passphrase-less, which makes reading one file equal to silent-RCE power over every install — and the reflex fix (regenerate with a password) STRANDS the whole install base because the pubkey is compiled into shipped binaries. Same-keypair rekey instead: the key file is base64 of a standard minisign secret key, so decode → `minisign -C` → re-encode, then a three-step verify (empty password must FAIL, passphrase signs via the release pipeline's exact env channel, signature verifies against the SHIPPED pubkey). Includes the measured non-repro of tauri#13485 on CLI 2.10.1, the fail-fast test-sign pattern for release scripts, and the backup-rotation hunt (password-manager version history, sync-client recycle bins, disk scan beats memory).", "content": "# Add a passphrase to an existing Tauri updater key — without stranding every install\n\n## The situation that makes this urgent\n\nThe Tauri updater signing keypair gets generated once, early, usually with an\nempty password because that's the path of least resistance (`--ci`, or just\npressing Enter). From then on the secret key sits at `~/.tauri/<app>.key` and\nthe release script passes `TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''`.\n\nThreat shape, stated plainly: **without** that key, an attacker who gains write\naccess to your release bucket can only *deny* updates — every installed client\nverifies signatures against a pubkey compiled into the binary. **With** the\nkey, it's silent RCE on the entire install base: a signed malicious artifact is\naccepted and (with `installMode: \"passive\"`) installed with no user\ninteraction. The whole update channel's security reduces to \"who can read one\nfile\" — and with an empty password, *reading the file is having the key*.\nEvery backup of the file carries identical power: a synced folder, a password\nmanager entry with the key text, an old laptop.\n\n## The trap — the reason this article exists\n\n**Do not fix this by regenerating the keypair with a password.** The public\nkey is compiled into every binary you have ever shipped. A new keypair means\nevery existing install can verify no future update — they are stranded on\nmanual downloads forever, silently (update-check failures are deliberately\nquiet). Nothing in `tauri signer` warns you about this, and\n`tauri signer generate -f` will happily overwrite the key that your install\nbase depends on.\n\nThe safe direction keeps the **same keypair** and only encrypts the secret key\nat rest.\n\n## The fix: the Tauri key file is just base64 of a minisign secret key\n\nThe Tauri CLI has no rekey command (`tauri signer` = `generate` + `sign`\nonly). But the key file is a single-line base64 wrapper around a standard\nminisign secret key, and C minisign has `-C` — change/set the secret key's\npassword in place:\n\n```bash\n# work on a COPY; original untouched until everything below passes\nmkdir rekey && cp ~/.tauri/myapp.key rekey/original.key.b64\nbase64 -d < rekey/original.key.b64 > rekey/decoded.key   # 2 lines: untrusted comment + key data\n\nminisign -C -s rekey/decoded.key   # prompts: current pw (Enter if empty), new pw twice\n\nbase64 -w0 < rekey/decoded.key > rekey/rekeyed.key.b64   # same single-line format Tauri expects\n```\n\nCross-implementation compatibility is real, not assumed: a key generated by\nthe Tauri CLI (rust-minisign) was rekeyed by **C minisign 0.12** and consumed\nagain by **Tauri CLI 2.10.1** — both directions worked (measured 2026-07-29).\n\n## Verify BEFORE swapping the live key — all three, in this order\n\n1. **Negative:** signing with the old empty password must now FAIL.\n   `TAURI_SIGNING_PRIVATE_KEY=\"$(cat rekey/rekeyed.key.b64)\" TAURI_SIGNING_PRIVATE_KEY_PASSWORD='' pnpm tauri signer sign testfile`\n   → expect `Wrong password for that key`. If it signs, the rekey didn't take.\n2. **Positive:** sign a test file with the passphrase **through the same\n   channel your release pipeline uses** (env vars, not `-p` on the CLI — see\n   the bug note below for why the channel matters).\n3. **Keypair intact:** the produced `.sig` is base64 of a `.minisig`; decode it\n   and verify against the ORIGINAL pubkey — the exact string in\n   `tauri.conf.json` that shipped inside your binaries:\n   `base64 -d < testfile.sig > testfile.minisig && minisign -Vm testfile -p <decoded original pubkey>`\n   This is the line that proves no install gets stranded.\n\nOnly then replace `~/.tauri/myapp.key` with the rekeyed file.\n\n## The env-password bug report that almost derails the plan\n\n[tauri-apps/tauri#13485](https://github.com/tauri-apps/tauri/issues/13485)\nreports that a key password supplied via `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`\nfails (\"Wrong password for that key\") while the CLI flag works — reported on\n2.5.1, untriaged. Measured 2026-07-29 on CLI 2.10.1: **does not reproduce**;\nenv-supplied password signs fine. Cheap way to check your own version before\ntrusting a release run: `tauri signer sign` honors the same two env vars as\nthe bundler, so it's a 2-second repro harness.\n\n## Release-pipeline consequences\n\n- **Prompt hidden, then fail-fast test-sign before the build.** Read the\n  passphrase with echo off, then sign a throwaway temp file (~2s) *before*\n  version stamping and the minutes-long build, so a typo fails instantly.\n- **`||` not `??` for the env fallback.** An empty-string\n  `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` is the *legacy no-passphrase config*,\n  not a valid password — it must fall through to the prompt.\n- **The passphrase is now exactly as unlosable as the key.** Losing it strands\n  every install just like regenerating would. Put it in the password manager\n  BEFORE running `minisign -C`, named by product (\"MyApp — updater signing key\n  passphrase\"), with a note saying what it unlocks and that loss is\n  unrecoverable.\n\n## Rotate every copy of the old file — they all still carry full power\n\nThe rekey protects the live file; it does nothing for copies made earlier.\nHunt them deliberately:\n\n- **Password managers keep version history.** Editing the entry that holds the\n  old key text preserves the old text underneath. Delete the entry, create a\n  fresh one, empty the manager's trash.\n- **Cloud-synced folders keep recycle bins AND per-file version history**, and\n  a delete-then-recreate of the same filename can be coalesced by the sync\n  client into a \"modify\" that preserves history (observed with OneDrive\n  semantics — check the file's version history, not just the recycle bin).\n  Also verify whether the folder is *actually syncing* before assuming cloud\n  exposure: a folder named OneDrive with no signed-in account is just a local\n  folder.\n- **Disk scan beats memory.** `find ~ -iname \"*.key\"` plus a content check\n  (minisign files decode from base64 prefix `dW50cnVzdGVkIGNvbW1lbnQ`) found a\n  forgotten 9-day-old copy the owner was sure didn't exist.\n- Accepted residuals worth naming rather than hand-waving: OS shadow copies\n  (need local admin — usually inside your already-game-over boundary) and SSD\n  unallocated remnants (out of threat model for a non-targeted solo dev)."}, {"id": "tombstone-vs-hide-for-mirrored-data.md", "title": "A tombstone is a claim of nonexistence — don't use one for data you don't own", "kind": "pattern", "last_verified": "2026-07-20", "stack": ["sync", "offline-first", "powersync", "distributed-systems"], "groups": ["Data & Sync"], "description": "A soft-delete tombstone claims \"this shouldn't exist anywhere\" — false for rows mirrored from an external authority (Steam library, calendar sync) that the server deliberately keeps live. Use a local-only, non-syncing hidden flag instead; soft-deleting re-derivable data is an unwinnable fight against a correctly-functioning sync engine. Plus two guard rules for genuine deletes: write-throughs must never re-insert a tombstoned row, and tombstone GC must be replication-confirmed, not a bare wall-clock timer.", "content": "# A tombstone is a claim of nonexistence — don't use one for data you don't own\n\n**One-liner:** in any sync system with a trusted central server, a soft-delete tombstone means *\"this record should not exist anywhere.\"* That claim is simply **false** for rows mirrored/re-derived from an external authoritative source (a Steam library, a GitHub org sync, a calendar integration, an imported CSV you re-import periodically) that the server deliberately keeps live. Soft-deleting those rows locally starts an unwinnable fight against the sync engine, which will faithfully re-send a row it's been told is still current — because that's the sync engine working correctly, not a bug in it. The fix is a **local-only, non-syncing \"hidden\" flag**, categorically distinct from delete.\n\n## The trap, generalized\n\nYou have two kinds of rows that both currently go through the same \"soft-delete\" code path:\n\n1. **Genuine user data** (a note, a manual entry, an uploaded file) — when the user deletes it, it should be gone everywhere. A soft-delete tombstone that syncs is exactly correct here: it's a real claim, and the server has a counterpart for it (the row IS actually being removed server-side too).\n2. **A mirror/projection of an external source** (installed Steam games, synced calendar events, an imported repo list) — the server *keeps this row live on purpose*, because it's re-derivable and the external source is still the truth. If you locally soft-delete this row (e.g., \"user disconnected this integration\"), you've created a tombstone whose claim is false: the server row is live and will keep re-arriving. Every re-arrival looks like \"resurrection,\" gets re-deleted, re-arrives again — a churn loop that isn't a bug in either the delete code or the sync engine; it's the wrong operation applied to the wrong kind of row.\n\n**The tell:** a delete is only durable if it has a counterpart at the source of truth. If your delete is intentionally NOT mirrored to the authoritative source (because you want to keep syncing that data for everyone else, or because reconnecting should bring it right back), you don't have a delete — you have a **visibility** change, and visibility is local, not synced.\n\n## What actually works (validated across systems with a trusted central server)\n\nComparable systems handle \"hide, but don't destroy, a re-derivable thing\" the same way, independent of their sync engine:\n\n- **Linear** separates **Archive** (reversible, keeps the row, syncs the archived state) from **Delete** (destroys the row) — disconnect/hide is semantically an archive, never a delete.\n- **Ditto** ships `isArchived` as an explicit soft-delete-flag-as-filter, distinct from its actual tombstone-producing `DELETE` — \"a way to flag data as inactive while retaining it.\"\n- **PowerSync** (and similar sync engines) support **local-only columns/tables** — writes to them never produce a sync/CRUD entry, so a local \"hidden\" flag never leaves the device and never collides with the live server row.\n\n**The fix, concretely:** keep the synced/mirrored rows exactly as delivered (don't touch them). Add a separate **local-only, non-syncing** predicate — a local-only column, a local-only side table keyed by the mirrored row's id, or a single device-local boolean if it's an all-or-nothing integration — and filter your UI queries by it. Disconnecting = flip the local flag. Reconnecting = flip it back; the rows are already there, nothing re-imports. No tombstone is created, so there is nothing for the sync engine to \"incorrectly\" restore — the bug class disappears rather than getting mitigated.\n\n**Only reach for an actual destructive delete** if disconnect is genuinely supposed to wipe the data (lose any local annotations on it) — and in that case, delete it server-side too (stop re-deriving it), so nothing re-inserts. That's a heavier, different feature (\"disconnect and forget\") than \"disconnect and hide\" — don't default to it just because delete-code already exists.\n\n## Two related rules for genuine deletes (the case where soft-delete IS correct)\n\nFor rows where soft-delete really is the right model, two failure modes recur across every mature sync system's design docs (WatermelonDB, RxDB, Couchbase, Cassandra, Ditto):\n\n1. **A write-through/mirror must never re-insert an already-tombstoned row.** When an incoming synced row carries a delete marker, treat it as \"ensure locally absent,\" never \"insert, then let garbage collection clean it up later.\" The insert-then-GC pattern is itself an insert→GC→re-insert churn engine if timing lines up wrong.\n   - **Confirmed in production (Playmoir BUG-52, 2026-07-18):** every write-through in the family inserted an incoming tombstoned row unconditionally, even when no local row existed for it. Two distinct symptoms from one root cause: a local \"delete forever\" resurrected as a ghost seconds later (the cloud tombstone streams down forever — no server-side tombstone GC existed yet), and a *fresh* device imported ghosts for rows it never had at all (e.g. refund-pruned rows it was never sent as live in the first place). The concrete guard: `if (incoming.deleted_at) { if (no local row exists for this id) skip; }` — keyed by whatever the entity's natural id is (not the sync engine's own row id) — applied identically across every entity family (games, manual entries, journal entries) once one family (screenshots/audio) was found to already have it correctly. A tombstone for something you've never had is a no-op, full stop; it should never be the trigger for a first INSERT.\n2. **Never clear a local tombstone just because the server's copy currently lacks one.** That's an unconditional \"server wins,\" which is actu
